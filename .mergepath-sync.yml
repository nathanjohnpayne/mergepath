# .mergepath-sync.yml — propagation manifest for sync-to-downstream.sh
#
# Single source of truth for which Mergepath paths are canonical
# (mirrored verbatim) or templated (mirrored with substitutions),
# and which downstream consumers opt in to each. Read by
# scripts/sync-to-downstream.sh — see #168 for the full design.
#
# Schema is deliberately small for v1 (Layer 1 + Layer 2 of the issue
# plan): manifest + audit. Additional path types and per-path knobs
# (kit-with-allowlist, three-way-merge for review-policy.yml,
# substitution rules for templated docs) land in later layers.
#
# ─────────────────────────────────────────────────────────────────────
# Per-repo identity / hub-only docs are OUT (invariant, #743)
# ─────────────────────────────────────────────────────────────────────
#
# Per-repo-owned identity/agent docs — README.md, BRAND.md,
# .ai_context.md, SECURITY.md, AGENTS.md, and docs/agents/{repository-
# overview,testing-requirements,code-modification-rules}.md — and the
# hub-only docs (ai_agent_tooling_standard.md, docs/agents/{bootstrap-
# runbook,propagation-ordering,templated-propagation,coderabbit-audit}.md) are
# DELIBERATELY absent from this manifest, and must STAY absent as
# verbatim `type: canonical`/`type: kit` entries. Every consumer
# customizes the identity docs (its own brand narrative, system
# overview, repo-layout section); the hub-only docs describe machinery
# a consumer doesn't run. A verbatim mirror would clobber a consumer's
# corrected copy on the next wave — the exact content the gaycruisebingo
# scrub had to remove (#744). If one of these ever genuinely must be
# shared, it MUST be `type: templated` (rendered per-consumer with
# facts), never verbatim. This invariant is ENFORCED by
# scripts/ci/check_sync_manifest (check 8) — a canonical/kit entry for
# any denylisted path fails the check.
#
# ─────────────────────────────────────────────────────────────────────
# `requires:` — propagation closure invariant (#264)
# ─────────────────────────────────────────────────────────────────────
#
# A path entry MAY declare a `requires:` list naming OTHER paths that
# must travel with it to a consumer for the entry to function. The
# canonical motivation is the propagation wave that triggered #264:
# scripts/ci/check_gh_as_author was propagated as part of the
# scripts/ci/ kit, but the test files it hard-requires
# (tests/test_gh_pr_guard.sh, tests/test_gh_as_author.sh, etc.)
# were NOT in the manifest. Every consumer's `lint` job then
# failed in pre-flight on `Missing required file: tests/...`.
#
# The `requires:` field closes that gap structurally:
# `scripts/ci/check_sync_manifest` enforces that for every required
# path listed under any entry, that path is ALSO covered by the
# manifest. "Covered" means EITHER an exact entry of its own OR a
# path strictly inside a manifest kit entry (because kit propagation
# walks the whole directory, so a fixtures subdir under a kit path
# travels for free).
#
# Be conservative when adding `requires:` — only entries you can
# verify by grepping the actual script/workflow for hard-required
# paths. A `requires:` entry should be:
#   - a test file under tests/ that a `scripts/ci/check_*` wrapper
#     hard-fails on if missing,
#   - a script that a propagated workflow shells out to (e.g.
#     codex-p1-gate.yml → codex-p1-gate.sh), or
#   - a fixture/library path that an extracted module depends on at
#     runtime (e.g. agent-review.yml's detect-disagreement job
#     requires scripts/disagreement-detector.cjs).
#
# Things that are NOT `requires:` material:
#   - Soft dependencies (docs cross-references, comment pointers).
#   - Paths inside the SAME manifest entry's kit directory (those
#     travel automatically; declaring them is harmless and may help
#     readability, but the validator accepts them either way).
#   - Per-consumer config (e.g. .github/review-policy.yml) that is
#     intentionally NOT propagated.
#
# Format:
#   - path: scripts/ci/
#     type: kit
#     consumers: all
#     requires:
#       - "tests/test_gh_pr_guard.sh"       # check_gh_as_author
#       - "tests/test_gh_as_author.sh"      # check_gh_as_author
#       - "scripts/ci/fixtures/"            # check_disagreement_detector
#
# ─────────────────────────────────────────────────────────────────────
# Canary-first procedure for --sync-all
# ─────────────────────────────────────────────────────────────────────
#
# When propagating a large change set, prefer the canary-first pattern
# over a parallel fan-out. The propagation wave that surfaced #264
# opened 8 consumer PRs simultaneously; every one of them failed the
# same `lint` job for the same reason, so a single canary would have
# caught the gap before the fan-out blew up.
#
# Recommended steps for `scripts/sync-to-downstream.sh --sync-all`:
#   1. Pick ONE consumer (typically a public repo so the failure is
#      easy to read in a tab without auth): `--repos <one-name>`.
#   2. Wait for that consumer's PR to pass `lint`. If it fails,
#      investigate IN THE CONSUMER PR before opening any others —
#      most failures (missing test files, missing fixtures, missing
#      scripts the kit hard-requires) are upstream manifest gaps
#      that `requires:` would have caught at the manifest layer.
#   3. Once the canary is green, fan out: `--sync-all` (no `--repos`).
#   4. The remaining consumers re-use the cleared invariant, so the
#      fan-out is reduced to a verification step, not exploration.
#
# This is documentation, not enforcement — agents and humans share the
# same recommendation. The `requires:` invariant above is the
# structural guard; the canary procedure is the operational practice
# that makes a manifest gap recoverable for a single PR instead of
# eight.
#
# Full procedure: the risk-ranked fan-out order (riskiest → least, in
# pairs), the canary-selection rule, and the change-handling playbook
# live in docs/agents/propagation-ordering.md — reviewed monthly, with
# the dated review log on the repo wiki page
# `Propagation-Wave-Order-Review-Log` (issue #492 retired 2026-07-06).

# Schema version. Bumped on incompatible changes; the script refuses
# to run against an unknown version so old scripts can't silently
# misinterpret a newer manifest.
version: 1

consumers:
  - name: matchline
    repo: nathanjohnpayne/matchline
    visibility: public
    facts:
      frameworks: [react, typescript]
  - name: nathanpaynedotcom
    repo: nathanjohnpayne/nathanpaynedotcom
    visibility: public
    facts:
      frameworks: [astro, typescript]
  # overridebroadway is CJS + TypeScript (React 19 + TypeScript, root
  # package.json, ~81 .ts/.tsx files). The prior "zero lintable surface"
  # exclusion was false (#461). Folded into the CJS templated entry below;
  # examples/eslint.config.cjs.js already carries the `frameworks contains
  # typescript` arm (require("typescript-eslint")), so the CJS + TS render
  # is supported. First CJS + TS consumer of the canonical floor.
  - name: overridebroadway
    repo: nathanjohnpayne/overridebroadway
    visibility: public
    facts:
      frameworks: [react, typescript]
  # device-source-of-truth is a React 19 + TypeScript + Vite SPA with a
  # root package.json and ~148 .ts/.tsx files, so it IS in scope for the
  # canonical ESLint floor (#458). Folded into the ESM templated entry
  # below; the prior "zero lintable surface" exclusion was false.
  - name: device-source-of-truth
    repo: nathanjohnpayne/device-source-of-truth
    visibility: public
    facts:
      frameworks: [react, typescript]
  - name: friends-and-family-billing
    repo: nathanjohnpayne/friends-and-family-billing
    visibility: public
    facts:
      frameworks: [react]
      # ffb hand-added a vitest globals block during the Phase D
      # fanout (#250); folding it into the template removes the
      # override. See mergepath#322.
      testing: vitest
      # ffb's tests + several src/main.js patterns put JSX in `.js`
      # files (no JSX in *.jsx). The default `**/*.{jsx,tsx}` glob
      # misses them; jsx_in_js: true adds a second React rule entry
      # that covers `.js` too. See mergepath#322.
      jsx_in_js: true
  - name: device-platform-reporting
    repo: nathanjohnpayne/device-platform-reporting
    visibility: public
    facts:
      frameworks: [react]
      # dpr uses Jest (not vitest); same template gap as ffb above.
      testing: jest
      # dpr is JS-only and uses babel-loader to transpile JSX inside
      # `.js` files. Same opt-in as ffb. See mergepath#322.
      jsx_in_js: true
  # swipewatch has minimal Node + vitest code, no frameworks. The
  # empty `frameworks: []` list opts it into the JS baseline only.
  - name: swipewatch
    repo: nathanjohnpayne/swipewatch
    visibility: public
    facts:
      frameworks: []
  - name: tadlockpsychiatry
    repo: nathanjohnpayne/tadlockpsychiatry
    visibility: public
    facts:
      frameworks: [react, typescript]
  # gaycruisebingo was bootstrapped from mergepath (byte-identical
  # gh-as-author.sh, registered in the loop docs) but was never enrolled
  # as an ongoing sync consumer, so it missed every post-bootstrap fix
  # (#741). React 18 + TypeScript + Vite SPA, `"type": "module"` (ESM),
  # root package.json. No JSX in `.js` files (pure `.tsx`), so no
  # `jsx_in_js`. It runs vitest with globals (its test files use bare
  # `describe`/`it`/`expect`/`vi`), and the eslint template emits the
  # vitest globals block ONLY when `testing: vitest` is set (an unset
  # `testing` renders NO testing globals — verified against
  # examples/eslint.config.js § `>>> if testing contains vitest`), so the
  # fact is REQUIRED here to avoid stripping the block on first sync and
  # regressing `no-undef` on the test globals. Its first ongoing sync is not
  # small: measured 2026-08-20 against mergepath at
  # 9943173ca2b532359d619ffeadda93daf9f9cf43, the hub has 115 kit blobs and
  # this consumer holds 110 hub-known entries. Follow the canonical per-wave
  # selection and fan-out gates in docs/agents/propagation-ordering.md.
  - name: gaycruisebingo
    repo: nathanjohnpayne/gaycruisebingo
    visibility: public
    facts:
      frameworks: [react, typescript]
      testing: vitest

# Path types:
#   canonical  — byte-for-byte mirror. Any difference is drift.
#   kit        — directory mirror with allow-extras semantics: every
#                file under Mergepath's path must exist (byte-identical)
#                in the consumer; consumer-only files in the same dir
#                are ignored. This matches scripts/ci/, where each
#                consumer adds repo-specific check_* scripts alongside
#                the canonical ones.
#   templated  — rendered per consumer via scripts/lib/template-
#                substitution.sh (#313). The Mergepath source is a
#                template with `>>> if <expr> ... <<<` conditional
#                blocks and `{{key}}` variable substitutions; the
#                consumer's facts (see consumer.facts below) drive
#                the rendering. Audit re-renders per consumer and
#                byte-diffs against the on-disk destination. Sync
#                materializes the rendered output into the destination
#                path.
#
#                v1 NOTE: the propagation-PR review lane (#264) does
#                NOT YET re-render-and-verify templated entries. The
#                lane's parse_manifest_paths.sh emits only source
#                paths, so a PR touching a templated `dest` reads as
#                "off propagation surface" and the lane gate denies
#                exemption — templated propagation PRs route to
#                normal Phase 4 review. A follow-up PR will extend
#                verify-propagation-pr.sh to re-render against
#                mergepath@<sha> with the consumer's facts and
#                byte-verify the PR content. See docs/agents/
#                templated-propagation.md § Propagation-lane
#                verification — v1 limitation.
#
#                Templated entries require explicit `source:` and
#                `dest:` fields (the source path in Mergepath does
#                NOT equal the destination path in the consumer —
#                this is the whole point of templated propagation,
#                e.g., examples/eslint.config.js → eslint.config.js).
#                For canonical and kit, source = dest = path; the
#                source/dest fields are optional and default to path
#                when omitted.
#
# Per-entry source/dest fields:
#   source:     path within Mergepath where the source template lives
#               (defaults to `path` when omitted)
#   dest:       path within each consumer where the rendered output
#               (or canonical/kit content) lands (defaults to `path`)
#
# Per-consumer facts (templated propagation only):
#   Each consumer entry MAY carry a `facts:` block — a mapping of
#   fact keys (matching [a-z0-9_-]+) to values. Facts are exported
#   as MERGEPATH_FACT_<KEY> env vars before invoking the template
#   substitution lib, where uppercase + hyphen-to-underscore is
#   applied per the lib's contract. List-valued facts (yaml `[a, b]`)
#   are serialized as space-separated for the lib's `contains`
#   expression form.
#
#   Example:
#     consumers:
#       - name: matchline
#         repo: nathanjohnpayne/matchline
#         visibility: public
#         facts:
#           frameworks: [react, typescript]
#           node_version: "20"
#
#   Canonical/kit consumers don't require facts; the block is
#   optional and only consulted for templated entries the consumer
#   opts into.
#
# `consumers: all` means every entry in the consumers list above.
# Per-consumer exclusions live under the `exclusions:` block at the
# bottom of the file.

paths:
  # Canonical scripts — Phase 4 review tooling, hooks, helpers.
  - path: scripts/op-preflight.sh
    type: canonical
    consumers: all
  # Sourced by all five GH_TOKEN-using helper scripts; carries the
  # auto-source logic that lets agents drop the explicit
  # `GH_TOKEN=...` prefix once the preflight cache is warm. See #282.
  - path: scripts/lib/preflight-helpers.sh
    type: canonical
    consumers: all
  # Sourced by codex-review-check.sh (the statusCheckRollup read) and
  # by the inline bash in .github/workflows/auto-clear-blocking-labels.yml
  # (label-list reads, label-removal writes, attribution-comment posts).
  # Provides `with_gh_retry` — 3×30s retry on transient gh failures
  # (HTTP 5xx, rate-limit, "Resource not accessible by integration").
  # See mergepath#324 for the propagation closure rationale.
  - path: scripts/lib/gh-retry-helpers.sh
    type: canonical
    consumers: all
  # Sourced by scripts/gh-as-author.sh + scripts/gh-as-reviewer.sh (and the
  # other write-path helpers) to resolve a verified token for an identity —
  # prefers the OP_PREFLIGHT_*_PAT cache, falls back to `gh auth token
  # --user`. Added by #415/#416 but never propagated; without it every
  # consumer's gh-as-author/reviewer wrapper aborts at `source ... : No such
  # file` and check_gh_as_author fails. Surfaced by the b10671e propagation
  # wave on matchline#269. Same #264 closure class.
  - path: scripts/lib/gh-token-resolver.sh
    type: canonical
    consumers: all
  # Sourced by scripts/workflow/verify-propagation-pr.sh (propagated kit) and
  # the sync tooling to read consumer facts from the manifest. Travels with
  # verify-propagation-pr.sh so a consumer running check_verify_propagation_pr
  # doesn't abort at `source ... : No such file`. Same #264 closure class as
  # gh-token-resolver.sh above; both gaps from recent (#415/#416) refactors.
  - path: scripts/lib/manifest-fact-helpers.sh
    type: canonical
    consumers: all
  # Templated-propagation render engine (#313). Hard-sourced by
  # scripts/workflow/verify-propagation-pr.sh: the lane verifier now runs
  # the consumer's OWN copy from the PR base (not the runtime clone —
  # mergepath#531), so it sources this render lib locally. It must travel
  # to every consumer that can receive a templated sync PR (the
  # eslint.config.js entries below cover all 8). Also declared in the
  # scripts/workflow/ kit requires:.
  - path: scripts/lib/template-substitution.sh
    type: canonical
    consumers: all
  # Shared available_reviewers reader (#453). Hard-required (exit 3 if
  # missing) by coderabbit-wait.sh, codex-review-check.sh, and
  # audit-propagation-lane.sh — the reviewer allow-list parse is a
  # fail-closed gate input, so a consumer missing this lib must error, not
  # silently degrade. Declared in each consumer's requires: below.
  - path: scripts/lib/reviewers-helpers.sh
    type: canonical
    consumers: all
  # Single-source pinned mikefarah/yq bootstrap (#616). Invoked CI-only
  # (--ci-only, gated on GITHUB_ACTIONS=true) by
  # scripts/ci/check_resolve_pr_threads when yq is missing, so the
  # yq-dependent delegated verified-propagation suite is self-sufficient
  # during the #601 skew window: the scripts/ci kit arrives via manifest
  # sync while repo_lint.yml (whose install_yq_for_sync_manifest step
  # delegates to this same script) travels separately on the
  # template-mirror lane. Also declared in the scripts/ci/ kit requires:
  # below so the closure invariant records the coupling.
  - path: scripts/lib/ensure-yq.sh
    type: canonical
    consumers: all
  # Shared top-level policy scalar reader used by the trusted workflow kit.
  - path: scripts/lib/review-policy-scalar.sh
    type: canonical
    consumers: all
  # Single source of truth for the Codex App failure-marker regexes (#722):
  # the usage-limit / not-connected patterns audit-codex-latency.sh classifies
  # retrospectively, factored out so the live Phase 4a scripts test the SAME
  # patterns. Sourced (existence-guarded, flag-gated) by codex-review-request.sh
  # and codex-review-check.sh — declared in each of their requires: below so the
  # closure invariant records the coupling and the lib travels with them. A
  # consumer missing it degrades to the pre-#722 behavior (no marker detection),
  # so the source is soft, not fail-closed.
  - path: scripts/lib/codex-failure-markers.sh
    type: canonical
    consumers: all
  # Fail-closed scalar REST reader (#799). `gh api <path> --jq <expr>` writes
  # the HTTP error body to STDOUT, so every call site that inferred failure
  # from empty output was reading an outage as data. gh_api_scalar suppresses
  # the body and returns 3 — the same contract #831 gave fetch_api_array,
  # extended from arrays to scalars — plus optional sha/login/timestamp shape
  # predicates as second-line defence. HARD-sourced (exit, not degrade) by
  # every consumer below, because the degraded mode IS the defect: declared in
  # each of their requires: so the lib can never ship behind its callers.
  - path: scripts/lib/gh-api-scalar.sh
    type: canonical
    consumers: all
  # Paginated LIST reader (#1008) — the array twin of gh-api-scalar.sh above,
  # and the one definition of `fetch → capture → flatten` that eight review
  # sensing scripts each used to carry inline. The duplication is what
  # regenerated the fixes: #831/#965 corrected the failure contract one helper
  # at a time across four PRs, and #966's stream-separation correction reached
  # only ONE of the eight. HARD-sourced by every consumer below, because the
  # degraded mode is `command not found` on the reads whose fail-closed
  # contract keeps an unreadable surface from being graded as "no findings":
  # declared in each of their requires: so the lib can never ship behind its
  # callers. Each caller keeps only its own failure ACTION (die 2 / die 3 /
  # return 3 / return 1), which is the part that genuinely differs.
  - path: scripts/lib/gh-api-array.sh
    type: canonical
    consumers: all
  - path: scripts/coderabbit-wait.sh
    type: canonical
    consumers: all
    # Hard-sources scripts/lib/reviewers-helpers.sh (#453) for the
    # token-derived expected-reviewer allow-list; exits 3 if absent. Since
    # #837 it also hard-sources scripts/lib/feedback-policy-helpers.sh: the
    # potential-issue count grades findings with the shared coderabbit_tier_of
    # rather than a private marker grep, so a consumer missing that lib must
    # error rather than silently count zero blocking findings.
    requires:
      - "scripts/lib/reviewers-helpers.sh"
      - "scripts/lib/feedback-policy-helpers.sh"
      - "scripts/lib/gh-api-array.sh"   # #1008, hard-sourced by both fetch wrappers
  # #489 CodeRabbit-rate-limit auto-merge disposition gate. agent-review.yml's
  # exit-5 (rate-limited) branch calls this script to decide whether the
  # Codex-failover path may auto-merge. Absent on a consumer it exits 127 and
  # the workflow's `else` blocks auto-merge — fail-safe, but the PR loses the
  # #489 nuanced disposition. Referenced by .github/workflows/agent-review.yml;
  # undeclared by #489, surfaced by the fabb2b1 wave's @codex pass (#521).
  - path: scripts/coderabbit-automerge-rate-limit-gate.sh
    type: canonical
    consumers: all
    # #825 arm 2b invokes scripts/codex-review-check.sh directly, by path, on
    # every unprotected head, and its safety rests on that checker HONORING
    # CODEX_REVIEW_CHECK_ALLOW_PHASE_4B_SUBSTITUTE=false (#727). A checker
    # predating that flag ignores it, so gate (c) accepts the very reviewer
    # APPROVED that armed auto-merge as a Phase-4b substitute and the probe
    # returns 0 before Codex has reviewed anything — the #512 r3 hole this arm
    # exists to keep closed. A commit-path sync updates only changed canonical
    # targets, so without this edge a consumer could take the new gate while
    # keeping a stale checker; the closure gate must refuse to ship the caller
    # ahead of the dependency it trusts (Codex P1 on #960, same reasoning as
    # the scripts/phase-4b-review.sh edge below).
    requires:
      - "scripts/codex-review-check.sh"
  - path: scripts/codex-review-request.sh
    type: canonical
    consumers: all
    # Sources scripts/lib/codex-failure-markers.sh (existence-guarded) so the
    # poll loop can short-circuit on a usage-limit / not-connected marker
    # instead of running out the full review timeout (#722). Soft-degrades to
    # the pre-#722 behavior if the lib is absent mid-skew.
    #
    # Shells out to scripts/workflow/codex_auto_trigger_gate.sh (also
    # existence-guarded) to decide whether an AUTOMATIC trigger may be skipped
    # on a content-free update-branch head (#798). Absent, the call site fails
    # OPEN and posts the trigger — the pre-#798 behavior — so the coupling is
    # soft; it is declared so the closure invariant records it and the gate
    # travels with its only caller.
    #
    # HARD-sources scripts/lib/gh-api-scalar.sh (#799) for the post-trigger
    # timestamp read. Unlike the two soft deps above, an absent lib exits 3:
    # the read anchors every "newer than my trigger?" comparison in the poll
    # loop, so degrading it silently is worse than refusing to run.
    requires:
      - "scripts/lib/codex-failure-markers.sh"
      - "scripts/workflow/codex_auto_trigger_gate.sh"   # #798, content-free auto-trigger gate
      - "scripts/lib/gh-api-scalar.sh"   # #799, fail-closed scalar API reads
      - "scripts/lib/gh-api-array.sh"    # #1008, hard-sourced paginated list reads
      - "scripts/review-feedback-accounting.sh"   # #1000, fail before another review round
  # Complete-history reviewer-feedback accounting gate (#1000). Reads every
  # paginated inline comment, review object, and PR-level comment; reconciles
  # classified findings with finding-bound disposition evidence. It hard-
  # sources the shared severity classifiers and travels with every caller.
  - path: scripts/review-feedback-accounting.sh
    type: canonical
    consumers: all
    requires:
      - "scripts/lib/feedback-policy-helpers.sh"
      - "scripts/lib/preflight-helpers.sh"
      - "scripts/lib/gh-api-array.sh"   # #1008, hard-sourced paginated list reads
      - "scripts/workflow/resolve_base_policy.sh"   # #1000, governing base-branch policy
  - path: scripts/render-feedback-archive.sh
    type: canonical
    consumers: all
    requires:
      - "scripts/lib/feedback-policy-helpers.sh"   # #1000, provider-aware marker snapshot
  - path: scripts/review-feedback-surface-fingerprint.sh
    type: canonical
    consumers: all
    requires:
      - "scripts/lib/preflight-helpers.sh"
      - "scripts/lib/gh-api-array.sh"   # #1000, generation fence over all accounting surfaces
  - path: scripts/codex-review-check.sh
    type: canonical
    consumers: all
    # Sources scripts/lib/gh-retry-helpers.sh on startup to wrap the
    # statusCheckRollup read in 3×30s retry on transient gh failures
    # (#324). Without the helper present in the consumer, the
    # `source` line is silently skipped (existence-guarded), but the
    # retry semantics are lost — every transient failure becomes a
    # hard rc=3 and the auto-clear stalls.
    requires:
      - "scripts/lib/gh-retry-helpers.sh"
      - "scripts/lib/reviewers-helpers.sh"   # #453, hard-sourced for the gate (b)/(c) reviewer allow-list
      - "scripts/lib/codex-failure-markers.sh"   # #722, sourced for the gate (c) usage-limit/not-connected diagnostic
      - "scripts/lib/gh-api-array.sh"   # #1008, hard-sourced paginated list reads
  # Phase 4a feedback loop (#487): records the validated 👍/👎 reaction
  # Codex solicits on each finding. WRITE path — every reaction POST goes
  # through scripts/gh-as-reviewer.sh under the reviewer identity, so the
  # wrapper (and its scripts/lib/gh-token-resolver.sh dep) MUST travel with
  # this script or the reaction write fails closed. The reviewer-identity
  # resolver is also sourced directly for the idempotency owner-check.
  - path: scripts/codex-record-feedback.sh
    type: canonical
    consumers: all
    requires:
      - "scripts/gh-as-reviewer.sh"
      - "scripts/lib/gh-token-resolver.sh"
      - "scripts/lib/gh-api-array.sh"   # #1008, hard-sourced paginated list reads
  - path: scripts/phase-4b-classifier.sh
    type: canonical
    consumers: all
  # Automated Phase 4b handoff orchestrator (#579). It sources the
  # scripts/phase-4b/ kit for adapter selection, schema validation, and
  # timeout helpers, then delegates review posting to the identity-checked
  # reviewer wrapper. Keep these edges explicit so consumer repos that
  # receive the scripts/ci/ kit do not get a hard-failing lint wrapper
  # without the runnable handoff package it checks.
  - path: scripts/phase-4b-review.sh
    type: canonical
    consumers: all
    requires:
      - "scripts/phase-4b/"
      - "scripts/gh-as-reviewer.sh"
      - "scripts/post-phase-4b-handoff.sh"
      # The #814 same-head barrier invokes both of these directly, by path,
      # on every non-dry run. A consumer that receives the orchestrator
