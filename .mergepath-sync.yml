  - path: .github/workflows/required-check-publisher.yml
    type: canonical
    consumers: all
    # Default-branch-owned writer of the Checks-API slot for the three
    # script-backed required contexts (#845); shadow names until the
    # Stage B flip, so early propagation is inert. Runs all three gate
    # scripts directly — same coupling class as the gate-workflow
    # entries above; missing scripts fail-closed on missing-file.
    requires:
      # The parent workflow is the trigger source: workflow_run fires only
      # on its exact top-level name, so a consumer missing (or renaming)
