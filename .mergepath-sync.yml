      - "scripts/lib/daily-feedback-rollup-helpers.sh"
      - "scripts/ci/check_daily_feedback_rollup"
      - "tests/test_daily_feedback_rollup.sh"
  # Fleet CI wiring contract (#601). repo_lint.yml was previously seeded
  # exactly ONCE by the bootstrap template-mirror rsync and never again, so
  # consumers kept a bootstrap-era ~8-step workflow while carrying the full
  # scripts/ci/ kit — check_ci_scripts_wired enforced the wiring contract on
  # mergepath only, a permanent silent skew invisible to weekly-drift-audit.
  # Canonical propagation closes it. ATOMICITY CONTRACT: a new
  # scripts/ci/check_* and its repo_lint.yml `run:` step land in the same
  # mergepath PR, so the check + its wiring travel to consumers in the SAME
  # sync PR and check_ci_scripts_wired stays green fleet-wide at every sync
  # point. Consumer-local steps/exemptions live in the never-propagated
  # .github/workflows/repo_lint_local.yml annex (see check_ci_scripts_wired).
  - path: .github/workflows/repo_lint.yml
    type: canonical
    consumers: all
    requires:
      - "scripts/ci/"   # every run: step executes a kit check — must travel together (#601)
      - "tests/test_repo_lint_optimization.sh"  # parsed trigger/lane/aggregator contract (#1062)

  # NOTE: `.mergepath-sync.yml` is deliberately NOT propagated.
  # #268 briefly made it a canonical path on the theory the lane
  # would read it in-repo — but the lane's redesign (after the Codex
  # P1 on #268) runs verify-propagation-pr.sh from the CLONED
  # mergepath@<sha>, which carries its own authoritative manifest.
  # The consumer's copy would be unused — and this file enumerates the
  # full fleet inventory (every consumer repo name + facts), which there
  # is no reason to mirror into each consumer. (It historically also
  # avoided leaking then-private repo names to a public consumer; the
  # fleet is uniformly public as of 2026-07-06, so that specific concern
  # is now moot, but the file stays mergepath-only regardless.) Keep it
  # mergepath-only. (CodeRabbit Major, #271.)

  # Kit directories — Mergepath-canonical files are required;
  # consumer-only additions in the same directory are allowed.
  - path: .github/ISSUE_TEMPLATE/
    type: kit
    consumers: all
    # Synced issue templates establish the shared Mergepath issue
    # shape while preserving allow-extras semantics for product-
    # specific consumer templates. Keep labels to GitHub default
    # labels (`bug`, `documentation`, `enhancement`) so consumer
    # repos do not silently drop non-existent front-matter labels.
  - path: scripts/phase-4b/
    type: kit
    consumers: all
    # Automated Phase 4b handoff package (#579): adapters, schema, shared
    # shell helpers, and README — plus the approval-loop accounting module
    # (#602: accounting.sh, accounting.schema.json, prices.json) rendered
    # into automated APPROVED review bodies. The top-level orchestrator and
    # CI checks (check_phase_4b_automation, check_phase_4b_accounting) all
    # depend on these files as one versioned package; consumer repos may add
    # local notes/scripts in this directory without forking the canonical
    # files.
  - path: scripts/ci/
    type: kit
    consumers: all
    # check_* wrappers under scripts/ci/ hard-fail (exit 1) when their
    # paired tests, scripts, workflows, or fixtures are missing. Every
    # entry below is grep-verified against a `scripts/ci/check_*`
    # script's REQUIRED_FILES / TEST / FIXTURE constants — the same
    # closure gap that surfaced as #264 on the original propagation
    # wave (check_gh_as_author missing its tests on every consumer).
    requires:
      - "scripts/lib/ci-check-modes.sh"          # shared --check/--self-test selector (#1062)
      - "scripts/lib/blocking-labels.sh"         # check_workflow_parsers shared exact-label predicate (#1062)
      - "tests/test_repo_lint_optimization.sh"   # check_repo_lint_optimization
      - "tests/test_check_doc_ownership.sh"      # check_doc_ownership
      - "tests/test_gh_pr_guard.sh"            # check_gh_as_author
