  # assumed: the exclusion that hid this file is a MACHINE-global
  # core.excludesfile, which CI does not have, and no consumer's repo
  # .gitignore carries a `.codex/` rule. The hub carries a re-include stanza
  # only because the first commit of this path had to be made from a machine
  # where that global exclusion was active.
