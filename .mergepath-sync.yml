  # template-substitution.sh using the consumer's facts.* from the
  # consumers: block above. See § Path types above for the full
  # contract, and docs/agents/templated-propagation.md for syntax.

  # ESLint flat-config per the Mergepath ESLint standard floor
  # (mergepath#250). Two manifest entries because ESLint
  # `eslint.config.js` resolution honors `package.json "type"`:
  # ESM consumers need ESM syntax (import/export default), CJS
  # consumers need CJS syntax (require/module.exports). Mixing
  # would fail to load (Codex P1 on PR #318). The template-author
  # maintains both source files in parallel; the body inside the
  # export is byte-identical, only the import/export syntax differs.
  #
  # device-source-of-truth was previously excluded on a false "zero
  # lintable surface" rationale; #458 folds it into the ESM entry below
  # (React 19 + TypeScript + Vite SPA, root package.json, ~148 .ts/.tsx).
  # overridebroadway carried the same false rationale; #461 folds it into
  # the CJS entry below (CJS + React 19 + TypeScript, root package.json,
  # ~81 .ts/.tsx) — the first CJS + TS consumer of the floor. The CJS
  # template's `frameworks contains typescript` arm renders it correctly.
  #
  # Per-consumer rendered shapes (driven by facts.frameworks; module
  # syntax driven by which entry the consumer is in below):
  #   matchline (ESM)                  → JS + TS + React + react-hooks
  #   nathanpaynedotcom (ESM)          → JS + TS + Astro
  #   tadlockpsychiatry (ESM)          → JS + TS + React + react-hooks
  #   device-source-of-truth (ESM)     → JS + TS + React + react-hooks
  #   gaycruisebingo (ESM)             → JS + TS + React + react-hooks
  #   friends-and-family-billing (CJS) → JS + React + react-hooks
  #   device-platform-reporting (CJS)  → JS + React + react-hooks
  #   overridebroadway (CJS)           → JS + TS + React + react-hooks
  #   swipewatch (CJS)                 → JS baseline only

  # ESM variant — consumers with `"type": "module"` in package.json
  - path: examples/eslint.config.js
    source: examples/eslint.config.js
    dest: eslint.config.js
    type: templated
    consumers:
      - matchline
      - nathanpaynedotcom
      - tadlockpsychiatry
      - device-source-of-truth
      - gaycruisebingo

  # CJS variant — consumers without `"type": "module"` (default
  # CJS resolution). Same body as the ESM variant; only the
  # imports and module.exports differ.
  - path: examples/eslint.config.cjs.js
    source: examples/eslint.config.cjs.js
    dest: eslint.config.js
    type: templated
    consumers:
      - friends-and-family-billing
      - device-platform-reporting
      - overridebroadway
      - swipewatch

# Per-consumer exclusions. Use sparingly — drift exceptions become
# audit noise over time. Each entry must list a `reason:` so future
# readers know whether the exclusion is still load-bearing.
exclusions: []

# ─────────────────────────────────────────────────────────────────────
# `doc_ownership:` — exhaustive ownership inventory for docs/agents/ (#780)
# ─────────────────────────────────────────────────────────────────────
#
# WHY IT LIVES HERE. This is the same governance question the rest of
# this manifest answers — "which files travel to a consumer, and how" —
# so it belongs in the same file as the `paths:` entries and the
# identity-doc invariant above, not in a second declaration that can
# drift from them. Three properties make this the right home:
#
#   * It is hub-only by nature. Ownership classes are decided at the
#     canonical source; the manifest is already mergepath-internal and
#     never propagated (#268/#271), which matches exactly.
#   * It is adjacent to the data it constrains. A `class:` here and a
#     `type:` in `paths:` above are two halves of one statement, and
#     scripts/ci/check_doc_ownership cross-validates them in one read.
#   * It inherits the existing validation harness. check_sync_manifest
#     and check_propagation_closure already parse this file with yq
#     behind a MERGEPATH_MANIFEST_PATH fixture override, so the new
#     check reuses the same idiom instead of inventing a second one.
#
# THE THREE CLASSES. Every docs/agents/*.md file on disk MUST appear
# below exactly once, with exactly one of:
#
#   canonical      — one source of truth on the hub, mirrored verbatim
#                    to consumers. Must be true, verbatim, in EVERY repo
#                    that receives it: no hub identity claims, no
#                    repo-specific tech stack, no reference to tooling a
#                    consumer lacks. Backed by a `paths:` entry above.
#   per-repo-owned — each repo authors and owns its own copy. The hub's
#                    copy is mergepath's, not a template. Must never be
#                    a verbatim `canonical`/`kit` entry (it would clobber
#                    the consumer's copy on the next wave — the #744
#                    failure).
#   hub-only       — describes machinery only the hub runs (the
#                    propagation engine, the bootstrap wizard, the
#                    templated-render engine, the CodeRabbit config
#                    audit). Never travels; a consumer copy is bootstrap
#                    residue to delete, not content to sync.
#
# `bootstrap-seeded` is deliberately NOT a class. Bootstrap describes
# initial DELIVERY, not durable OWNERSHIP: a file seeded into a new repo
# is afterwards owned by exactly one of the three classes above.
#
# MIXED DOCUMENTS. A doc whose content is partly shared and partly
# repo-specific is TRANSITIONAL DEBT to be split, not a fourth class.
# Classify it by its DOMINANT ownership and record the split in `note:`.
# The split itself is separate follow-up work.
#
# FIELDS:
#   path              (required) repo-relative path, must exist on disk. Paths
#                     must be canonical spellings: no absolute paths, parent
#                     traversal, embedded dot/empty segments, or commas.
#   class             (required) canonical | per-repo-owned | hub-only.
#   pending_manifest  (optional, canonical only) `true` when the class is
#                     decided but the `paths:` entry has not landed yet.
#                     Requires a `note:` naming the follow-up. Without
#                     this flag a canonical class with no `paths:` entry
#                     is a FAIL — an unbacked canonical claim.
#   note              (optional, required with pending_manifest) free
#                     text: the transitional-debt record.
#
# ENFORCED by scripts/ci/check_doc_ownership: zero classes, two classes,
# an unknown class, an unsafe/stale path, an unbacked canonical claim, an
# unsupported canonical `dest:` remap, or a per-repo-owned/hub-only doc sitting
# in a verbatim canonical/kit entry all fail the check.
#
# ADDING A DOC. A PR that adds a docs/agents/*.md file MUST add its
# `doc_ownership:` entry in the SAME PR — the check fails closed on an
# unclassified doc, by design. When two branches race (one adding a doc,
# one editing this block), whichever merges second adds the entry.
doc_ownership:
  # ── canonical ──────────────────────────────────────────────────────
  - path: docs/agents/shared-operating-rules.md
    class: canonical
  - path: docs/agents/worktree-placement.md
    class: canonical
  # Landed in #776 while this inventory was in flight. Canonical by the same
  # reasoning as worktree-placement.md: a single-purpose, tech-stack-independent
  # convention that is true verbatim in every consumer, already carried as a
  # `type: canonical` path entry above.
  - path: docs/agents/decision-records.md
    class: canonical
  - path: docs/agents/code-review-requirements.md
    class: canonical
    note: >-
      #780 step 6 RESOLVED as canonical-thin-pointer, not remove-if-unused.
      Evidence: an org-wide code search finds no inbound reference in any
      of the ten repos except the generated PRD mirror, so "unused" was
      literally true — but the doc is a live governance tombstone ("do not
      add review rules here; update REVIEW_POLICY.md instead"), it names
      only files present in every consumer, and it is already byte-identical
      (blob 9c6d1c37) in 8 of 9. Removing it would have stranded those 8
      orphans and a dead PRD row in another repo to buy nothing.
      Canonicalizing instead closes the friends-and-family-billing gap and
      makes drift impossible. It is now indexed in the hub AGENTS.md; the
      consumer AGENTS.md rows land with the steps 4-5 migration wave.
  - path: docs/agents/prose-line-wrapping.md
    class: canonical
    note: >-
      SPLIT OUT of docs/agents/documentation-rules.md by #780 step 6. The
      universal half (soft-wrap prose, one physical line per paragraph,
      never reflow a file this repo does not author) is canonical here;
      the mergepath-local half (in-scope path allowlist, the
      md-prose-wrap gate) stays in the per-repo-owned file, which now
      points here for the rule itself.

  # ── per-repo-owned ─────────────────────────────────────────────────
  - path: docs/agents/operating-rules.md
    class: per-repo-owned
    note: >-
      MIXED — the transitional debt #780 exists to split. All 9 consumer
      copies differ from the hub and from each other; five carry large
      repo-specific architecture, logging, and coding blocks (up to 407
      lines in device-source-of-truth). Dominant ownership is per-repo,
      so it stays the LOCAL OVERLAY. The shared half moved to
      docs/agents/shared-operating-rules.md; removing the now-duplicated
      prose from each local overlay is #780 steps 4-5 (canary first).
  - path: docs/agents/documentation-rules.md
    class: per-repo-owned
    note: >-
      MIXED, and confirmed so by the fleet: all 9 consumer copies differ
      from the hub and from each other, and every one of them is a
      repo-specific list of which of ITS docs to update when. Stays
      per-repo-owned. #780 step 6 extracted the prose line-wrapping rule
      into canonical docs/agents/prose-line-wrapping.md and left the
      allowlist + gate behind. Canonical-source discipline was
      deliberately NOT extracted: as written it names
      scripts/audit-canonical-mirrors.sh (hub-only, bootstrap-excluded)
      and describes mergepath's own authoring workflow, so a verbatim
      mirror would be false downstream. Extracting it needs a rewrite,
      not a move — a separate decision, not this audit.
  - path: docs/agents/deployment-process.md
    class: per-repo-owned
    note: >-
      MIXED. Deploy commands, environments, and build steps are
      repo-specific by construction, so it stays per-repo-owned. #780
      step 6 declined to mint a canonical deploy doc and extracted the
      universal floor into shared-operating-rules.md § Secret handling
      instead. Evidence for declining: the 9 consumer copies are 925-2814
      bytes against the hub's 6853 and are already rewritten to each
      repo's own deploy story; only 2 of 4 sampled carry the
      no-downgrade invariant, in incompatible wordings ("template-derived
      repos" vs "this repo"); the surrounding procedure depends on
      op-firebase-deploy, a PATH command rather than a guaranteed repo
      file; and the one procedural rule that IS universal (the op
      sign-in pause-and-prompt) was already canonical. Residual:
      gaycruisebingo's copy is still byte-identical to the hub's
      (un-scrubbed bootstrap residue asserting a hub-only workflow it
      does not have — the #744/#747 class), a consumer-side deletion for
      the steps 4-5 migration wave.
  - path: docs/agents/repository-overview.md
    class: per-repo-owned
  - path: docs/agents/testing-requirements.md
    class: per-repo-owned
  - path: docs/agents/code-modification-rules.md
    class: per-repo-owned
  - path: docs/agents/cloudflare-mcp-servers.md
    class: per-repo-owned
    note: >-
      A capability note about a plugin installed on this machine
      (#908), not a fleet-wide convention. Stays per-repo-owned.

  # ── hub-only ───────────────────────────────────────────────────────
  - path: docs/agents/bootstrap-runbook.md
    class: hub-only
  - path: docs/agents/propagation-ordering.md
    class: hub-only
  - path: docs/agents/templated-propagation.md
    class: hub-only
  - path: docs/agents/coderabbit-audit.md
    class: hub-only
    note: >-
      Documents the hub-side CodeRabbit configuration audit — it records
      the TEMPLATE repo's own .coderabbit.yml posture ("our value") and a
      fleet-wide seat-coverage sweep, so a verbatim consumer copy reads
      as if the consumer were the hub. #780 step 6 made the class
      enforceable: it is now on check_sync_manifest's
      IDENTITY_DOCS_DENYLIST, the bootstrap mirror derives its exclude
      pattern from this very class entry (see
      bootstrap::_derive_hub_only_excludes in
      scripts/bootstrap/template-mirror.sh, so there is no second list
      to keep in step), and
      REVIEW_POLICY.md's two links to it were rewritten as absolute
      hub URLs so excluding it strands no dead relative link in a newly
      bootstrapped repo. Residual: gaycruisebingo still carries the
      un-scrubbed bootstrap residue (the only consumer that does);
      deleting it is a consumer-side change for the steps 4-5 wave.
