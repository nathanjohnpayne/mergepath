# .repo-template.yml
#
# Per-repo overrides for CI lint scripts under scripts/ci/. Read by:
#   - scripts/ci/check_spec_test_alignment
#
# Keep this file small and only add entries when the default conventions
# (filename match of test against spec basename) don't cover the case.

# Map each spec_id (frontmatter or basename) to one or more test files.
# Used by check_spec_test_alignment when the default filename search
# wouldn't find the test.
spec_test_map:
  coderabbit_phase_25_invocation:
    - tests/test_coderabbit_should_invoke.sh
  mergepath_playground:
    - tests/test_mergepath_playground.sh
  bootstrap_consumer_identity:
    - tests/test_bootstrap_template_mirror.sh
  coderabbit_review_sensing:
    - tests/test_coderabbit_wait_status_probe.sh
    - tests/test_phase_4b_automation.sh
    # The waiter's freshness-rung and response-shape criteria (#967/#968/#985)
    # are asserted here rather than in the probe suite.
    - tests/test_coderabbit_wait_statuscontext_ratelimit.sh
  review_feedback_accounting:
    - tests/test_review_feedback_accounting.sh
  # NOTE - avoid a colon followed by a space anywhere in a comment inside this
  # block. check_spec_test_alignment parses it line by line and treats any
  # line containing one as a key, silently rebinding the current spec and
  # attaching the entries below it to the wrong name. A mapping written with
  # such a comment reads correctly and does not work.
  worktree_cleanup_audit:
    # Covered by the helper's own suite rather than a spec-named file. The
    # cases that assert the exit contract (unreadable and unwritable snapshot
    # paths, the eligibility short-circuit, the cause-specific remedy) are
    # inseparable from the classification fixtures they run against, so a
    # separate file would duplicate the whole fixture repo.
    - tests/test_worktree_cleanup.sh
  doc_ownership_validation:
    - tests/test_check_doc_ownership.sh
  repo_lint_execution:
    - tests/test_repo_lint_optimization.sh
    - tests/test_655_repo_lint_local_observed.sh
  bootstrap_label_seeding:
    # Covered by the stage's own suite rather than a spec-named file. The
    # format, the fail-closed guard and the warning-record behaviour are all
    # asserted against the real bootstrap::_seed_labels there, driven through
    # the gh shim, so a separate file would duplicate the whole harness.
    - tests/test_bootstrap_github_infra.sh
  # The publisher's fence and fixtures live in the merge-clearance suite
  # (Test 25) rather than a file of their own: a new tests/ file wired into
  # a propagated scripts/ci/check_* needs its own manifest requires: entry,
  # which grows the diff for bookkeeping rather than content. The default
  # filename search cannot find it, hence this entry (#845).
  required_check_publisher:
    - tests/test_merge_clearance_gate.sh

# Glob patterns that identify test files. Supplements the default
# ("tests/**/*.test.*") which doesn't cover shell-based tests.
test_globs:
  - "tests/**"

# Top-level directories beyond the canonical set that are intentional
# in this repo. Silences `check_no_forbidden_top_level_dirs` warnings.
# Uses inline-array form because the parser in that script only
# recognizes `key: [a, b]`, not indented list items.
extra_top_level_dirs: [mergepath, packaging, artifacts, bugs, examples]
