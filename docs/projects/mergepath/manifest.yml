# Generated project-documentation manifest for Mergepath's own project folder.
# Canonical sync configuration lives in .mergepath-project-docs.yml; this file
# is the project-scoped, human-readable mirror of the same source/destination
# contract for agents working from docs/projects/<project>/.
version: 1
project: mergepath
owning_repo: nathanjohnpayne/mergepath

prds:
