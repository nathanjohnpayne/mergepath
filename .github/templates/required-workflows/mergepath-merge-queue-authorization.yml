# Canonical inert template for the organization policy repository.
#
# Do not move this file under this target repository's .github/workflows/.
# The active copy must live only in the separately protected source repository
# selected by the organization ruleset. That rule binds its repository, path,
# ref, and exact SHA independently of the target pull request.

name: Mergepath Merge Queue Authorization

on:
  # GitHub ignores filters on organization-ruleset required workflows. The PR
  # leg must finish before queue admission; only merge_group may authorize the
  # final synthetic commit.
  pull_request:
  merge_group:

permissions:
  actions: read
  checks: read
  contents: read
  issues: read
  pull-requests: read
  security-events: read
  statuses: read

jobs:
  admission:
    name: Merge queue admission handoff
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact trusted target base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: trusted-base

      - name: Require the native queue before admission
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
          WORKFLOW_REF: ${{ job.workflow_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          MERGEPATH_REPO_ROOT="$GITHUB_WORKSPACE/trusted-base" \
            "$GITHUB_WORKSPACE/trusted-base/scripts/workflow/merge-queue-required-admission.sh" \
              --repo "$REPO" \
              --pr "$PR_NUMBER" \
              --head-sha "$EVENT_HEAD_SHA" \
              --head-ref "$EVENT_HEAD_REF" \
              --head-repo "$EVENT_HEAD_REPOSITORY" \
              --base-sha "$EVENT_BASE_SHA" \
              --base-ref "$EVENT_BASE_REF" \
              --default-branch "$DEFAULT_BRANCH" \
              --workflow-repository "$WORKFLOW_REPOSITORY" \
              --workflow-file-path "$WORKFLOW_FILE_PATH" \
              --workflow-ref "$WORKFLOW_REF" \
              --workflow-sha "$WORKFLOW_SHA"

  precheck:
    name: Merge group pre-audit policy check
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact trusted target base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.merge_group.base_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: trusted-base

      - name: Evaluate the released PR and singleton queue entry
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
          WORKFLOW_REF: ${{ job.workflow_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          MERGEPATH_REPO_ROOT="$GITHUB_WORKSPACE/trusted-base" \
            "$GITHUB_WORKSPACE/trusted-base/scripts/workflow/merge-group-required-checks.sh" \
              --repo "$REPO" \
              --head-sha "$GROUP_HEAD_SHA" \
              --head-ref "$GROUP_HEAD_REF" \
              --base-sha "$GROUP_BASE_SHA" \
              --base-ref "$GROUP_BASE_REF" \
              --default-branch "$DEFAULT_BRANCH" \
              --workflow-repository "$WORKFLOW_REPOSITORY" \
              --workflow-file-path "$WORKFLOW_FILE_PATH" \
              --workflow-ref "$WORKFLOW_REF" \
              --workflow-sha "$WORKFLOW_SHA" \
              --run-id "$RUN_ID" \
              --run-attempt "$RUN_ATTEMPT" \
              --phase pre-audit

  handshake:
    name: Source-pinned final audit handshake
    if: >-
      github.event_name == 'merge_group' &&
      needs.precheck.result == 'success'
    needs: [precheck]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      issues: read
      pull-requests: read
    steps:
      # This is the only job with write authority. It checks out the separately
      # protected policy source at the immutable SHA GitHub selected for this
      # required workflow. It never checks out or executes target-base code.
      - name: Fetch the exact public policy source without credentials
        env:
          SOURCE_REPOSITORY: ${{ job.workflow_repository }}
          SOURCE_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          case "$SOURCE_REPOSITORY" in */*) ;; *) exit 1 ;; esac
          printf '%s' "$SOURCE_SHA" \
            | grep -Eq '^[0-9a-fA-F]{40}([0-9a-fA-F]{24})?$'
          SOURCE_DIR="$GITHUB_WORKSPACE/trusted-policy-source"
          git init "$SOURCE_DIR"
          git -C "$SOURCE_DIR" remote add origin \
            "https://github.com/$SOURCE_REPOSITORY.git"
          git -C "$SOURCE_DIR" -c protocol.version=2 fetch \
            --no-tags --depth=1 origin "$SOURCE_SHA"
          [ "$(git -C "$SOURCE_DIR" rev-parse FETCH_HEAD)" = "$SOURCE_SHA" ]
          git -C "$SOURCE_DIR" checkout --detach "$SOURCE_SHA"
          [ "$(git -C "$SOURCE_DIR" rev-parse HEAD)" = "$SOURCE_SHA" ]
          [ -z "$(git -C "$SOURCE_DIR" symbolic-ref -q HEAD || true)" ]

      - name: Dispatch and verify the final administrative audit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
          WORKFLOW_REF: ${{ job.workflow_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          "$GITHUB_WORKSPACE/trusted-policy-source/scripts/workflow/merge-queue-final-handshake.sh" \
            --repo "$REPO" \
            --head-sha "$GROUP_HEAD_SHA" \
            --head-ref "$GROUP_HEAD_REF" \
            --base-sha "$GROUP_BASE_SHA" \
            --base-ref "$GROUP_BASE_REF" \
            --default-branch "$DEFAULT_BRANCH" \
            --workflow-repository "$WORKFLOW_REPOSITORY" \
            --workflow-file-path "$WORKFLOW_FILE_PATH" \
            --workflow-ref "$WORKFLOW_REF" \
            --workflow-sha "$WORKFLOW_SHA" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT"

  postcheck:
    name: Merge group post-audit policy check
    if: >-
      github.event_name == 'merge_group' &&
      needs.precheck.result == 'success' &&
      needs.handshake.result == 'success'
    needs: [precheck, handshake]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact trusted target base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.merge_group.base_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: trusted-base

      - name: Re-evaluate every public predicate after the private audit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
          WORKFLOW_REF: ${{ job.workflow_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          MERGEPATH_REPO_ROOT="$GITHUB_WORKSPACE/trusted-base" \
            "$GITHUB_WORKSPACE/trusted-base/scripts/workflow/merge-group-required-checks.sh" \
              --repo "$REPO" \
              --head-sha "$GROUP_HEAD_SHA" \
              --head-ref "$GROUP_HEAD_REF" \
              --base-sha "$GROUP_BASE_SHA" \
              --base-ref "$GROUP_BASE_REF" \
              --default-branch "$DEFAULT_BRANCH" \
              --workflow-repository "$WORKFLOW_REPOSITORY" \
              --workflow-file-path "$WORKFLOW_FILE_PATH" \
              --workflow-ref "$WORKFLOW_REF" \
              --workflow-sha "$WORKFLOW_SHA" \
              --run-id "$RUN_ID" \
              --run-attempt "$RUN_ATTEMPT" \
              --phase post-audit

  required-contexts:
    name: ${{ matrix.context_name }}
    if: github.event_name == 'merge_group' && always()
    needs: [postcheck]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        context_name:
          - Label Gate
          - Self-Review Required
          - CodeRabbit unresolved blocking findings
          - Codex P1 unresolved threads
          - Merge clearance gate
    steps:
      - name: Publish bridge verdict
        env:
          BRIDGE_RESULT: ${{ needs.postcheck.result }}
        run: |
          [ "$BRIDGE_RESULT" = "success" ] || {
            echo "Merge-group authorization did not clear: $BRIDGE_RESULT" >&2
            exit 1
          }
