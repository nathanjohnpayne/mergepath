name: Weekly branch-protection audit

# Runs `scripts/audit-branch-protection.sh --fleet` weekly across the hub
# and every consumer declared in `.mergepath-sync.yml`, so branch-protection
# drift is surfaced on a schedule instead of only when somebody thinks to
# run the audit by hand. See #774 for the drift this closes: the audit
# script existed and was referenced only from documentation, nothing
# invoked it, and the fleet reached a state where eight of ten repos
# enforced ZERO of the five canonical gates and three had no protection on
# `main` at all — with no red check anywhere to say so.
#
# Scope — read-only, on purpose:
#   This workflow only READS branch protection. It never calls a
#   protection-mutating endpoint. Bringing a repo up to the canonical set
#   is an owner-authorised settings change (#774 item 1) and is
#   deliberately out of this workflow's reach; the cron's job is
#   visibility, not remediation.
#
# What it does on drift (`--fleet` exits 3):
#   1. Writes a GitHub Actions job summary ($GITHUB_STEP_SUMMARY) with the
#      per-repo verdict table and the full audit output.
#   2. Opens-or-updates a SINGLE rollup issue labelled
#      `branch-protection-drift`. One issue for the whole fleet, refreshed
#      in place — not one issue per repo per run. On a clean audit it
#      closes any open rollup issue.
#
#      The label is the dedupe key, but it is NOT allowed to gate the
#      report: ensuring it is best-effort, and if it cannot be created the
#      rollup issue is still opened (unlabelled) and the job fails
#      afterwards. Reporting drift with a degraded dedupe key beats
#      reporting nothing at all.
#
# Auth model — the trap this workflow is most likely to fall into:
#   `GET /repos/{owner}/{repo}/branches/{branch}/protection` requires the
#   **`Administration:read`** scope (the ruleset half of the audit — GitHub
#   enforces classic protection and rulesets together, so both are read —
#   does not, but a token that cannot read the first is useless here). The
#   reviewer PAT in `secrets.REVIEWER_ASSIGNMENT_TOKEN` — the token
#   weekly-drift-audit.yml uses for its cross-repo clones — does NOT have
#   it and 403s on every repo (#177, #285). So this workflow needs its own
#   secret, `secrets.BRANCH_PROTECTION_AUDIT_TOKEN`, holding an
#   author/admin PAT with `Administration:read` on every repo in the
#   manifest.
#
#   `Administration:read` — NOT write — is the whole contract, and the
#   hub's admin-enforcement audit is built to live inside it. GitHub
#   returns a ruleset's `bypass_actors` list only to a caller with WRITE
#   access to that ruleset ("to prevent leaking sensitive information"),
#   so a correctly scoped token here never sees it. The audit therefore
#   reads admin bypass from `current_user_can_bypass`, which read-only
#   callers do receive, after confirming the token's identity is a
#   repository admin. Do NOT "fix" a ruleset-path exit 2 by upgrading
#   this secret to `Administration:write`: that would hand a weekly,
#   unattended, fleet-wide credential the power to rewrite the very
#   protection this workflow exists to audit — a strictly worse posture
#   than the drift it detects.
#
#   One consequence worth stating: because the identity must be a
#   repository ADMIN (not merely a reader) for the hub's ruleset path to
#   reach a verdict, a token downgraded to a non-admin identity exits 2
#   rather than reporting clean. That is the intended direction.
#
#   Because a wrong or absent token produces a *uniform* failure across
#   every repo, it could easily be mistaken for "nothing to report". Two
#   guards prevent that:
#     - the "Run the fleet audit" step fails the job outright when the
#       secret is empty or whitespace, naming the secret and the scope it
#       needs — in an ::error:: annotation AND in a job summary on the run
#       page, because a guard that fails correctly but only inside a
#       collapsed log group is still a silent audit (#989). The summary
#       states what has to be provisioned and points at
#       docs/architecture/0002-branch-protection-enforcement-posture.md
#       § Provisioning BRANCH_PROTECTION_AUDIT_TOKEN;
#     - `--fleet` exits 2 (infrastructure) rather than 3 (drift) when any
#       repo could not be read, and this workflow fails loudly on 2
#       WITHOUT touching the rollup issue. A token that lost its scope can
#       therefore never present as a clean audit, and can never close an
#       open rollup issue.
#
# Issue-write token:
#   The rollup issue lives in THIS repository, so the default
#   `GITHUB_TOKEN` (with `issues: write` below) is sufficient and is the
#   least-privilege choice — the admin PAT is used only for the reads that
#   genuinely require it. The known consequence is that a GITHUB_TOKEN-
#   authored issue or comment creates no workflow runs; that is acceptable
#   here precisely because the rollup issue is a terminal notification
#   surface and no workflow keys off it. If anything ever does need to
#   trigger on this issue, the issue steps must move to a PAT — the
#   permission block alone will not fix it.
#
# `--fleet` exit codes (see scripts/audit-branch-protection.sh header):
#   0  clean — every audited repo requires all canonical checks
#   1  usage error / missing prerequisite (yq, manifest, unsupported
#      manifest schema version, hub repo, unwritable --summary-file)
#   2  at least one repo could not be audited (auth/API) — infrastructure
#   3  drift — at least one readable repo is missing a canonical check, or
#      (hub only, ADR 0002) requires one that an admin/bypass actor can skip
# Only 3 touches the rollup issue; only 0 closes it. 1 and 2 fail the job
# and leave the issue exactly as it was.

on:
  schedule:
    # Mondays 08:30 UTC — after weekly-drift-audit.yml (08:00) and before
    # pr-audit.yml / the feedback sweep (09:00), so all three weekly
    # reports are already filed when the human's planning window starts.
    - cron: '30 8 * * 1'
  # Manual runs go through repository_dispatch, NOT workflow_dispatch.
  #
  # workflow_dispatch lets the dispatcher pick a ref, and GitHub then runs
  # the workflow DEFINITION from that ref. Any in-workflow guard against a
  # non-default ref therefore lives in the very file the dispatcher can
  # rewrite: push a branch that deletes the guard (or replaces the steps
  # outright) and the run gets BRANCH_PROTECTION_AUDIT_TOKEN — an
  # admin-scoped PAT with Administration:read on all ten fleet repos —
  # before the pinned checkout can matter. Pinning `ref:` on the checkout
  # step does not help: the step list itself came from the attacker's ref.
  #
  # repository_dispatch has no ref parameter at all. GitHub only ever runs
  # the DEFAULT-BRANCH copy of a repository_dispatch workflow, so the
  # branch-selection surface is gone rather than guarded from inside. Fire
  # one with:
  #
  #   gh api repos/nathanjohnpayne/mergepath/dispatches \
  #     -f event_type=branch-protection-audit
  #
  # (a PAT is required — a GITHUB_TOKEN-authored dispatch creates no
  # workflow run.) Do NOT re-add workflow_dispatch here; the ref guard on
  # the job below is a backstop, not a substitute, and
  # tests/test_audit_branch_protection_workflow.sh fails if it reappears.
  repository_dispatch:
    types: [branch-protection-audit]

permissions:
  contents: read
  issues: write

# Serialize every run of this audit. The rollup-issue steps are a
# read-then-write pair: two overlapping runs can both see "no open rollup
# issue" and both `gh issue create`, breaking the single-rollup guarantee
# this workflow's whole reporting model rests on; and a slow drift run
# finishing after a fast clean run would re-open what the clean run just
# closed. `cancel-in-progress: false` queues rather than cancels, so a
# scheduled audit is never silently dropped in favour of a manual one.
concurrency:
  group: branch-protection-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit fleet branch protection
    # Backstop, not the primary control. With repository_dispatch and
    # schedule as the only triggers, github.ref_name is ALWAYS the default
    # branch, so this condition is expected to be trivially true — it
    # exists so that re-adding a ref-selectable trigger fails closed
    # instead of silently handing an admin PAT to a feature branch. The
    # real protection is the absence of workflow_dispatch above (#550).
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Every value below is written straight into a GitHub API field that
      # has a documented limit, so each is kept here as a measurable YAML
      # scalar rather than inline in a `run:` heredoc — that is what lets
      # tests/test_audit_branch_protection_workflow.sh assert the exact
      # bytes GitHub would receive:
      #   TRACKING_LABEL              label name,        <= 50 characters
      #   TRACKING_LABEL_COLOR        label color,       exactly 6 hex digits, no '#'
      #   TRACKING_LABEL_DESCRIPTION  label description, <= 100 characters
      #   ISSUE_TITLE                 issue title,       <= 256 characters
      # An over-long description does not degrade — GitHub 422s the whole
      # `POST /repos/{owner}/{repo}/labels` call, so the label is simply
      # never created.
      TRACKING_LABEL: branch-protection-drift
      TRACKING_LABEL_COLOR: D93F0B
      TRACKING_LABEL_DESCRIPTION: 'Fleet repo does not require the canonical mergepath status checks (branch-protection-audit.yml)'
      ISSUE_TITLE: 'Fleet branch protection has drifted from the canonical required checks'
    steps:
      - name: Checkout mergepath
        # Pin to the trusted default branch (#548). Belt-and-braces given
        # the triggers above already fix the ref: it keeps the checked-out
        # scripts/audit-branch-protection.sh trusted even if a future edit
        # adds a ref-selectable trigger, and it makes the intent explicit
        # rather than implicit in the trigger list.
        # persist-credentials:false is safe: the audit reads through
        # `gh api`, not through the workspace git remote.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Install yq (mikefarah/yq v4)
        # --fleet parses .mergepath-sync.yml with mikefarah/yq. Delegate to
        # the single-source pinned bootstrap (#616) rather than duplicating
        # a version pin here.
        run: |
          set -euo pipefail
          bash scripts/lib/ensure-yq.sh
          yq --version

      - name: Verify gh is present
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            echo "ERROR: gh not installed on runner" >&2
            exit 1
          fi
          gh --version

      - name: Run the fleet audit
        id: audit
        env:
          # Admin-scoped READ path. See the auth-model note in the header:
          # the reviewer PAT cannot read branch protection, so this is a
          # distinct secret and its absence must be loud.
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_AUDIT_TOKEN }}
          HUB_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          # An unset secret and a secret set to whitespace are the same
          # thing to this audit, and GitHub cannot tell them apart from the
          # Settings page either: an empty secret still exists and still
          # bumps `updated_at`. Strip before testing so " " cannot buy a
          # token-shaped value past the guard and into a fleet-wide run of
          # 403s that reads as flaky infrastructure (#989).
          if [ -z "$(printf '%s' "${GH_TOKEN}" | tr -d '[:space:]')" ]; then
            echo "::error::BRANCH_PROTECTION_AUDIT_TOKEN secret is empty — the audit cannot read branch protection without a token carrying the 'Administration:read' scope on every repo in .mergepath-sync.yml."
            echo "        The reviewer PAT (REVIEWER_ASSIGNMENT_TOKEN) is NOT a substitute: it lacks that scope and 403s on every repo (#177, #285)."
            echo "        Set BRANCH_PROTECTION_AUDIT_TOKEN in repo Settings -> Secrets and variables -> Actions."

            # The annotation above is a line in a collapsed log group. This
            # audit had never once produced a result: every run since it
            # landed aborted here, and the only outward sign was a red cron
            # nobody was reading (#989). A guard that fails correctly but
            # illegibly is still a silent audit, so restate the failure on
            # the run page itself — the surface a human actually opens —
            # complete with what has to be provisioned. Written even though
            # the step is about to exit non-zero: the summary is the report
            # for a run that produced no audit.
            {
              echo "# Weekly branch-protection audit — DID NOT RUN"
              echo
              echo ":no_entry: **No audit was performed.** The \`BRANCH_PROTECTION_AUDIT_TOKEN\` secret is empty or unset, so this run read nothing and knows nothing. **This is not a clean result** — treat the fleet's protection posture as unverified since the last successful run."
              echo
              echo "## What has to be provisioned"
              echo
              echo "| | |"
              echo "|---|---|"
              echo "| **Secret name** | \`BRANCH_PROTECTION_AUDIT_TOKEN\` (Actions secret on \`${HUB_REPO}\`) |"
              echo "| **Kind** | Fine-grained PAT, **read-only** |"
              echo "| **Scope** | \`Administration: read\` on every repo in \`.mergepath-sync.yml\`, plus this hub |"
              echo "| **Identity** | Must be a repository **admin** on the hub — the hub's admin-enforcement check reads \`current_user_can_bypass\`, which is only evidence about admins when the caller is one. A non-admin identity exits 2, not clean. |"
              echo "| **Not this** | \`REVIEWER_ASSIGNMENT_TOKEN\` — the reviewer PAT lacks \`Administration:read\` and 403s on every repo (#177, #285). Pointing this workflow at it is not a fix. |"
              echo "| **Never this** | \`Administration: write\`. It would hand a weekly, unattended, fleet-wide credential the power to rewrite the protection this workflow exists to audit. |"
              echo "| **Where** | Settings → Secrets and variables → Actions → New repository secret |"
              echo
              echo "Provisioning is deliberately a human action — it mints a credential — and the full procedure, including storing the PAT in 1Password and guarding \`gh secret set\` against writing an empty value, is in [\`docs/architecture/0002-branch-protection-enforcement-posture.md\`](docs/architecture/0002-branch-protection-enforcement-posture.md) § Provisioning \`BRANCH_PROTECTION_AUDIT_TOKEN\`."
              echo
              echo "Once the secret exists, verify it off-schedule without waiting a week:"
              echo
              echo '```'
              echo "gh api repos/${HUB_REPO}/dispatches -f event_type=branch-protection-audit"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          chmod +x scripts/audit-branch-protection.sh

          # Capture stdout+stderr for the job summary and the rollup issue
          # body while still streaming to the run log. The compact per-repo
          # verdict table is written separately so the issue body can carry
          # it in full even when the verbose output has to be truncated.
          set +e
          scripts/audit-branch-protection.sh --fleet \
            --hub-repo "$HUB_REPO" \
            --summary-file fleet-summary.txt 2>&1 | tee audit-output.txt
          rc=${PIPESTATUS[0]}
          set -e

          echo "exit_code=${rc}" >> "$GITHUB_OUTPUT"
          echo "Fleet audit exited with code ${rc}"

          case "${rc}" in
            0)
              echo "result=clean" >> "$GITHUB_OUTPUT"
              ;;
            3)
              echo "result=drift" >> "$GITHUB_OUTPUT"
              ;;
            1)
              echo "::error::audit-branch-protection.sh --fleet exited 1 (usage error / missing prerequisite: yq, manifest, or hub repo). This is NOT drift — failing the workflow without touching the rollup issue."
              exit 1
              ;;
            2)
              echo "::error::audit-branch-protection.sh --fleet exited 2 (at least one repo could not be read). Almost always a token without 'Administration:read' on that repo. This is an infrastructure failure, NOT drift — failing the workflow without touching the rollup issue, so a scope loss can never present as a clean audit."
              exit 2
              ;;
            *)
              echo "::error::audit-branch-protection.sh --fleet exited with unexpected code ${rc} (contract drift). Failing the workflow."
              exit "${rc}"
              ;;
          esac

      - name: Write job summary
        # Runs for both clean and drift. The exit-1/2 paths above already
        # failed the job and never reach here, so the summary only ever
        # reflects a real audit verdict.
        if: steps.audit.outputs.result == 'clean' || steps.audit.outputs.result == 'drift'
        env:
          RESULT: ${{ steps.audit.outputs.result }}
        run: |
          {
            echo "# Weekly branch-protection audit"
            echo
            if [ "${RESULT}" = "clean" ]; then
              echo ":white_check_mark: **No drift.** Every repo in \`.mergepath-sync.yml\` (plus the hub) requires all canonical mergepath checks on its default branch."
            else
              echo ":warning: **Protection drift.** At least one repo either does not require the canonical checks — so the corresponding gate workflows run but their failures are advisory — or requires one that an admin or bypass actor can skip. The per-repo output below says which."
              echo
              echo "A rollup issue (label \`${TRACKING_LABEL}\`) has been opened or updated. Remediation is an owner-authorised settings change; this cron only reports."
            fi
            echo
            echo "## Per-repo verdicts"
            echo
            echo '```'
            cat fleet-summary.txt
            echo '```'
            echo
            echo "## Full audit output"
            echo
            echo '```'
            cat audit-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure tracking label exists
        id: label
        if: steps.audit.outputs.result == 'drift'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Deliberately `set -uo pipefail` and NOT `set -e`. This step runs
          # BEFORE the step that writes the rollup issue, and the issue is
          # this workflow's whole deliverable — the label only exists so the
          # NEXT run can find that issue again. Under `set -e` any label
          # failure aborts the job here and the drift run reports nothing at
          # all: no issue, no notification, drift signalled only by a red
          # cron. That is the blind spot #774 exists to close, so the
          # convenience must not be allowed to block the deliverable.
          # Instead the outcome is published as steps.label.outputs.ready
          # and the rollup step degrades loudly (see below) — the failure is
          # annotated and still fails the job, just AFTER the report lands.
          set -uo pipefail

          ready=false
          # Idempotent: `gh label create` errors if the label already
          # exists, so check first. `--limit 500` overrides gh's default
          # 30-item cap — without it the existence check could miss an
          # already-present label in a repo with >30 labels and fall into
          # the create branch.
          if gh label list --repo "$REPO" --limit 500 --json name --jq '.[].name' | grep -qx "$TRACKING_LABEL"; then
            echo "Label '$TRACKING_LABEL' already exists."
            ready=true
          else
            echo "Creating label '$TRACKING_LABEL'."
            if create_err="$(gh label create "$TRACKING_LABEL" --repo "$REPO" \
                --color "$TRACKING_LABEL_COLOR" \
                --description "$TRACKING_LABEL_DESCRIPTION" 2>&1)"; then
              ready=true
            elif printf '%s\n' "$create_err" | grep -qiE 'already exists|already been taken'; then
              # Either the listing above failed outright (a failed pipeline
              # is indistinguishable from an empty one at the `grep -qx`)
              # or something created the label in between. Both mean the
              # label is present and only the lookup was wrong.
              echo "Label '$TRACKING_LABEL' is already present (create reported a duplicate)."
              ready=true
            else
              printf '%s\n' "$create_err" >&2
              echo "::warning::Could not create the '${TRACKING_LABEL}' label. The rollup issue will still be written, but it cannot be labelled — so the next run will not find it and will open a duplicate. The rollup step reports the drift first and then fails the job."
            fi
          fi

          echo "Tracking label ready: ${ready}"
          echo "ready=${ready}" >> "$GITHUB_OUTPUT"

      - name: Open or update the rollup issue
        if: steps.audit.outputs.result == 'drift'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # 'true' only when the previous step proved the tracking label is
          # present. Anything else (including an empty value, e.g. a step
          # that never ran) is treated as "not present" — fail-safe for the
          # report, not for the label.
          LABEL_READY: ${{ steps.label.outputs.ready }}
        run: |
          set -euo pipefail
          today="$(date -u '+%Y-%m-%d')"

          # GitHub caps an issue body at 65536 characters. The verbose
          # per-repo output can approach that on a ten-repo fleet, so the
          # body is assembled findings-first: the compact verdict table
          # goes in whole and the VERBOSE block is what gets truncated.
          # Capping the other way around would silently drop repos from
          # the rollup — a rollup that loses findings to a body cap is the
          # failure mode this ordering exists to prevent.
          OUTPUT_BUDGET=40000
          truncated=0
          if [ "$(wc -c < audit-output.txt)" -gt "$OUTPUT_BUDGET" ]; then
            truncated=1
          fi

          {
            echo "## Fleet branch-protection drift"
            echo
            echo "\`scripts/audit-branch-protection.sh --fleet\` found at least one repo whose"
            echo "default branch does not enforce the canonical mergepath posture. **Read the"
            echo "per-repo output below for the reason** — exit 3 covers two distinct findings,"
            echo "and they have different fixes:"
            echo
            echo "1. **A canonical check is not required.** The corresponding workflow still runs"
            echo "   and still goes red — but the PR merges anyway. \`Label Gate\` is the"
            echo "   load-bearing one: where it is not required, the whole"
            echo "   \`needs-external-review\` / \`needs-human-review\` / \`policy-violation\` /"
            echo "   \`human-hold\` merge block is advisory (see #161, #774). The audit prints"
            echo "   \`FAIL: N canonical mergepath check(s) NOT required\` and names them."
            echo "2. **A required check is skippable.** Every protection source that requires it"
            echo "   also allows a bypass — classic protection without \`enforce_admins\`, or a"
            echo "   ruleset with a non-empty bypass list — so an admin merges past a check that"
            echo "   IS required. The audit prints \`FAIL: every protection source that requires"
            echo "   the following canonical check(s) … also allows a bypass\` and names the"
            echo "   bypass entries. This is audited on the HUB only (ADR 0002); the two escapes"
            echo "   that motivated the merge-clearance gate, #427 and #428, were both admin"
            echo "   merges. Adding checks does NOT clear it, so a repo reported this way stays"
            echo "   red until the bypass is removed."
            echo
            echo "- **Last audit:** ${today} (UTC)"
            echo "- **Run:** ${RUN_URL}"
            echo
            echo "### Per-repo verdicts"
            echo
            echo '```'
            cat fleet-summary.txt
            echo '```'
            echo
            echo "### Audit output"
            echo
            echo '```'
            head -c "$OUTPUT_BUDGET" audit-output.txt
            if [ "$truncated" -eq 1 ]; then
              echo
              echo "[... truncated at ${OUTPUT_BUDGET} characters to stay under GitHub's issue-body limit."
              echo " The per-repo verdict table above is complete; the full output is in the run log: ${RUN_URL} ...]"
            fi
            echo '```'
            echo
            echo "---"
            echo
            echo "### Fixing a repo"
            echo
            echo "**A missing required check** (finding 1 above): Settings → Branches → branch"
            echo "protection rule for the default branch → Require status checks to pass before"
            echo "merging → add the missing checks. **Ordering trap:** GitHub only offers a check"
            echo "name in that dropdown once the workflow has run at least once on the repo, so a"
            echo "repo with no protection at all needs a PR through first before its checks can be"
            echo "required."
            echo
            echo "**A skippable required check** (finding 2 above): adding checks changes nothing"
            echo "here — remove the bypass instead."
            echo
            echo "- Classic protection: Settings → Branches → branch protection rule for the"
            echo "  default branch → tick **Do not allow bypassing the above settings**"
            echo "  (\`enforce_admins\`)."
            echo "- Rulesets: Settings → Rules → the ruleset named in the audit output → **Bypass"
            echo "  list** → remove every actor. A bypass entry is the ruleset-world equivalent of"
            echo "  \`enforce_admins: false\`."
            echo
            echo "The intended posture per repo class is recorded in"
            echo "[\`docs/architecture/0002-branch-protection-enforcement-posture.md\`](docs/architecture/0002-branch-protection-enforcement-posture.md)."
            echo
            echo "This issue is **maintained in place** by"
            echo "[\`.github/workflows/branch-protection-audit.yml\`](.github/workflows/branch-protection-audit.yml):"
            echo "each weekly run updates this body rather than opening a new issue, and a clean"
            echo "audit closes it automatically. The cron is read-only and never changes protection"
            echo "settings itself."
            echo
            echo "cc @nathanjohnpayne"
          } > issue-body.txt

          # Find an existing OPEN rollup issue. Single source of truth: the
          # `branch-protection-drift` LABEL. Deliberately not a body-content
          # match — the body is truncated under a size budget above, so a
          # dedupe key read out of the body would stop matching exactly when
          # the fleet is at its most broken. Take the lowest-numbered match
          # if (unexpectedly) more than one exists. `--limit 500` overrides
          # gh's default 30-item cap so the lookup can't miss the rollup
          # issue behind a backlog of >30 open issues.
          #
          # Plain command substitution on purpose: a failing `gh issue
          # list` makes this assignment fail, which `set -e` turns into a
          # failed step. Do not rewrite it as `mapfile < <(gh ...)` — a
          # process substitution's failure is invisible to mapfile, and a
          # lookup error would then read as "no rollup issue exists" and
          # open a duplicate.
          existing="$(gh issue list --repo "$REPO" --state open --limit 500 \
            --label "$TRACKING_LABEL" --json number --jq 'sort_by(.number) | .[0].number // ""')"

          # An existing match was found BY LABEL, so on that path the label
          # provably exists and LABEL_READY is not consulted.
          label_degraded=0
          if [ -n "$existing" ]; then
            echo "Updating existing rollup issue #${existing}."
            gh issue edit "$existing" --repo "$REPO" \
              --title "${ISSUE_TITLE}" \
              --body-file issue-body.txt
            gh issue comment "$existing" --repo "$REPO" \
              --body ":warning: Protection drift still present as of ${today} (UTC). Issue body refreshed — see [latest run](${RUN_URL})."
            echo "issue=${existing}" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${LABEL_READY:-false}" = "true" ]; then
            echo "No open rollup issue — opening one."
            gh issue create --repo "$REPO" \
              --title "${ISSUE_TITLE}" \
              --label "$TRACKING_LABEL" \
              --body-file issue-body.txt
          else
            # The label could not be ensured, so `gh issue create --label`
            # would be rejected and take the entire report down with it.
            # Report FIRST — unlabelled — then fail the job below. An
            # unlabelled rollup is degraded (next week's lookup is by
            # label, so it will not find this issue and will open a second
            # one), but a drift run that reports NOTHING is strictly worse
            # and is the exact failure mode this workflow exists to
            # prevent.
            echo "::error::Tracking label '${TRACKING_LABEL}' could not be ensured — opening the rollup issue WITHOUT it. Dedupe is degraded until the label exists: later runs will not find this issue and will open duplicates. Create the label by hand (Issues -> Labels) or fix the failure logged by the 'Ensure tracking label exists' step."
            gh issue create --repo "$REPO" \
              --title "${ISSUE_TITLE}" \
              --body-file issue-body.txt
            label_degraded=1
          fi

          if [ "$label_degraded" -eq 1 ]; then
            echo "Fleet protection drift WAS reported, but the rollup issue is unlabelled." >&2
            echo "Failing the job so a missing '${TRACKING_LABEL}' label is not silently tolerated." >&2
            exit 1
          fi

      - name: Close stale rollup issue on a clean audit
        if: steps.audit.outputs.result == 'clean'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          today="$(date -u '+%Y-%m-%d')"

          # Close every open rollup issue (normally zero or one). No-op when
          # none exist — the intended steady state. Reached ONLY on result
          # == clean, which the exit-1/2 guards above make unreachable under
          # an auth failure, so a token that lost its scope cannot close a
          # genuine drift issue.
          #
          # The lookup is a plain command substitution, deliberately NOT
          # `mapfile -t arr < <(gh ...)`: a process substitution's exit
          # status is not the exit status of `mapfile`, so under
          # `set -euo pipefail` a failing `gh issue list` still leaves
          # mapfile succeeding with an empty array. "GitHub was
          # unreachable" would then be indistinguishable from "no rollup
          # issue is open", and the step would report the stale drift
          # issue as already closed while leaving it open. Fail the job
          # instead — the next weekly run (or a manual dispatch) closes it.
          if ! open_issue_numbers="$(gh issue list --repo "$REPO" --state open --limit 500 \
              --label "$TRACKING_LABEL" --json number --jq '.[].number')"; then
            echo "::error::Could not list open '${TRACKING_LABEL}' issues — gh issue list failed. Failing the job rather than treating an unreadable list as an empty one, which would silently leave a stale drift issue open behind a clean audit."
            exit 1
          fi

          open_count=0
          open_issues=()
          while IFS= read -r n; do
            [ -z "$n" ] && continue
            open_issues[open_count]="$n"
            open_count=$((open_count + 1))
          done <<<"$open_issue_numbers"

          if [ "$open_count" -eq 0 ]; then
            echo "Audit clean and no open rollup issue — nothing to do."
            exit 0
          fi

          for n in "${open_issues[@]}"; do
            echo "Audit clean — closing rollup issue #${n}."
            gh issue close "$n" --repo "$REPO" \
              --comment ":white_check_mark: Audit clean as of ${today} (UTC) — every repo in the fleet requires the canonical mergepath checks. Closing automatically. See [run](${RUN_URL})."
          done
