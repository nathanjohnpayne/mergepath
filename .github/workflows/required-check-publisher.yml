name: Required Check Publisher

# Single writer of the Checks-API slot for the three script-backed required
# contexts (#845, Stage B). This file always executes from the DEFAULT
# branch — workflow_run, schedule, and repository_dispatch all read the
# default-branch definition — so a PR cannot edit the publisher that
# evaluates it (the P1a closure). The natively-named gate jobs in the three
# gate workflows are untouched and keep producing the truth on their own
# lineage; this workflow writes only the synthetic (Checks-API) slot.
#
# LIVE STAGE: Stage A rehearsed this trigger shape, head binding, PR
# resolution and rc mapping under shadow names. These names now match the
# required contexts; the native producers remain as independent fallbacks
# through the post-live observation window and the later removal stage.
#
# NO RUNNER-HELD WAITING (#2167). Every job here evaluates once and exits;
# the only loops in this file are `read` loops over enumerated PRs and
# bounded three-attempt API retries. CI completion reaches this workflow as
# an EVENT (the repo-lint parent below), never as a sleep-poll on a runner.
# scripts/ci/check_required_check_publisher fences that shape.

on:
  workflow_run:
    # TWO parents, by role (cross-agent round 2 on #867; #2167):
    #
    #   "Merge Clearance Gate" carries every REVIEW-side refresh signal. Its
    #   trigger set is a measured strict superset of both sibling gates' (it
    #   adds labeled/unlabeled and repository_dispatch), so one delivery per
    #   PR event covers all three contexts and the per-event fan-in stays at
    #   one pass instead of three.
    #
    #   "repo-lint" is the CI-side fan-in (#2167). None of the three contexts
    #   reads `lint` — scripts/merge-clearance-gate.sh deliberately skips
    #   codex-review-check.sh's CI gate (a), because a required check that
    #   waited on the required-check rollup would deadlock on itself — so a
    #   `lint` completion changes no verdict. What it changes is the MERGE
    #   decision: `lint` is normally the last required context to land, and
    #   before #2167 nothing re-published the three Checks-API slots for that
    #   head once it did; a verdict published at push time stayed the newest
    #   entry, and a gate run queued behind a late approval could sit behind
    #   30-minute lint jobs (on #2112 the approval-fired gate run queued for
    #   38 min and then ran for 12 s). Listening to repo-lint completion
    #   re-publishes a fresh, head-pinned verdict within one publisher pass of
    #   `lint` landing — for EVERY open PR head, under-threshold or not — and
    #   no job anywhere reserves a runner while CI executes. The parent's
    #   `requested` / `in_progress` deliveries open no hold (see the open job):
    #   a hold spanning the whole lint run would pend three contexts that do
    #   not depend on it, and the completed pass claims its own head first.
    #
    #   The main-SHA confounder: repo-lint also runs on `push` to main, and a
    #   merge therefore floods completions whose head_sha is main's tip. Those
    #   match no open PR, so a pass on them is a wasted full sweep (or, worse,
    #   a cancelled queued member — the rcp-publish queue cancels the PENDING
    #   member when a third arrives). The publish job's `if:` admits a
    #   repo-lint parent only when its own event was `pull_request`, so push,
    #   schedule and dispatch lint runs never enter the queue. A PR-head lint
    #   run whose head moved on before the pass is the existing
    #   "superseded head" path below: pendings on it close red, the pass still
    #   covers every open PR.
    #
    # Both entries must match the parent's top-level `name:` exactly; a rename
    # on either side silently orphans that trigger (fence assertion A6 reads
    # each name out of its parent file).
    workflows: ["Merge Clearance Gate", "repo-lint"]
    # in_progress is the rerun cue: a rerun re-uses the run, so `requested`
    # never re-fires, and without it no pending entry would cover the
    # re-evaluation window (cross-agent P1 on #867). Ordinary runs emit
    # both; the open job uses exact pending evidence to avoid the duplicate
    # first-attempt writes while retaining in_progress as fail-closed backup.
    types: [requested, in_progress, completed]
  repository_dispatch:
    # merge-clearance-recheck kept verbatim (#658 lane reaches this file
    # unchanged); required-check-republish covers all three on a named PR.
    types: [merge-clearance-recheck, required-check-republish]
  # NO schedule of its own until PR 4 (cross-agent round 11): the Merge
  # Clearance Gate's */30 cron already reaches this file through the
  # workflow_run chain — a schedule-parent delivery whose head matches no
  # open PR degrades to a full-coverage pass below — so an own cron would
  # run a SECOND full pass every interval. PR 4 re-adds it in the same
  # diff that deletes the gate workflows' schedules.
  # NO workflow_dispatch: a manual dispatch executes the SELECTED ref's copy
  # of this file, so a PR branch could be run with checks: write — the P1a
  # hole this file exists to close (cross-agent P1 on #867). The operator
  # break-glass is repository_dispatch required-check-republish, which is
  # PAT-gated and always runs the default-branch definition.

permissions:
  contents: read

env:
  # Stage B's single behavior change: these three values now name the live
  # required contexts. The publisher shape remains unchanged.
  MCG_CONTEXT: "Merge clearance gate"
  CODEX_P1_CONTEXT: "Codex P1 unresolved threads"
  CODERABBIT_CONTEXT: "CodeRabbit unresolved blocking findings"

jobs:
  # Phase 1. NOT named for any required context, and OUTSIDE the publish
  # job's concurrency group: a queued third event cancels a group's pending
  # member and materialises that run's native check (#843, measured), so
  # keeping this job groupless means a phase-1 retirement is never the
  # member that gets cancelled — and its native check is named `open`,
  # which nothing requires.
  open:
    name: open
    # `requested` fires at parent-run creation, before its jobs execute, so
    # pending entries land within seconds of the PR event; `in_progress`
    # covers reruns. Holds open ONLY for the gate parent (#2167): a repo-lint
    # `requested` arrives at push time alongside the gate's own (duplicate),
    # and on a lint rerun it would pend three lint-independent contexts for
    # the whole lint run. The completed pass claims its head itself.
    #
    # #2881: an issue_comment-originated gate run is excluded here and in the
    # publish job. Such a run carries the default branch's head_sha and
    # matches no PR; its dispatch-recheck job (or its skipped jobs, when the
    # comment is not a Codex request or answer) already publishes the one
    # context the comment can move, through the Checks API on the PR head.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'Merge Clearance Gate' &&
      github.event.workflow_run.event != 'issue_comment' &&
      (github.event.action == 'requested' || github.event.action == 'in_progress')
    runs-on: ubuntu-latest
    # GROUPLESS, on purpose (cross-agent round 3 on #867, superseding the
    # round-2 queue-join): the pending must become visible BEFORE a
    # mid-flight stale pass can finish, so it cannot wait behind that pass.
    # Owned-ID completion and the paired opening-order reader keep a later
    # pending generation authoritative when an older evaluation finishes.
    permissions:
      contents: read
      pull-requests: read
      # actions: read for the parent-status lookup below — without it the
      # guard 403s into its fail-open branch on restricted-default repos
      # (cross-agent round 2; same requirement documented in
      # auto-clear-blocking-labels.yml).
      actions: read
      checks: write
    steps:
      - name: Open pending entries on the event head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # NEVER github.sha: on a workflow_run run it is the DEFAULT
          # branch's last commit, and binding to it would put every context
          # on a commit branch protection never consults (#845 risks).
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_ACTION: ${{ github.event.action }}
          PARENT_RUN_ID: ${{ github.event.workflow_run.id }}
          PARENT_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          if [ -z "$HEAD_SHA" ]; then
            echo "::error::workflow_run.head_sha is empty; cannot open pending entries."
            exit 1
          fi
          # If the parent has ALREADY completed, its completed delivery owns
          # the slot and a fresh pending here would have no future event to
          # retire it — stuck until the sweep (cross-agent P1 on #867). On a
          # failed read, open anyway: pending is the fail-closed direction.
          if parent_status=$(gh api "repos/$REPO/actions/runs/$PARENT_RUN_ID" --jq .status); then
            if [ "$parent_status" = "completed" ]; then
              echo "Parent run $PARENT_RUN_ID already completed; the completed pass owns this head. Not opening."
              exit 0
            fi
          else
            echo "::warning::could not read parent run status; opening anyway (fail closed)."
          fi
          # Ordinary first attempts emit both `requested` and `in_progress`.
          # The latter may skip only when the former has ALREADY published
          # all three holds for this exact parent attempt. The Checks API is
          # the coordination record: a delayed, failed, partial or racing
          # requested job leaves incomplete evidence and falls through to
          # the full open path. Reruns bypass this probe because GitHub does
          # not emit `requested` for a new attempt (#1130).
          # Keep the proof marker in output metadata. The lineage
          # discriminator for these required contexts must remain unset on
          # Checks-API runs, or the native and synthetic lineages collapse.
          pending_summary="Publisher phase 1: evaluation queued for $HEAD_SHA. <!-- required-check-publisher:pending:${PARENT_RUN_ID}:${PARENT_RUN_ATTEMPT} -->"
          if [ "$EVENT_ACTION" = "in_progress" ] && [ "$PARENT_RUN_ATTEMPT" = "1" ]; then
            if pending_runs=$(gh api --paginate -X GET \
                "repos/$REPO/commits/$HEAD_SHA/check-runs" -f per_page=100 -f filter=all \
                --jq '.check_runs[] | [.name, .status, (.output.summary // ""), (.app.slug // ""), (.started_at // ""), .id] | @tsv'); then
              all_pending=1
              for name in "$MCG_CONTEXT" "$CODEX_P1_CONTEXT" "$CODERABBIT_CONTEXT"; do
                if ! awk -F '\t' -v name="$name" -v summary="$pending_summary" \
                    '$1 == name {
                       row_exact = $2 == "in_progress" && $3 == summary && $4 == "github-actions"
                       if (!found || $5 > started) {
                         found=1; started=$5; exact=row_exact; conflict=!row_exact
                       } else if ($5 == started) {
                         if (row_exact) exact=1; else conflict=1
                       }
                     }
                     END {
                       exit(found && exact && !conflict ? 0 : 1)
                     }' <<<"$pending_runs"; then
                  all_pending=0
                fi
              done
              if [ "$all_pending" -eq 1 ]; then
                echo "Requested delivery already opened all three pending entries for parent $PARENT_RUN_ID attempt $PARENT_RUN_ATTEMPT."
                exit 0
              fi
            else
              echo "::warning::could not read pending check runs; opening anyway (fail closed)."
            fi
          fi
          # Open only on open-PR heads: the parent also fires on schedule,
          # where head_sha is main's tip. Resolution comes from the open-PR
          # list — never workflow_run.pull_requests, empty for fork PRs. If
          # the list READ fails, open anyway: pending is the fail-closed
          # direction, and a spurious pending on a non-PR head is invisible
          # to branch protection and retired by the next publish pass.
          if heads=$(gh api --paginate -X GET "repos/$REPO/pulls" -f state=open \
              -f per_page=100 --jq '.[].head.sha'); then
            if ! grep -qxF "$HEAD_SHA" <<<"$heads"; then
              echo "Head $HEAD_SHA is not an open PR head; nothing to open."
              exit 0
            fi
          else
            echo "::warning::open-PR list read failed; opening pending entries anyway (fail closed)."
          fi
          # NO delayed-open fence here, on purpose (#2171, removed in Codex
          # round 5). A fence that skips these holds because a "newer" publisher
          # verdict exists cannot be made sound from check-run data: a verdict's
          # started_at is its POST time, not when its gate script read PR state,
          # so a pass that read state before this parent's event and posted after
          # it passes any timestamp test and leaves a stale green authoritative.
          # Three review rounds found a fail-closed defect in each version. The
          # accepted residual: under runner contention a delayed hold here re-pends
          # the three contexts until this parent's own completed pass re-publishes
          # (specs/required_check_publisher.md § Phase ordering). Pending is the
          # fail-closed direction; tests/test_required_check_publisher_dedup.sh
          # fails if a timestamp fence that suppresses the hold returns.
          # Second status check IMMEDIATELY before the burst (round 7):
          # the enumeration above took seconds, and a parent that completed
          # during them means the completed pass owns this head — opening
          # after that point is the strand-maker. Residual: a completion
          # inside the sub-second burst itself, sweep-bounded below.
          if parent_status=$(gh api "repos/$REPO/actions/runs/$PARENT_RUN_ID" --jq .status) \
              && [ "$parent_status" = "completed" ]; then
            echo "Parent run completed during enumeration; the completed pass owns this head. Not opening."
            exit 0
          fi
          # Retried per context, loop continues past a failure so later
          # contexts still open, red exit after (cross-agent round 7): a
          # transiently failed pending write must not silently leave the
          # previous green usable AND must not block the sibling contexts.
          # No fail-closed write exists through a failing write path — the
          # completed pass and the sweep recover; the red run is the alarm.
          post_pending() {
            local name="$1" attempt
            for attempt in 1 2 3; do
              if gh api -X POST "repos/$REPO/check-runs" \
                -f name="$name" \
                -f head_sha="$HEAD_SHA" \
                -f status="in_progress" \
                -f "output[title]=$name (re-evaluation in progress)" \
                -f "output[summary]=$pending_summary" \
                >/dev/null; then
                return 0
              fi
              sleep "$attempt"
            done
            return 1
          }
          open_failed=0
          for name in "$MCG_CONTEXT" "$CODEX_P1_CONTEXT" "$CODERABBIT_CONTEXT"; do
            if ! post_pending "$name"; then
              echo "::error::Failed to open pending $name on $HEAD_SHA after 3 attempts."
              open_failed=1
            fi
          done
          echo "Opened pending entries for all three contexts on $HEAD_SHA."
          # A completion during this burst is handled by the completed
          # delivery and its freshness guard, or the next sweep. Reading the
          # parent again here cannot retract or repair these writes; it only
          # emitted a warning and consumed another installation-budget GET.
          # Keep the two pre-write status fences; omit that diagnostic read.
          [ "$open_failed" -eq 0 ] || exit 1

  # Phase 2 opens its own generations before evaluation and PATCHes only
  # those ids. Phase-1 holds stay independent; opening order decides currency.
  publish:
    name: publish
    # Everything except workflow_run `requested`, which is phase 1's cue.
    # Re-evaluates from scratch on every path; never reads
    # workflow_run.conclusion (deliveries drop and conclusion can be null
    # upstream — the verdict must not depend on how the parent finished).
    # A repo-lint parent is admitted only for a `pull_request` lint run
    # (#2167): push-to-main, schedule and dispatch lint runs carry main's tip
    # as head_sha, match no open PR, and must not enter the rcp-publish queue
    # at all — a member that enters must run the full pass (coalescing), so
    # the filter has to live here, at the expression level.
    #
    # #2881 (direct Phase 4b on #2886): a Merge Clearance Gate run whose own
    # event was issue_comment is excluded the same way. GitHub completes that
    # run even when every job is skipped (an ordinary or CodeRabbit comment),
    # and its head_sha is the default branch's tip, so admitting it would
    # leave due_only=0 and sweep every open PR on ordinary review traffic. A
    # job-level `if:` in the gate workflow cannot prevent the completion, and
    # issue_comment has no activity filter narrower than its types, so the
    # filter lives here. The comment path's own dispatch-recheck job
    # publishes the merge-clearance context on the PR head; the other two
    # contexts do not read comments that could change on that path.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.action == 'completed' &&
       (github.event.workflow_run.name != 'repo-lint' ||
        github.event.workflow_run.event == 'pull_request') &&
       (github.event.workflow_run.name != 'Merge Clearance Gate' ||
        github.event.workflow_run.event != 'issue_comment'))
    runs-on: ubuntu-latest
    # ONE global queue for every publish pass, not a per-head group
    # (cross-agent P1 on #867): a sweep or dispatch run outside the head's
    # group could read state before a transition and POST after a newer
    # evaluation, restoring a stale verdict. A single fixed group makes
    # writes land in arrival order across event, sweep and dispatch paths.
    # Safe on THIS file and not on the gate workflows — the measured
    # difference (#843): when a third member queues, the cancelled PENDING
    # member materialises a native check named `publish`, which nothing
    # requires. Cancellation is COALESCING here, not loss: every pass
    # evaluates every open PR, so whichever member survives subsumes the
    # work of each cancelled one (cross-agent round 2).
    concurrency:
      group: rcp-publish
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      issues: read
      # actions: read for the server-issued pass-start stamp (round 6).
      actions: read
      checks: write
      # Required for scripts/codex-p1-gate.sh's scripts/review-feedback-
      # accounting.sh call, which reads code-scanning/alerts to grade a
      # github-advanced-security[bot] finding's severity (#1101). Without
      # it, this job's GITHUB_TOKEN 403s on that read once a PR carries a
      # real CodeQL comment.
      security-events: read
    # #2239/#2205: PRs the pass nominated to auto-clear, space-separated, for
    # the nominate-auto-clear job below. Written before the step's final
    # exit, so another PR's infra error does not drop a nomination.
    outputs:
      autoclear_prs: ${{ steps.publish.outputs.autoclear_prs }}
      evidence_escalations: ${{ steps.publish.outputs.evidence_escalations }}
    steps:
      - name: Checkout repo (default branch — trusted scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve targets, evaluate gates, publish
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_HEAD: ${{ github.event.workflow_run.head_sha }}
          # The parent run's own trigger: `schedule` marks the sweep pass,
          # which keeps full coverage (#1130 due-only targeting below).
          PARENT_EVENT: ${{ github.event.workflow_run.event }}
          # Which parent delivered this pass (#2220, Codex P1 on #2225): a
          # repo-lint parent opened no holds (the open job admits only the
          # gate parent), so a lint-only refresh must never close the head
          # with a budget red.
          PARENT_NAME: ${{ github.event.workflow_run.name }}
          # An event pass skips an open PR only while its published verdicts
          # are younger than this — the parent sweep's own cadence, so no
          # verdict outlives what a quiet period already allowed. EQUAL to
          # the gate parent's */30 sweep interval in seconds (#2220: it was
          # left at 900 when #2167 moved the sweep from */15, so every green
          # PR fell due again after 15 minutes and event passes re-evaluated
          # it twice as often as designed). check_required_check_publisher
          # A16 fails when the two differ, so they cannot drift again.
          DUE_MAX_AGE_SECONDS: "1800"
          # Budget guard (#2220). A pass whose PRs-to-evaluate cannot be
          # covered by the installation budget GET /rate_limit reports
          # (BUDGET_PER_PR_REQUESTS each, plus BUDGET_RESERVE_REQUESTS kept
          # back for the event paths and hold writes) evaluates only the
          # heads it claimed with holds. 60 covers the measured per-PR cost of
          # the three gate scripts (REVIEW_POLICY.md "What a sweep costs":
          # about 30 gh invocations, many paginated) plus this pass's own
          # owned-generation openings and binding/revalidation reads.
          BUDGET_PER_PR_REQUESTS: "60"
          BUDGET_RESERVE_REQUESTS: "100"
          # The same token has a SEPARATE GraphQL bucket, which the Codex P1
          # and CodeRabbit gates spend on paginated review-thread queries
          # (about 10 points per PR across the three scripts' query sites).
          # A healthy REST core with an empty GraphQL bucket fails a pass
          # just the same, so both are budgeted (Codex P1 on #2225).
          BUDGET_PER_PR_GRAPHQL_POINTS: "10"
          BUDGET_GRAPHQL_RESERVE_POINTS: "50"
          # Validated as a positive integer below, so an arbitrary
          # client_payload cannot inject shell (same posture as
          # merge-clearance-gate.yml's dispatch-recheck job).
          DISPATCH_PR: ${{ github.event.client_payload.pr }}
        run: |
          set -euo pipefail
          . scripts/workflow/required-check-generation.sh
          OWN_GENERATIONS=""
          EVIDENCE_ESCALATIONS=""
          # Server-issued start time anchors due-proof age, installation
          # back-off and rotating budget selection to the same clock.
          # Generation ordering itself uses immutable server opening IDs.
          if ! PASS_START=$(gh api "repos/$REPO/actions/runs/$GITHUB_RUN_ID" \
              --jq .run_started_at) || [ -z "$PASS_START" ]; then
            echo "::error::Could not read this run's server-issued start time; aborting the pass (fail closed)."
            exit 1
          fi
          # Head-to-PR mapping from the open-PR list ONLY — never
          # workflow_run.pull_requests, empty for fork PRs (#845 risks).
          # Exhaustive pagination, not a fixed cap: a capped list silently
          # exempts every head beyond it from both phases (cross-agent
          # round 3). One query carries number AND head so no per-PR
          # resolve call can fail independently (#465). The fourth column is
          # whether the PR carries needs-external-review (#2239), read from
          # the same response, so nominating a labeled PR to auto-clear below
          # costs no request.
          if ! prs_raw=$(gh api --paginate -X GET "repos/$REPO/pulls" -f state=open \
              -f per_page=100 \
              --jq '.[] | "\(.number)\t\(.head.sha)\t\(.updated_at)\t\(any(.labels[]?; .name == "needs-external-review"))"'); then
            echo "::error::Failed to list open PRs on $REPO; leaving any pending entries standing (fail closed)."
            exit 1
          fi

          requested_pr=""
          if [ -n "$DISPATCH_PR" ]; then
            requested_pr="$DISPATCH_PR"
            case "$requested_pr" in
              ''|*[!0-9]*|0*)
                echo "::error::PR selector is not a positive integer: '$requested_pr'"
                exit 1
                ;;
            esac
          fi

          # Every pass evaluates EVERY open PR (cross-agent round 2 on
          # #867): the queue holds at most one pending member and cancels
          # the rest, so a pass that covered only its own head would turn
          # each cancellation into a lost re-evaluation — under sustained
          # traffic a displaced head (or the displaced sweep) could stay
          # pending indefinitely. With full coverage, whichever member
          # survives subsumes the work of every cancelled one. The event
          # head goes first so its verdict lands inside the latency budget;
          # a dispatch narrows to its named PR (the fast manual remedy).
          targets=""
          dispatch_matched=""
          if [ -n "$requested_pr" ]; then
            # Full coverage here too (cross-agent round 3): a dispatch that
            # evaluated only its named PR could cancel a queued full pass
            # and strand the displaced head's pendings, contradicting the
            # subsume-all property. Named PR first keeps the remedy fast.
            # The selector must MATCH a row (round 9): a named PR that
            # closed before enumeration must not fall through to an
            # unrelated first row — degrade to a plain full pass instead.
            dispatch_matched=$(awk -F'\t' -v n="$requested_pr" '$1 == n' <<<"$prs_raw" || true)
            if [ -n "$dispatch_matched" ]; then
              targets=$({ printf '%s\n' "$dispatch_matched"; \
                          awk -F'\t' -v n="$requested_pr" '$1 != n' <<<"$prs_raw"; } || true)
            else
              echo "::warning::Dispatch named PR #$requested_pr, which is not an open PR; running a plain full pass."
              targets="$prs_raw"
            fi
          elif [ -n "$RUN_HEAD" ]; then
            targets=$({ awk -F'\t' -v h="$RUN_HEAD" '$2 == h' <<<"$prs_raw"; \
                        awk -F'\t' -v h="$RUN_HEAD" '$2 != h' <<<"$prs_raw"; } || true)
          else
            targets="$prs_raw"
          fi

          if [ -n "$RUN_HEAD" ] && \
              ! grep -qF "$RUN_HEAD" <<<"$prs_raw"; then
              # The event head matches no open PR: the parent ran on main's
              # tip (schedule, phase 1 opened nothing) or the PR's head
              # moved on. Close — never abandon — anything phase 1 DID open
              # on that head: a red pinned to a superseded head is invisible
              # to branch protection; an abandoned in_progress reads as a
              # hang. The pass still evaluates every open PR below.
              for name in "$MCG_CONTEXT" "$CODEX_P1_CONTEXT" "$CODERABBIT_CONTEXT"; do
                # --paginate: page 1 alone can miss a pending run on a head
                # with many same-name suites, and a truncated read here is a
                # false all-clear (cross-agent P1 on #867). IDs land in a
                # variable — no early-close pipe under pipefail.
                pending_ids=$(gh api --paginate -X GET "repos/$REPO/commits/$RUN_HEAD/check-runs" \
                  -f check_name="$name" -f filter=latest -f per_page=100 \
                  --jq '.check_runs[] | select(.status != "completed") | .id')
                if [ -n "$pending_ids" ]; then
                  echo "::notice::Superseded head $RUN_HEAD retains its incomplete phase-1 generation(s): $pending_ids. No new completed generation is minted."
                fi
              done
              echo "Head $RUN_HEAD matches no open PR; closed any pending entries on it."
          fi

          if [ -z "$targets" ]; then
            echo "No matching open PRs; nothing to publish."
            exit 0
          fi

          had_infra_error=0
          # Budget guard (#2220). The gate scripts spend the repository's
          # Actions installation budget (secrets.GITHUB_TOKEN, 1,000 REST
          # requests per hour), and a pass that starts while it is short
          # turns every PR it reaches into an infra red the next pass
          # re-evaluates: the outage feeds itself (nine exhaustions between
          # 2026-10-13 19:36Z and 2026-10-14 05:06Z). GET /rate_limit does
          # not count against the limit, so the pass reads it once, here,
          # with the job token. A pass the remaining budget cannot cover
          # evaluates only the heads it claimed with holds (the event head,
          # or the dispatch head when the budget allowed opening them);
          # every other PR is skipped WITHOUT a write, so it keeps its
          # previous verdict on its own head and is never given a new green.
          # An unreadable /rate_limit, or a malformed knob, proceeds exactly
          # as before: fail toward evaluating, with a warning.
          # The reader and the affordability arithmetic live in
          # scripts/workflow/installation-budget.sh (#2286), shared with the
          # event-driven gate workflows so every budget decision reads
          # /rate_limit the same way. It sets per_pr, reserve, gql_per_pr,
          # gql_reserve, budget_known, gql_known, rl_remaining, rl_reset,
          # gql_remaining, gql_reset and RATE_LIMIT_RESET_ISO.
          . scripts/workflow/installation-budget.sh
          # Requests this pass has already spent on its own selection reads
          # (one per due() proof read), charged against the snapshot below
          # so the proof reads cannot eat the reserve unseen (Codex P2 on
          # #2225).
          spent=0
          ib_read "${BUDGET_PER_PR_REQUESTS:-60}" "${BUDGET_RESERVE_REQUESTS:-100}" \
            "${BUDGET_PER_PR_GRAPHQL_POINTS:-10}" "${BUDGET_GRAPHQL_RESERVE_POINTS:-50}"
          # ib_affordable <count>: exit 0 when BOTH buckets cover <count> PR
          # evaluations plus their reserves (net of this pass's own
          # selection reads), or when the budget is unknown. ib_capacity:
          # how many PR evaluations the budget covers beyond the reserves (a
          # large number when the budget is unknown). ib_short_bucket_reset:
          # the reset to stamp on a budget red, the later reset of the
          # bucket(s) that cannot cover one evaluation, so the back-off ends
          # when the bucket that actually ran out refills (Codex P1 on
          # #2225).
          n_targets=$(awk 'NF { n++ } END { print n + 0 }' <<<"$targets")
          # Heads this pass claimed with holds. Under a short budget they are
          # the only heads evaluated, and after a rate-limit stop their
          # remaining contexts are still closed (never orphaned) — holds
          # opened by the `open` job on the event head are claimed through
          # the event-head re-claim below.
          CLAIMED_HEADS=""
          # Set by gate() on the first installation rate-limit failure.
          RATE_LIMITED=0
          RATE_LIMIT_MARK="$IB_RATE_LIMIT_MARK"
          # A dispatch-narrowed pass opens pendings on the named head FIRST
          # (cross-agent round 8): without them the previous green stays
          # usable for the whole re-evaluation it was asked to refresh.
          # Capture each owned ID before evaluation. Selected sweep heads
          # open their own generations inside gate(); skipped heads receive
          # no new hold. An opening whose response is lost stays non-green,
          # and a later opening can retire it without patching an unowned ID.
          # Exhausted opening retries make the pass an infrastructure failure.
          OWN_PENDING_IDS=""
          open_holds() {
            local hd="$1" claim_pr="$2" name attempt oid ok
            CLAIMED_HEADS="$CLAIMED_HEADS $hd"
            for name in "$MCG_CONTEXT" "$CODEX_P1_CONTEXT" "$CODERABBIT_CONTEXT"; do
              ok=0
              for attempt in 1 2 3; do
                if oid=$(rcg_open "$REPO" "$claim_pr" "$hd" "$name"); then
                  OWN_PENDING_IDS="$OWN_PENDING_IDS $oid"
                  OWN_GENERATIONS="$OWN_GENERATIONS
          $hd|$name|$oid"
                  ok=1
                  break
                fi
                sleep "$attempt"
              done
              if [ "$ok" -eq 0 ]; then
                echo "::error::Failed to open hold $name on $hd after 3 attempts."
                had_infra_error=1
              fi
            done
          }
          # A dispatch decides here, BEFORE it claims the named head (#2220):
          # one that cannot afford even the named PR evaluates nothing new,
          # because holds it opened anyway would have no verdict to close
          # them. One that can claims it, and the batch below fills the rest.
          budget_low=0
          if [ -n "$dispatch_matched" ]; then
            dispatch_head=$(awk -F'\t' 'NR==1{print $2}' <<<"$dispatch_matched")
            if ! ib_affordable 1; then
              budget_low=1
            elif [ -n "$dispatch_head" ]; then
              open_holds "$dispatch_head" "$(awk -F'\t' 'NR==1{print $1}' <<<"$dispatch_matched")"
            fi
          fi
          # The completed event path claims ITS head too (round 10): when
          # the open job was delayed past parent completion, its guard
          # skips without a replacement, and old greens would stay usable
          # for the whole evaluation. A brief double-hold in the common
          # case is harmless — the newest run counts, and this pass's
          # completed verdicts supersede both.
          #
          # Unless the budget cannot cover even this one evaluation (#2220,
          # Codex P1 on #2225): then the gate scripts would fail partway on
          # the exhausted bucket and every write after that fails too, so
          # the pass does not evaluate the head at all. It claims the head
          # WITHOUT new holds and gate() closes each context with the budget
          # red straight away — a few requests out of the reserve instead
          # of a full evaluation that cannot finish. If even those writes
          # fail, the holds stay pending: fail closed, never a green.
          if [ -n "$RUN_HEAD" ] && [ -n "$targets" ] \
              && [ "$(awk -F'\t' 'NR==1{print $2}' <<<"$targets")" = "$RUN_HEAD" ]; then
            if ib_affordable 1; then
              open_holds "$RUN_HEAD" "$(awk -F'\t' -v h="$RUN_HEAD" '$2==h{print $1; exit}' <<<"$targets")"
            elif [ "${PARENT_NAME:-}" = "repo-lint" ]; then
              # A lint-parent pass opened no holds and the gates do not
              # read `lint`, so there is nothing to close and nothing new to
              # learn: leave the head's verdicts exactly as they are (Codex
              # P1 on #2225). The batch below then evaluates nothing.
              echo "::notice::Budget guard (#2220): short of one evaluation on a repo-lint refresh; leaving $RUN_HEAD as it is."
            else
              CLAIMED_HEADS="$CLAIMED_HEADS $RUN_HEAD"
              RATE_LIMITED=1
              RATE_LIMIT_RESET_ISO=$(ib_short_bucket_reset)
              echo "::warning::Budget guard (#2220): $rl_remaining REST request(s) and ${gql_remaining} GraphQL point(s) remain, short of one evaluation plus the reserves; closing the event head's holds with the budget red instead of evaluating it (re-evaluated after ${RATE_LIMIT_RESET_ISO:-the window resets})."
            fi
          fi
          # Heads carried by MORE than one open PR fail closed (cross-agent
          # round 3): the per-commit slot holds one verdict while the
          # per-PR policy state (base, labels, reviews, threads) differs,
          # so red-until-disambiguated is the only verdict that cannot be
          # wrong for either PR. Detected once, posted once per head.
          dup_heads=$(cut -f2 <<<"$prs_raw" | sort | uniq -d)
          # Due-only coverage on PR-event passes (#1130). A full pass costs
          # every gate script on every open PR (about 40 installation-budget
          # requests per PR), and PR events arrive faster than passes finish,
          # so the queue kept full passes running back to back and exhausted
          # the 1,000/hr installation budget. An event pass now evaluates its
          # own head, and every other open PR unless there is POSITIVE proof
          # that the PR's slot is current. Proof is read from the Checks-API
          # suite the required contexts resolve against (API-posted runs:
          # publisher holds and verdicts, native gate leases; job runs carry
          # an /actions/runs/ details URL and live in their own suites). For
          # EACH of the three contexts, the newest such run (by id) must be a
          # completed SUCCESS, completed after the PR's last activity
          # (updated_at), and inside DUE_MAX_AGE_SECONDS. Anything else makes
          # the PR due:
          #   * a hold left by phase 1 or by a cancelled pass (still pending),
          #     which keeps the subsume-all property for coalesced members;
          #   * a red or infra verdict, a missing context, a missing
          #     updated_at, or a failed read (unknown is due);
          #   * activity since the verdict, or a verdict older than the
          #     sweep interval (time-based gate inputs such as reaction
          #     freshness are refreshed no less often than a quiet period).
          # ONE exception, the rate-limit back-off (#2220): a context whose
          # newest verdict is the red this pass family posts when a gate hit
          # the installation rate limit (its title carries RATE_LIMIT_MARK
          # and the window's reset time) is NOT due before that reset — at
          # most one hour after the red. Re-evaluating it earlier spends a
          # budget that is already gone and only re-posts the same red; the
          # first event pass after the reset finds it due and evaluates it,
          # so no manual rerun is needed. A PR is still due when any OTHER
          # context is due (ordinary reds, holds and missing contexts are
          # unchanged), and its own events evaluate it as the event head.
          # Schedule-parent passes and dispatches keep full coverage, so the
          # sweep and the operator remedy behave exactly as before.
          due_only=0
          if [ "$EVENT_NAME" = "workflow_run" ] && [ -n "$RUN_HEAD" ] \
              && [ "${PARENT_EVENT:-}" != "schedule" ] \
              && awk -F'\t' -v h="$RUN_HEAD" '$2 == h { found=1 } END { exit !found }' <<<"$prs_raw"; then
            due_only=1
          fi
          stale_before=""
          if [ "$due_only" -eq 1 ] && ! stale_before=$(jq -nr --arg t "$PASS_START" \
              --argjson age "${DUE_MAX_AGE_SECONDS:-1800}" \
              '($t | fromdateiso8601) - $age | todateiso8601'); then
            echo "::warning::Could not compute the due-only cutoff; running a full pass (fail closed)."
            due_only=0
          fi
          # retry_after <title> <completed_at>: the time before which a
          # rate-limit red is backed off — the reset its title records,
          # capped at one hour after the red (a rate-limit window is never
          # longer), or that cap alone when the title records none. Exit 1
          # when completed_at is unusable, which makes the context due.
          retry_after() {
            local t="$1" done_at="$2" cap retry
            cap=$(jq -nr --arg d "$done_at" '($d | fromdateiso8601) + 3600 | todateiso8601' 2>/dev/null) \
              && [ -n "$cap" ] || return 1
            retry="${t##*re-evaluated after }"
            if [ "$retry" = "$t" ] \
                || ! [[ "$retry" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] \
                || [[ "$retry" > "$cap" ]]; then
              retry="$cap"
            fi
            printf '%s\n' "$retry"
          }
          # due <head> <updated_at>: exit 0 when the PR must be evaluated.
          # On exit 1, DUE_REASON says why not: `current`, or `backoff <time>`.
          DUE_REASON=""
          due() {
            local hd="$1" updated="$2" rows ctx newest d_status d_concl d_done d_title retry backoff="" read_rc=0
            DUE_REASON=""
            DUE_PAGES=0
            case "$updated" in ''|null) return 0 ;; esac
            # --jq runs once per fetched page, so the `__page__` line it
            # emits counts the HTTP requests this read cost: a head with
            # more than 100 check runs costs one per page (Codex P2 on
            # #2225), and the caller charges every one to the budget.
            DUE_PAGES=1
            rows=$(gh api --paginate -X GET "repos/$REPO/commits/$hd/check-runs" \
                -f filter=all -f per_page=100 \
                --jq '"__page__", (.check_runs[] | select(((.details_url // "") | test("/actions/runs/")) | not) | [.name, (.id | tostring), .status, (.conclusion // "-"), (.completed_at // "-"), (.output.title // "-")] | @tsv)') \
              || read_rc=$?
            DUE_PAGES=$(grep -c '^__page__$' <<<"$rows" || true)
            if [ "$read_rc" -ne 0 ]; then
              # A read that fails partway (page 1 fetched, page 2 a 5xx or
              # a rate limit) has still spent every page it printed, plus
              # the request that failed (#2229). The PR stays due.
              DUE_PAGES=$(( ${DUE_PAGES:-0} + 1 ))
              return 0
            fi
            [ "${DUE_PAGES:-0}" -ge 1 ] || DUE_PAGES=1
            rows=$(grep -v '^__page__$' <<<"$rows" || true)
            for ctx in "$MCG_CONTEXT" "$CODEX_P1_CONTEXT" "$CODERABBIT_CONTEXT"; do
              newest=$(awk -F'\t' -v n="$ctx" '$1 == n && ($2 + 0) > max { max = $2 + 0; row = $0 } END { print row }' <<<"$rows")
              [ -n "$newest" ] || return 0
              d_status=$(cut -f3 <<<"$newest"); d_concl=$(cut -f4 <<<"$newest"); d_done=$(cut -f5 <<<"$newest")
              d_title=$(cut -f6 <<<"$newest")
              if [ "$d_status" = "completed" ] && [ "$d_concl" = "failure" ] \
                  && [[ "$d_title" == *"$RATE_LIMIT_MARK"* ]]; then
                retry=$(retry_after "$d_title" "$d_done") || return 0
                [[ "$PASS_START" < "$retry" ]] || return 0
                backoff="$retry"
                continue
              fi
              [ "$d_status" = "completed" ] && [ "$d_concl" = "success" ] || return 0
              [[ "$d_done" > "$updated" ]] || return 0
              [[ "$d_done" > "$stale_before" ]] || return 0
            done
            if [ -n "$backoff" ]; then
              DUE_REASON="backoff $backoff"
            else
              DUE_REASON="current"
            fi
            return 1
          }
          evaluated=0
          skipped=0
          handled_dups=""
          # gate <script> <context> <sentinel-or-empty> <pr> <head>
          #      [require-review-summary]: evaluate one gate for one PR and
          # PATCH its owned pre-evaluation generation. The optional flag belongs
          # only to CodeRabbit's #886/#1364 publication hold.
          gate() {
            local script="$1" context="$2" sentinel="$3" pr="$4" head="$5"
            local summary_hold="${6:-false}"
            local output rc conclusion title rate_limit_red=0
            local CR_EVIDENCE_REPORT
            CR_EVIDENCE_REPORT=$(mktemp) || { had_infra_error=1; return 0; }
            export CR_EVIDENCE_REPORT
            local generation_id
            if [ "${RATE_LIMITED:-0}" -eq 1 ]; then
              case " ${CLAIMED_HEADS:-} " in
                *" $head "*) ;;
                *) return 0 ;;
              esac
            fi
            generation_id=$(awk -F'|' -v h="$head" -v c="$context" '$1==h && $2==c {print $3; exit}' <<<"$OWN_GENERATIONS")
            if [ -z "$generation_id" ]; then
              if ! generation_id=$(rcg_open "$REPO" "$pr" "$head" "$context"); then
                echo "::error::Could not open $context on $head; no evaluation or completed POST is authorized."
                had_infra_error=1
                return 0
              fi
            fi
            if [ "${RATE_LIMITED:-0}" -eq 1 ]; then
              # This pass already stopped at an installation rate-limit
              # failure (#2220): nothing more is EVALUATED. A head this pass
              # claimed still has holds open, so its remaining contexts are
              # closed with the same rate-limit red rather than orphaned;
              # any other PR is left exactly as it was.
              case " ${CLAIMED_HEADS:-} " in
                *" $head "*)
                  output="Not evaluated: the installation API budget is exhausted (a gate already failed on it, or it cannot cover this evaluation), so this pass closes the hold on $head instead of leaving it pending (#2220)."
                  rc=2
                  rate_limit_red=1
                  ;;
                *)
                  echo "PR #$pr: $context not evaluated after the installation rate-limit stop; its previous verdict stands (#2220)."
                  return 0
                  ;;
              esac
            else
              set +e
              if [ "$summary_hold" = true ]; then
                output=$(REQUIRE_REVIEW_SUMMARY=true "$script" "$pr" "$REPO" 2>&1)
              else
                output=$("$script" "$pr" "$REPO" 2>&1)
              fi
              rc=$?
              set -e
              # The first gate that fails on the exhausted installation
              # budget stops the pass (#2220): every later PR would fail the
              # same way, and each failure is another infra red the next
              # pass would re-evaluate. rc 0 and 1 are verdicts, never this.
              # REST says "rate limit exceeded for installation"; GraphQL says
              # "rate limit already exceeded for installation".
              if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ] \
                  && ib_rate_limited "$output"; then
                RATE_LIMITED=1
                rate_limit_red=1
                echo "::error::$script hit the installation API rate limit on PR #$pr; stopping this pass (#2220)."
                # Stamp the reset of the bucket that actually ran out, read
                # now from the X-RateLimit-* headers of a probe the same
                # bucket refuses (#2286: GET /rate_limit can read healthy
                # while calls are refused), falling back to the exhausted
                # bucket GET /rate_limit names. An unreadable answer keeps
                # the pass-start reset.
                local exhausted_reset
                exhausted_reset=$(ib_exhausted_reset "$output")
                if [ -n "$exhausted_reset" ]; then
                  RATE_LIMIT_RESET_ISO="$exhausted_reset"
                fi
              fi
            fi
            printf '%s\n' "$output"
            title="$context (publisher re-evaluation)"
            case "$rc" in
              0) conclusion="success" ;;
              1) conclusion="failure" ;;
              3)
                conclusion="failure"
                if [ "$summary_hold" = true ]; then
                  title="$context — evidence hold; explicit recovery required after escalation"
                else
                  had_infra_error=1
                  title="$context — infra/config error (rc=$rc)"
                fi
                ;;
              *)
                # Config/usage/infra exits publish a RED, not a skip:
                # skipping would leave the PREVIOUS verdict standing on the
                # refresh path this publisher owns (#429 sweep posture).
                echo "::error::$script rc=$rc on PR #$pr (config/usage/infra error)"
                had_infra_error=1
                conclusion="failure"
                title="$context — infra/config error (rc=$rc)"
                if [ "$rate_limit_red" -eq 1 ]; then
                  # Identifiable by due()'s rate-limit back-off (#2220): the
                  # fixed mark plus the window's reset, so event passes leave
                  # this PR alone until the budget refills, and the first
                  # pass after the reset re-evaluates it with no manual rerun.
                  title="$context — ${RATE_LIMIT_MARK:-installation API budget exhausted} (rc=$rc)"
                  if [ -n "${RATE_LIMIT_RESET_ISO:-}" ]; then
                    title="$title; re-evaluated after $RATE_LIMIT_RESET_ISO"
                  fi
                fi
                ;;
            esac
            if [ "$rc" -eq 0 ] && [ -n "$sentinel" ] && \
                ! grep -qF "$sentinel" <<<"$output"; then
              # rc 0 without the script's own PASS line means the success
              # did not come from the verdict path (a stubbed or truncated
              # script); publish red and flag it.
              echo "::error::$script exited 0 without '$sentinel' on PR #$pr"
              had_infra_error=1
              conclusion="failure"
              title="$context — rc 0 without verdict sentinel"
            fi
            # Bash slice, not head -c: pipefail-safe under large outputs,
            # correct for the 65535-char API limit (b10671e wave).
            local summary="${output:0:60000}"
            # Current-head revalidation (cross-agent round 5): the gate
            # scripts evaluate LIVE PR state, so a force-push between
            # enumeration and here would attach a fresh-state verdict to
            # the captured SHA — reusable if the branch ever returns to
            # it. On drift, red pinned to the bound head (the event
            # publisher's posture); the push's own synchronize event owns
            # the new head. A failed read is unknown drift: fail closed.
            local live_head
            if ! live_head=$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha); then
              echo "::error::Could not revalidate PR #$pr head before posting $context; withholding (fail closed)."
              had_infra_error=1
              return 0
            fi
            if [ "$live_head" != "$head" ]; then
              conclusion="failure"
              title="$context — head moved during evaluation"
              summary="PR #$pr moved from $head to $live_head while this pass evaluated; this verdict is pinned red to the superseded head. The new head gets its own evaluation from its own events."
            fi
            if ! rcg_close "$REPO" "$pr" "$head" "$context" "$generation_id" "$conclusion" "$title" "$summary"; then
              echo "::error::Failed to post $context for PR #$pr — its slot was not refreshed."
              had_infra_error=1
            elif [ "$context" = "$CODERABBIT_CONTEXT" ] && [ -s "$CR_EVIDENCE_REPORT" ] \
                && [ "$(jq -r .state "$CR_EVIDENCE_REPORT")" = escalate ]; then
              EVIDENCE_ESCALATIONS="$EVIDENCE_ESCALATIONS $pr"
            elif [ "$context" = "$MCG_CONTEXT" ] && [ "$conclusion" = "success" ]; then
              # #2239: a green clearance verdict that LANDED on the live head
              # (a moved head was turned red above). The nomination step
              # after the loop decides whether auto-clear should run on it.
              MCG_GREEN_PRS="${MCG_GREEN_PRS:-} $pr"
            fi
          }

          # Selection, then evaluation (#2220): the budget decision needs the
          # number of PRs the pass would evaluate, which on an event pass is
          # only known once due() has read each PR's proof.
          selected=""
          budget_skipped=""
          while IFS=$'\t' read -r PR head_sha pr_updated _pr_labeled; do
            [ -z "$PR" ] && continue
            if [ -z "$head_sha" ] || [ "$head_sha" = "null" ]; then
              echo "::error::No head SHA for PR #$PR from the open-PR list; cannot refresh its contexts."
              had_infra_error=1
              continue
            fi
            if grep -qxF "$head_sha" <<<"$dup_heads"; then
              if ! grep -qF "$head_sha" <<<"$handled_dups"; then
                handled_dups="$handled_dups $head_sha"
                echo "::error::Head $head_sha is carried by more than one open PR; publishing red on all three contexts."
                had_infra_error=1
                for name in "$MCG_CONTEXT" "$CODEX_P1_CONTEXT" "$CODERABBIT_CONTEXT"; do
                  if duplicate_id=$(rcg_open "$REPO" "$PR" "$head_sha" "$name"); then
                    rcg_close "$REPO" "$PR" "$head_sha" "$name" "$duplicate_id" failure \
                      "$name — ambiguous head" "More than one open PR carries $head_sha; close or rebase one of them." \
                      || echo "::error::Failed to close ambiguity generation for $name on $head_sha."
                  fi
                done
              fi
              continue
            fi
            if [ "$due_only" -eq 1 ] && [ "$head_sha" != "$RUN_HEAD" ]; then
              # The event head plus this PR is already more than the budget
              # covers: skip without spending a due() read on it (#2220).
              if ! ib_affordable 2; then
                budget_skipped="$budget_skipped #$PR"
                continue
              fi
              DUE_PAGES=1
              if ! due "$head_sha" "${pr_updated:-}"; then
                spent=$((spent + DUE_PAGES))
                if [ "${DUE_REASON%% *}" = backoff ]; then
                  echo "PR #$PR @ $head_sha: newest verdict is an installation rate-limit red; backed off until ${DUE_REASON#backoff }, after which the first pass re-evaluates it (#2220)."
                else
                  echo "PR #$PR @ $head_sha: green, newer than its last activity and under ${DUE_MAX_AGE_SECONDS}s old; skipped on this event pass (#1130)."
                fi
                skipped=$((skipped + 1))
                continue
              fi
              spent=$((spent + DUE_PAGES))
            fi
            selected="$selected$PR"$'\t'"$head_sha"$'\n'
          done <<<"$targets"

          n_selected=$(awk 'NF { n++ } END { print n + 0 }' <<<"$selected")
          if [ -n "$budget_skipped" ] \
              || { [ "$n_selected" -gt 0 ] && ! ib_affordable "$n_selected"; }; then
            budget_low=1
          fi
          if [ "$budget_low" -eq 1 ]; then
            # Claimed heads always stay (their holds must close). The rest
            # of the capacity goes to a ROTATING batch of the other PRs
            # (Codex P1 on #2225): an all-or-nothing rule could never run a
            # full pass once 40 x open PRs + 100 exceeds the whole bucket
            # (23 PRs), leaving the scheduled backstop dead indefinitely.
            # The batch starts at tick % n_others, an offset that advances by
            # ONE every sweep interval whatever the capacity, so every
            # position is a batch start once per n_others ticks and each of
            # a stable set of PRs is evaluated within n_others ticks under
            # any positive capacity (#2229). Scaling the offset by the batch
            # size covered PRs faster at a steady capacity but let a
            # capacity that changed between ticks jump over the same
            # position indefinitely.
            kept=""
            others=""
            n_claimed_kept=0
            while IFS=$'\t' read -r PR head_sha; do
              [ -z "$PR" ] && continue
              case " $CLAIMED_HEADS " in
                *" $head_sha "*) kept="$kept$PR"$'\t'"$head_sha"$'\n'; n_claimed_kept=$((n_claimed_kept + 1)) ;;
                *) others="$others$PR"$'\t'"$head_sha"$'\n' ;;
              esac
            done <<<"$selected"
            slots=$(( $(ib_capacity) - n_claimed_kept ))
            [ "$slots" -ge 0 ] || slots=0
            n_others=$(awk 'NF { n++ } END { print n + 0 }' <<<"$others")
            batch=""
            if [ "$slots" -gt 0 ] && [ "$n_others" -gt 0 ]; then
              tick=$(jq -nr --arg t "$PASS_START" --argjson i "${DUE_MAX_AGE_SECONDS:-1800}" \
                       '($t | fromdateiso8601) / $i | floor' 2>/dev/null || echo 0)
              batch=$(awk -v off=$(( tick % n_others )) -v take="$slots" \
                        'NF { a[n++] = $0 } END { for (i = 0; i < take && i < n; i++) print a[(off + i) % n] }' <<<"$others")
            fi
            while IFS=$'\t' read -r PR head_sha; do
              [ -z "$PR" ] && continue
              grep -qxF "$PR"$'\t'"$head_sha" <<<"$batch" || budget_skipped="$budget_skipped #$PR"
            done <<<"$others"
            selected="$kept$batch"
            n_batch=$(awk 'NF { n++ } END { print n + 0 }' <<<"$batch")
            if [ "$n_claimed_kept" -eq 0 ] && [ "$n_batch" -eq 0 ]; then
              scope="evaluating nothing new"
            else
              scope="evaluating $n_claimed_kept claimed head(s) and a rotating batch of $n_batch of $n_others other PR(s)"
            fi
            echo "::notice::Budget guard (#2220): $(( rl_remaining - spent )) REST request(s) and ${gql_remaining} GraphQL point(s) remain until ${RATE_LIMIT_RESET_ISO:-the window resets}, short of $per_pr requests and $gql_per_pr points per PR to evaluate plus reserves of $reserve and $gql_reserve; $scope. Skipped:${budget_skipped:- none}. Each skipped PR keeps its previous verdict on its own head."
          fi

          stopped=""
          while IFS=$'\t' read -r PR head_sha; do
            [ -z "$PR" ] && continue
            # After a rate-limit stop only claimed heads are touched, and
            # gate() closes their holds without evaluating (#2220).
            if [ "$RATE_LIMITED" -eq 1 ]; then
              case " $CLAIMED_HEADS " in
                *" $head_sha "*) ;;
                *) stopped="$stopped #$PR"; continue ;;
              esac
            fi
            evaluated=$((evaluated + 1))
            echo "::group::Publish PR #$PR @ $head_sha"
            gate scripts/merge-clearance-gate.sh   "$MCG_CONTEXT"        "Merge clearance: PASS" "$PR" "$head_sha"
            gate scripts/codex-p1-gate.sh          "$CODEX_P1_CONTEXT"   ""                      "$PR" "$head_sha"
            gate scripts/coderabbit-severity-gate.sh "$CODERABBIT_CONTEXT" ""                    "$PR" "$head_sha" true
            echo "::endgroup::"
          done <<<"$selected"

          # Auto-clear nominations (#2239, #2205). auto-clear-blocking-labels.yml
          # listens to no run of this workflow, so a green `Merge clearance
          # gate` verdict posted here used to reach the label only through its
          # */5 sweep, which GitHub delays or drops under load. Each PR this
          # pass gave a green verdict is nominated, for the nominate-auto-clear
          # job to dispatch, when:
          #   * it carries needs-external-review (the open-PR list above, no
          #     extra request): auto-clear re-derives clearance from live
          #     state and removes the label if the merge gate passes; or
          #   * on a full-coverage pass only (the */30 chained sweep pass, a
          #     dispatch), it does not, and the newest auto-clear-blocking-labels
          #     check-run on its head is a failure: a heal that failed after a
          #     removal, which nothing else retries (#2205). One request per
          #     such PR, inside the per-PR budget, and none after a rate-limit
          #     stop.
          # A red verdict, a withheld one, an unlabeled PR with no stale
          # failure, and a pass that evaluated nothing nominate nothing.
          autoclear_prs=""
          for green_pr in ${MCG_GREEN_PRS:-}; do
            case " $autoclear_prs " in *" $green_pr "*) continue ;; esac
            green_row=$(awk -F'\t' -v n="$green_pr" '$1 == n { print; exit }' <<<"$prs_raw")
            green_head=$(cut -f2 <<<"$green_row")
            if [ "$(cut -f4 <<<"$green_row")" = "true" ]; then
              echo "PR #$green_pr: green clearance verdict on a PR carrying needs-external-review; nominating it to auto-clear (#2239)."
              autoclear_prs="$autoclear_prs $green_pr"
              continue
            fi
            [ "$due_only" -eq 0 ] && [ "${RATE_LIMITED:-0}" -eq 0 ] || continue
            if ! ac_runs=$(gh api --paginate -X GET "repos/$REPO/commits/$green_head/check-runs" \
                -f check_name=auto-clear-blocking-labels -f filter=latest -f per_page=100 \
                --jq '.check_runs[] | select(.name == "auto-clear-blocking-labels") | [(.completed_at // .started_at // ""), (.id | tostring), (.conclusion // .status // "unknown")] | @tsv'); then
              echo "::warning::Could not read the auto-clear-blocking-labels check-runs on PR #$green_pr head $green_head; the next full pass retries the read (#2205)."
              continue
            fi
            [ -n "$ac_runs" ] || continue
            if [ "$(sort -t $'\t' -k1,1 -k2,2n <<<"$ac_runs" | tail -n 1 | cut -f3)" = "failure" ]; then
              echo "PR #$green_pr: label absent and the newest auto-clear-blocking-labels run on $green_head is a failure; nominating it to auto-clear to heal it (#2205)."
              autoclear_prs="$autoclear_prs $green_pr"
            fi
          done
          # shellcheck disable=SC2086  # intentional word-splitting to trim
          echo "autoclear_prs=$(echo $autoclear_prs)" >> "$GITHUB_OUTPUT"
          echo "evidence_escalations=$(echo $EVIDENCE_ESCALATIONS)" >> "$GITHUB_OUTPUT"

          if [ -n "$stopped" ]; then
            echo "::warning::Stopped at an installation API rate-limit failure (#2220). Not evaluated:$stopped. Each keeps its previous verdict on its own head; a pass after ${RATE_LIMIT_RESET_ISO:-the budget resets} evaluates them."
          fi
          if [ "$due_only" -eq 1 ]; then
            echo "Due-only event pass: evaluated $evaluated open PR(s), skipped $skipped current one(s)."
          fi
          if [ "$had_infra_error" -ne 0 ]; then
            echo "::error::Publisher finished with one or more infra errors"
            exit 1
          fi

      # #2907: close holds whose writer died. Phase-1 holds, owned
      # generations and native leases are completed only by the run that
      # opened them (or, for phase-1 holds, superseded by a newer
      # generation); a run lost to an Actions incident leaves its hold
      # `in_progress` forever, so the head's check suite never completes and
      # an armed auto-merge never fires. The reaper cancels a hold only once
      # it is an hour old AND a newer same-name run on the same head has
      # completed, so it never clears a context. It runs on the */30
      # schedule-parent pass only (full coverage), and after a failed publish
      # step too: the evaluation's outcome does not change which holds are
      # orphaned.
      - name: Reap orphaned holds on open PR heads
        if: >-
          ${{ !cancelled() && github.event_name == 'workflow_run' &&
          github.event.workflow_run.event == 'schedule' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: scripts/workflow/reap-orphaned-holds.sh "$REPO"

  # Phase 3 (#2239, #2205). Sends one `auto-clear-evaluate` repository_dispatch
  # per PR the publish pass nominated (see "Auto-clear nominations" in its
  # step), carrying only the PR number. auto-clear-blocking-labels.yml handles
  # it on its default-branch definition, re-derives clearance from live state,
  # fences the live head/base before any label DELETE and runs its heal step.
  #
  # A SEPARATE job because POST /dispatches needs `contents: write`, and a job
  # is the narrowest scope a GITHUB_TOKEN permission can have: the publish job
  # runs the gate scripts and must not hold it. This job checks out nothing and
  # runs one inline loop over integers it validates, so no candidate or
  # repository code ever executes with that grant. It writes no check-run and
  # opens no hold, and it is skipped (no runner) whenever the pass nominated
  # nothing, which is almost every pass. No PAT: a GITHUB_TOKEN
  # repository_dispatch starts the run.
  nominate-auto-clear:
    name: nominate-auto-clear
    needs: publish
    if: ${{ !cancelled() && needs.publish.outputs.autoclear_prs != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Dispatch auto-clear evaluations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          AUTOCLEAR_PRS: ${{ needs.publish.outputs.autoclear_prs }}
        run: |
          set -euo pipefail
          # Best effort, single attempt per PR: auto-clear's */5 sweep still
          # bounds a dropped nomination for a labeled PR, and the next full
          # publisher pass repeats a heal nomination. A failed dispatch warns
          # instead of reddening the publisher run, whose red means a verdict
          # was not published.
          for pr in $AUTOCLEAR_PRS; do
            if ! [[ "$pr" =~ ^[1-9][0-9]{0,9}$ ]]; then
              echo "::warning::Ignoring malformed auto-clear nomination '$pr'."
              continue
            fi
            if gh api -X POST "repos/$REPO/dispatches" \
                -f event_type=auto-clear-evaluate \
                -F "client_payload[pr]=$pr" >/dev/null; then
              echo "Dispatched auto-clear-evaluate for PR #$pr."
            else
              echo "::warning::Could not dispatch auto-clear-evaluate for PR #$pr; the auto-clear sweep or the next publisher full pass covers it."
            fi
          done

  # #906: isolate issue writes from all gate evaluation. This job can only
  # report the newest owned evidence hold; it has no check-publication scope.
  escalate-coderabbit-evidence:
    name: Escalate persistent CodeRabbit evidence failures
    needs: publish
    if: ${{ always() && needs.publish.outputs.evidence_escalations != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Installation tokens route PR issue-comment writes through this
      # scope; issues:write alone 403s on PR targets (measured #1163).
      pull-requests: write
      checks: read
      issues: write
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Record evidence escalation and parser drift
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PRS: ${{ needs.publish.outputs.evidence_escalations }}
        run: python3 scripts/workflow/coderabbit-evidence-recovery.py --escalate "$REPO" "$PRS"
