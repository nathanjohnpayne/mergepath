# repo_lint.yml — canonical fleet CI workflow (manifest-propagated, #601).
#
# This file is a `canonical` entry in .mergepath-sync.yml (consumers: all):
# every consumer receives it byte-for-byte on each sync wave. Editing rules:
#
#   - A new scripts/ci/check_* MUST add its `run: ./scripts/ci/check_X` step
#     here in the SAME PR that adds the script. check_ci_scripts_wired
#     enforces wired-or-exempt on every repo in the fleet, so the check and
#     its wiring travel to consumers atomically in the same sync PR.
#   - Consumer-local wiring (consumer-only steps, consumer-local
#     WIRED-EXEMPT lines) belongs in the OPTIONAL, never-propagated
#     .github/workflows/repo_lint_local.yml annex — NOT here. Local edits to
#     this file are drift and get overwritten by the next sync wave.
#   - Every step must be consumer-safe: SKIP-guard hub-only checks (the
#     scripts/sync-to-downstream.sh marker idiom — see check_sync_manifest),
#     depend only on manifest-propagated files, or soft-pass when the
#     backing script is absent (the #590-style
#     `[ -f scripts/<gate>.sh ] || exit 0` one-liner).
#   - EVERY check step in `lint_fast` is pinned to exactly ONE shard with
#     `if: matrix.shard == N` (#2163). The fast lane is a 4-leg matrix
#     balanced by measured step time; a step with no pin runs on every
#     shard (wasted minutes, not a missed assertion), and a pin naming a
#     shard outside the matrix never runs anywhere — which is why
#     tests/test_repo_lint_optimization.sh asserts both. Put a new check
#     on the shard with the smallest measured sum (see the job comment).
#   - EVERY `run: ./scripts/ci/check_X` step carries the #590 missing-file
#     soft-pass tail (#979), without exception:
#
#       run: ./scripts/ci/check_X || { rc=$?; if [ ! -f scripts/ci/check_X ] &&
#         [ ! -f scripts/sync-to-downstream.sh ]; then echo "..."; exit 0; fi; exit "$rc"; }   # (one physical line)
#
#     The tail exits 0 ONLY when the backing script and the hub-only sync
#     orchestrator are both absent; that identifies a consumer that skipped
#     the kit. A hub-side missing wrapper and a present script that fails both
#     propagate their exit code, so neither can silently disable lint. It
#     must stay on ONE line so
#     check_ci_scripts_wired still sees the literal `run: ./scripts/ci/check_X`
#     wire. Rationale: `requires: ["scripts/ci/"]` makes the kit travel with
#     this file, but a consumer may skip the kit in its `.sync-overrides.yml`
#     (gaycruisebingo does today) and then receives this workflow WITHOUT the
#     script it invokes — a bare `run:` reds that consumer's lint on rc 127,
#     forever, and the consumer cannot fix it because the hub owns the kit.
#     The paired consumer-safety suite executes every `run:` body here against
#     both kit-less consumer and missing-wrapper hub fixtures to prove those
#     distinct outcomes.
#   - The same kit-less rule binds any OTHER step that touches scripts/ci/,
#     not just the check wires. A setup step that fails on an absent or empty
#     kit reds the job BEFORE the guarded checks run, which makes every tail
#     below it unreachable — the `make_ci_scripts_executable` chmod was
#     exactly that. The same suite executes each such step against a tree
#     with no scripts/ci/ at all and against an empty one, and both must
#     exit 0.

name: repo-lint

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      deep: ${{ steps.classify.outputs.deep }}
      full: ${{ steps.classify.outputs.full }}
      checks: ${{ steps.classify.outputs.checks }}
      consumer_replay: ${{ steps.classify.outputs.consumer_replay }}
      self_tests: ${{ steps.classify.outputs.self_tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: classify repo-lint scope
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          classifier=scripts/ci/repo-lint-scope.sh
          if [ ! -f "$classifier" ]; then
            if [ -f scripts/sync-to-downstream.sh ]; then
              echo "FAIL: $classifier is missing from the hub checkout" >&2
              exit 1
            fi
            if [ -n "${GITHUB_OUTPUT:-}" ]; then
              echo "deep=false" >> "$GITHUB_OUTPUT"
              echo "full=false" >> "$GITHUB_OUTPUT"
              echo "checks=[]" >> "$GITHUB_OUTPUT"
              echo "consumer_replay=false" >> "$GITHUB_OUTPUT"
              echo "self_tests=false" >> "$GITHUB_OUTPUT"
            fi
            echo "repo-lint scope: consumer skipped the scripts/ci kit"
            exit 0
          fi
          if [ "$EVENT_NAME" != "pull_request" ]; then
            printf '' | bash "$classifier" --event "$EVENT_NAME"
          elif git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null \
              && git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null \
              && changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA"); then
            printf '%s\n' "$changed" | bash "$classifier" --event "$EVENT_NAME" --head-ref "$HEAD_REF"
          else
            {
              echo "deep=true"
              echo "full=true"
              echo "checks=[]"
              echo "consumer_replay=true"
              echo "self_tests=true"
            } >> "$GITHUB_OUTPUT"
            echo "repo-lint scope: PR diff unavailable; failing closed to deep CI"
          fi

  lint_fast:
    # Sharded fast lane (#2163, #1062 Phase 2). Every check step below is
    # pinned to exactly one shard with `if: matrix.shard == N`; the setup
    # prelude (checkout, chmod, identity snapshot, python + yq provisioning)
    # carries no pin and runs on every shard, so each leg is a complete,
    # self-contained copy of the old single job minus the checks that
    # belong to the other legs. GitHub renders the legs as `lint-fast (N)`
    # and the required `lint` aggregator reads the matrix job's rolled-up
    # `needs.lint_fast.result`, which is `success` only when every leg is.
    #
    # Balance is by MEASURED step time, not by subject: run 38433656174
    # (2026-10-13, 19 min serial) assigned by longest-processing-time-first
    # over the per-step durations lands each shard at ~283 s of check time
    # before setup. Re-balance by moving `if:` pins when the measured sums
    # drift; the latency audit (.github/workflows/repo-lint-latency.yml)
    # reports per-step timing for the heads it samples. The tree scan and
    # regression suite of check_git_identity_hygiene are checkout-static,
    # so they run once (the plain call on their shard) while every OTHER
    # shard closes with `--verify`, the Parts A/B re-assertion that proves
    # that shard's suites left .git/config alone (#777).
    #
    # No `concurrency:` here: the workflow-level group already cancels a
    # superseded PR head, and a job-level group on a required-gate input
    # cancels a PENDING leg of the same head (memory: never add one).
    name: lint-fast
    runs-on: ubuntu-latest
    # Bound each leg the way deep_safety is bounded: a wedged check would
    # otherwise hold the required `lint` context open for the 6 h runner
    # default. The slowest leg measured ~5 min of check time.
    timeout-minutes: 30
    strategy:
      # Every leg reports; a failing shard must not cancel its siblings'
      # evidence, and the aggregator fails on any non-success leg anyway.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Lint only runs scripts/ci/check_* against the checked-out tree; it
          # never pushes or uses the workspace remote, so don't leave the
          # checkout token in .git/config (#548 defense-in-depth).
          persist-credentials: false

      - name: make_ci_scripts_executable
        # Kit-less-safe (#979). `chmod +x scripts/ci/*` fails on a consumer
        # that skipped the `scripts/ci/` kit: the glob matches nothing, bash
        # hands `chmod` the literal pattern, and chmod exits nonzero — so the
        # job reds HERE, before any soft-passing check step below ever runs,
        # and every soft-pass tail underneath is unreachable. Guard on the
        # directory and enumerate with `find`, which is a no-op on an empty
        # kit; a real chmod failure on a populated kit still propagates.
        run: |
          if [ -d scripts/ci ]; then
            find scripts/ci -maxdepth 1 -type f -exec chmod +x {} +
          fi

      # #777 part 1 of 2 — record .git/config BEFORE any step that runs a
      # test suite. The paired verification step at the END of this job
      # byte-compares against this snapshot, which turns "running the
      # suite leaves .git/config untouched" into an assertion this job
      # actually makes across every test-wrapping step in between. A test
      # that builds a fixture repo but runs `git config` without `-C`
      # writes the CHECKOUT's identity instead, and every worktree of that
      # repo then inherits it. The `|| { ...; }` tail is the #590-style
      # self-bootstrap guard: soft-pass when the check script is not in
      # this tree yet (the #601 kit-vs-workflow skew window). Unpinned on
      # purpose: every shard is its own runner and checkout, so every
      # shard records its own baseline and verifies it at its own end.
      - name: check_git_identity_hygiene --snapshot
        run: ./scripts/ci/check_git_identity_hygiene --snapshot || { rc=$?; if [ ! -f scripts/ci/check_git_identity_hygiene ] && [ ! -f scripts/sync-to-downstream.sh ]; then echo "check_git_identity_hygiene not in this tree yet; soft-pass (bootstrap skew)"; else exit "$rc"; fi; }

      # #853 — provision the Python packages the check_* loop depends on
      # explicitly, instead of relying on whatever the runner image happens
      # to ship. Installed into an isolated venv (same pattern as
      # .github/workflows/md-prose-wrap.yml) with its bin/ prepended to
      # GITHUB_PATH, so every later step's bare `python3` resolves to this
      # interpreter without any script needing to know about a venv.
      #
      #   - PyYAML backs the #850 structural assertions in
      #     check_merge_clearance_gate and the agent-review.yml parse tier in
      #     check_workflow_parsers. Both soft-SKIP (loud, exit 0) when PyYAML
      #     is absent — the right posture for a bare local shell, but it left
      #     CI enforcement resting on GitHub-hosted runner images happening
      #     to ship PyYAML, an undocumented dependency of a merge-relevant
      #     fence (#853). The check scripts keep their loud-SKIP posture for
      #     local shells unchanged; this step is what makes CI never take
      #     that path.
      #   - markdown-it-py backs the CommonMark oracle in
      #     tests/test_check_doc_ownership.sh (the regression net
      #     check_doc_ownership runs). Same gap in the same job (#929 item
      #     21, Addendum 7): the GitHub-hosted runner image ships an
      #     importable markdown_it, but it answers CommonMark 0.30 while the
      #     oracle's fixture rows target 0.31 — the two specs disagree on the
      #     § HTML blocks condition 6 tag list, which is what Case 14w
      #     exercises. So the renderer was never absent, and the skip was
      #     never silent: since #925 the oracle gates on a conformance probe
      #     and names the exact spec mismatch on stdout when it declines.
      #     What was missing is a PINNED renderer that actually answers
      #     0.31 — an unpinned install would still resolve to whatever
      #     CommonMark version the runner's markdown-it-py happens to
      #     implement, which is the wrong specification for these fixtures.
      #     Bundled here rather than filed separately because the fix is the
      #     identical one step in the identical job.
      #
      # Placed AFTER the #777 snapshot above, not before it: this is the only
      # step in the job that fetches and executes third-party code, so it
      # belongs INSIDE the snapshot/verify window rather than outside it. Any
      # .git/config write an installer performs is then caught by the paired
      # verification step at the end of the job. Nothing earlier in the job
      # needs `python3`, so the placement costs no coverage.
      #
      # These exact pins constrain the two direct packages so their own
      # versions cannot silently drift and change parse/render behavior for a
      # merge-relevant gate or CommonMark oracle. Both pins are the current
      # stable release at time of writing — PyYAML 6.0.3 (2025-09-25) and
      # markdown-it-py 4.2.0 — and the latter matches the existing
      # .github/workflows/md-prose-wrap.yml pin, so both document gates use
      # the same renderer version. Bumping either pin is a deliberate,
      # reviewed edit; it is not expected to track latest.
      #
      # These direct pins do not lock or hash the transitive dependency graph:
      # pip still resolves dependencies such as markdown-it-py's mdurl. This
      # step therefore does not guarantee a fully reproducible environment.
      # A locked, hashes-backed graph and its update process would be a
      # separate reviewed change, not an implication of these direct pins.
      #
      # No self-bootstrap `|| { ...; }` tail here, unlike several check_*
      # steps below: a failed `pip install` (network, index, or resolver
      # failure) or a package that installs but does not import must fail
      # this step outright — silently soft-passing a missing CI dependency
      # is exactly the failure mode #853 exists to close. The tradeoff is
      # accepted deliberately: this job now has a hard PyPI dependency, so a
      # PyPI or network outage reds `repo-lint` fleet-wide rather than
      # silently downgrading a merge-relevant gate to SKIP. #853's acceptance
      # asks for exactly that ("guarantees a YAML-capable python3 ... or
      # fails loudly"). Do not "fix" a transient outage by adding a soft-pass
      # tail here — re-run the job instead.
      - name: install_python_ci_dependencies
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ci-pyenv"
          "$RUNNER_TEMP/ci-pyenv/bin/pip" install --quiet 'PyYAML==6.0.3' 'markdown-it-py==4.2.0'
          echo "$RUNNER_TEMP/ci-pyenv/bin" >> "$GITHUB_PATH"
          if ! "$RUNNER_TEMP/ci-pyenv/bin/python3" -c "import yaml, markdown_it" >/dev/null 2>&1; then
            echo "FAIL: PyYAML / markdown-it-py did not import after install — CI dependency provisioning is broken" >&2
            exit 1
          fi

      # Structural guard added in #269: every executable
      # scripts/ci/check_* must be wired into this workflow as an
      # explicit `run: ./scripts/ci/check_X` step (or carry a
      # documented exemption comment). Catches the failure mode where
      # a check ships on disk but never executes in CI because nobody
      # remembered to add the matching workflow step. Pure-bash so it
      # can run before any tooling install (yq, etc.).
      - name: check_ci_scripts_wired
        if: matrix.shard == 1
        run: ./scripts/ci/check_ci_scripts_wired || { rc=$?; if [ ! -f scripts/ci/check_ci_scripts_wired ] && [ ! -f scripts/sync-to-downstream.sh ]; then echo "check_ci_scripts_wired not on this tree yet — soft pass (kit skew)"; exit 0; fi; exit "$rc"; }

      # The reverse of check_ci_scripts_wired: that one enforces script → wire,
      # this one enforces wire → script. It is deliberately INLINE rather than
      # a scripts/ci/ check, and gated on the hub marker rather than on the
      # kit. Every soft-pass tail above exits 0 when its backing script is
      # gone, so any assertion that lives inside the kit can be retired by
      # deleting the very file it was supposed to notice was missing — the
      # mechanism would then validate its own removal. This step cannot be:
      # scripts/sync-to-downstream.sh is hub-only and is NOT part of the
      # scripts/ci/ kit, so on the hub a wired name with no file is a hard
      # failure even if the whole kit is deleted, while a consumer that
      # skipped the kit still passes. Pure-bash; the awk is the same
      # comment-stripping, `run:`-anchored extraction the wired guard uses,
      # so a check named only in a comment is not mistaken for a wire.
      - name: check_ci_kit_integrity
        if: matrix.shard == 1
        run: |
          set -euo pipefail
          if [ ! -f scripts/sync-to-downstream.sh ]; then
            echo "check_ci_kit_integrity: SKIP (consumer checkout — the scripts/ci kit is optional here)"
            exit 0
          fi
          missing=0
          wired=$(awk '
            {
              sub(/[[:space:]]*#.*$/, "")
              if (match($0, /^[[:space:]]*run:[[:space:]]*\.\/scripts\/ci\/check_[A-Za-z0-9_]+/)) {
                line = substr($0, RSTART, RLENGTH)
                sub(/^[[:space:]]*run:[[:space:]]*\.\/scripts\/ci\//, "", line)
                print line
              }
            }
          ' .github/workflows/repo_lint.yml | LC_ALL=C sort -u)
          if [ -z "$wired" ]; then
            echo "FAIL: no wired scripts/ci checks found in repo_lint.yml (extraction broken?)" >&2
            exit 1
          fi
          # Check names are [A-Za-z0-9_] by construction above, so plain word
          # splitting is safe and keeps the loop in the current shell (a pipe
          # would run it in a subshell and lose "missing").
          for name in $wired; do
            if [ ! -f "scripts/ci/$name" ]; then
              echo "FAIL: repo_lint.yml wires $name but scripts/ci/$name does not exist on the hub — the missing-script soft-pass would swallow it silently" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "check_ci_kit_integrity: PASS ($(printf '%s\n' "$wired" | wc -l | tr -d ' ') wired checks all resolve to a file)"

      - name: check_required_root_files
        if: matrix.shard == 1
        run: ./scripts/ci/check_required_root_files || { rc=$?; if [ ! -f scripts/ci/check_required_root_files ] && [ ! -f scripts/sync-to-downstream.sh ]; then echo "check_required_root_files not on this tree yet — soft pass (kit skew)"; exit 0; fi; exit "$rc"; }

      - name: check_no_tool_folder_instructions
        if: matrix.shard == 1
        run: ./scripts/ci/check_no_tool_folder_instructions || { rc=$?; if [ ! -f scripts/ci/check_no_tool_folder_instructions ] && [ ! -f scripts/sync-to-downstream.sh ]; then echo "check_no_tool_folder_instructions not on this tree yet — soft pass (kit skew)"; exit 0; fi; exit "$rc"; }

      - name: check_no_forbidden_top_level_dirs
        if: matrix.shard == 1
        run: ./scripts/ci/check_no_forbidden_top_level_dirs || { rc=$?; if [ ! -f scripts/ci/check_no_forbidden_top_level_dirs ] && [ ! -f scripts/sync-to-downstream.sh ]; then echo "check_no_forbidden_top_level_dirs not on this tree yet — soft pass (kit skew)"; exit 0; fi; exit "$rc"; }

      - name: check_dist_not_modified
        if: matrix.shard == 1
        run: ./scripts/ci/check_dist_not_modified || { rc=$?; if [ ! -f scripts/ci/check_dist_not_modified ] && [ ! -f scripts/sync-to-downstream.sh ]; then echo "check_dist_not_modified not on this tree yet — soft pass (kit skew)"; exit 0; fi; exit "$rc"; }

      - name: check_spec_test_alignment
        if: matrix.shard == 2
        run: ./scripts/ci/check_spec_test_alignment || { rc=$?; if [ ! -f scripts/ci/check_spec_test_alignment ] && [ ! -f scripts/sync-to-downstream.sh ]; then echo "check_spec_test_alignment not on this tree yet — soft pass (kit skew)"; exit 0; fi; exit "$rc"; }

      - name: check_duplicate_docs
        if: matrix.shard == 1
        run: ./scripts/ci/check_duplicate_docs || { rc=$?; if [ ! -f scripts/ci/check_duplicate_docs ] && [ ! -f scripts/sync-to-downstream.sh ]; then echo "check_duplicate_docs not on this tree yet — soft pass (kit skew)"; exit 0; fi; exit "$rc"; }

      # Bootstrap-wizard test suites (#156). Each check_bootstrap_*
      # script wraps the matching tests/test_bootstrap_*.sh suite
      # that exercises the corresponding bootstrap sub-wizard so the
      # wizards stay reproducible and a regression in any sub-wizard
      # is caught in CI before it ships to consumer repos. Wired in
      # #269 after the inventory of unwired scripts/ci/check_*.
      - name: check_bootstrap_sh
        if: matrix.shard == 1
        # Runtime-secret bootstrap helper: restore-only op inject path
        # and retired Secure Note / notesPlain sync path.
        run: ./scripts/ci/check_bootstrap_sh || { rc=$?; if [ ! -f scripts/ci/check_bootstrap_sh ] && [ ! -f scripts/sync-to-downstream.sh ]; then echo "check_bootstrap_sh not on this tree yet — soft pass (kit skew)"; exit 0; fi; exit "$rc"; }

      - name: check_bootstrap_wizard
        if: matrix.shard == 4
        # Sub-A: top-level bootstrap wizard scaffolding + flow.
        run: ./scripts/ci/check_bootstrap_wizard || { rc=$?; if [ ! -f scripts/ci/check_bootstrap_wizard ] && [ ! -f scripts/sync-to-downstream.sh ]; then echo "check_bootstrap_wizard not on this tree yet — soft pass (kit skew)"; exit 0; fi; exit "$rc"; }

      - name: check_bootstrap_template_mirror
        if: matrix.shard == 1
        # Sub-B: template-mirror bootstrap that seeds a downstream
        # repo with the canonical mergepath template files.
        run: ./scripts/ci/check_bootstrap_template_mirror || { rc=$?; if [ ! -f scripts/ci/check_bootstrap_template_mirror ] && [ ! -f scripts/sync-to-downstream.sh ]; then echo "check_bootstrap_template_mirror not on this tree yet — soft pass (kit skew)"; exit 0; fi; exit "$rc"; }

      - name: check_bootstrap_github_infra
        if: matrix.shard == 4
        # Sub-C: GitHub infrastructure bootstrap (labels, branch
        # protection, required workflows) for a fresh consumer repo.
        run: ./scripts/ci/check_bootstrap_github_infra || { rc=$?; if [ ! -f scripts/ci/check_bootstrap_github_infra ] && [ ! -f scripts/sync-to-downstream.sh ]; then echo "check_bootstrap_github_infra not on this tree yet — soft pass (kit skew)"; exit 0; fi; exit "$rc"; }

      - name: check_bootstrap_firebase_and_codereview
        if: matrix.shard == 3
        # Sub-D: Firebase + code-review configuration bootstrap.
        # Validates the wizard correctly disables CodeRabbit for
        # private consumer repos (free tier is public-only).
        run: ./scripts/ci/check_bootstrap_firebase_and_codereview || { rc=$?; if [ ! -f scripts/ci/check_bootstrap_firebase_and_codereview ] && [ ! -f scripts/sync-to-downstream.sh ]; then echo "check_bootstrap_firebase_and_codereview not on this tree yet — soft pass (kit skew)"; exit 0; fi; exit "$rc"; }

      - name: check_bootstrap_board_and_summary
        if: matrix.shard == 3
        # Sub-E: Project board + bootstrap-summary generation.
        # Ensures the wizard's end-state artifacts stay in sync with
        # the canonical templates.
        run: ./scripts/ci/check_bootstrap_board_and_summary || { rc=$?; if [ ! -f scripts/ci/check_bootstrap_board_and_summary ] && [ ! -f scripts/sync-to-downstream.sh ]; then echo "check_bootstrap_board_and_summary not on this tree yet — soft pass (kit skew)"; exit 0; fi; exit "$rc"; }

      - name: check_review_policy_exists
        if: matrix.shard == 1
        run: |
          MISSING=0
          if [ ! -f ".github/review-policy.yml" ]; then
            echo "ERROR: .github/review-policy.yml is missing"
            MISSING=1
          fi
          if [ ! -f "REVIEW_POLICY.md" ]; then
            echo "ERROR: REVIEW_POLICY.md is missing"
            MISSING=1
          fi
          exit $MISSING

      # WIRED-EXEMPT: check_op_firebase_deploy_integration — opt-in
      # local-only resolver smoke test for `scripts/firebase/op-firebase-deploy`
      # (#211). Gated on MERGEPATH_RUN_INTEGRATION=1 in the script's
      # own header; defaults to SKIPPED + exit 0 so wiring it into
      # repo_lint.yml would just add a SKIPPED step. The check_ci_scripts_wired
      # exemption keeps it executable on disk (so operators can run it
      # locally with the env var) without requiring a no-op CI step.
      # See #289 r4 / #290 / #269 — nathanpayne-codex Phase 4b finding.

      - name: check_codex_scripts
        if: matrix.shard == 1
        run: ./scripts/ci/check_codex_scripts || { rc=$?; if [ ! -f scripts/ci/check_codex_scripts ] && [ ! -f scripts/sync-to-downstream.sh ]; then echo "check_codex_scripts not on this tree yet — soft pass (kit skew)"; exit 0; fi; exit "$rc"; }

      - name: check_review_feedback_accounting
        if: matrix.shard == 3
        run: ./scripts/ci/check_review_feedback_accounting || { rc=$?; if [ ! -f scripts/ci/check_review_feedback_accounting ] && [ ! -f scripts/sync-to-downstream.sh ]; then echo "check_review_feedback_accounting not on this tree yet — soft pass (kit skew)"; exit 0; fi; exit "$rc"; }

      - name: check_daily_feedback_rollup
        if: matrix.shard == 1
        # Pure-function helpers + a 3-case shimmed --dry-run smoke
        # over scripts/daily-feedback-rollup.sh (#299 v1 slice).
        # Hermetic — uses a gh stub + canned GraphQL fixture; no
        # network. The full rollup integration (actually firing the
        # workflow against live PRs) is exercised once daily via
        # the cron in .github/workflows/daily-feedback-rollup.yml.
        run: ./scripts/ci/check_daily_feedback_rollup || { rc=$?; if [ ! -f scripts/ci/check_daily_feedback_rollup ] && [ ! -f scripts/sync-to-downstream.sh ]; then echo "check_daily_feedback_rollup not on this tree yet — soft pass (kit skew)"; exit 0; fi; exit "$rc"; }

      - name: check_canonical_bugs_263caf3
        if: matrix.shard == 2
        # Regression coverage for nathanpayne-codex findings on the
        # 263caf3 propagation wave and follow-up review-policy bugs:
