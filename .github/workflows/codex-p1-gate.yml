name: Codex P1 Gate
run-name: >-
  ${{ github.event_name == 'schedule' && 'Codex P1 Gate scheduled sweep' ||
  format('Codex P1 Gate relay-v1 PR #{0}', github.event.pull_request.number || github.event.issue.number) }}

# Enforces nathanjohnpayne/mergepath#235: Codex P1 inline-review findings
# must be resolved (via the GitHub UI's "Resolve conversation" button or
# the GraphQL `resolveReviewThread` mutation) before a PR can merge.
#
# Reports feedback-accounting misses and "Codex P1 unresolved: N" via
# scripts/codex-p1-gate.sh. The script exits 1 when any prior finding lacks
# disposition evidence or any required-tier thread on the current HEAD is
# unresolved. Review-body findings have no thread and are covered by the
# accounting pass (#1000).
#
# Complete-history feedback accounting is default-on in every consumer.
# codex.p1_gate.enabled controls only the older current-HEAD required-tier
# thread scan: Mergepath sets it true, while downstream consumers default to
# false until that override pattern is shaken out (#235, #1000).
#
# Re-runs on every push to a PR AND on every review-related event, so
# a human who clicks "Resolve conversation" on a P1 thread sees the
# gate go green without needing a push.
#
# Trigger shape note (#257 codex CR): GitHub Actions does NOT document
# `pull_request_review_thread` as a workflow trigger. It exists as a
# webhook event for GitHub Apps, but the Actions
# "events-that-trigger-workflows" reference omits it
# (https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows),
# and adding it to `on:` is a no-op in practice — clicking "Resolve
# conversation" produces no workflow run. To cover the UI-resolve
# case we combine:
#   - pull_request + pull_request_review + pull_request_review_comment
#     for the event-driven path (push, review submit/edit/dismiss,
#     inline comment activity).
#   - schedule (every 15 minutes) as the safety net for the
#     UI-resolve case, since no other event fires when a human
#     clicks "Resolve conversation" on a thread. Same pattern as
#     auto-clear-blocking-labels.yml § scheduled-sweep (#197).
# The schedule job is read-only and idempotent (no-op when no open
# PRs match), so the 15-min cadence is safe to run unconditionally
# across this repo.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  # pull_request_review_comment fires when a reviewer posts (or edits /
  # deletes) an inline diff comment. Catches the case where Codex
  # posts a new P1 mid-review without a fresh review-submission event.
  pull_request_review_comment:
    types: [created, edited, deleted]
  # Review-body acknowledgements live on the PR conversation rather than in
  # a review thread. Re-run when that disposition record changes; ignore plain
  # issues in the job condition below.
  issue_comment:
    types: [created, edited, deleted]
  # Periodic sweep — catches the "human clicks Resolve conversation
  # on a Codex P1 thread" case. The thread-resolution webhook fires
  # but does NOT trigger Actions workflows (no Actions event for it
  # per GitHub docs), so without the schedule the required check
  # would stay red until the next push or manual rerun. 15-min
  # cadence mirrors auto-clear-blocking-labels.yml § scheduled-sweep.
  schedule:
    - cron: "*/15 * * * *"

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read
  # `checks: write` is required for the scheduled sweep and for the
  # issue_comment path. Both post a check_run on the PR head because their
  # native workflow checks are attached elsewhere (schedule/default-branch
  # events); pull_request* events still produce the head check natively.
  checks: write

jobs:
  archive-edited-feedback:
    name: Archive edited reviewer feedback
    if: >-
      github.event_name != 'schedule' &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request)
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.prepare.outputs.pr }}
      head_sha: ${{ steps.prepare.outputs.head_sha }}
      is_fork: ${{ steps.prepare.outputs.is_fork }}
      requires_relay: ${{ steps.prepare.outputs.requires_relay }}
      pr_actor: ${{ steps.prepare.outputs.pr_actor }}
    permissions:
      # Read this run's own creation time so a review-edit archive record is
      # stable across re-runs of the same run id (a wall-clock stamp would
      # re-archive an unchanged payload and stale a valid acknowledgement).
      actions: read
      contents: read
      # Same-repository events normally append directly. Fork and Dependabot
      # events can only upload a handoff artifact; the trusted workflow_run
      # relay owns the write.
      issues: write
      pull-requests: read
    steps:
      - name: Checkout repo (default branch — trusted archive renderer)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1

      - name: Prepare and persist the reviewer-feedback version
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request|pull_request_review|pull_request_review_comment)
              pr=$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")
              head_sha=$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")
              is_fork=$(jq -r '.pull_request.head.repo.fork // false' "$GITHUB_EVENT_PATH")
              pr_actor=$(jq -r '.pull_request.user.login // ""' "$GITHUB_EVENT_PATH")
              ;;
            issue_comment)
              pr=$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")
              pr_json=$(gh api "repos/$REPO/pulls/$pr")
              head_sha=$(jq -r '.head.sha' <<<"$pr_json")
              is_fork=$(jq -r '.head.repo.fork // false' <<<"$pr_json")
              pr_actor=$(jq -r '.user.login // ""' <<<"$pr_json")
              ;;
            *)
              echo "::error::Unsupported archive event: $EVENT_NAME"
              exit 1
              ;;
          esac
          if [ -z "$pr" ] || [ "$pr" = null ] || [ -z "$head_sha" ] || [ "$head_sha" = null ]; then
            echo "::error::Could not bind feedback archival to a PR and head SHA"
            exit 1
          fi
          requires_relay="$is_fork"
          if [ "$pr_actor" = 'dependabot[bot]' ]; then
            requires_relay=true
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "is_fork=$is_fork" >> "$GITHUB_OUTPUT"
          echo "requires_relay=$requires_relay" >> "$GITHUB_OUTPUT"
          echo "pr_actor=$pr_actor" >> "$GITHUB_OUTPUT"

          source_kind=""
          if [ "$EVENT_NAME" = issue_comment ] \
            && { [ "$EVENT_ACTION" = edited ] || [ "$EVENT_ACTION" = deleted ]; }; then
            source_kind=issue-comment
            source_id=$(jq -r '.comment.id' "$GITHUB_EVENT_PATH")
            source_login=$(jq -r '.comment.user.login // ""' "$GITHUB_EVENT_PATH")
            archived_at=$(jq -r '.comment.updated_at // .comment.created_at // ""' "$GITHUB_EVENT_PATH")
          elif [ "$EVENT_NAME" = pull_request_review_comment ] \
            && { [ "$EVENT_ACTION" = edited ] || [ "$EVENT_ACTION" = deleted ]; }; then
            source_kind=inline
            source_id=$(jq -r '.comment.id' "$GITHUB_EVENT_PATH")
            source_login=$(jq -r '.comment.user.login // ""' "$GITHUB_EVENT_PATH")
            archived_at=$(jq -r '.comment.updated_at // .comment.created_at // ""' "$GITHUB_EVENT_PATH")
          elif [ "$EVENT_NAME" = pull_request_review ] && [ "$EVENT_ACTION" = edited ]; then
            source_kind=review-body
            source_id=$(jq -r '.review.id' "$GITHUB_EVENT_PATH")
            source_login=$(jq -r '.review.user.login // ""' "$GITHUB_EVENT_PATH")
            # A review-edit webhook carries no edit timestamp — `submitted_at` is
            # immutable and predates the edit, so it cannot serve as the archive
            # floor. Wall-clock cannot either: re-running this workflow without a
            # further edit would render a DIFFERENT record for the identical
            # payload, advance the evidence floor, and invalidate an
            # acknowledgement that already dispositioned the finding. The run's
            # creation time is stable across attempts of the same run id and
            # still postdates the edit that created the run, so repeated
            # processing of one edit stays idempotent.
            archived_at=$(gh api "repos/$REPO/actions/runs/$GITHUB_RUN_ID" \
              --jq '.created_at')
          fi

          previous_file=$(mktemp "${RUNNER_TEMP}/feedback-previous.XXXXXX")
          archive_records_file=$(mktemp "${RUNNER_TEMP}/feedback-archive-records.XXXXXX")
          payload_file=$(mktemp "${RUNNER_TEMP}/feedback-archive-payload.XXXXXX")
          trap 'rm -f "$previous_file" "$archive_records_file" "$payload_file"' EXIT

          if [ -n "$source_kind" ]; then
            if [ "$EVENT_ACTION" = edited ]; then
              jq -j '.changes.body.from // ""' "$GITHUB_EVENT_PATH" >"$previous_file"
            else
              jq -j '.comment.body // ""' "$GITHUB_EVENT_PATH" >"$previous_file"
            fi
            # The renderer emits one v1 record or a complete set of chunked v2
            # records when the full prior body cannot fit in one comment.
            scripts/render-feedback-archive.sh \
              "$source_kind" "$source_id" "$source_login" "$archived_at" "$previous_file" \
              >"$archive_records_file"
          fi

          if [ "$requires_relay" != true ] && [ -s "$archive_records_file" ]; then
            existing=$(gh api --paginate "repos/$REPO/issues/$pr/comments" | jq -s 'add // []')
            while IFS= read -r archive_record; do
              [ -n "$archive_record" ] || continue
              if jq -e --arg body "$archive_record" 'any(.[]; (.body // "") == $body)' \
                <<<"$existing" >/dev/null; then
                echo "Feedback archive record already persisted for $source_kind $source_id."
                continue
              fi
              jq -n --arg body "$archive_record" '{body:$body}' >"$payload_file"
              posted=$(gh api --method POST "repos/$REPO/issues/$pr/comments" \
                --input "$payload_file")
              existing=$(printf '%s\n%s\n' "$existing" "$posted" | jq -cs '.[0] + [.[1]]')
              echo "Archived one reviewer-feedback record for $source_kind $source_id."
            done <"$archive_records_file"
          fi

          if [ "$requires_relay" = true ]; then
            jq -n \
              --rawfile archive_records "$archive_records_file" \
              --arg repo "$REPO" --argjson pr "$pr" --arg head_sha "$head_sha" \
              --argjson source_run_id "$SOURCE_RUN_ID" --arg event_name "$EVENT_NAME" \
              --argjson is_fork "$is_fork" --arg pr_actor "$pr_actor" \
              '{version:1,repo:$repo,pr:$pr,head_sha:$head_sha,source_run_id:$source_run_id,event_name:$event_name,is_fork:$is_fork,requires_relay:true,pr_actor:$pr_actor,archive_records:($archive_records | split("\n") | map(select(length > 0)))}' \
              >"$RUNNER_TEMP/codex-p1-read-only-handoff.json"
          fi

      - name: Upload trusted-relay handoff for a read-only PR event
        if: steps.prepare.outputs.requires_relay == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: codex-p1-read-only-handoff-${{ steps.prepare.outputs.pr }}
          path: ${{ runner.temp }}/codex-p1-read-only-handoff.json
          if-no-files-found: error
          retention-days: 1

  codex-p1-gate:
    # A fork- or Dependabot-triggered run cannot publish the trusted required
    # check. Give its native job a distinct, non-required name; the
    # workflow_run relay is the only publisher of the required context.
    name: >-
      ${{ needs.archive-edited-feedback.outputs.requires_relay == 'true' &&
      'Codex P1 read-only archive handoff' || 'Codex P1 unresolved threads' }}
    needs: [archive-edited-feedback]
    runs-on: ubuntu-latest
    # Deliberately no Actions concurrency block. GitHub cancels the queued
    # member when a third event arrives even with cancel-in-progress:false,
    # leaving a cancelled native required check that no API write can retire
    # (#843). Ordered publication comes from the two-phase check lease below.
    # Event-driven path. The scheduled sweep below runs the same
    # gate but on every open PR via the Checks API; gating this job
    # to non-schedule events avoids paying for an empty no-op run.
    if: >-
      always() &&
      github.event_name != 'schedule' &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request)
    steps:
      - name: Open the PR-head check lease
        id: open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CHECK_NAME: "Codex P1 unresolved threads"
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ needs.archive-edited-feedback.outputs.pr }}
          HEAD_SHA: ${{ needs.archive-edited-feedback.outputs.head_sha }}
          IS_FORK: ${{ needs.archive-edited-feedback.outputs.is_fork }}
          REQUIRES_RELAY: ${{ needs.archive-edited-feedback.outputs.requires_relay }}
        run: |
          set -uo pipefail
          pr="$PR_NUMBER"
          head_sha="$HEAD_SHA"
          is_fork="$IS_FORK"
          requires_relay="$REQUIRES_RELAY"
          if [ -z "$pr" ] || [ "$pr" = null ] || [ -z "$head_sha" ] || [ "$head_sha" = null ]; then
            # The archive job failed before its prepare step published the PR
            # binding — a checkout failure, or the issue_comment path's PR API
            # read. Exiting here is not enough: on issue_comment (and the other
            # default-branch events) this job's NATIVE check attaches to the
            # default branch, not the PR head, so a bare failure leaves the
            # older successful "Codex P1 unresolved threads" check authoritative
            # on an unchanged PR head until the 15-minute sweep. Recover the PR
            # head from the webhook payload — which is independent of the failed
            # job's outputs — and publish the PR-head failure ourselves, the same
            # always-run posture the relay uses for a missing handoff. Publishing
            # a terminal failure can supersede a newer generation, but failing
            # closed is the safe direction and the sweep republishes the truth.
            echo "::error::Could not bind the gate lease to a PR number and head SHA"
            recovered_head=""
            recovered_fork=false
            recovered_actor=""
            case "$EVENT_NAME" in
              pull_request|pull_request_review|pull_request_review_comment)
                recovered_head=$(jq -r '.pull_request.head.sha // ""' "$GITHUB_EVENT_PATH")
                recovered_fork=$(jq -r '.pull_request.head.repo.fork // false' "$GITHUB_EVENT_PATH")
                recovered_actor=$(jq -r '.pull_request.user.login // ""' "$GITHUB_EVENT_PATH")
                ;;
              issue_comment)
                recovered_pr=$(jq -r '.issue.number // ""' "$GITHUB_EVENT_PATH")
                recovered_json=""
                if [ -n "$recovered_pr" ] && [ "$recovered_pr" != null ]; then
                  recovered_json=$(gh api "repos/$REPO/pulls/$recovered_pr" 2>/dev/null) \
                    || recovered_json=""
                fi
                if [ -n "$recovered_json" ]; then
                  recovered_head=$(jq -r '.head.sha // ""' <<<"$recovered_json")
                  recovered_fork=$(jq -r '.head.repo.fork // false' <<<"$recovered_json")
                  recovered_actor=$(jq -r '.user.login // ""' <<<"$recovered_json")
                fi
                ;;
            esac
            requires_relay="$recovered_fork"
            if [ "$recovered_actor" = 'dependabot[bot]' ]; then
              requires_relay=true
            fi
            # Recompute the read-only boundary before writing anything. A fork
            # or Dependabot run holds a read-only token, and its missing handoff
            # already publishes the PR-head failure from the trusted relay.
            if [ "$requires_relay" = true ]; then
              echo "Read-only PR event: the trusted workflow_run relay publishes the PR-head failure for the missing handoff."
              exit 0
            fi
            case "$recovered_head" in
              [0-9a-f]*)
                summary="The reviewer-feedback archive job failed before it could bind this run to a PR head, so the feedback history for $recovered_head was never evaluated. Rerun the Codex P1 Gate workflow; the scheduled sweep also re-evaluates every 15 minutes."
                gh api --method POST "repos/$REPO/check-runs" \
                  -f name="$CHECK_NAME" -f head_sha="$recovered_head" \
                  -f status=completed -f conclusion=failure \
                  -f "output[title]=Codex feedback gate — reviewer-feedback archive did not publish its PR binding" \
                  -f "output[summary]=$summary" >/dev/null \
                  || echo "::error::Could not publish the PR-head failure on $recovered_head"
                ;;
              *)
                echo "::error::Could not recover a PR head from the $EVENT_NAME payload; no PR-head failure published"
                ;;
            esac
            exit 1
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "is_fork=$is_fork" >> "$GITHUB_OUTPUT"
          echo "requires_relay=$requires_relay" >> "$GITHUB_OUTPUT"

          # The native job deliberately carries a non-required name on this
          # path. Do not even attempt a privileged lease with a token whose
          # trust boundary requires the default-branch workflow_run relay.
          if [ "$requires_relay" = true ]; then
            echo "Read-only PR event will publish through the trusted workflow_run relay."
            exit 0
          fi

          # POST one in-progress generation before evaluation, then PATCH this
          # exact id in phase 2. An older run can finish after a newer event,
          # but updating its older generation cannot supersede the newer
          # generation the event opened. This is the lease/fence that plain
          # job concurrency cannot safely provide for a required check.
          id=""
          for attempt in 1 2 3; do
            id=$(gh api -X POST "repos/$REPO/check-runs" \
              -f name="$CHECK_NAME" \
              -f head_sha="$head_sha" \
              -f status="in_progress" \
              -f "output[title]=Codex feedback gate (re-evaluation in progress)" \
              -f "output[summary]=Evaluating complete reviewer-feedback history on $head_sha." \
              --jq .id 2>/dev/null) && [ -n "$id" ] && break
            id=""
            sleep $((attempt * 5))
          done
          if [ -z "$id" ]; then
            echo "::error::Could not open the required PR-head check lease"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Fail closed when the feedback archive did not complete
        if: >-
          needs.archive-edited-feedback.result == 'failure' ||
          needs.archive-edited-feedback.result == 'cancelled'
        run: |
          echo "::error::Reviewer-feedback archive did not complete; the prior comment body may be unrecoverable."
          exit 1

      - name: Defer read-only evaluation to the trusted archive relay
        if: steps.open.outputs.requires_relay == 'true'
        run: |
          echo "Read-only handoff uploaded; the trusted workflow_run archive relay exclusively publishes the required PR-head check."

      - name: Checkout repo (default branch — trusted gate script)
        if: steps.open.outputs.requires_relay != 'true'
        # Pin to the default branch, NOT the PR HEAD. The gate is a
        # REQUIRED status check: if it ran scripts/codex-p1-gate.sh
        # from the PR's own checkout, a PR could edit that script to
        # `exit 0`, satisfy the required check, and merge past
        # unresolved Codex P1 threads in the window before the
        # scheduled sweep re-evaluates. "Read-only" (no label writes)
        # does NOT mean "can't be weaponized" — satisfying a required
        # check IS the weaponization. The gate script doesn't need the
        # PR diff anyway: it takes a PR number + repo and queries the
        # GitHub API. Same trusted-checkout posture as the scheduled-
        # sweep job below. (Codex P1, #271.)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          # persist-credentials: false (#545 review / zizmor artipacked):
          # this job only runs the API-driven scripts/codex-p1-gate.sh — it
          # never pushes or uses the workspace git remote, so no token needs
          # to linger in .git/config.
          persist-credentials: false
          # Shallow checkout (#536): this job only runs
          # scripts/codex-p1-gate.sh, which is API-driven (takes a PR
          # number + repo and queries the GitHub API) — it never reads
          # git history. `fetch-depth: 0` cloned the entire history for
          # nothing; the default depth-1 checkout is sufficient for the
          # trusted gate script.
          fetch-depth: 1

      - name: Run scripts/codex-p1-gate.sh
        if: steps.open.outputs.requires_relay != 'true'
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.open.outputs.pr }}
          REPO: ${{ github.repository }}
          EXPECTED_HEAD_SHA: ${{ steps.open.outputs.head_sha }}
        run: |
          set -euo pipefail
          # The script is the source of truth for what blocks merge.
          # Exit codes:
          #   0 = all feedback accounted and no unresolved required-tier
          #       threads on HEAD (or the legacy thread scan is disabled)
          #   1 = feedback unaccounted or unresolved required-tier threads
          #   2 = config / usage error (CI failure, not a gate block)
          fingerprint_available=false
          if [ ! -x scripts/review-feedback-surface-fingerprint.sh ]; then
            # One bootstrap exception is required while the introducing PR's
            # trusted default branch predates both the helper and its manifest
            # entry. Once the manifest declares the helper, absence is an
            # infrastructure failure rather than a silent fence downgrade.
            if grep -Fq 'path: scripts/review-feedback-surface-fingerprint.sh' \
              .mergepath-sync.yml; then
              echo "::error::Installed feedback-fingerprint helper is missing or not executable"
              exit 1
            fi
            echo "::warning::Feedback-fingerprint helper is not installed on the trusted default branch yet; allowing only the manifest-absent bootstrap window"
            feedback_fp_before="bootstrap-unavailable"
          else
            fingerprint_available=true
            feedback_fp_before=$(scripts/review-feedback-surface-fingerprint.sh \
              "$PR_NUMBER" "$REPO")
          fi
          set +e
          output=$(CODEX_P1_EXPECTED_HEAD_SHA="$EXPECTED_HEAD_SHA" \
            scripts/codex-p1-gate.sh "$PR_NUMBER" "$REPO" 2>&1)
          rc=$?
          set -e
          echo "$output"
          feedback_fp_after="$feedback_fp_before"
          if [ "$fingerprint_available" = true ]; then
            feedback_fp_after=$(scripts/review-feedback-surface-fingerprint.sh \
              "$PR_NUMBER" "$REPO")
            if [ "$feedback_fp_after" != "$feedback_fp_before" ]; then
              output="${output}"$'\n'"Feedback changed during gate evaluation; refusing the stale result."
              rc=2
            fi
          fi

          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # Hand the closing step the exact feedback surface this decision was
          # computed over. That step re-reads the fingerprint immediately before
          # it publishes, so a finding landing in the gap between this step and
          # that PATCH cannot be published over (#1000 Codex P1).
          echo "fingerprint_available=$fingerprint_available" >> "$GITHUB_OUTPUT"
          echo "feedback_fp=$feedback_fp_after" >> "$GITHUB_OUTPUT"
          printf '%s' "${output:0:60000}" > "$RUNNER_TEMP/codex-p1-summary.txt"
          if [ "$rc" -eq 2 ]; then
            echo "::error::codex-p1-gate.sh exited 2 (config/usage error)"
            exit 1
          fi
          exit "$rc"

      - name: Close the PR-head check lease
        if: ${{ !cancelled() && steps.open.outputs.id != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.open.outputs.pr }}
          HEAD_SHA: ${{ steps.open.outputs.head_sha }}
          CHECK_ID: ${{ steps.open.outputs.id }}
          ARCHIVE_RESULT: ${{ needs.archive-edited-feedback.result }}
          GATE_RC: ${{ steps.gate.outputs.rc }}
          FINGERPRINT_AVAILABLE: ${{ steps.gate.outputs.fingerprint_available }}
          FEEDBACK_FP: ${{ steps.gate.outputs.feedback_fp }}
        run: |
          set -uo pipefail
          conclusion=failure
          title="Codex feedback gate — evaluation failed closed"
          if [ "$ARCHIVE_RESULT" = failure ] || [ "$ARCHIVE_RESULT" = cancelled ]; then
            title="Codex feedback gate — reviewer-feedback archive failed"
          elif [ "$GATE_RC" = 0 ]; then
            conclusion=success
            title="Codex feedback gate (leased re-evaluation)"
          elif [ "$GATE_RC" = 1 ]; then
            title="Codex feedback gate (leased re-evaluation)"
          elif [ -n "$GATE_RC" ]; then
            title="Codex feedback gate — infra/config error (rc=$GATE_RC)"
          fi

          current=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.sha' 2>/dev/null || true)
          if [ "$current" != "$HEAD_SHA" ]; then
            conclusion=failure
            title="Codex feedback gate — head moved during evaluation"
          fi

          # Revalidate the feedback surface INSIDE the publishing step. The
          # gate step's final fingerprint read happens a step earlier, and the
          # head re-read above cannot stand in for it: a bot PR-level finding
          # moves no SHA, so it lands in that gap invisibly and this PATCH
          # publishes success over it. The run that finding triggers cannot
          # re-protect the head in time either — on issue_comment (and every
          # other default-branch event) this job's native check attaches to the
          # default branch, so the head is unprotected until the new run's
          # archive dependency finishes and opens the next lease. The required
          # context is green for that whole window and auto-merge can fire with
          # the finding unaccounted (#1000 Codex P1). Only a success needs the
          # re-read; a failure conclusion cannot be made less safe by drift.
          drift_note=""
          if [ "$conclusion" = success ] && [ "$FINGERPRINT_AVAILABLE" = true ]; then
            feedback_fp_publish=$(scripts/review-feedback-surface-fingerprint.sh \
              "$PR_NUMBER" "$REPO" 2>/dev/null || true)
            if [ -z "$feedback_fp_publish" ] || [ "$feedback_fp_publish" != "$FEEDBACK_FP" ]; then
              conclusion=failure
              title="Codex feedback gate — feedback changed before publication"
              drift_note=$'\n'"Feedback changed between gate evaluation and publication, or the surface could not be re-read; refusing the stale clearance. The next event or the 15-minute sweep re-evaluates $HEAD_SHA."
            fi
          fi
          summary=$(cat "$RUNNER_TEMP/codex-p1-summary.txt" 2>/dev/null || printf '%s' "$title")
          summary="${summary}${drift_note}"
          for attempt in 1 2 3; do
            gh api -X PATCH "repos/$REPO/check-runs/$CHECK_ID" \
              -f status="completed" \
              -f conclusion="$conclusion" \
              -f "output[title]=$title" \
              -f "output[summary]=$summary" >/dev/null && exit 0
            sleep $((attempt * 5))
          done
          echo "::warning::Could not close check lease $CHECK_ID; it remains pending until a newer event or sweep supersedes it"
          exit 0

  scheduled-sweep:
    name: Codex P1 scheduled sweep
    # Periodic re-evaluation across every open PR. Required because:
    #   - GitHub Actions does NOT support pull_request_review_thread
    #     as a workflow trigger (see top-of-file comment + #257).
    #   - When a human clicks "Resolve conversation" on a Codex P1
    #     thread, no Actions event fires — so the required check
    #     `Codex P1 unresolved threads` stays red on the PR's head
    #     SHA until a push or manual rerun.
    # This sweep walks every open PR, runs the same gate script, and
    # posts a fresh check_run on each PR's head SHA via the Checks
    # API. Required-check resolution keys on (head_sha, name), so the
    # new check supersedes the stale red one. Idempotent: no-op when
    # the gate result is unchanged.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # No Actions concurrency here either. Each PR gets its own in-progress
    # check generation and this sweep PATCHes only that generation, so an
    # overlapping newer sweep or event remains newer regardless of finish order.
    steps:
      - name: Checkout repo (default branch — trusted scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          # persist-credentials: false (#545 review / zizmor artipacked):
          # this job only runs the API-driven scripts/codex-p1-gate.sh — it
          # never pushes or uses the workspace git remote, so no token needs
          # to linger in .git/config.
          persist-credentials: false
          # Shallow checkout (#536): the scheduled sweep also only runs
          # the API-driven scripts/codex-p1-gate.sh per open PR (listed
          # via `gh pr list`, head SHA via `gh api`). No git history is
          # read, so the full-history clone was pure overhead.
          fetch-depth: 1

      - name: Find open PRs
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # List ALL open PRs. The gate script itself short-circuits
          # when codex.p1_gate.enabled=false, so we don't filter by
          # label here. `--limit 500` mirrors auto-clear-blocking-
          # labels.yml's bound (well above any realistic open-PR
          # count for a single repo).
          if ! prs_raw=$(gh pr list --repo "$REPO" --state open \
            --limit 500 --json number --jq '.[].number'); then
            echo "::error::Failed to list open PRs on $REPO"
            exit 1
          fi
          if [ -z "$prs_raw" ]; then
            echo "No open PRs on $REPO; sweep is a no-op."
            echo "prs=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo 'prs<<EOF'
            printf '%s\n' "$prs_raw"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Re-evaluate gate per PR and post check_run
        if: steps.find.outputs.prs != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRS: ${{ steps.find.outputs.prs }}
          REPO: ${{ github.repository }}
          # Check name MUST match the event-driven job name above so
          # branch protection's required-check entry resolves either
          # source as the same gate. GitHub keys required checks on
          # (head_sha, name); a fresh check_run with the same name
          # supersedes the stale one.
          CHECK_NAME: "Codex P1 unresolved threads"
        run: |
          set -euo pipefail
          had_infra_error=0
          MAX_RELAY_SOURCE_RUNS=1000
          fingerprint_available=false
          if [ ! -x scripts/review-feedback-surface-fingerprint.sh ]; then
            if grep -Fq 'path: scripts/review-feedback-surface-fingerprint.sh' \
              .mergepath-sync.yml; then
              echo "::error::Installed feedback-fingerprint helper is missing or not executable"
              exit 1
            fi
            echo "::warning::Feedback-fingerprint helper is not installed on the trusted default branch yet; allowing only the manifest-absent bootstrap window"
          else
            fingerprint_available=true
          fi
          while IFS= read -r PR; do
            [ -z "$PR" ] && continue
            echo "::group::Sweep PR #$PR"

            # Look up the PR's head SHA so the check_run lands on the
            # branch-protection-relevant commit (NOT the schedule's
            # default-branch HEAD).
            pr_json=$(gh api "repos/$REPO/pulls/$PR")
            head_sha=$(jq -r '.head.sha' <<<"$pr_json")
            is_fork=$(jq -r '.head.repo.fork // false' <<<"$pr_json")
            pr_actor=$(jq -r '.user.login // ""' <<<"$pr_json")
            requires_relay="$is_fork"
            if [ "$pr_actor" = 'dependabot[bot]' ]; then
              requires_relay=true
            fi
            pr_created_at=$(jq -r '.created_at // ""' <<<"$pr_json")
            if [ -z "$head_sha" ] || [ "$head_sha" = "null" ]; then
              echo "::error::Could not resolve head SHA for PR #$PR; cannot open a fail-closed lease"
              had_infra_error=1
              echo "::endgroup::"
              continue
            fi

            check_id=""
            for attempt in 1 2 3; do
              check_id=$(gh api -X POST "repos/$REPO/check-runs" \
                -f name="$CHECK_NAME" \
                -f head_sha="$head_sha" \
                -f status="in_progress" \
                -f "output[title]=Codex P1 gate (scheduled re-evaluation in progress)" \
                -f "output[summary]=Evaluating complete reviewer-feedback history on $head_sha." \
                --jq .id 2>/dev/null) && [ -n "$check_id" ] && break
              check_id=""
              sleep $((attempt * 5))
            done
            if [ -z "$check_id" ]; then
              echo "::error::Could not open the scheduled check lease for PR #$PR"
              had_infra_error=1
              echo "::endgroup::"
              continue
            fi

            relay_pending=false
            relay_scan_error=false
            if [ "$requires_relay" = true ]; then
              source_runs='[]'
              # Scheduled runs and other PRs share this workflow. Query only
              # event kinds that can produce this PR's relay handoff, then
              # apply the fail-closed bound after filtering to its exact run
              # title. GitHub caps any filtered workflow-run query at 1,000
              # results, so recursively split a saturated time window before
              # accepting it as complete. Unrelated traffic never consumes
              # the final matching-run bound.
              scan_source_window() {
                local source_event="$1" window_start="$2" window_end="$3"
                local start_iso end_iso source_page source_page_json source_total
                local midpoint page_runs source_count
                [ "$relay_scan_error" != true ] || return 0
                start_iso=$(date -u -d "@$window_start" +%Y-%m-%dT%H:%M:%SZ)
                end_iso=$(date -u -d "@$window_end" +%Y-%m-%dT%H:%M:%SZ)
                if ! source_page_json=$(gh api --method GET \
                  "repos/$REPO/actions/workflows/codex-p1-gate.yml/runs" \
                  -f per_page=100 -f page=1 -f event="$source_event" \
                  -f created="$start_iso..$end_iso"); then
                  relay_scan_error=true
                  return 0
                fi
                source_total=$(jq -r '.total_count // 0' <<<"$source_page_json")
                if [ "$source_total" -ge "$MAX_RELAY_SOURCE_RUNS" ]; then
                  if [ "$window_start" -ge "$window_end" ]; then
                    echo "::error::Read-only relay source scan saturated the GitHub API ceiling within one second for PR #$PR"
                    relay_scan_error=true
                    return 0
                  fi
                  midpoint=$((window_start + (window_end - window_start) / 2))
                  scan_source_window "$source_event" "$window_start" "$midpoint"
                  scan_source_window "$source_event" "$((midpoint + 1))" "$window_end"
                  return 0
                fi

                source_page=1
                while :; do
                  if [ "$source_page" -gt 1 ]; then
                    if ! source_page_json=$(gh api --method GET \
                      "repos/$REPO/actions/workflows/codex-p1-gate.yml/runs" \
                      -f per_page=100 -f page="$source_page" -f event="$source_event" \
                      -f created="$start_iso..$end_iso"); then
                      relay_scan_error=true
                      return 0
                    fi
                  fi
                  page_runs=$(jq -c --arg title "Codex P1 Gate relay-v1 PR #$PR" \
                    '[.workflow_runs[] | select(.display_title == $title) | .id]' \
                    <<<"$source_page_json")
                  source_runs=$(printf '%s\n%s\n' "$source_runs" "$page_runs" \
                    | jq -cs '.[0] + .[1]')
                  source_count=$(jq 'length' <<<"$source_runs")
                  if [ "$source_count" -ge "$MAX_RELAY_SOURCE_RUNS" ]; then
                    echo "::error::Read-only relay matching source run scan exceeded the fail-closed bound of $MAX_RELAY_SOURCE_RUNS for PR #$PR"
                    relay_scan_error=true
                    return 0
                  fi
                  [ $((source_page * 100)) -ge "$source_total" ] && break
                  source_page=$((source_page + 1))
                done
              }

              if ! scan_start_epoch=$(date -u -d "$pr_created_at" +%s) \
                || ! scan_end_epoch=$(date -u +%s); then
                relay_scan_error=true
              else
                for source_event in pull_request pull_request_review pull_request_review_comment issue_comment; do
                  scan_source_window "$source_event" "$scan_start_epoch" "$scan_end_epoch"
                  [ "$relay_scan_error" != true ] || break
                done
              fi
              if [ "$relay_scan_error" != true ]; then
                if ! relay_comments=$(gh api --paginate \
                  "repos/$REPO/issues/$PR/comments" | jq -s 'add // []'); then
                  relay_scan_error=true
                else
                  terminal_runs=$(printf '%s' "$relay_comments" | jq -c '[
                    .[] | select(.user.login == "github-actions[bot]") | .body // ""
                    | try capture("^<!-- mergepath-feedback-archive-relay:v1 run=(?<run>[0-9]+) status=(?<status>complete|failed) -->$").run
                      catch empty
                    | tonumber
                  ]')
                  if jq -e --argjson terminal "$terminal_runs" \
                    'any(.[] as $run; ($terminal | index($run)) == null)' \
                    <<<"$source_runs" >/dev/null; then
                    relay_pending=true
                  fi
                fi
              fi
            fi

            if [ "$relay_scan_error" = true ]; then
              output="Trusted read-only feedback-archive source run scan failed closed."
              rc=2
              had_infra_error=1
            elif [ "$relay_pending" = true ]; then
              output="Trusted read-only feedback-archive relay is still pending; refusing scheduled clearance."
              rc=1
            else
              feedback_fp_before="bootstrap-unavailable"
              if [ "$fingerprint_available" = true ]; then
                feedback_fp_before=$(scripts/review-feedback-surface-fingerprint.sh \
                  "$PR" "$REPO")
              fi
              set +e
              output=$(scripts/codex-p1-gate.sh "$PR" "$REPO" 2>&1)
              rc=$?
              set -e
              echo "$output"

              feedback_fp_after="$feedback_fp_before"
              if [ "$fingerprint_available" = true ]; then
                feedback_fp_after=$(scripts/review-feedback-surface-fingerprint.sh \
                  "$PR" "$REPO")
                if [ "$feedback_fp_after" != "$feedback_fp_before" ]; then
                  output="${output}"$'\n'"Feedback changed while PR #$PR was evaluated; closing this generation as failure."
                  rc=2
                  had_infra_error=1
                fi
              fi
            fi

            check_title="Codex P1 gate (scheduled leased re-evaluation)"
            case "$rc" in
              0) conclusion="success" ;;
              1) conclusion="failure" ;;
              *)
                echo "::error::codex-p1-gate.sh rc=$rc on PR #$PR (config/usage error)"
                had_infra_error=1
                conclusion="failure"
                check_title="Codex P1 gate — infra/config error (rc=$rc)"
                ;;
            esac

            current_head=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha' 2>/dev/null || true)
            if [ "$current_head" != "$head_sha" ]; then
              conclusion="failure"
              check_title="Codex P1 gate — head moved during scheduled evaluation"
              had_infra_error=1
            fi

            # Same revalidation the event-driven publisher performs, for the
            # same reason: the post-evaluation fingerprint above is separated
            # from the PATCH below by the head re-read, and a PR-level finding
            # that lands in that gap moves no SHA. Re-read the surface with the
            # publication rather than with the evaluation, so a success is
            # never published over a finding this generation never saw
            # (#1000 Codex P1).
            if [ "$conclusion" = success ] && [ "$fingerprint_available" = true ]; then
              feedback_fp_publish=$(scripts/review-feedback-surface-fingerprint.sh \
                "$PR" "$REPO" 2>/dev/null || true)
              if [ -z "$feedback_fp_publish" ] \
                || [ "$feedback_fp_publish" != "${feedback_fp_after:-}" ]; then
                conclusion="failure"
                check_title="Codex P1 gate — feedback changed before scheduled publication"
                output="${output}"$'\n'"Feedback changed before scheduled publication, or the surface could not be re-read; refusing the stale clearance."
                had_infra_error=1
              fi
            fi

            # Truncate to stay under GitHub's 65535-char summary limit.
            # Bash slice, NOT `printf | head -c`: under `set -euo pipefail`
            # a >60KB output makes head close the pipe early, printf takes
            # SIGPIPE (141), pipefail propagates it, and `summary=$(...)`
            # aborts the sweep BEFORE the check_run POST — fail-open on the
            # UI-resolve path this sweep exists to close. Slicing is
            # pipefail-safe + char-based (same fix as merge-clearance-gate.yml;
            # Codex P2 on the b10671e propagation wave).
            summary="${output:0:60000}"

            # Close only the generation opened above. PATCH preserves its
            # creation order: if a newer event or sweep opened another lease
            # while this evaluation ran, this older completion cannot become
            # the newest required-check generation even when it finishes last.
            if ! gh api -X PATCH "repos/$REPO/check-runs/$check_id" \
              -f status="completed" \
              -f conclusion="$conclusion" \
              -f "output[title]=$check_title" \
              -f "output[summary]=$summary" \
              >/dev/null; then
              echo "::error::Failed to close check lease $check_id for PR #$PR; it remains pending"
              had_infra_error=1
            fi
            echo "::endgroup::"
          done <<<"$PRS"
          if [ "$had_infra_error" -ne 0 ]; then
            echo "::error::Sweep finished with one or more infra errors"
            exit 1
          fi
