name: Dependabot Auto-merge
# Existing approval and merge duties use separate protected environments.
# Only inert PR/full-head/base metadata crosses; the author repeats all gates.
# Owner provisioning: store AUTHOR_MERGE_TOKEN only under
# Settings → Environments → merge-queue-policy → Environment secrets,
# never as a repository or organization secret. The protected environment
# retains exactly AUTHOR_MERGE_TOKEN, MERGE_QUEUE_POLICY_TOKEN and
# MERGE_QUEUE_SOURCE_TOKEN, pairwise distinct; the reviewer credential belongs
# separately in reviewer-maintenance. Protect/read back before source activation;
# provision afterward under the owner-run sequence. This workflow grants no
# authority to create settings or enable a queue.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  approve:
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      && github.ref == 'refs/heads/main'
      && github.event.repository.default_branch == 'main'
      && github.event.pull_request.base.repo.full_name == github.repository
      && github.event.pull_request.base.ref == 'main'
    environment: reviewer-maintenance
    permissions:
      contents: read
      pull-requests: write # existing provenance-failure protective disable under GITHUB_TOKEN
      issues: read
    outputs:
      repo: ${{ steps.approve.outputs.repo }}
      pr: ${{ steps.approve.outputs.pr }}
      head: ${{ steps.approve.outputs.head }}
      base: ${{ steps.approve.outputs.base }}
      base_ref: ${{ steps.approve.outputs.base_ref }}
    steps:
      - name: Checkout trusted main source, never the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify Dependabot commit provenance
        id: provenance
        run: |
          set -euo pipefail
          for lib in scripts/lib/gh-api-array.sh scripts/lib/dependabot-commit-provenance.sh; do
            if [ ! -r "$lib" ]; then
              echo "::error::$lib is missing from the base checkout; refusing Dependabot auto-merge because commit provenance cannot be verified. Propagate the scripts/lib kit, then rerun."
              echo "trusted=false" >>"$GITHUB_OUTPUT"
              exit 1
            fi
          done
          # shellcheck source=/dev/null
          . scripts/lib/gh-api-array.sh
          # shellcheck source=/dev/null
          . scripts/lib/dependabot-commit-provenance.sh

          rc=0
          dependabot_commit_provenance "$GITHUB_REPOSITORY" "$PR_NUMBER" "$PR_HEAD_SHA" || rc=$?
          case "$rc" in
            0)
              echo "::notice::Dependabot provenance verified on $PR_HEAD_SHA: $DEPENDABOT_PROVENANCE_REASON"
              echo "trusted=true" >>"$GITHUB_OUTPUT"
              ;;
            1)
              echo "::warning::PR is not Dependabot-only ($DEPENDABOT_PROVENANCE_REASON); skipping Dependabot auto-approve/merge. It needs ordinary review."
              echo "trusted=false" >>"$GITHUB_OUTPUT"
              armed=$(gh pr view "$PR_URL" --json autoMergeRequest --jq 'if .autoMergeRequest == null then "false" else "true" end')
              if [ "$armed" = "true" ]; then
                gh pr merge --disable-auto "$PR_URL"
                echo "::warning::Withdrew the auto-merge request armed on an earlier Dependabot-only head."
              fi
              ;;
            *)
              echo "::error::Could not verify Dependabot commit provenance on $PR_HEAD_SHA: $DEPENDABOT_PROVENANCE_REASON. Refusing auto-merge."
              echo "trusted=false" >>"$GITHUB_OUTPUT"
              exit 1
              ;;
          esac
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Reads the PR commits and, only on a failed verdict, withdraws a
          # stale auto-merge request. Both are covered by this workflow's own
          # `permissions:` block, so no external PAT is involved here.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch Dependabot metadata
        id: metadata
        if: steps.provenance.outputs.trusted == 'true'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Approve eligible Dependabot update
        id: approve
        if: |
          steps.provenance.outputs.trusted == 'true' && (
            steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
            steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
            steps.metadata.outputs.dependency-group == 'dev-dependencies'
          )
        env:
          GH_TOKEN: ${{ secrets.REVIEWER_ASSIGNMENT_TOKEN }}
          WORKFLOW_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPENDENCY_GROUP: ${{ steps.metadata.outputs.dependency-group }}
        run: bash scripts/workflow/dependabot-approved-merge.sh approve

  auto-merge:
    needs: approve
    runs-on: ubuntu-latest
    if: >-
      needs.approve.result == 'success' && needs.approve.outputs.head != ''
      && github.ref == 'refs/heads/main'
      && github.event.repository.default_branch == 'main'
      && github.event.pull_request.base.repo.full_name == github.repository
      && github.event.pull_request.base.ref == 'main'
    # Exact existing three-secret environment; no reviewer/App credential.
    environment: merge-queue-policy
    permissions:
      actions: read # authenticates accounting relay workflow/job/log evidence
      contents: write
      pull-requests: write
      issues: read
      security-events: read # accounting reads CodeQL findings under GITHUB_TOKEN
    steps:
      - name: Checkout trusted main source, never the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Classification is re-read; no approved/cleared boolean or update
      # classification from the reviewer job authorizes the author writer.
      - name: Fetch Dependabot metadata again
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Merge only an independently verified approved head
        env:
          GH_TOKEN: ${{ secrets.AUTHOR_MERGE_TOKEN }}
          WORKFLOW_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.approve.outputs.pr }}
          PR_HEAD_SHA: ${{ needs.approve.outputs.head }}
          PR_BASE_SHA: ${{ needs.approve.outputs.base }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPENDENCY_GROUP: ${{ steps.metadata.outputs.dependency-group }}
          REQUIRED_HEAD_CHECK_NAME: lint
        run: bash scripts/workflow/dependabot-approved-merge.sh merge
