# Note: CodeRabbit (Phase 2.5) is handled by the CodeRabbit GitHub App
# and does not require a CI workflow step. It runs automatically when
# installed on the repo. See .github/review-policy.yml for enablement.
name: Agent Review Pipeline

on:
  pull_request:
    # `synchronize` (every push on an open PR) is in the list so
    # `load-config` re-parses `.github/review-policy.yml` on every
    # commit, not just on `opened` / `ready_for_review`. Without it,
    # a shell-parser regression can land on main and only surface
    # weeks later when the next PR happens to be opened. See #59.
    # `reopened` is included so the approval-readiness path (#495) actually
    # fires: the job `if:` matches `synchronize || reopened`, but a reopened
    # event reaches this workflow only when subscribed here.
    # `unlabeled` is the #620 readiness retry: on an over-threshold PR with a
    # carried-over approval, update-branch makes triage re-apply
    # needs-external-review, the live label re-verify sees it
    # and hard-fails (correctly), and auto-clear removes the label moments
    # later once the clearance gate passes — with no trigger on the removal,
    # the PR sat CLEAN-but-unmerged until a human reran the failed job.
    # `edited` re-evaluates carried approvals after mutable PR metadata or the
    # base branch changes, but it does not itself report readiness (#1094).
    types: [opened, ready_for_review, labeled, synchronize, reopened, edited, unlabeled]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write

# #1094: mutable PR events share one latest-state enforcement group, but every
# APPROVED webhook gets a review-ID group and is never cancelled. The reviews
# API can lag a webhook; cancelling approval A when approval B arrives could
# therefore let B's replacement run miss A entirely. A's durable run keeps its
# own payload fallback and will classify/dismiss it. GitHub also evicts an
# older PENDING member of a shared group even when cancel-in-progress is false,
# so events that skip the guard use a run-unique group. COMMENTED reviews and
# unrelated label events can neither cancel nor replace enforcement; only the
# needs-external-review force-on label joins mutable approval enforcement.
concurrency:
  group: >-
    agent-review-${{ github.event.pull_request.number }}-${{
      ((github.event_name == 'pull_request_review' &&
        github.event.review.state == 'approved' &&
        format('approval-{0}', github.event.review.id)) ||
       ((github.event_name == 'pull_request' &&
         (github.event.action == 'synchronize' ||
          github.event.action == 'reopened' ||
          github.event.action == 'edited' ||
          (github.event.action == 'labeled' &&
           github.event.label.name == 'needs-external-review') ||
          (github.event.action == 'unlabeled' &&
           contains(fromJSON('["needs-external-review","needs-human-review","policy-violation","human-hold"]'), github.event.label.name)))) &&
        'approval-enforcement') || github.run_id }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' &&
        (github.event.action == 'synchronize' ||
         github.event.action == 'reopened' ||
         github.event.action == 'edited' ||
         (github.event.action == 'labeled' &&
          github.event.label.name == 'needs-external-review') ||
         (github.event.action == 'unlabeled' &&
          contains(fromJSON('["needs-external-review","needs-human-review","policy-violation","human-hold"]'), github.event.label.name))) }}

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Read review-policy.yml configuration
  # ──────────────────────────────────────────────
  load-config:
    # Runs on opened, ready_for_review, synchronize, reopened, and edited so the
    # parser exercises every commit pushed to an open PR, not just
    # initial open. `reopened` is included for the #495 readiness path: a PR
    # changed while closed and then reopened, or retargeted through an edit,
    # must have its policy
    # re-parsed here BEFORE approval readiness evaluates, so the
    # threshold/paths feeding triage reflect the changed diff rather than
    # a stale snapshot. Ordinary `labeled` events remain excluded so reviewer
    # assignment cannot re-fire on every label edit. The single force-on label
    # is admitted for invalidation only; `assign` has its own narrower guard
    # and remains scoped to opened/ready. See #59 for the SKIPPED-as-SUCCESS
    # miss this closes and Codex's P2 on PR #131 for why generic labeled
    # events are excluded.
    # #557: ALSO run on approved pull_request_review events. The
    # legacy-named auto-merge-on-approval registered-reviewer gate
    # reads needs.load-config.outputs.reviewers on the direct-approval
    # path; if load-config is skipped on review events that list is empty,
    # the gate defaults REVIEWERS_JSON to [], rejects every approver as
    # "not a registered reviewer", and never reaches readiness validation.
    # The merge still backstops via merge-clearance-gate. This job
    # only reads the static review-policy.yml, so it is event-shape-agnostic.
    if: >
      (github.event_name == 'pull_request' &&
       (github.event.action == 'opened' ||
        github.event.action == 'ready_for_review' ||
        github.event.action == 'synchronize' ||
        github.event.action == 'reopened' ||
        github.event.action == 'edited' ||
        (github.event.action == 'labeled' &&
         github.event.label.name == 'needs-external-review') ||
        github.event.action == 'unlabeled')) ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.state == 'approved')
    runs-on: ubuntu-latest
    outputs:
      threshold: ${{ steps.config.outputs.threshold }}
      paths: ${{ steps.config.outputs.paths }}
      reviewers: ${{ steps.config.outputs.reviewers }}
      author_identity: ${{ steps.config.outputs.author_identity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Trusted default-branch checkout (#788). This step now shells out to
          # scripts/workflow/ helpers with a token in the environment, so the
          # HELPER CODE must come from the default branch and never from the PR
          # head — the same trust rule the triage job below states. The default
          # checkout ref made this the PR's own merge ref on `pull_request`
          # events and the default branch on `pull_request_review` events, so
          # the same PR was parsed from two different files depending on which
          # event woke the job.
          #
          # The POLICY the helpers read is a separate decision, resolved from
          # the PR base by scripts/workflow/resolve_base_policy.sh below.
          ref: ${{ github.event.repository.default_branch }}
          # Explicit-token gh / github-script only, no authenticated git, so
          # don't leave the checkout token in .git/config (#548 / Codex #550).
          persist-credentials: false

      - name: Parse the governing review-policy.yml
        id: config
        env:
          # Only consumed on the non-default-base path, where the resolver
          # fetches the base branch's policy. A default-base PR — every PR in
          # the fleet today — makes no API call at all, so an unset secret is
          # harmless there and fails closed (empty reviewer allow-list)
          # everywhere else. Mirrors the triage job's resolver invocation.
          GH_TOKEN: ${{ secrets.CI_ACTOR_TOKEN || secrets.REVIEWER_ASSIGNMENT_TOKEN }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Bootstrap-skew guard (the #577/#590 shape). The checkout above is
          # pinned to the DEFAULT branch so the helper code is trusted, which
          # means the helper is absent from this tree on exactly two
          # occasions: the PR that INTRODUCES it (this one), and each
          # consumer's first sync wave — .mergepath-sync.yml makes the
          # workflow and scripts/workflow/ travel together, but they land IN
          # that PR, not on the consumer's default branch before it runs.
          # Without this guard `bash <missing file>` exits 127 and the step —
          # and the job — hard-fail.
          #
          # A failed load-config is the fail-OPEN outcome this whole step
          # exists to avoid: `triage` declares `needs: [load-config]` with no
          # `always()`, so it would be SKIPPED and never apply or refresh
          # `needs-external-review` (#59's SKIPPED-as-SUCCESS class), and
          # the legacy-named approval-readiness job would be skipped with it.
          #
          # So emit the SAME fail-closed outputs load_review_config.sh emits
          # when it cannot resolve the governing policy, and exit 0:
          # `reviewers=[]` (assign assigns nobody; the readiness-admission gate
          # already defaults `REVIEWERS_JSON` to `[]` and rejects every
          # approver as unregistered), `threshold=0` (triage's preliminary
          # calculation requires external review), `paths=[]`,
          # `author_identity=` unproven. Requiredness itself is unaffected
          # either way: triage re-resolves the base policy for itself, and
          # pr-review-policy.yml labels independently from a base worktree.
          # The step activates in full the moment this lands on the default
          # branch. A PR cannot fake the skew to reach this branch — the test
          # is against the default-branch tree, which no unmerged PR alters.
          LOADER="scripts/workflow/load_review_config.sh"
          if [ ! -f "$LOADER" ]; then
            echo "::notice::$LOADER is not on the default branch yet (the bootstrap PR introducing it, or a consumer's first sync wave); emitting fail-closed load-config outputs — empty reviewer allow-list, threshold 0 — and soft-passing so triage is not skipped."
            {
              echo "threshold=0"
              echo "paths=[]"
              echo "reviewers=[]"
              echo "author_identity="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CONFIG=".github/review-policy.yml"
          if [ ! -f "$CONFIG" ]; then
            echo "ERROR: $CONFIG not found"
            exit 1
          fi

          # Parsing lives in scripts/workflow/load_review_config.sh so it can
          # be exercised hermetically (tests/test_load_review_config.sh, run by
          # scripts/ci/check_external_review_helpers) — the same extraction
          # this repo applied to parse_policy_list.sh after #54/#57.
          #
          # It resolves the policy that GOVERNS this PR (the base branch's)
          # through the shared resolver that merge-clearance-gate.sh,
          # codex-review-check.sh and the triage job also use, then emits
          # threshold / paths / reviewers / author_identity from it. Passing
          # --base-ref/--base-sha/--default-branch rather than --pr is
          # load-bearing: it keeps the default-base short circuit free of any
          # API call (#769), which matters because this job runs on every push
          # to every open PR in the fleet.
          bash "$LOADER" \
            --repo "$REPO" \
            --base-ref "$BASE_REF" \
            --base-sha "$BASE_SHA" \
            --default-branch "$DEFAULT_BRANCH" \
            --default-config "$CONFIG"

  # ──────────────────────────────────────────────
  # Job 2: Auto-label PRs that need external review
  # ──────────────────────────────────────────────
  triage:
    needs: [load-config]
    # `synchronize` / `reopened` are included alongside
    # opened/ready_for_review so any push-triggered readiness retry gets
    # threshold and protected-path labels (`needs-external-review`)
    # REFRESHED against the changed diff before it evaluates. Without this,
    # an originally-under-threshold PR whose later push or closed-state
    # change crossed the threshold (or touched a protected path) could
    # proceed on a stale/missing label snapshot. Mirrors load-config, which
    # also handles synchronize/reopened so this job's threshold/paths inputs
    # are freshly parsed. Approved review events also run this same decision
    # path so block-self-approval consumes one authoritative Phase 4 result
    # rather than a second threshold/path implementation. Blocking-label
    # `edited` re-evaluates the mutable body/base inputs before a carried
    # approval can survive them. The force-on `labeled` event and blocking-label
    # `unlabeled` events run in classification-only mode: the independence
    # guard needs current Phase 4 scope, while triage must neither re-add the
    # label already added nor undo the settle event that just removed it
    # (#620/#1094).
    if: >
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      ((github.event_name == 'pull_request' &&
        (github.event.action == 'opened' ||
         github.event.action == 'ready_for_review' ||
         github.event.action == 'synchronize' ||
         github.event.action == 'reopened' ||
         github.event.action == 'edited' ||
         (github.event.action == 'labeled' &&
          github.event.label.name == 'needs-external-review') ||
         (github.event.action == 'unlabeled' &&
          contains(fromJSON('["needs-external-review","needs-human-review","policy-violation","human-hold"]'), github.event.label.name)))) ||
       (github.event_name == 'pull_request_review' &&
        github.event.review.state == 'approved'))
    runs-on: ubuntu-latest
    outputs:
      needs_external: ${{ steps.check.outputs.needs_external }}
      phase_4_required: ${{ steps.check.outputs.phase_4_required }}
      phase_4_intrinsic_required: ${{ steps.check.outputs.phase_4_intrinsic_required }}
      classified_head: ${{ steps.check.outputs.classified_head }}
      classified_base_ref: ${{ steps.check.outputs.classified_base_ref }}
      classified_base_sha: ${{ steps.check.outputs.classified_base_sha }}
      reviewers: ${{ steps.check.outputs.reviewers }}
      author_identity: ${{ steps.check.outputs.author_identity }}
    steps:
      - name: Checkout trusted workflow helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job shells out only to trusted default-branch helpers; never
          # run helper code from the PR head under the label-writing PAT.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Evaluate PR against review-policy.yml
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          THRESHOLD: ${{ needs.load-config.outputs.threshold }}
          PROTECTED_PATHS: ${{ needs.load-config.outputs.paths }}
          GH_TOKEN: ${{ secrets.CI_ACTOR_TOKEN || secrets.REVIEWER_ASSIGNMENT_TOKEN }}
        with:
          github-token: ${{ secrets.CI_ACTOR_TOKEN || secrets.REVIEWER_ASSIGNMENT_TOKEN }}
          script: |
            const childProcess = require('child_process');
            const fs = require('fs');
            const os = require('os');
            const path = require('path');

            function parseReviewerList(raw, label) {
              let reviewers;
              try {
                reviewers = JSON.parse(raw || '[]');
              } catch (error) {
                throw new Error(`${label} reviewer allow-list is malformed`);
              }
              if (
                !Array.isArray(reviewers) ||
                reviewers.some(reviewer =>
                  typeof reviewer !== 'string' || reviewer.trim().length === 0
                )
              ) {
                throw new Error(`${label} reviewer allow-list is malformed`);
              }
              return reviewers;
            }

            // BEGIN TRIAGE POLICY MATERIALIZATION DECISION
            function shouldMaterializeDefaultPolicy({
              baseRef,
              baseSha,
              defaultBranch,
              checkoutSha,
            }) {
              return baseRef === defaultBranch &&
                (!checkoutSha || checkoutSha !== baseSha);
            }
            // END TRIAGE POLICY MATERIALIZATION DECISION

            // BEGIN TRIAGE PHASE 4 DECISION
            // BEGIN STABLE PR LABEL NAMES BOOTSTRAP
            // Generated from scripts/self-approval-detector.cjs. Do not edit.
            function stablePrLabelNames(candidate) {
              const labels = candidate && candidate.labels;
              if (
                !Array.isArray(labels) ||
                labels.some(label =>
                  !label || typeof label.name !== 'string' || !label.name.trim()
                )
              ) {
                throw new Error('live PR labels are unavailable or malformed');
              }
              return labels.map(label => label.name).sort();
            }
            // END STABLE PR LABEL NAMES BOOTSTRAP

            function phase4RequiredForTriage({
              requiresReview,
              laneVerifiedHead,
              pr,
            }) {
              const forceOn = stablePrLabelNames(pr)
                .includes('needs-external-review');
              return forceOn || phase4IntrinsicRequiredForTriage({
                requiresReview,
                laneVerifiedHead,
              });
            }

            function phase4IntrinsicRequiredForTriage({
              requiresReview,
              laneVerifiedHead,
            }) {
              return Boolean(requiresReview) && !laneVerifiedHead;
            }

            function triageMayMutateLabels({eventName, action, labelName}) {
              if (eventName !== 'pull_request') return true;
              return action !== 'unlabeled' && !(
                action === 'labeled' &&
                labelName === 'needs-external-review'
              );
            }
            // END TRIAGE PHASE 4 DECISION

            function loadGoverningIdentities(pr, policyConfigPath) {
              const outputPath = path.join(
                os.tmpdir(),
                `mergepath-live-policy-${process.pid}-${Date.now()}.out`,
              );
              try {
                fs.writeFileSync(outputPath, '');
                childProcess.execFileSync(
                  'bash',
                  [
                    'scripts/workflow/load_review_config.sh',
                    '--repo', `${context.repo.owner}/${context.repo.repo}`,
                    '--base-ref', pr.base.ref,
                    '--base-sha', pr.base.sha,
                    '--default-branch', context.payload.repository.default_branch,
                    '--default-config', policyConfigPath,
                    '--output', outputPath,
                  ],
                  {encoding: 'utf8', env: process.env},
                );
                const outputs = new Map();
                for (const line of fs.readFileSync(outputPath, 'utf8').split(/\r?\n/)) {
                  if (!line) continue;
                  const separator = line.indexOf('=');
                  if (separator <= 0) {
                    throw new Error('governing policy output is malformed');
                  }
                  const key = line.slice(0, separator);
                  if (outputs.has(key)) {
                    throw new Error(`governing policy output repeats ${key}`);
                  }
                  outputs.set(key, line.slice(separator + 1));
                }
                const reviewers = parseReviewerList(
                  outputs.get('reviewers'),
                  'governing policy',
                );
                const authorIdentity = outputs.get('author_identity') || '';
                if (reviewers.length === 0 || !authorIdentity.trim()) {
                  throw new Error(
                    'governing policy identities are unavailable; refusing to classify approval',
                  );
                }
                return {reviewers, authorIdentity};
              } finally {
                try {
                  fs.unlinkSync(outputPath);
                } catch (error) {
                  if (error && error.code !== 'ENOENT') throw error;
                }
              }
            }
            const eventPr = context.payload.pull_request;
            const snapshotKey = candidate => JSON.stringify({
              head: candidate && candidate.head && candidate.head.sha,
              baseRef: candidate && candidate.base && candidate.base.ref,
              baseSha: candidate && candidate.base && candidate.base.sha,
              labels: stablePrLabelNames(candidate),
            });
            const {data: pr} = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: eventPr.number,
            });
            const triageSnapshot = snapshotKey(pr);
            if (snapshotKey(eventPr) !== triageSnapshot) {
              core.notice(
                'The event PR snapshot is stale; triage is evaluating the ' +
                'current live head/base and the approval guard will suppress ' +
                'direct-event violation attribution for the stale webhook.',
              );
            }
            const eventLabelName = context.payload.label &&
              context.payload.label.name;
            const isForceOnLabelEvent =
              context.eventName === 'pull_request' &&
              context.payload.action === 'labeled' &&
              eventLabelName === 'needs-external-review';
            const isUnlabeledSettleEvent =
              context.eventName === 'pull_request' &&
              context.payload.action === 'unlabeled';
            const mayMutateLabels = triageMayMutateLabels({
              eventName: context.eventName,
              action: context.payload.action,
              labelName: eventLabelName,
            });
            const threshold = parseInt(process.env.THRESHOLD, 10);
            const protectedPaths = JSON.parse(process.env.PROTECTED_PATHS);

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
              }
            );
            const {data: prAfterFiles} = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: eventPr.number,
            });
            if (snapshotKey(prAfterFiles) !== triageSnapshot) {
              throw new Error(
                'PR head/base changed while triage read the live file list; ' +
                'refusing to classify a mixed snapshot. A newer event will retry.',
              );
            }

            // Config must come from the PR BASE, not this default-branch
            // checkout (#763/#769). This job checks out the default branch so
            // the HELPER code is trusted — correct, and unchanged — but the
            // helper was then handed the default branch's review-policy.yml. A
            // PR targeting a stricter non-default base was therefore judged by
            // the LOOSER policy, and since `needsExternal` is overwritten by
            // the helper result below, that could flip it to false and skip the
            // external-review label entirely.
            //
            // Resolution goes through the SHARED helper that
            // merge-clearance-gate.sh and codex-review-check.sh also use, so
            // every policy decision in the fleet reads one implementation
            // rather than four near-copies. For a default-base PR it returns
            // the checked-out path and makes no API call; it fails (exit 2)
            // only for a positively-identified non-default base whose policy
            // cannot be read, which is the one case where silently using the
            // default-branch copy would be the bypass.
            let policyConfigPath = '.github/review-policy.yml';
            let policyReadFailed = false;
            try {
              let checkoutSha = '';
              try {
                checkoutSha = childProcess.execFileSync(
                  'git',
                  ['rev-parse', 'HEAD'],
                  {encoding: 'utf8'},
                ).trim();
              } catch (error) {
                core.warning(
                  `Could not prove the trusted checkout SHA (${error.message}); ` +
                  `materializing the exact live default-base policy instead.`,
                );
              }
              const policyResolverArgs = [
                'scripts/workflow/resolve_base_policy.sh',
                '--repo', `${context.repo.owner}/${context.repo.repo}`,
                '--base-ref', pr.base.ref,
                '--base-sha', pr.base.sha,
                '--default-branch', context.payload.repository.default_branch,
                '--default-config', '.github/review-policy.yml',
              ];
              if (shouldMaterializeDefaultPolicy({
                baseRef: pr.base.ref,
                baseSha: pr.base.sha,
                defaultBranch: context.payload.repository.default_branch,
                checkoutSha,
              })) {
                policyResolverArgs.push('--materialize-default');
              }
              policyConfigPath = childProcess.execFileSync(
                'bash',
                policyResolverArgs,
                {encoding: 'utf8', env: process.env}
              ).trim();
              console.log(`Governing review policy: ${policyConfigPath}`);
            } catch (e) {
              policyReadFailed = true;
              core.warning(
                `Could not resolve the governing review policy ` +
                `(${e.message}); requiring external review fail-closed rather ` +
                `than judging this PR by the default-branch policy.`
              );
            }

            let governingIdentities = {reviewers: [], authorIdentity: ''};
            if (!policyReadFailed) {
              try {
                governingIdentities = loadGoverningIdentities(
                  pr,
                  policyConfigPath,
                );
              } catch (error) {
                core.warning(
                  `Could not load live governing identities (${error.message}); ` +
                  `exporting an empty reviewer allow-list so approval ` +
                  `enforcement fails closed.`,
                );
              }
            }

            // Exclude lockfiles, minified, and generated files from line count
            // to match REVIEW_POLICY.md threshold definition
            const excludePatterns = [
              /\.lock$/, /lock\.json$/, /\.min\.js$/, /\.min\.css$/,
              /\.generated\./, /\.g\.dart$/, /\.freezed\.dart$/,
            ];
            const countedFiles = files.filter(
              f => !excludePatterns.some(p => p.test(f.filename))
            );
            const totalChanges = countedFiles.reduce(
              (sum, f) => sum + f.additions + f.deletions, 0
            );

            // Convert glob patterns to regex for matching
            function globToRegex(pattern) {
              let re = pattern
                .replace(/\./g, '\\.')
                .replace(/\*\*/g, '___GLOBSTAR___')
                .replace(/\*/g, '[^/]*')
                .replace(/___GLOBSTAR___/g, '.*');
              return new RegExp('^' + re + '$');
            }

            // Both sides of a rename (#763): GitHub reports the destination in
            // .filename and the source in .previous_filename, so matching only
            // .filename would let a PR move a protected file to an unprotected
            // path without tripping this. Same fix as
            // external_review_fingerprint.sh, applied to this inline twin.
            const touchesProtected = files.some(f =>
              [f.filename, f.previous_filename]
                .filter(Boolean)
                .some(name => protectedPaths.some(p => globToRegex(p).test(name)))
            );

            // Use >= to match REVIEW_POLICY.md definition
            let needsExternal = totalChanges >= threshold || touchesProtected;
            let externalReviewFingerprint = '';
            let filesPath = '';
            const repo = `${context.repo.owner}/${context.repo.repo}`;
            if (policyReadFailed) {
              // Base policy unknown — see the fail-closed note above. Skip the
              // helper entirely: running it against the default-branch config
              // is exactly the bypass being closed, and its result would
              // OVERWRITE needsExternal.
              needsExternal = true;
              externalReviewFingerprint = '';
              console.log(
                'External-review fail-closed: base review policy unreadable; ' +
                'requiring review and skipping the fingerprint calculation.'
              );
            } else {
              try {
                filesPath = path.join(os.tmpdir(), `mergepath-pr-${pr.number}-files.json`);
                fs.writeFileSync(filesPath, JSON.stringify(files));
                const fingerprintRaw = childProcess.execFileSync(
                  'bash',
                  [
                    'scripts/workflow/external_review_fingerprint.sh',
                    '--repo', repo,
                    '--pr', String(pr.number),
                    '--ref', pr.head.sha,
                    '--config', policyConfigPath,
                    '--files-json', filesPath,
                  ],
                  {encoding: 'utf8', env: process.env}
                );
                const fingerprint = JSON.parse(fingerprintRaw);
                needsExternal = Boolean(fingerprint.requires_review);
                externalReviewFingerprint = fingerprint.fingerprint || '';
              } catch (e) {
                core.warning(
                  `External-review fingerprint calculation failed; ` +
                  `labeling fail-closed (${e.message}).`
                );
                needsExternal = true;
                externalReviewFingerprint = '';
              }
            }

            // PROPAGATION-LANE-DEFER (#656): this job and pr-review-policy.yml's
            // External Review Check both decide needs-external-review, but only
            // the latter BYTE-VERIFIES a mergepath-sync/ PR against
            // mergepath@<sha> and exempts a faithful mirror (removing the
            // label + posting a github-actions[bot] comment with the
            // HEAD-PINNED marker `mergepath-propagation-lane
            // verified-head=<sha>`). Pre-#656, this job re-added the label on
            // any later event because it never consulted that verdict —
            // stranding approved, byte-verified sync PRs on Label Gate
            // (tadlockpsychiatry#93: lane-cleared 14:55, triage re-added
            // 15:46, stuck).
            //
            // Fix: SKIP the label add ONLY when the lane has already verified
            // THIS exact head — i.e. a github-actions[bot]-authored comment
            // carries the marker pinned to pr.head.sha. Everything else stays
            // FAIL-CLOSED: an unverified sync head (fresh push, diverged
            // hand-edit, reopened-with-new-head) is labeled here exactly as
            // before, and the lane later removes the label if and only if the
            // byte-compare passes. This preserves the PAT-driven label
            // add/remove events that retrigger the downstream gates, and it
            // grants no exemption this job derives itself — the lane's
            // byte-verify remains the sole teeth. (The naive alternative —
            // skipping by branch name — was rejected as fail-OPEN in the
            // closed first attempt: Codex P1 on the #657 PR.)
            //
            // Marker contract + trust model are shared with
            // scripts/merge-clearance-gate.sh lane_verified() (#620): only
            // repo workflows author github-actions[bot] comments, and only
            // pr-review-policy.yml posts this marker, only after
            // verify-propagation-pr.sh byte-confirms the head. Keep the
            // marker string in lockstep across the three files
            // (scripts/ci/check_agent_review_triage_defers asserts it).
            // The branch-prefix pre-filter must match SYNC_BRANCH_PREFIX in
            // scripts/sync-to-downstream.sh; it only bounds the extra API
            // read to sync branches — the marker, not the branch name, is
            // what authorizes the skip.
            let laneVerifiedHead = false;
            if (needsExternal &&
                ((pr.head && pr.head.ref) || '').startsWith('mergepath-sync/')) {
              try {
                const comments = await github.paginate(
                  github.rest.issues.listComments,
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    per_page: 100,
                  }
                );
                const marker = `mergepath-propagation-lane verified-head=${pr.head.sha}`;
                laneVerifiedHead = comments.some(
                  c => c.user && c.user.login === 'github-actions[bot]' &&
                       (c.body || '').includes(marker)
                );
              } catch (e) {
                // Indeterminate marker read must not skip labeling — mirror
                // lane_verified()'s fail-safe direction (external review can
                // only be ADDED by an uncertain read, never removed).
                core.warning(`Propagation-lane marker read failed (${e.message}); labeling fail-closed.`);
                laneVerifiedHead = false;
              }
            }

            // Export intrinsic threshold/path requiredness separately from
            // the then-live force-on result. A carry-forward below can clear
            // already-reviewed bytes, but does not turn the PR into Phase 3.
            // Only the exact-head, byte-verified propagation lane has the
            // policy's under-threshold-equivalent standing. The approval
            // guard recombines the intrinsic output with its own stabilized
            // live labels so overlapping add/remove events cannot latch this
            // snapshot's mutable force-on state (#1094).
            const phase4IntrinsicRequired =
              phase4IntrinsicRequiredForTriage({
                requiresReview: needsExternal,
                laneVerifiedHead,
              });
            const phase4Required = phase4RequiredForTriage({
              requiresReview: needsExternal,
              laneVerifiedHead,
              pr,
            });

            if (needsExternal && laneVerifiedHead) {
              console.log(
                `Propagation lane already byte-verified head ${pr.head.sha} ` +
                `(github-actions[bot] verified-head marker present) — skipping ` +
                `needs-external-review add; the lane owns this PR's labeling.`
              );
            } else if (needsExternal) {
              let carried = false;
              try {
                if (needsExternal && externalReviewFingerprint && filesPath) {
                  const carryRaw = childProcess.execFileSync(
                    'bash',
                    [
                      'scripts/workflow/external_review_carryforward.sh',
                      '--repo', repo,
                      '--pr', String(pr.number),
                      '--head', pr.head.sha,
                      '--current-fingerprint', externalReviewFingerprint,
                      '--config', policyConfigPath,
                      '--files-json', filesPath,
                    ],
                    {encoding: 'utf8', env: process.env}
                  );
                  const carry = JSON.parse(carryRaw);
                  carried = Boolean(carry.carried);
                  if (carried) {
                    needsExternal = false;
                    console.log(
                      `Codex already cleared the same external-review fingerprint ` +
                      `on ${carry.source_commit} at ${carry.source_time}; skipping ` +
                      `needs-external-review on base-only sync (#705).`
                    );
                  }
                }
              } catch (e) {
                core.warning(
                  `External-review fingerprint carry-forward check failed; ` +
                  `labeling fail-closed using threshold/protected-path result (${e.message}).`
                );
              }

              if (!carried && mayMutateLabels && needsExternal) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  labels: ['needs-external-review'],
                });
              } else if (!mayMutateLabels && needsExternal) {
                console.log(
                  `Computed Phase 4 applicability for the ` +
                  `${isForceOnLabelEvent ? 'force-on labeled' : 'unlabeled settle'} ` +
                  `event without mutating needs-external-review (#620/#1094).`
                );
              }
            }

            core.setOutput('needs_external', needsExternal.toString());
            core.setOutput('phase_4_required', phase4Required.toString());
            core.setOutput(
              'phase_4_intrinsic_required',
              phase4IntrinsicRequired.toString(),
            );
            core.setOutput('classified_head', pr.head.sha);
            core.setOutput('classified_base_ref', pr.base.ref);
            core.setOutput('classified_base_sha', pr.base.sha);
            core.setOutput(
              'reviewers',
              JSON.stringify(governingIdentities.reviewers),
            );
            core.setOutput(
              'author_identity',
              governingIdentities.authorIdentity,
            );
            if (policyConfigPath !== '.github/review-policy.yml') {
              try {
                fs.unlinkSync(policyConfigPath);
              } catch (error) {
                if (error && error.code !== 'ENOENT') throw error;
              }
            }

  # ──────────────────────────────────────────────
  # Job 3: Assign reviewer (internal self-peer review)
  # ──────────────────────────────────────────────
  assign:
    needs: [load-config, triage]
    if: >
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event.action == 'opened' || github.event.action == 'ready_for_review')
    runs-on: ubuntu-latest
    steps:
      # The reviewer-assignment parse below runs the SHARED PR-body parser
      # (scripts/lib/pr-body-contract.mjs) rather than a local regex, so this
      # job needs the repo on disk. Explicit-token github-script only, no
      # authenticated git, so don't leave the checkout token in .git/config
      # (#548 / Codex #550).
      - name: Check out the shared PR-body parser
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # TRUSTED default-branch checkout, not the PR merge ref (#788, and
          # the same rule load-config uses above). This job hands a
          # write-capable token to github-script and then EXECUTES
          # scripts/lib/pr-body-contract.mjs from this checkout. On
          # `pull_request` the default ref is the PR merge ref, so an
          # unpinned checkout would run PR-authored JavaScript with that
          # token in scope. Disabling checkout credential persistence removes the
          # checkout credential; it does NOT make the checked-out code
          # trusted, and the parser must be the canonical one regardless.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Assign reviewer identity based on Authoring-Agent
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AUTHOR_IDENTITY: ${{ needs.load-config.outputs.author_identity }}
          REVIEWERS_JSON: ${{ needs.load-config.outputs.reviewers }}
        with:
          github-token: ${{ secrets.CI_ACTOR_TOKEN || secrets.REVIEWER_ASSIGNMENT_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const authorIdentity = process.env.AUTHOR_IDENTITY || 'nathanjohnpayne';
            const reviewers = JSON.parse(process.env.REVIEWERS_JSON || '[]');

            // Under the new policy, all PRs are authored by the author identity.
            if (author !== authorIdentity) {
              console.log(`Author ${author} is not ${authorIdentity}; skipping auto-assignment.`);
              return;
            }

            if (reviewers.length === 0) {
              console.log('No reviewers configured in review-policy.yml');
              return;
            }

            // Read the Authoring-Agent line from the PR body to determine which
            // agent wrote the code. Per REVIEW_POLICY.md, the same agent reviews
            // under its own reviewer identity (e.g., claude → nathanpayne-claude).
            //
            // This MUST use the shared parser, not a local regex (#1121). The
            // previous `body.match(/^Authoring-Agent:.../mi)` took the first RAW
            // line, so a marker inside an HTML comment counted as a declaration
            // here while gh-pr-guard.sh ignored it. The same PR could then be
            // assigned to one reviewer while the guard attributed it to another,
            // and merge-clearance could wrongly consider the same-agent Codex
            // fallback eligible. One parser, one answer, everywhere.
            const { execFileSync } = require('child_process');
            const body = pr.body || '';
            const runParser = (flag) => {
              try {
                return execFileSync('node', ['scripts/lib/pr-body-contract.mjs', flag],
                  { input: body, encoding: 'utf8' }).trim();
              } catch (e) {
                console.log(`shared PR-body parser failed for ${flag}: ${e.message}`);
                return '';
              }
            };

            // Exactly one VISIBLE marker, matching the guard and the merge gate.
            // Zero, or more than one, is not a declaration and must not resolve
            // to a reviewer — falling through to the default keeps assignment
            // conservative instead of guessing from an ambiguous body.
            const agentCount = runParser('--author-count');
            const agentName = agentCount === '1' ? runParser('--author').toLowerCase() : '';
            let reviewer;

            if (agentName) {
              const matchingReviewer = reviewers.find(
                r => r.endsWith(`-${agentName}`)
              );
              if (matchingReviewer) {
                reviewer = matchingReviewer;
                console.log(`Authoring-Agent: ${agentName} → assigning ${reviewer}`);
              } else {
                console.log(`Authoring-Agent: ${agentName} has no matching reviewer identity, using first available.`);
                reviewer = reviewers[0];
              }
            } else {
              console.log('No Authoring-Agent line found in PR body; assigning first available reviewer.');
              reviewer = reviewers[0];
            }

            const { data: existingReviewers } = await github.rest.pulls.listRequestedReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });
            const alreadyRequested = existingReviewers.users.map(u => u.login);

            if (!alreadyRequested.includes(reviewer)) {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                reviewers: [reviewer],
              });
              console.log(`Assigned ${reviewer} for internal self-peer review.`);
            }

  # Note: no CI-side invoke-reviewer job exists. Phase 2 internal
  # self-peer review is performed by the authoring agent in its own
  # session — the agent switches its identity to its reviewer account
  # (e.g., nathanpayne-claude) via a PAT from 1Password and posts the
  # review with that PAT. See REVIEW_POLICY.md § Phase 2 and CLAUDE.md
  # "After opening the PR" steps 4–7. A headless Claude/Codex CLI
  # invocation in CI is intentionally NOT used: it (a) bypasses the
  # in-session tool context the agent already has, (b) adds a stale
  # API-key failure surface unrelated to the PR, and (c) duplicates
  # work the agent is already doing as part of the PR loop.

  # ──────────────────────────────────────────────
  # Job 4: Detect agent disagreement → escalate
  # ──────────────────────────────────────────────
  detect-disagreement:
    if: github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Explicit-token gh / github-script only, no authenticated git, so
          # don't leave the checkout token in .git/config (#548 / Codex #550).
          persist-credentials: false

      - name: Install js-yaml
        run: npm install --no-save --ignore-scripts --legacy-peer-deps js-yaml

      - name: Check for conflicting reviews
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.CI_ACTOR_TOKEN || secrets.REVIEWER_ASSIGNMENT_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const yaml = require('js-yaml');

            // Decision logic lives in scripts/disagreement-detector.cjs
            // so the workflow and the fixture-driven test
            // (scripts/ci/check_disagreement_detector) exercise the
            // exact same code. See #259 for the regression this
            // factoring closes.
            const { decide } = require(
              path.resolve(process.env.GITHUB_WORKSPACE, 'scripts/disagreement-detector.cjs')
            );

            let reviewerAccounts;
            try {
              const config = yaml.load(fs.readFileSync('.github/review-policy.yml', 'utf8'));
              reviewerAccounts = config.available_reviewers || [];
            } catch (e) {
              reviewerAccounts = ['nathanpayne-claude', 'nathanpayne-codex', 'nathanpayne-cursor'];
            }

            // Paginate reviews — long histories (>30) otherwise truncate and
            // mask the latest-on-HEAD signal. Mirrors the pagination
            // fix in pr-audit.yml (PR #255 P2).
            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
              }
            );

            // Check if the label is currently applied
            const labels = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const hasLabel = labels.data.some(l => l.name === 'needs-human-review');

            const decision = decide({
              reviews,
              reviewerAccounts,
              headSha: context.payload.pull_request.head.sha,
              hasLabel,
            });

            if (decision === 'apply') {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: ['needs-human-review'],
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: '**Agent disagreement detected.** One reviewer approved and another requested changes on the current HEAD. Escalating to @nathanjohnpayne for human tiebreaker per REVIEW_POLICY.md.',
              });
            } else if (decision === 'remove') {
              // No live disagreement on the current HEAD — remove the
              // label. Covers the #259 case: a stale CHANGES_REQUESTED
              // on an older SHA is superseded by an APPROVED on HEAD.
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  name: 'needs-human-review',
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  body: '**Agent disagreement resolved.** No live conflict on the current HEAD (latest review per reviewer, non-DISMISSED, commit_id == HEAD). Removing `needs-human-review` label.',
                });
              } catch (e) {
                // Label may already be removed — ignore 404
                if (e.status !== 404) throw e;
              }
            }
            // decision === 'noop' — nothing to do.

  # ──────────────────────────────────────────────
  # Job 5: Enforce approval independence
  # ──────────────────────────────────────────────
  block-self-approval:
    needs: [load-config, triage]
    if: >
      always() &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      ((github.event_name == 'pull_request_review' &&
        github.event.review.state == 'approved') ||
       (github.event_name == 'pull_request' &&
        (github.event.action == 'synchronize' ||
         github.event.action == 'reopened' ||
         github.event.action == 'edited' ||
         (github.event.action == 'labeled' &&
          github.event.label.name == 'needs-external-review') ||
         (github.event.action == 'unlabeled' &&
          contains(fromJSON('["needs-external-review","needs-human-review","policy-violation","human-hold"]'), github.event.label.name)))))
    runs-on: ubuntu-latest
    outputs:
      eligible_approval: ${{ steps.check.outputs.eligible_approval }}
      auto_arm_allowed: ${{ steps.retract_shared_author.outputs.auto_arm_allowed }}
    steps:
      - name: Checkout trusted self-approval detector
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The review event can target untrusted PR code. Load the detector
          # only from the trusted default branch.
          ref: ${{ github.event.repository.default_branch }}
          # Explicit-token github-script only, no authenticated git, so don't
          # leave the checkout token in .git/config (#548 / Codex #550).
          persist-credentials: false

      - name: Classify and dismiss ineligible approvals
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AUTHOR_IDENTITY: ${{ needs.triage.outputs.author_identity }}
          REVIEWERS_JSON: ${{ needs.triage.outputs.reviewers }}
          EVENT_REVIEWERS_JSON: ${{ needs.load-config.outputs.reviewers }}
          PHASE_4_INTRINSIC_REQUIRED: ${{ needs.triage.outputs.phase_4_intrinsic_required }}
          TRIAGE_HEAD: ${{ needs.triage.outputs.classified_head }}
          TRIAGE_BASE_REF: ${{ needs.triage.outputs.classified_base_ref }}
          TRIAGE_BASE_SHA: ${{ needs.triage.outputs.classified_base_sha }}
          TRIAGE_RESULT: ${{ needs.triage.result }}
        with:
          github-token: ${{ secrets.CI_ACTOR_TOKEN || secrets.REVIEWER_ASSIGNMENT_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            // BEGIN SELF-APPROVAL BOOTSTRAP
            // Generated from scripts/self-approval-detector.cjs. Do not edit.
            function bootstrapDetector() {
              function normalized(value) {
                return typeof value === 'string' ? value.trim().toLowerCase() : '';
              }

              // BEGIN STABLE PR LABEL NAMES
              function stablePrLabelNames(candidate) {
                const labels = candidate && candidate.labels;
                if (
                  !Array.isArray(labels) ||
                  labels.some(label =>
                    !label || typeof label.name !== 'string' || !label.name.trim()
                  )
                ) {
                  throw new Error('live PR labels are unavailable or malformed');
                }
                return labels.map(label => label.name).sort();
              }
              // END STABLE PR LABEL NAMES

              function decide(input) {
                const prAuthor = normalized(input && input.prAuthor);
                const authorIdentity = normalized(input && input.authorIdentity);
                const reviewer = normalized(input && input.reviewer);
                const reviewerAccounts = Array.isArray(input && input.reviewerAccounts)
                  ? input.reviewerAccounts.map(normalized).filter(Boolean)
                  : [];
                const reviewerIsAgent = reviewerAccounts.includes(reviewer);

                // Keep the native-account defense independent of the PR-body declaration.
                // This catches a reviewer approving a PR authored by that same GitHub
                // account even when external review would otherwise not be required.
                if (reviewer && reviewerIsAgent && prAuthor === reviewer) {
                  return {
                    action: 'block',
                    reason: 'same-native-account-approval',
                    persistentViolation: true,
                  };
                }

                // Human reviews are the documented tiebreaker and reviewer accounts not in
                // this repository's configured agent allow-list are outside this guard.
                if (!reviewerIsAgent) {
                  return { action: 'allow', reason: 'human-or-unregistered-reviewer' };
                }

                if (!prAuthor || !authorIdentity) {
                  return { action: 'block', reason: 'indeterminate-native-author' };
                }

                // External contributors and dependency bots do not use the shared author
                // identity, so they need no Authoring-Agent declaration. Their registered
                // agent reviewer is independent by native GitHub identity.
                if (prAuthor !== authorIdentity) {
                  return { action: 'allow', reason: 'non-shared-author-pr' };
                }

                if (!input || typeof input.requiresExternalReview !== 'boolean') {
                  return { action: 'block', reason: 'indeterminate-review-requirement' };
                }

                if (input.requiresExternalReview === true) {
                  const declarationAttempts = (
                    typeof input.prBody === 'string' ? input.prBody : ''
                  ).split(/\r?\n|\r/).filter(
                    line => /^[ \t]*Authoring-Agent:/i.test(line),
                  );
                  if (declarationAttempts.length === 0) {
                    return {
                      action: 'block',
                      reason: 'indeterminate-phase-4-author',
                      detail: 'missing-authoring-agent-declaration',
                    };
                  }
                  if (declarationAttempts.length > 1) {
                    return {
                      action: 'block',
                      reason: 'indeterminate-phase-4-author',
                      detail: 'multiple-authoring-agent-declarations',
                    };
                  }
                  const declaration = /^Authoring-Agent:[ \t]*([A-Za-z0-9_-]+)[ \t]*$/i
                    .exec(declarationAttempts[0]);
                  if (!declaration) {
                    return {
                      action: 'block',
                      reason: 'indeterminate-phase-4-author',
                      detail: 'malformed-authoring-agent-declaration',
                    };
                  }
                  const authoringAgent = normalized(declaration[1]);
                  const authoringReviewers = reviewerAccounts.filter(
                    account => account.endsWith(`-${authoringAgent}`),
                  );
                  if (authoringReviewers.length === 0) {
                    return {
                      action: 'block',
                      reason: 'indeterminate-phase-4-author',
                      detail: 'unknown-authoring-agent',
                    };
                  }
                  if (authoringReviewers.length > 1) {
                    return {
                      action: 'block',
                      reason: 'indeterminate-phase-4-author',
                      detail: 'ambiguous-authoring-agent-mapping',
                    };
                  }
                  const [authoringReviewer] = authoringReviewers;

                  if (authoringReviewer && authoringReviewer === reviewer) {
                    return {
                      action: 'block',
                      reason: 'same-agent-phase-4-approval',
                      // The declaration is mutable and GitHub exposes no conditional label
                      // write bound to the body snapshot. Dismiss the approval, but reserve
                      // the human-only persistent label for immutable native-author proof.
                      authoringAgent,
                      authoringReviewer,
                    };
                  }
                } else {
                  return { action: 'allow', reason: 'under-threshold-agent-approval' };
                }

                return { action: 'allow', reason: 'different-agent-phase-4-approval' };
              }

              function latestOpinionatedReviews(input) {
                const reviewerAccounts = Array.isArray(input && input.reviewerAccounts)
                  ? input.reviewerAccounts.map(normalized).filter(Boolean)
                  : [];
                const prAuthor = normalized(input && input.prAuthor);
                const includePrAuthor = Boolean(input && input.includePrAuthor);
                const reviews = Array.isArray(input && input.reviews) ? input.reviews : [];
                const latestByReviewer = new Map();

                for (const review of reviews) {
                  const reviewer = normalized(review && review.user && review.user.login);
                  const state = normalized(review && review.state).toUpperCase();
                  if (
                    !reviewer ||
                    (!includePrAuthor && reviewer === prAuthor) ||
                    !reviewerAccounts.includes(reviewer) ||
                    !['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(state)
                  ) {
                    continue;
                  }

                  const current = latestByReviewer.get(reviewer);
                  const submittedAt = String((review && review.submitted_at) || '');
                  const currentSubmittedAt = String((current && current.submitted_at) || '');
                  const id = Number((review && review.id) || 0);
                  const currentId = Number((current && current.id) || 0);
                  if (
                    !current ||
                    submittedAt > currentSubmittedAt ||
                    (submittedAt === currentSubmittedAt && id > currentId)
                  ) {
                    latestByReviewer.set(reviewer, review);
                  }
                }

                return reviewerAccounts
                  .map(reviewer => latestByReviewer.get(reviewer))
                  .filter(Boolean);
              }

              function latestApprovedReviews(input) {
                const headSha = normalized(input && input.headSha);
                const requireHead = Boolean(input && input.requireHead);
                return latestOpinionatedReviews(input).filter(review =>
                  normalized(review.state).toUpperCase() === 'APPROVED' &&
                  (!requireHead || (headSha && normalized(review.commit_id) === headSha)),
                );
              }

              // A direct review webhook can arrive before the list-reviews endpoint exposes
              // that review. Add it only when the live list has no object with the same ID;
              // if the API already reports that ID as DISMISSED or CHANGES_REQUESTED, the
              // live state wins over the older APPROVED webhook payload.
              function reviewsWithDirectFallback(reviews, directReview) {
                const combined = Array.isArray(reviews) ? [...reviews] : [];
                const directId = Number((directReview && directReview.id) || 0);
                if (
                  directId > 0 &&
                  !combined.some(review => Number((review && review.id) || 0) === directId)
                ) {
                  combined.push(directReview);
                }
                return combined;
              }

              // Bind the webhook-only fallback to live PR state without letting event
              // freshness decide whether the fallback is retained. A delayed durable
              // APPROVED event must still carry its exact review object when listReviews
              // lags; staleness suppresses only direct-event attribution (red run and
              // persistent label), not classification or dismissal.
              function prepareDirectApproval(input) {
                const directReview = input && input.directReview;
                const liveHeadSha = normalized(input && input.liveHeadSha);
                const directCommit = normalized(directReview && directReview.commit_id);
                const directAttributionCurrent = !directReview || (
                  input && input.eventEnforcementCurrent === true &&
                  liveHeadSha &&
                  directCommit === liveHeadSha
                );

                return {
                  reviews: reviewsWithDirectFallback(input && input.liveReviews, directReview),
                  directAttributionCurrent,
                };
              }

              // Plan the complete standing-approval enforcement for one workflow event.
              // Event identity controls only attribution (red run / persistent label); it
              // never narrows the standing set that must be classified and dismissed.
              function planApprovalEnforcement(input) {
                const directReviewId = Number((input && input.directReviewId) || 0);
                const directAttributionCurrent = !input || input.directAttributionCurrent !== false;
                // Enforcement must retain a registered reviewer whose native account is
                // also the PR author so decide() can apply the explicit native-account
                // defense. Ordinary approval-readiness callers keep excluding PR-author
                // reviews through latestApprovedReviews()'s default.
                const approvals = latestApprovedReviews({...input, includePrAuthor: true});
                let eligibleApproval = false;
                let persistentDirectViolation = false;
                const directBlockedDiagnostics = [];
                const blockedDiagnostics = [];

                const classifiedApprovals = approvals.map(review => {
                  const reviewer = review && review.user && review.user.login;
                  const decision = decide({...input, reviewer});
                  const diagnostic = decision.detail
                    ? `${decision.reason}: ${decision.detail}`
                    : decision.reason;
                  const reviewId = Number((review && review.id) || 0);
                  const isDirectReview =
                    directAttributionCurrent && directReviewId > 0 && reviewId === directReviewId;

                  if (decision.action === 'allow') {
                    eligibleApproval = true;
                  } else {
                    blockedDiagnostics.push(diagnostic);
                    if (isDirectReview) {
                      directBlockedDiagnostics.push(diagnostic);
                      persistentDirectViolation = Boolean(decision.persistentViolation);
                    }
                  }

                  return {review, reviewer, decision, diagnostic, isDirectReview};
                });

                return {
                  approvals: classifiedApprovals,
                  eligibleApproval,
                  persistentDirectViolation,
                  directBlockedDiagnostics,
                  blockedDiagnostics,
                };
              }
              return {stablePrLabelNames, decide, latestApprovedReviews, reviewsWithDirectFallback, prepareDirectApproval, planApprovalEnforcement};
            }
            // END SELF-APPROVAL BOOTSTRAP

            // BEGIN SELF-APPROVAL RESOLVER
            function detectorSupportsDurableFallback(detector) {
              return detector &&
                typeof detector.stablePrLabelNames === 'function' &&
                typeof detector.decide === 'function' &&
                typeof detector.latestApprovedReviews === 'function' &&
                typeof detector.reviewsWithDirectFallback === 'function' &&
                typeof detector.prepareDirectApproval === 'function' &&
                typeof detector.planApprovalEnforcement === 'function';
            }

            function selectDetector(input) {
              const detectorRequiredMarker =
                'SELF_APPROVAL_DETECTOR_DURABLE_FALLBACK_V2';
              if (input.modulePresent) {
                const canonical = input.loadCanonical();
                if (detectorSupportsDurableFallback(canonical)) {
                  return canonical;
                }
              }
              if (String(input.trustedWorkflow || '').includes(detectorRequiredMarker)) {
                throw new Error(
                  'trusted workflow already requires the durable approval ' +
                  'detector capability, but the canonical module is missing ' +
                  'or incompatible; failing closed',
                );
              }
              if (typeof input.notice === 'function') {
                input.notice(
                  'The trusted default branch predates the durable approval ' +
                  'detector; using the generated strict bootstrap for this ' +
                  'atomic workflow/module rollout only.',
                );
              }
              return input.loadBootstrap();
            }
            // END SELF-APPROVAL RESOLVER

            const detectorPath = path.resolve(
              process.env.GITHUB_WORKSPACE,
              'scripts/self-approval-detector.cjs',
            );
            const trustedWorkflowPath = path.resolve(
              process.env.GITHUB_WORKSPACE,
              '.github/workflows/agent-review.yml',
            );
            const modulePresent = fs.existsSync(detectorPath);
            const trustedWorkflow = fs.readFileSync(trustedWorkflowPath, 'utf8');
            const detector = selectDetector({
              modulePresent,
              trustedWorkflow,
              loadCanonical: () => require(detectorPath),
              loadBootstrap: bootstrapDetector,
              notice: message => core.notice(message),
            });
            const {
              stablePrLabelNames,
              decide,
              latestApprovedReviews,
              reviewsWithDirectFallback,
              prepareDirectApproval,
              planApprovalEnforcement,
            } = detector;
            if (
              typeof stablePrLabelNames !== 'function' ||
              typeof decide !== 'function' ||
              typeof latestApprovedReviews !== 'function' ||
              typeof reviewsWithDirectFallback !== 'function' ||
              typeof prepareDirectApproval !== 'function' ||
              typeof planApprovalEnforcement !== 'function'
            ) {
              throw new Error('self-approval detector exports are unavailable');
            }

            // BEGIN DISMISS REVIEW FAIL-CLOSED
            async function dismissReviewFailClosed(input) {
              try {
                await input.dismiss();
                return 'dismissed';
              } catch (writeError) {
                let currentReview;
                try {
                  currentReview = await input.read();
                } catch (readError) {
                  throw writeError;
                }
                if (
                  !currentReview ||
                  Number(currentReview.id || 0) !== Number(input.reviewId) ||
                  String(currentReview.state || '').toUpperCase() !== 'DISMISSED'
                ) {
                  throw writeError;
                }
                input.notice();
                return 'already-dismissed';
              }
            }
            // END DISMISS REVIEW FAIL-CLOSED

            // BEGIN DURABLE APPROVAL PROTECTION
            function registeredReviewerUnion(rawLists) {
              const reviewers = new Set();
              for (const raw of rawLists) {
                let parsed;
                try {
                  parsed = JSON.parse(raw || '[]');
                } catch (error) {
                  continue;
                }
                if (!Array.isArray(parsed)) continue;
                for (const reviewer of parsed) {
                  if (typeof reviewer === 'string' && reviewer.trim()) {
                    reviewers.add(reviewer.trim().toLowerCase());
                  }
                }
              }
              return reviewers;
            }

            async function protectDurableApproval(input) {
              const directReview = input && input.directReview;
              const reviewer = String(
                directReview && directReview.user && directReview.user.login || '',
              ).trim().toLowerCase();
              if (
                !directReview ||
                String(directReview.state || '').toUpperCase() !== 'APPROVED' ||
                Number(directReview.id || 0) <= 0 ||
                !reviewer ||
                !registeredReviewerUnion(input.reviewerLists || []).has(reviewer)
              ) {
                return false;
              }
              await input.dismiss(directReview);
              return true;
            }
            // END DURABLE APPROVAL PROTECTION

            // BEGIN STABLE REVIEW SNAPSHOT
            async function readStableReviewSnapshot(input) {
              let pr = input.pr;
              const maxAttempts = Number(input.maxAttempts || 3);
              for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
                const reviews = await input.listReviews(pr);
                const after = await input.readPr();
                if (
                  input.enforcementSnapshot(after) ===
                  input.enforcementSnapshot(pr)
                ) {
                  return {pr: after, reviews, attempts: attempt};
                }
                if (input.policySnapshot(after) !== input.triageSnapshot) {
                  throw new Error(
                    'PR head/base changed after live triage',
                  );
                }
                input.notice(attempt);
                pr = after;
              }
              throw new Error(
                `PR metadata did not stabilize after ${maxAttempts} review reads`,
              );
            }
            // END STABLE REVIEW SNAPSHOT

            // BEGIN APPROVAL PHASE 4 DECISION
            function approvalEnforcementSnapshot(candidate, policySnapshotFn) {
              return JSON.stringify({
                policy: policySnapshotFn(candidate),
                author: candidate && candidate.user && candidate.user.login,
                body: (candidate && candidate.body) || '',
                labels: stablePrLabelNames(candidate),
              });
            }

            function phase4RequiredForApprovalGuard(
              phase4IntrinsicRaw,
              candidate,
            ) {
              if (
                phase4IntrinsicRaw !== 'true' &&
                phase4IntrinsicRaw !== 'false'
              ) {
                throw new Error('Phase 4 applicability is unavailable');
              }
              return phase4IntrinsicRaw === 'true' ||
                stablePrLabelNames(candidate)
                  .includes('needs-external-review');
            }
            // END APPROVAL PHASE 4 DECISION

            async function protectCurrentDirectReview(reason) {
              const directReview =
                context.eventName === 'pull_request_review' &&
                context.payload.review &&
                context.payload.review.state === 'approved'
                  ? context.payload.review
                  : null;
              return protectDurableApproval({
                directReview,
                reviewerLists: [
                  process.env.REVIEWERS_JSON,
                  process.env.EVENT_REVIEWERS_JSON,
                ],
                dismiss: approval => dismissReviewFailClosed({
                  reviewId: approval.id,
                  dismiss: () => github.rest.pulls.dismissReview({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: context.payload.pull_request.number,
                    review_id: approval.id,
                    message: `Approval policy snapshot could not stabilize ` +
                      `(${reason}). This registered-agent approval was ` +
                      `dismissed conservatively; submit a fresh approval on ` +
                      `the current PR state.`,
                  }),
                  read: async () => {
                    const response = await github.rest.pulls.getReview({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      pull_number: context.payload.pull_request.number,
                      review_id: approval.id,
                    });
                    return response.data;
                  },
                  notice: () => core.notice(
                    `Approval ${approval.id} was already dismissed by an ` +
                    `overlapping enforcement run.`,
                  ),
                }),
              });
            }

            async function failClosedBeforeClassification(reason, message) {
              const dismissed = await protectCurrentDirectReview(reason);
              if (dismissed) {
                core.notice(
                  'The durable registered-agent approval was dismissed before ' +
                  'this unstable run stopped.',
                );
              }
              core.setFailed(message);
            }

            core.setOutput('eligible_approval', 'false');
            core.setOutput('snapshot_current', 'false');
            if (process.env.TRIAGE_RESULT !== 'success') {
              await failClosedBeforeClassification(
                'live triage did not complete',
                'Phase 4 classification did not complete; refusing to ' +
                'classify or consume approvals.',
              );
              return;
            }

            const eventPr = context.payload.pull_request;
            const policySnapshot = candidate => JSON.stringify({
              head: candidate && candidate.head && candidate.head.sha,
              baseRef: candidate && candidate.base && candidate.base.ref,
              baseSha: candidate && candidate.base && candidate.base.sha,
            });
            const enforcementSnapshot = candidate =>
              approvalEnforcementSnapshot(candidate, policySnapshot);
            const triageSnapshot = JSON.stringify({
              head: process.env.TRIAGE_HEAD || '',
              baseRef: process.env.TRIAGE_BASE_REF || '',
              baseSha: process.env.TRIAGE_BASE_SHA || '',
            });
            let livePrResponse;
            try {
              livePrResponse = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: eventPr.number,
              });
            } catch (error) {
              await failClosedBeforeClassification(
                `live PR read failed: ${error.message}`,
                `Could not read the live PR (${error.message}); refusing to ` +
                `consume approvals.`,
              );
              return;
            }
            let pr = livePrResponse.data;
            if (policySnapshot(pr) !== triageSnapshot) {
              await failClosedBeforeClassification(
                'PR head/base changed after live triage',
                'The PR changed after live triage; refusing to classify with ' +
                'stale governing-policy outputs. A current run must retry.',
              );
              return;
            }
            const eventPolicyCurrent =
              policySnapshot(pr) === policySnapshot(eventPr);
            if (!eventPolicyCurrent) {
              core.notice(
                'The event head/base is stale; this durable approval run will ' +
                'still classify its exact webhook review under the live ' +
                'triage policy, without persistent direct attribution.',
              );
            }
            let reviewerAccounts;
            try {
              reviewerAccounts = JSON.parse(
                process.env.REVIEWERS_JSON || '[]',
              );
            } catch (error) {
              reviewerAccounts = [];
            }
            if (
              !Array.isArray(reviewerAccounts) ||
              reviewerAccounts.length === 0 ||
              reviewerAccounts.some(reviewer =>
                typeof reviewer !== 'string' || reviewer.trim().length === 0
              )
            ) {
              await failClosedBeforeClassification(
                'governing reviewer allow-list is unavailable',
                'governing policy reviewer allow-list is unavailable; refusing to classify approval',
              );
              return;
            }

            const phase4IntrinsicRaw =
              process.env.PHASE_4_INTRINSIC_REQUIRED;
            if (
              phase4IntrinsicRaw !== 'true' &&
              phase4IntrinsicRaw !== 'false'
            ) {
              await failClosedBeforeClassification(
                'Phase 4 applicability is unavailable',
                'Phase 4 applicability is unavailable; refusing to consume approvals.',
              );
              return;
            }
            const isDirectApproval =
              context.eventName === 'pull_request_review' &&
              context.payload.review &&
              context.payload.review.state === 'approved';
            const isUnlabeledRearm =
              context.eventName === 'pull_request' &&
              context.payload.action === 'unlabeled';
            let stableReviewSnapshot;
            try {
              stableReviewSnapshot = await readStableReviewSnapshot({
                pr,
                triageSnapshot,
                enforcementSnapshot,
                policySnapshot,
                listReviews: currentPr => github.paginate(
                  github.rest.pulls.listReviews,
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: currentPr.number,
                    per_page: 100,
                  },
                ),
                readPr: async () => {
                  const response = await github.rest.pulls.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: pr.number,
                  });
                  return response.data;
                },
                notice: attempt => core.notice(
                  `The PR body, author, or labels changed during review read attempt ` +
                  `${attempt}; retrying the durable approval fallback against ` +
                  `one stable live snapshot.`,
                ),
              });
            } catch (error) {
              await failClosedBeforeClassification(
                `stable review snapshot unavailable: ${error.message}`,
                `Could not obtain one stable live review snapshot ` +
                `(${error.message}); refusing to consume approvals.`,
              );
              return;
            }
            pr = stableReviewSnapshot.pr;
            const liveReviews = stableReviewSnapshot.reviews;
            const prAuthor = pr.user.login;
            let requiresExternalReview;
            try {
              requiresExternalReview = phase4RequiredForApprovalGuard(
                phase4IntrinsicRaw,
                pr,
              );
            } catch (error) {
              await failClosedBeforeClassification(
                `live Phase 4 applicability is unavailable: ${error.message}`,
                `Could not classify live Phase 4 applicability ` +
                `(${error.message}); refusing to consume approvals.`,
              );
              return;
            }
            core.setOutput('snapshot_current', eventPolicyCurrent.toString());
            const directReview = isDirectApproval
              ? context.payload.review
              : null;
            let eventEnforcementCurrent = false;
            try {
              eventEnforcementCurrent =
                enforcementSnapshot(eventPr) === enforcementSnapshot(pr);
            } catch (error) {
              core.notice(
                `The event enforcement snapshot is unavailable ` +
                `(${error.message}); direct-event violation attribution is ` +
                `disabled for this webhook.`,
              );
            }
            const preparedApproval = prepareDirectApproval({
              liveReviews,
              directReview,
              eventEnforcementCurrent,
              liveHeadSha: pr.head.sha,
            });
            const enforcement = planApprovalEnforcement({
              reviews: preparedApproval.reviews,
              directReviewId: directReview && directReview.id,
              directAttributionCurrent:
                preparedApproval.directAttributionCurrent,
              reviewerAccounts,
              prAuthor,
              authorIdentity: process.env.AUTHOR_IDENTITY,
              prBody: pr.body || '',
              requiresExternalReview,
            });

            if (enforcement.approvals.length === 0) {
              core.info('No eligible registered approval exists for this readiness retry.');
              return;
            }

            for (const classification of enforcement.approvals) {
              const {
                review: approval,
                reviewer,
                decision,
                diagnostic: decisionDiagnostic,
                isDirectReview,
              } = classification;
              core.info(
                `Approval ${approval.id} by ${reviewer}: ` +
                `${decision.action} (${decisionDiagnostic})`,
              );

              if (decision.action !== 'block') {
                continue;
              }

              const persistentDirectViolation =
                isDirectReview && Boolean(decision.persistentViolation);
              const dismissalPrefix = persistentDirectViolation
                ? 'Approval violates the agent-independence policy'
                : isDirectReview
                  ? 'Approval independence could not be verified'
                  : 'Approval is no longer eligible under the current agent-independence policy';
              await dismissReviewFailClosed({
                reviewId: approval.id,
                dismiss: () => github.rest.pulls.dismissReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  review_id: approval.id,
                  message: `${dismissalPrefix} (${decisionDiagnostic}). ` +
                    'This review has been dismissed automatically.',
                }),
                read: async () => {
                  const response = await github.rest.pulls.getReview({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: pr.number,
                    review_id: approval.id,
                  });
                  return response.data;
                },
                notice: () => core.notice(
                  `Approval ${approval.id} was already dismissed by an ` +
                  'overlapping enforcement run; treating the write as complete.',
                ),
              });
            }

            if (enforcement.persistentDirectViolation) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: ['policy-violation'],
              });
            }

            core.setOutput(
              'eligible_approval',
              enforcement.eligibleApproval.toString(),
            );
            if (enforcement.directBlockedDiagnostics.length > 0) {
              core.setFailed(
                `Approval dismissed by the agent-independence guard ` +
                `(${enforcement.directBlockedDiagnostics.join('; ')}).`,
              );
            } else if (enforcement.blockedDiagnostics.length > 0) {
              core.notice(
                `Dismissed ${enforcement.blockedDiagnostics.length} approval(s) that ` +
                `became ineligible before the ${isUnlabeledRearm ? 'unlabeled' : 'update'} readiness evaluation.`,
              );
            }

      - name: Retract durable auto-merge
        id: retract_shared_author
        if: ${{ always() }}
        env:
          # SHARED_AUTHOR_DISARM_REQUIRED_V1. The marker name is retained for
          # rollout compatibility. This workflow write only disables
          # auto-merge; it can never arm or merge the PR.
          GH_TOKEN: ${{ github.token }}
          AUTHOR_IDENTITY: ${{ needs.triage.outputs.author_identity }}
          SNAPSHOT_CURRENT: ${{ steps.check.outputs.snapshot_current }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Default closed. The legacy output means only "run privileged
          # readiness validation"; it never authorizes a merge mutation.
          echo "auto_arm_allowed=false" >> "$GITHUB_OUTPUT"
          if ! pr_state=$(gh pr view "$PR_NUMBER" --repo "$REPO" \
            --json author,autoMergeRequest,url,headRefOid,baseRefName,baseRefOid); then
            echo "::error::Could not read live PR author or auto-merge state."
            exit 1
          fi
          if ! jq -e '
            type == "object" and
            (.author.login | type == "string" and length > 0) and
            (.url | type == "string" and length > 0) and
            (.headRefOid | type == "string" and length > 0) and
            (.baseRefName | type == "string" and length > 0) and
            (.baseRefOid | type == "string" and length > 0) and
            has("autoMergeRequest") and
            ((.autoMergeRequest == null) or (.autoMergeRequest | type == "object"))
          ' >/dev/null 2>&1 <<<"$pr_state"; then
            echo "::error::Live PR author or auto-merge metadata is malformed."
            exit 1
          fi
          native_author=$(jq -r '.author.login' <<<"$pr_state")
          live_head=$(jq -r '.headRefOid' <<<"$pr_state")
          live_base_ref=$(jq -r '.baseRefName' <<<"$pr_state")
          live_base_sha=$(jq -r '.baseRefOid' <<<"$pr_state")
          if [ "${SNAPSHOT_CURRENT:-}" != "true" ] \
            || [ "$live_head" != "${EVENT_HEAD:-}" ] \
            || [ "$live_base_ref" != "${EVENT_BASE_REF:-}" ] \
            || [ "$live_base_sha" != "${EVENT_BASE_SHA:-}" ]; then
            echo "::warning::The event head/base is stale or unclassified; treating the live auto-merge arm as unclassified."
            AUTHOR_IDENTITY=""
          fi
          if [ -z "${AUTHOR_IDENTITY:-}" ]; then
            if jq -e '.autoMergeRequest == null' >/dev/null <<<"$pr_state"; then
              echo "Governing author_identity is unavailable, but no auto-merge request exists; readiness continuation remains disabled."
              exit 0
            fi
            echo "::warning::Governing author_identity is unavailable; retracting the existing unclassified auto-merge request fail closed."
          elif [ "$native_author" != "$AUTHOR_IDENTITY" ]; then
            echo "auto_arm_allowed=true" >> "$GITHUB_OUTPUT"
            if jq -e '.autoMergeRequest == null' >/dev/null <<<"$pr_state"; then
              echo "Native non-shared PR is eligible for readiness validation and has no durable arm."
              exit 0
            fi
            echo "::warning::Native non-shared PR has a head-only durable arm; retracting it pending the #1058 merge-group boundary."
          elif jq -e '.autoMergeRequest == null' >/dev/null <<<"$pr_state"; then
            echo "Shared-author PR has no auto-merge request to retract; readiness continuation remains disabled."
            exit 0
          fi
          pr_url=$(jq -r '.url' <<<"$pr_state")
          if ! gh pr merge "$pr_url" --repo "$REPO" --disable-auto; then # NO_BARE_GH_WRITE_EXEMPT: github.token is write-scoped and disable-only cleanup intentionally applies across head drift; tuple readback fails closed
            echo "::error::Could not retract durable auto-merge."
            exit 1
          fi
          if ! readback=$(gh pr view "$PR_NUMBER" --repo "$REPO" \
            --json author,autoMergeRequest,headRefOid); then
            echo "::error::Could not verify durable auto-merge retraction."
            exit 1
          fi
          if ! jq -e --arg author "$native_author" --arg head "$live_head" '
            (.author.login == $author) and
            (.headRefOid == $head) and
            has("autoMergeRequest") and
            .autoMergeRequest == null
          ' >/dev/null 2>&1 <<<"$readback"; then
            echo "::error::Durable auto-merge retraction did not persist."
            exit 1
          fi
          echo "Durable or unclassified auto-merge retraction verified."

  # ──────────────────────────────────────────────
  # Job 6: Approval readiness (legacy job id retained for consumers)
  # ──────────────────────────────────────────────
  # The job must wait for detect-disagreement, block-self-approval, and triage
  # because each sibling can apply a blocking label or invalidate an approval.
  # Triage also recomputes Phase 4 applicability for synchronize, reopen,
  # approved-review, and blocking-label-removal events. The guard exports a
  # live eligible-approval result and the legacy-named auto_arm_allowed output;
  # the latter now means only that a native non-shared PR may enter readiness
  # validation. It is never permission to arm, enqueue, or merge.
  #
  # Three event shapes re-evaluate readiness (#495, #620): a newly submitted
  # approval; synchronize or reopen with a surviving registered latest-state
  # approval; and removal of a blocking label after clearance settles. Edited
  # events only invalidate mutable approval provenance and deliberately do not
  # enter this job. Every path rechecks the governing author identity, labels,
  # required checks, clearance, accounting, conversations, and live approval
  # independence. The trusted continuation then retracts every durable arm and
  # reports stable unarmed readiness. #1058 owns the future merge-group boundary.
  auto-merge-on-approval:
    needs: [load-config, detect-disagreement, block-self-approval, triage]
    # Job-level override (replaces rather than merges with the workflow
    # default above): adds security-events: read, required for
    # scripts/workflow/approval-merge-continuation.sh's
    # review-feedback-accounting.sh call, which reads code-scanning/alerts
    # to grade a github-advanced-security[bot] finding's severity (#1101).
    # That call runs under ACCOUNTING_GH_TOKEN (this job's GITHUB_TOKEN,
    # not the AUTHOR_MERGE_TOKEN this job otherwise uses) specifically so
    # this permissions block can reach it — CodeRabbit on PR #1106.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      security-events: read
    if: >
      always() &&
      ((github.event_name == 'pull_request_review' &&
        github.event.review.state == 'approved') ||
       (github.event_name == 'pull_request' &&
        (github.event.action == 'synchronize' ||
         github.event.action == 'reopened' ||
         (github.event.action == 'unlabeled' &&
          contains(fromJSON('["needs-external-review","needs-human-review","policy-violation","human-hold"]'), github.event.label.name))))) &&
      needs.triage.result == 'success' &&
      needs.block-self-approval.result == 'success' &&
      needs.block-self-approval.outputs.eligible_approval == 'true' &&
      needs.block-self-approval.outputs.auto_arm_allowed == 'true' &&
      !contains(github.event.pull_request.labels.*.name, 'needs-external-review') &&
      !contains(github.event.pull_request.labels.*.name, 'needs-human-review') &&
      !contains(github.event.pull_request.labels.*.name, 'human-hold')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job holds the author readiness token. Its helper scripts must
          # come from the trusted default branch, never the PR checkout.
          ref: ${{ github.event.repository.default_branch }}
          # Explicit-token API path only, no authenticated git, so don't
          # leave the checkout token in .git/config (#548 / Codex #550).
          persist-credentials: false

      # Readiness retry gate (#495). On a `synchronize` / `reopened` event
      # the approval is NOT in the event payload, so confirm via the API
      # that a valid non-author latest-state APPROVED review already
      # exists before continuing. On the `pull_request_review` approved path
      # the approval IS the trigger, so this step is skipped and `proceed`
      # defaults to true for the downstream guard.
      #
      # Approval semantics mirror scripts/codex-review-check.sh gate (b)
      # and scripts/disagreement-detector.cjs: collapse to each reviewer's
      # LATEST opinionated review (APPROVED / CHANGES_REQUESTED /
      # DISMISSED; COMMENTED is informational), exclude the PR author
      # (GitHub blocks reviewer == author for native approval anyway), and
      # require that latest state to be APPROVED. A later
      # CHANGES_REQUESTED or DISMISSED from the same reviewer supersedes an
      # earlier APPROVED, so a withdrawn approval does not establish readiness.
      - name: Gate require existing non-author approval
        id: require_approval
        if: >
          github.event_name == 'pull_request' ||
          github.event_name == 'pull_request_review'
        env:
          GH_TOKEN: ${{ secrets.CI_ACTOR_TOKEN || secrets.REVIEWER_ASSIGNMENT_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
          # #529 / #544: restrict the approval that enters readiness to a
          # REGISTERED agent reviewer identity (available_reviewers), matching
          # scripts/codex-review-check.sh gate (b) and the required
          # merge-clearance-gate. An APPROVED from an account that is NOT a
          # mapped reviewer identity must not enter readiness on EITHER path:
          # the synchronize retry (existing-review API check below) OR the
          # direct pull_request_review approved event. #544 review: the gate
          # previously ran only on pull_request, so a direct approval from an
          # unregistered non-author skipped it (the merge-clearance-gate still
          # backstopped the actual merge, but the readiness gate should be
          # consistent on both paths).
          EVENT_REVIEWER: ${{ github.event.review.user.login }}
          REVIEWERS_JSON: ${{ needs.load-config.outputs.reviewers }}
        run: |
          REVIEWERS_JSON="${REVIEWERS_JSON:-[]}"
          # Direct approval event: the approval IS the trigger, so verify the
          # event reviewer is a registered, non-author reviewer here (#544).
          if [ "${GITHUB_EVENT_NAME:-}" = "pull_request_review" ]; then
            if [ -z "$EVENT_REVIEWER" ] || [ "$EVENT_REVIEWER" = "$PR_AUTHOR" ]; then
              echo "::notice::Approval reviewer '$EVENT_REVIEWER' is empty or the PR author; readiness denied."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if ! printf '%s' "$REVIEWERS_JSON" | jq -e --arg r "$EVENT_REVIEWER" 'index($r) != null' >/dev/null 2>&1; then
              echo "::notice::Approval reviewer '$EVENT_REVIEWER' is not a registered reviewer (available_reviewers); readiness denied (#544)."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Direct approval from registered reviewer $EVENT_REVIEWER; proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --- synchronize / reopened readiness path (existing API check) ---
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::Neither CI_ACTOR_TOKEN nor REVIEWER_ASSIGNMENT_TOKEN is configured; cannot confirm an existing approval for the synchronize readiness retry."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fetch raw pages then flatten with `jq -s 'add // []'` BEFORE
          # aggregating. `gh api --paginate --jq` applies the filter per
          # page, so a `group_by` over a >30-review history (default page
          # size) would collapse each page in isolation and miss a later
          # CHANGES_REQUESTED on a subsequent page. Flatten first, then run
          # the latest-state-per-reviewer collapse over the full array.
          # Mirrors fetch_api_array() in scripts/codex-review-check.sh.
          if ! RAW=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews" 2>&1); then
            echo "::error::Could not read reviews to confirm an existing approval ($RAW). Failing closed — readiness denied."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Latest opinionated review per non-author REGISTERED reviewer;
          # pass only when at least one such reviewer's latest state is
          # APPROVED. `-s` (slurp) merges the per-page arrays into one
          # list-of-arrays; `add // []` then flattens to the full review
          # array. #529: the `IN($reviewers[])` filter restricts to
          # available_reviewers identities — an approval from a non-reviewer
          # account does NOT count. Default to [] so an empty/failed
          # load-config fails CLOSED (no reviewer matches → no readiness).
          REVIEWERS_JSON="${REVIEWERS_JSON:-[]}"
          if ! APPROVER=$(printf '%s' "$RAW" | jq -r -s \
            --arg author "$PR_AUTHOR" \
            --argjson reviewers "$REVIEWERS_JSON" '
              [ (add // []) | .[]
                | select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED")
                | select(.user.login != $author)
                | select(.user.login | IN($reviewers[]))
              ]
              | group_by(.user.login)
              | map(max_by(.submitted_at))
              | map(select(.state == "APPROVED"))
              | first
              | if . == null then "" else .user.login end' 2>/dev/null); then
            echo "::error::Could not parse review list to confirm an existing approval. Failing closed — readiness denied."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$APPROVER" ]; then
            echo "::notice::No valid non-author APPROVED review from a registered reviewer (available_reviewers) on PR #$PR_NUMBER; a push does not establish readiness without one (#495/#529)."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Existing non-author approval found ($APPROVER); proceeding with the synchronize readiness retry."
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Check author readiness token
        id: author_merge_token
        # Skip privileged readiness when the require_approval gate set
        # proceed=false — either the synchronize retry found no existing
        # registered-reviewer approval, or (since #544) the direct
        # pull_request_review approver was not a registered reviewer. The
        # `!= 'false'` test still lets a genuine registered-reviewer approval
        # (proceed=true) and any other event shape (empty) through.
        if: steps.require_approval.outputs.proceed != 'false'
        env:
          GH_TOKEN: ${{ secrets.AUTHOR_MERGE_TOKEN }}
          # The author identity this token must resolve to comes from the
          # policy that GOVERNS this PR — the base branch's — which
          # `load-config` already resolved through
          # scripts/workflow/resolve_base_policy.sh (#788).
          #
          # This step used to parse `author_identity` out of THIS job's
          # checkout, and that checkout is not pinned: on a `pull_request`
          # event checkout materializes `refs/pull/N/merge`, so the
          # expected identity came from the PR's OWN copy of the policy, and on
          # a `pull_request_review` event it came from a different file again.
          # Two answers for one PR, neither of them the governing one — the
          # remaining half of #788, on the surface that issue named explicitly
          # (the approval-readiness gate). A PR must not be able to nominate
          # the identity that is allowed to merge it by editing policy on its
          # own branch, and on a non-default base the default-branch copy is
          # equally wrong in the other direction: it can name an identity the
          # base policy does not permit to merge there.
          EXPECTED_AUTHOR: ${{ needs.load-config.outputs.author_identity }}
          # Diagnostic only, and an env var rather than a `${{ }}` expansion
          # inside the shell below: a ref name interpolated into script text is
          # the workflow-injection shape this repo keeps out of `run:` blocks.
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::AUTHOR_MERGE_TOKEN is not configured; privileged readiness evaluation is disabled. Merge manually as the author identity."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # FAIL CLOSED on an unproven identity. An empty value means
          # `load-config` could not resolve the governing policy (or was itself
          # skipped — this job runs under `always()`), and it is exactly the
          # fail-closed output scripts/workflow/load_review_config.sh emits in
          # that case. Defaulting to a hard-coded login here would evaluate
          # under an identity no policy we can read has authorized, which is the
          # substitution #768/#769/#788 exist to prevent. Disabling readiness
          # path costs nothing that is not already lost: the same fail-closed
          # load-config emits `reviewers=[]`, so the readiness-admission gate
          # above has already rejected every approver. The author merges manually, and
          # the required merge-clearance gate is untouched either way.
          expected_author="${EXPECTED_AUTHOR:-}"
          if [ -z "$expected_author" ]; then
            echo "::notice::The review policy governing this PR's base branch yielded no author_identity, so privileged readiness evaluation is disabled (#788). Merge manually as the author identity."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! actual_author=$(gh api user --jq .login); then
            echo "::error::AUTHOR_MERGE_TOKEN could not authenticate to GitHub. Refusing privileged readiness evaluation."
            exit 1
          fi
          if [ "$actual_author" != "$expected_author" ]; then
            echo "::error::AUTHOR_MERGE_TOKEN resolves to '$actual_author', expected '$expected_author' (author_identity in the policy governing base branch '${BASE_REF:-?}'). Refusing privileged readiness evaluation."
            exit 1
          fi

          echo "Author readiness token verified for identity: $actual_author"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Re-verify blocking labels before readiness probe
        if: steps.author_merge_token.outputs.enabled == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.AUTHOR_MERGE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Guard against the TOCTOU race between the trigger-time label
          # snapshot and the actual merge. The job's top-level `if:` expression
          # evaluates labels from the `pull_request_review` event payload at
          # the moment GitHub Actions dispatched the event. Two things can
          # make that snapshot stale by the time we reach the merge step:
          #
          #   1. Eventual consistency. If a label is applied milliseconds
          #      before the review event fires, the event payload can still
          #      be generated without the label attached. Observed on PR #60
          #      (2026-04-14), where the `needs-external-review` label was
          #      applied 2 seconds before the review event but the job's
          #      `if:` check evaluated to true anyway, merging the PR before
          #      any external review could happen. See #61.
          #
          #   2. Other jobs can legitimately apply a blocking label after
          #      approval while this job is evaluating current-head checks.
          #      The trigger payload does not reflect that later mutation.
          #
          # Re-fetch the authoritative label state from the GitHub API before
          # entering the readiness probe. The shared continuation repeats this
          # check, along with feedback-accounting and conversation-resolution
          # gates before reporting readiness. Abort if any blocking
          # label is now present. Also check `policy-violation`, which is applied by the
          # block-self-approval job earlier in this same workflow run (and
          # again, the `if:` at job start wouldn't have seen it).
          # The trusted default-branch checkout intentionally lags an atomic
          # workflow+helper rollout by one merge. Source the shared helper when
          # it is present; retain the exact bootstrap predicate for the first
          # mergepath or consumer rollout so approval does not fail before the
          # helper has landed on that repository's default branch.
          if [ -f scripts/lib/blocking-labels.sh ]; then
            # shellcheck source=scripts/lib/blocking-labels.sh
            source scripts/lib/blocking-labels.sh
          else
            mergepath_blocking_labels_csv() {
              awk '$0 == "needs-external-review" || $0 == "needs-human-review" || $0 == "policy-violation" || $0 == "human-hold"' \
                | paste -sd, -
            }
          fi
          LABELS=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '.labels[].name')
          printf 'Labels at readiness time:\n%s\n' "$LABELS"
          blocking_labels=$(printf '%s\n' "$LABELS" | mergepath_blocking_labels_csv)
          if [ -n "$blocking_labels" ]; then
            echo "::error::Blocking label(s) present at readiness time: $blocking_labels."
            exit 1
          fi
          echo "No blocking labels present — proceeding with readiness validation."


      - name: Probe current-head check readiness once
        id: check_readiness
        if: steps.author_merge_token.outputs.enabled == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.AUTHOR_MERGE_TOKEN }}
          REPO: ${{ github.repository }}
          REQUIRED_HEAD_CHECK_NAME: lint
        run: |
          # Resolve the check-run names that must be green on the PR head.
          # Shared with dependabot-auto-merge.yml and the approval
          # continuation so all three enforce ONE list with one
          # implementation; see scripts/required-head-checks.sh for why the
          # value is per-consumer and read from the default branch.
          # First-rollout guard (#1070). On the PR introducing this helper,
          # and on each consumer's first propagation PR, the checkout can
          # predate the script. Fall back to the PRE-#1070 behaviour --
          # `lint` alone -- rather than failing closed: a repo without the
          # script cannot have received the config file either, so there is
          # no configured gate to drop. This is NOT the indeterminate-read
          # case, which stays fail-closed inside the script.
          if [ ! -f scripts/required-head-checks.sh ]; then
            echo "::notice::scripts/required-head-checks.sh absent (pre-#1070 checkout); using the default required head check."
            required_check_names="lint"
          elif ! required_check_names=$(bash scripts/required-head-checks.sh --repo "$REPO" --list); then
            echo "::error::could not resolve the required head-check list; refusing to report merge readiness."
            exit 1
          fi
          if [ -z "$required_check_names" ]; then
            echo "::error::required head-check list resolved empty; refusing to report merge readiness."
            exit 1
          fi
          echo "::notice::required head checks:"
          printf '%s\n' "$required_check_names" | sed 's/^/::notice::  /'
          # Retained for the diagnostics below, which name a single check.
          required_check_name=$(printf '%s\n' "$required_check_names" | head -n 1)
          # Approval is durable readiness state. This job probes current-head
          # checks exactly once; it never reserves a runner while CI executes.
          # A successful repo-lint / annex / policy workflow later wakes the
          # trusted continuation in auto-clear-blocking-labels.yml, which
          # reruns the complete merge gate and final mutable-state readback.
          pr_view_json=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid,isCrossRepository,baseRefName,headRefName)
          sha=$(echo "$pr_view_json" | jq -r .headRefOid)
          # #655 Codex P2 round 9 ("wait for valid push-only annex
          # workflows"): a push-only annex trigger only fires IN THIS REPO
          # for a same-repo PR (a fork PRs push lands in the fork, never
          # registering a push event here) -- isCrossRepository is gh pr
          # view's own field for this, no extra API call needed.
          annex_same_repo_pr=$(echo "$pr_view_json" | jq -r 'if .isCrossRepository then "false" else "true" end')
          # #655 Codex P2 round 11 ("evaluate base-branch filters before
          # passing"): a pull_request branches/branches-ignore filter is
          # matched against the PRs BASE ref; a push branches/branches-ignore
          # filter is matched against the ref actually being pushed, which
          # for a same-repo PRs synchronize event is the PRs own HEAD ref
          # (the feature branch), not base. Both already on this same
          # pr_view_json call, no extra API call needed.
          annex_base_branch=$(echo "$pr_view_json" | jq -r '.baseRefName // ""')
          annex_head_branch=$(echo "$pr_view_json" | jq -r '.headRefName // ""')
          # #655 Codex P2 round 16 ("wait for path-matched annex
          # workflows", narrowed in round 17 -- "use the event diff when
          # emulating path filters", found on the codex-review-check.sh
          # copy and mirrored here): paginated the same way as the reviews
          # fetch above (flatten with jq -s BEFORE deriving filenames).
          # #655 Codex P2 round 17 ("fail closed when the changed-file
          # lookup fails", Codex; "don't silently treat changed-files API
          # failures as filtered out", CodeRabbit): the round-16 version
          # piped stderr into stdout (2>&1) with no failure check, so a
          # failed gh api call fed an error message into jq, which failed
          # too, silently collapsing annex_changed_files_json to empty --
          # indistinguishable from "genuinely fetched, zero files" on the
          # ruby side, wrongly treated as "paths definitely does not
          # match". Explicit success/failure branching keeps a failed
          # fetch as an EXPLICITLY empty string (never touched by jq),
          # which the ruby probe treats as "unknown", not "no files".
          if annex_changed_files_raw=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" 2>&1); then
            annex_changed_files_json=$(printf '%s' "$annex_changed_files_raw" | jq -s 'add // []' | jq -c '[.[].filename]')
          else
            annex_changed_files_json=""
            echo "::warning::Could not fetch PR changed files ($annex_changed_files_raw) -- paths/paths-ignore annex filters will be treated as unresolvable (conservative default, #655 round 17)."
          fi

          # #655: a consumer's optional, never-propagated repo_lint_local.yml
          # annex (#601) produces a check run that branch protection does not
          # require, and this step — before this fix — did not observe either,
          # so it could report readiness with a red or missing annex check.
          # Probe the PR HEAD commit for the annex file via the Contents API
          # (not this job's own checkout — its ref is not guaranteed to be the
          # PR head on every trigger shape this workflow handles) and require
          # its check run(s) too when present. Absent (the common case,
          # including mergepath itself) is a no-op: only `lint` is required,
          # unchanged from before.
          #
          # required_checks_json stays scoped to ONLY the canonical
          # `required_check_name` entry -- it is a hard requirement this
          # one-shot readiness probe evaluates. The repo_lint_local.yml annex
          # must NOT be enforced the
          # same way (#655 Codex P2 round 6, "avoid forcing path-filtered
          # annex jobs to start"): a consumer annex scoped by workflow-level
          # `paths`/`paths-ignore` legitimately produces NO check run at all
          # for a PR outside those paths, and earlier rounds forcing its
          # derived name(s) into this hard-required list made the old wait
          # loop refuse readiness on every such PR. Annex enforcement instead
          # runs as a separate workflow-wide scan below (annex_workflow),
          # mirroring codex-review-check.sh gate (a): match by the stable
          # .workflowPath rather than by a specific job name, block immediately
          # on any REPORTED bad conclusion, report not-ready while anything
          # for that workflow is still in flight, and treat "nothing reported
          # for this workflow at all"
          # as non-blocking -- the same trade-off gate (a) already made and
          # validated across #655 rounds 2-5.
          # Built from the resolved LIST. The consumers of this array below
          # (check_count, .[$i].name, the rollup filter) already iterate it
          # generically, so widening one name to several needs no change
          # there. The scoping rule in the comment above is unchanged: only
          # explicitly-configured hard requirements land here, never the
          # path-filtered annex.
          # -R over the NEWLINE list: check-run names contain spaces
          # ("Merge clearance gate"), so word-splitting would shatter them
          # into names that do not exist and this probe would never be ready.
          required_checks_json=$(printf '%s\n' "$required_check_names" \
            | jq -R . | jq -s -c '[.[] | select(length > 0) | {name: ., workflow: ""}]')
          annex_workflow=""
          annex_unfiltered="false"
          annex_probe_err=$(mktemp)
          if annex_content=$(gh api "repos/$REPO/contents/.github/workflows/repo_lint_local.yml?ref=$sha" --jq .content 2>"$annex_probe_err"); then
            # The annex contract (scripts/ci/check_ci_scripts_wired) only requires
            # a real push/pull_request-triggered workflow that wires local
            # checks — it does NOT require the job (and therefore check-run)
            # name to be `repo-lint-local` (Codex P2 on #655), nor does it ban
            # path filters. Derive the annex's own top-level workflow name the
            # same way check_ci_scripts_wired parses its `on:` trigger
            # (safe_load + rescue), rather than assuming the filename
            # convention or that the workflow is unconditionally triggered.
            #
            # Matrix-strategy jobs are skipped during NAME derivation (#655
            # Codex P2 round 3): GitHub expands a matrix job into one check
            # run per combination with a name this static YAML read cannot
            # reproduce. They are NOT invisible to enforcement, though (#655
            # Codex P1 round 6, "observe matrix annex jobs before
            # auto-merge") -- annex_workflow is captured regardless of
            # whether any job names were derived, so the workflow-wide scan
            # below still catches a reported matrix-leg failure by workflow
            # identity, without needing to know its expanded name in advance.
            # ruby's stderr is NOT redirected here (unlike the base64
            # decode) so the skip notice surfaces in the workflow log.
            annex_probe_raw=$(printf '%s' "$annex_content" | base64 -d 2>/dev/null | ANNEX_SAME_REPO_PR="$annex_same_repo_pr" ANNEX_BASE_BRANCH="$annex_base_branch" ANNEX_HEAD_BRANCH="$annex_head_branch" ANNEX_CHANGED_FILES_JSON="$annex_changed_files_json" ruby -ryaml -rjson -e '
              raw = STDIN.read
              # #655 Codex P1 round 7 ("parse valid annex workflows that use
              # YAML aliases"): GitHub Actions supports anchors/aliases in
              # workflow files, but Psych safe_load defaults to
              # aliases:false specifically to block the "billion laughs"
              # DoS (a small file whose nested aliases expand
              # exponentially at parse time). This parses a PRs OWN branch
              # content, so any repo accepting external contributions is
              # exposed to a crafted repo_lint_local.yml exhausting CI
              # runner memory/CPU. Allow aliases, but bound the attack
              # surface first: a byte-size cap (legitimate CI configs are a
              # few KB) plus a raw anchor/alias token count cap (the
              # exploit needs many alias references to achieve exponential
              # blowup; a legitimate DRY job template reuses one or two) --
              # counted on the RAW text before parsing, since the danger is
              # in the expansion itself, not the input size.
              if raw.bytesize > 100_000
                STDERR.puts "repo_lint_local.yml exceeds 100000 bytes -- refusing to parse (defensive cap, not a realistic legitimate size, #655)"
                exit
              end
              # #655 Codex P2 round 8 ("avoid treating path globs as YAML
              # aliases"): a naive `[&*]word` scan over-counts, since an
              # ordinary glob like `**/*.ts` in a paths:/paths-ignore: list
              # starts with `*` too -- inflating the count on a perfectly
              # legitimate annex with a longer filter list past the cap. A
              # real YAML anchor/alias can ONLY appear immediately after a
              # structural position: start of text; a block-sequence dash
              # (which requires being the first non-whitespace character
              # on its line, with a MANDATORY space before the value --
              # narrowed in round 9, see below); or `:`, `,`, `[`, `{`
              # anywhere, optionally followed by whitespace. A glob string
              # value is never in that position unquoted (a bare scalar
              # starting with `*` is itself a YAML syntax error, confirmed
              # empirically), and a QUOTED glob has a leading quote
              # character that breaks the match.
              #
              # #655 Codex P2 round 9 ("do not count glob hyphens as YAML
              # aliases"): the round 8 version accepted a bare `-` ANYWHERE
              # in the text (with optional trailing whitespace) as a
              # structural position, which also matched an internal hyphen
              # inside a glob directly before a `*` (e.g.
              # "src/component-*.ts") with no space between them --
              # inflating the count on a filter list using hyphenated
              # names. A real block-sequence dash is anchored to the start
              # of its line (only preceded by indentation) and REQUIRES at
              # least one space before its value, unlike a mid-string
              # hyphen.
              if raw.scan(/(?:\A|^[ \t]*-\s+|[:,\[{]\s*)[&*][A-Za-z0-9_.-]+/).length > 40
                STDERR.puts "repo_lint_local.yml has an unusually high anchor/alias token count -- refusing to parse (defensive cap against a YAML alias-expansion DoS, #655)"
                exit
              end
              begin
                doc = YAML.safe_load(raw, aliases: true)
              rescue Psych::Exception
                exit
              end
              exit unless doc.is_a?(Hash) && doc["jobs"].is_a?(Hash)
              # #655 Codex P2 round 6: when the annex omits a top-level
              # `name:`, GitHub displays (and reports into
              # statusCheckRollup .workflowName as) the workflow FILE PATH,
              # not an empty string -- an empty workflow_name would disable
              # the workflow-wide scan below, even for a valid annex with
              # reported job failures.
              workflow_name = doc["name"] ? doc["name"].to_s : ".github/workflows/repo_lint_local.yml"
              jobs = []
              doc["jobs"].each do |id, job|
