name: CodeRabbit Severity Gate

# Enforces nathanjohnpayne/mergepath#574/#577: CodeRabbit inline-review
# findings whose mapped tier (see `feedback_policy` in
# .github/review-policy.yml) is `required` must be resolved (via the GitHub
# UI's "Resolve conversation" button or the GraphQL `resolveReviewThread`
# mutation) before a PR can merge. The CodeRabbit twin of
# .github/workflows/codex-p1-gate.yml.
#
# Reports "CodeRabbit blocking-tier unresolved: N" via
# scripts/coderabbit-severity-gate.sh. The script exits 1 (gate fails)
# when any CodeRabbit blocking-tier thread on the current HEAD is
# unresolved, and 3 when a current-HEAD review run has not published its
# PR-level summary yet — the event-driven job answers 3 by going non-green
# and the sweep by declining to publish, so no publisher posts a verdict
# read off the previous publication.
#
# Gate ON/OFF is controlled by coderabbit.severity_gate.enabled in
# .github/review-policy.yml. Mergepath sets it to true (the canonical
# source). Downstream consumers default to false — today CodeRabbit has no
# merge gate — so this is a clean no-op (always green) when off and safe to
# require everywhere ahead of flipping the switch per repo (the same
# narrow-start posture as the Codex P1 gate).
#
# Re-runs on every push to a PR AND on every review-related event, so a
# human who clicks "Resolve conversation" on a blocking-tier thread sees the
# gate go green without needing a push.
#
# Trigger shape note (mirrors codex-p1-gate.yml / #257 codex CR): GitHub
# Actions does NOT document `pull_request_review_thread` as a workflow
# trigger. It exists as a webhook event for GitHub Apps, but the Actions
# "events-that-trigger-workflows" reference omits it
# (https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows),
# and adding it to `on:` is a no-op in practice — clicking "Resolve
# conversation" produces no workflow run. To cover the UI-resolve case we
# combine:
#   - pull_request + pull_request_review + pull_request_review_comment
#     for the event-driven path (push, review submit/edit/dismiss,
#     inline comment activity).
#   - schedule (every 30 minutes since #2167) as the safety net for the UI-resolve
#     case, since no other event fires when a human clicks "Resolve
#     conversation" on a thread.
# The schedule job is read-only and idempotent (no-op when no open PRs
# match — and a no-op when the gate is disabled, which is the default), so
# the 30-min cadence is safe to run unconditionally across this repo.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  # pull_request_review_comment fires when a reviewer posts (or edits /
  # deletes) an inline diff comment. Catches the case where CodeRabbit
  # posts a new blocking-tier finding mid-review without a fresh
  # review-submission event.
  pull_request_review_comment:
    types: [created, edited, deleted]
  # issue_comment is the PR-LEVEL comment surface (#832, Codex P1 round 2 on
  # #886). Since the gate started classifying CodeRabbit's PR-level summary, a
  # blocking finding can appear, change, or disappear with no pull_request*
  # event firing at all — and so can the acknowledgement token that clears one.
  # Without this trigger a previously-green required check stays green for up
  # to one sweep interval (30 minutes) after CodeRabbit publishes a summary-only finding, and the
  # PR is mergeable through that window; symmetrically, an ack cannot turn a
  # red check green promptly.
  #
  # Routed to the SWEEP job, not the event-driven one, and that is not an
  # arbitrary choice: Actions only attaches a check to a PR's head SHA for
  # pull_request* events, so an issue_comment-triggered run of the event-driven
  # job would produce a workflow run that never updates the required check.
  # The sweep already posts a check_run on the head SHA via the Checks API for
  # exactly this reason, so the fix is to reuse it, scoped to the one PR.
  issue_comment:
    types: [created, edited, deleted]
  # Periodic sweep — catches the "human clicks Resolve conversation on a
  # CodeRabbit blocking-tier thread" case. The thread-resolution webhook
  # fires but does NOT trigger Actions workflows (no Actions event for it
  # per GitHub docs), so without the schedule the required check would stay
  # red until the next push or manual rerun. */30 since #2167 (was */15,
  # mirroring codex-p1-gate.yml): every tick walks every open PR against the
  # shared 1,000/hr installation-token budget; a UI-resolved thread now waits
  # up to 30 minutes. Pinned by check_required_check_publisher.
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read
  pull-requests: read
  # `issues: read` for the gate script's `/issues/{pr}/comments` read — the
  # PR-level SUMMARY surface (#832). CodeRabbit can carry a blocking finding
  # solely in its summary, which has no inline anchor; the gate classifies that
  # surface too. Not optional and not merely a nicety: that read is fail-CLOSED
  # (an unreadable endpoint exits 2, which this workflow turns into a CI
  # failure), so without this scope the gate would 403 and go red on every PR.
  # Same scope, same endpoint, same reason as merge-clearance-gate.yml (Codex
  # P2 on PR #429).
  issues: read
  # `checks: write` is required for the scheduled sweep job: it posts a
  # check_run on each open PR's head SHA so a UI-resolve clears the
  # stuck-red required check without a push. The event-driven job below
  # produces its check natively (Actions auto-creates the check on the PR's
  # head when triggered by pull_request* events) and would not need this
  # permission on its own.
  checks: write

jobs:
  coderabbit-severity-gate:
    name: CodeRabbit unresolved blocking findings
    runs-on: ubuntu-latest
    # Event-driven path. The scheduled sweep below runs the same gate but
    # on every open PR via the Checks API; gating this job away from the
    # sweep's events avoids paying for an empty no-op run.
    #
    # `issue_comment` is excluded as well as `schedule` (Codex P2 round 3 on
    # #886). It has to be an explicit exclusion, not an inherited one: this
    # job's PR resolver only understands `pull_request*` payloads, so leaving
    # the condition as `!= 'schedule'` started this job on every PR and issue
    # comment in the repo and failed it at "Unsupported event" — a red job on
    # ordinary conversation, and under the name of the REQUIRED check. Adding
    # a trigger to `on:` obliges every job in the file to say whether it
    # handles it.
    if: >-
      github.event_name != 'schedule'
      && github.event_name != 'issue_comment'
    steps:
      - name: Checkout repo (default branch — trusted gate script)
        # Pin to the default branch, NOT the PR HEAD. The gate is a
        # REQUIRED status check: if it ran scripts/coderabbit-severity-gate.sh
        # from the PR's own checkout, a PR could edit that script to
        # `exit 0`, satisfy the required check, and merge past unresolved
        # blocking-tier threads in the window before the scheduled sweep
        # re-evaluates. Satisfying a required check IS the weaponization.
        # The gate script doesn't need the PR diff anyway: it takes a PR
        # number + repo and queries the GitHub API. Same trusted-checkout
        # posture as codex-p1-gate.yml.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          # persist-credentials: false: this job only runs the API-driven
          # scripts/coderabbit-severity-gate.sh — it never pushes or uses
          # the workspace git remote, so no token needs to linger in
          # .git/config (#545 zizmor artipacked posture).
          persist-credentials: false
          # Shallow checkout: the gate is API-driven (takes a PR number +
          # repo and queries the GitHub API) — it never reads git history.
          fetch-depth: 1

      - name: Resolve PR number
        id: pr
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_JSON: ${{ toJSON(github.event) }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request|pull_request_review|pull_request_review_comment)
              pr=$(jq -r '.pull_request.number' <<<"$EVENT_JSON")
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then
            echo "Could not resolve PR number from event payload." >&2
            exit 1
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"

      - name: Run scripts/coderabbit-severity-gate.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
          # A review object can arrive before CodeRabbit publishes its
          # PR-level summary, and every publisher of this required check has to
          # honor that hold — the job, not the event, is the publisher (Codex P1
          # on #886). Scoping the flag to `pull_request_review` left the same job
          # running the arrival-INDEPENDENT scan on its other events: a
          # `pull_request_review_comment` (CodeRabbit's own inline comments fire
          # one each) or a `pull_request` [edited]/[reopened] landing inside the
          # gap published a native success over the review run's rc-3 red, on the
          # same head and under the same check name — the round-11 sweep hole,
          # reached through a sibling event instead.
          #
          # Unconditional `true` rather than a longer event allow-list, because
          # the flag is not what decides a hold: the gate holds only when a
          # completed CodeRabbit review RUN sits on the CURRENT head with no
          # correlated summary. A push cannot be in that state (its synchronize
          # event carries a NEW head that no review has touched yet), so the
          # "a push has no evidence a review started" case the old conditional
          # protected is already answered by the anchor, and an allow-list would
          # only have to grow again the next time a trigger is added. Both arms
          # now set it identically; they still ANSWER rc 3 differently (this job
          # goes non-green, the sweep declines to publish), which is where the
          # asymmetry belongs.
          REQUIRE_REVIEW_SUMMARY: "true"
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          CHECK_NAME: "CodeRabbit unresolved blocking findings"
          # Fork and Dependabot pull_request* runs hold a read-only token:
          # they cannot post the back-off red, so they are never skipped
          # (#2286, Codex P1 on #2298).
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          PR_ACTOR: ${{ github.event.pull_request.user.login }}
          # Budget guard knobs (#2286), read by
          # scripts/workflow/installation-budget.sh. One evaluation costs
          # about 4 REST requests (measured on #2249, #2265, #2292, #2232 and
          # #2225; the review-thread GraphQL reads run only when CodeRabbit
          # has inline findings on the head). The skip path below writes one
          # check run and reads the head's runs once. The reserve is the
          # publisher's own floor for one event-head evaluation (60 per PR
          # plus its 100 reserve) plus room for the skip-path writes of the
          # other gate workflows the same event starts.
          BUDGET_PER_EVAL_REQUESTS: "10"
          BUDGET_RESERVE_REQUESTS: "200"
          BUDGET_PER_EVAL_GRAPHQL_POINTS: "5"
          BUDGET_GRAPHQL_RESERVE_POINTS: "75"
        run: |
          set -euo pipefail
          # Bootstrap (nathanjohnpayne/mergepath#577): we run the TRUSTED copy of
          # the gate script from the default branch (checked out above), never
          # the PR HEAD. On the PR that INTRODUCES this gate the script does not
          # exist on the default branch yet, so there is nothing to run — soft-
          # pass. The gate cannot guard its own introduction (that PR is human/
          # Codex reviewed), and it activates for every subsequent PR the moment
          # this merges. A PR cannot fake this to bypass the gate: the check is
          # against the default-branch tree, which no unmerged PR can alter.
          if [ ! -f scripts/coderabbit-severity-gate.sh ]; then
            echo "::notice::coderabbit-severity-gate.sh is not on the default branch yet (bootstrap PR introducing the gate); soft-passing — the gate activates for all PRs once this merges."
            exit 0
          fi
          # The script is the source of truth for what blocks merge.
          # Exit codes:
          #   0 = no unresolved blocking-tier findings on HEAD (or gate disabled)
          #   1 = unresolved blocking-tier findings present (gate blocks)
          #   2 = config / usage error (CI failure, not a gate block)
          #   3 = a current-HEAD review run is awaiting its PR-level summary
          #
          # Budget guard (#2286). This job publishes no Checks-API run of its
          # own, so a run that does not evaluate (the guard skipped it, or the
          # evaluation died on the exhausted installation budget) first POSTs
          # the publisher's back-off red under the required name on the head:
          # never a green, and its title records the reset, so the
          # publisher's due() leaves the PR alone until then and its first
          # pass after the reset (an event pass on any PR, or the */30
          # chained full pass) re-evaluates it with no manual rerun. The
          # job-native run then concludes non-failing ONLY when
          # scripts/gate-api-lineage-blocking.sh confirms that the
          # Checks-API lineage blocks the head on its own, outside this
          # run's suite (the #2247 rule); otherwise it fails as before. A
          # native red here would sit in this run's own suite until someone
          # reran it. An unreadable budget, or a default branch without the
          # library, evaluates as before.
          budget_stop() {  # <rc> <reason> <skipped|rate-limited> [gate output]
            local reset title
            if [ "$3" = skipped ]; then
              reset=$(ib_short_bucket_reset)
            else
              reset=$(ib_exhausted_reset "${4:-}")
            fi
            title=$(ib_backoff_title "$CHECK_NAME" "$1" "$reset")
            gh api -X POST "repos/$REPO/check-runs" \
              -f name="$CHECK_NAME" -f head_sha="$HEAD_SHA" \
              -f status=completed -f conclusion=failure \
              -f "output[title]=$title" \
              -f "output[summary]=Not evaluated: $2 (#2286). The publisher re-evaluates this head after ${reset:-the window resets}." \
              >/dev/null || echo "::warning::Could not post the back-off red on $HEAD_SHA."
            if [ -x scripts/gate-api-lineage-blocking.sh ] \
               && scripts/gate-api-lineage-blocking.sh "$REPO" "$HEAD_SHA" "$CHECK_NAME" "$RUN_ID"; then
              echo "::notice::$CHECK_NAME was not evaluated on $HEAD_SHA ($2). This job-native run concludes non-failing by design (#2286); the Checks-API run of the same name carries the block until the publisher re-evaluates the head."
              exit 0
            fi
            echo "::error::$CHECK_NAME was not evaluated on $HEAD_SHA ($2), and the Checks-API lineage could not be confirmed to block, so the job-native run fails (#2286)."
            exit 1
          }
          #
          # A fork or Dependabot run holds a read-only token, so it could not
          # post that red, the lineage proof would fail, and its native run
          # would fail for nothing but the budget. It evaluates as before
          # instead, always (#2286, Codex P1 on #2298). `[ = ]`, not a case
          # glob: "dependabot[bot]" in a case arm is a character class.
          budget_lib=false
          read_only=false
          if [ "${IS_FORK:-}" = true ] || [ "${PR_ACTOR:-}" = "dependabot[bot]" ]; then
            read_only=true
            echo "Read-only token (fork or Dependabot): evaluating without the budget guard (#2286)."
          fi
          if [ "$read_only" = false ] && [ -r scripts/workflow/installation-budget.sh ]; then
            # shellcheck source=scripts/workflow/installation-budget.sh
            . scripts/workflow/installation-budget.sh
            budget_lib=true
            ib_read "$BUDGET_PER_EVAL_REQUESTS" "$BUDGET_RESERVE_REQUESTS" \
              "$BUDGET_PER_EVAL_GRAPHQL_POINTS" "$BUDGET_GRAPHQL_RESERVE_POINTS"
            if ! ib_affordable 1; then
              budget_stop 2 "the installation API budget ($rl_remaining REST request(s), ${gql_remaining:-?} GraphQL point(s)) is short of one evaluation plus the $BUDGET_RESERVE_REQUESTS-request reserve" skipped
            fi
          elif [ "$read_only" = false ]; then
            echo "::notice::scripts/workflow/installation-budget.sh is not on the default branch yet; evaluating without the budget guard (#2286)."
          fi
          gate_out=$(mktemp)
          set +e
          scripts/coderabbit-severity-gate.sh "$PR_NUMBER" "$REPO" 2>&1 | tee "$gate_out"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 2 ] && [ "$budget_lib" = true ] \
             && ib_rate_limited "$(cat "$gate_out")"; then
            # The gate stops at its first failed read; nothing more is
            # evaluated in this run (#2286).
            budget_stop 2 "the gate failed on the exhausted installation API budget" rate-limited "$(cat "$gate_out")"
          fi
          if [ "$rc" -eq 2 ]; then
            echo "::error::coderabbit-severity-gate.sh exited 2 (config/usage error)"
            exit 1
          fi
          if [ "$rc" -eq 3 ]; then
            # Non-green, deliberately. This job publishes the NATIVE check for
            # this head, so declining to publish is not available to it — the
            # check would simply keep whatever the previous event left, which is
            # the success this hold exists to withhold. The sweep is the arm
            # that skips instead (#886).
            echo "::error::CodeRabbit review on this HEAD has not published its PR-level summary yet; holding this run non-green until it does"
            exit 1
          fi
          exit "$rc"

  scheduled-sweep:
    name: CodeRabbit severity scheduled sweep
    # Periodic re-evaluation across every open PR. Required because:
    #   - GitHub Actions does NOT support pull_request_review_thread as a
    #     workflow trigger (see top-of-file comment).
    #   - When a human clicks "Resolve conversation" on a CodeRabbit
    #     blocking-tier thread, no Actions event fires — so the required
    #     check `CodeRabbit unresolved blocking findings` stays red on the
    #     PR's head SHA until a push or manual rerun.
    # This sweep walks every open PR, runs the same gate script, and posts a
    # fresh check_run on each PR's head SHA via the Checks API.
    # Required-check resolution keys on (head_sha, name), so the new check
    # supersedes the stale red one. Idempotent: no-op when the gate result
    # is unchanged (and a clean pass everywhere the gate is disabled).
    #
    # Also serves `issue_comment` on a PR (#832 / Codex P1 round 2 on #886) —
    # a summary finding or its acknowledgement lands on that surface and fires
    # no pull_request* event, and only this job can refresh the required check
    # on the head SHA. The job NAME is deliberately left reading "scheduled"
    # despite now serving two triggers: check names are load-bearing in this
    # repo's branch protection, and renaming one to gain descriptive accuracy
    # is not worth the class of breakage that causes.
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'issue_comment'
          && github.event.issue.pull_request != null)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (default branch — trusted scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1

      - name: Find open PRs
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_PR: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          . scripts/workflow/required-check-generation.sh
          # issue_comment path (#832): re-evaluate ONLY the PR that received
          # the comment. Sweeping all open PRs on every PR comment would turn
          # ordinary conversation into a repo-wide gate re-run.
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            if [ -z "$COMMENT_PR" ] || [ "$COMMENT_PR" = "null" ]; then
              echo "::error::issue_comment event carried no issue number"
              exit 1
            fi
            {
              echo 'prs<<EOF'
              printf '%s\n' "$COMMENT_PR"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # List ALL open PRs. The gate script itself short-circuits when
          # coderabbit.severity_gate.enabled=false, so we don't filter by
          # label here. `--limit 500` mirrors codex-p1-gate.yml's bound.
          # Bounded retry: a single transient API failure here used to fail
          # the whole sweep. Only three consecutive failures are fatal.
          list_ok=0
          for attempt in 1 2 3; do
            if prs_raw=$(gh pr list --repo "$REPO" --state open \
              --limit 500 --json number --jq '.[].number'); then
              list_ok=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          if [ "$list_ok" -ne 1 ]; then
            echo "::error::Failed to list open PRs on $REPO after 3 attempts"
            exit 1
          fi
          if [ -z "$prs_raw" ]; then
            echo "No open PRs on $REPO; sweep is a no-op."
            echo "prs=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo 'prs<<EOF'
            printf '%s\n' "$prs_raw"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Re-evaluate gate per PR and post check_run
        if: steps.find.outputs.prs != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRS: ${{ steps.find.outputs.prs }}
          REPO: ${{ github.repository }}
          # Check name MUST match the event-driven job name above so branch
          # protection's required-check entry resolves either source as the
          # same gate. GitHub keys required checks on (head_sha, name); a
          # fresh check_run with the same name supersedes the stale one.
          CHECK_NAME: "CodeRabbit unresolved blocking findings"
          # The sweep honors the publication hold too (Codex P1 + CodeRabbit
          # Major on #886). Without it the sweep is a second publisher of the
          # same required check running the arrival-INDEPENDENT scan, so a sweep
          # landing between a review object and its PR-level summary posted
          # success over the review run's red and reopened the gap. It is safe
          # here precisely because the sweep answers rc 3 by DECLINING TO
          # PUBLISH: the hold withholds a success, it never manufactures a red
          # this arm cannot retire.
          REQUIRE_REVIEW_SUMMARY: "true"
          EVENT_NAME: ${{ github.event_name }}
          # Budget guard knobs for the issue_comment path (#2286), read by
          # scripts/workflow/installation-budget.sh. One evaluation of the
          # commented PR costs about 18 REST requests and 2 GraphQL points:
          # two head reads, the generation open, two four-surface
          # fingerprints (one GraphQL page each), the gate's 4, and
          # rcg_close's binding read, three revalidation reads and PATCH.
          # The reserve matches the event job's. The scheduled sweep is not
          # guarded here: it is the delivery-independent backstop (#2224).
          BUDGET_PER_EVAL_REQUESTS: "25"
          BUDGET_RESERVE_REQUESTS: "200"
          BUDGET_PER_EVAL_GRAPHQL_POINTS: "5"
          BUDGET_GRAPHQL_RESERVE_POINTS: "75"
        run: |
          set -euo pipefail
          . scripts/workflow/required-check-generation.sh
          # Bootstrap (see the event-driven job): the trusted script is run from
          # the default-branch checkout. Until this gate merges to the default
          # branch the script is absent there, so the sweep has nothing to run —
          # no-op rather than 127 for every open PR.
          if [ ! -f scripts/coderabbit-severity-gate.sh ]; then
            echo "::notice::coderabbit-severity-gate.sh is not on the default branch yet (bootstrap); sweep is a no-op until the gate merges."
            exit 0
          fi
          # Budget guard, issue_comment path only (#2286). A PR comment
          # re-evaluates the one commented PR. When the installation budget
          # cannot cover that plus the reserve, the PR's head gets the
          # publisher's back-off red instead (two requests: the head read and
          # the POST): never a green, and its title records the reset, so
          # the publisher's due() leaves the PR alone until then and its
          # first pass after the reset re-evaluates it with no manual rerun.
          # This job's own native check is not a required context and is
          # attached to the default branch, so the run ends green. An
          # unreadable budget, or a default branch without the library,
          # evaluates as before.
          budget_lib=false
          if [ "${EVENT_NAME:-}" = issue_comment ] && [ -r scripts/workflow/installation-budget.sh ]; then
            # shellcheck source=scripts/workflow/installation-budget.sh
            . scripts/workflow/installation-budget.sh
            budget_lib=true
            ib_read "$BUDGET_PER_EVAL_REQUESTS" "$BUDGET_RESERVE_REQUESTS" \
              "$BUDGET_PER_EVAL_GRAPHQL_POINTS" "$BUDGET_GRAPHQL_RESERVE_POINTS"
            if ! ib_affordable 1; then
              reset=$(ib_short_bucket_reset)
              title=$(ib_backoff_title "$CHECK_NAME" 2 "$reset")
              echo "::notice::Budget guard (#2286): $rl_remaining REST request(s) and ${gql_remaining:-?} GraphQL point(s) remain, short of one evaluation plus the $BUDGET_RESERVE_REQUESTS-request reserve; posting the back-off red instead of evaluating."
              while IFS= read -r PR; do
                [ -n "$PR" ] || continue
                if ! head_sha=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha) \
                    || ! [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
                  echo "::warning::Could not read PR #$PR's head; its previous verdict stands until the publisher's next pass."
                  continue
                fi
                gh api -X POST "repos/$REPO/check-runs" \
                  -f name="$CHECK_NAME" -f head_sha="$head_sha" \
                  -f status=completed -f conclusion=failure \
                  -f "output[title]=$title" \
                  -f "output[summary]=Not evaluated: the installation API budget is short (#2286). The publisher re-evaluates this head after ${reset:-the window resets}." \
                  >/dev/null || echo "::warning::Could not post the back-off red on PR #$PR."
              done <<<"$PRS"
              exit 0
            fi
          fi
          budget_stopped=0
          had_infra_error=0
          while IFS= read -r PR; do
            [ -z "$PR" ] && continue
            echo "::group::Sweep PR #$PR"

            head_sha=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha) || { had_infra_error=1; echo "::endgroup::"; continue; }
            if ! generation_id=$(rcg_open "$REPO" "$PR" "$head_sha" "$CHECK_NAME"); then
              had_infra_error=1
              echo "::endgroup::"
              continue
            fi

            # Keep the head bound by rcg_open. Its final live-head fence
            # closes this same generation red if the PR moves meanwhile.

            # STALE-SNAPSHOT GUARD (Codex round 4 + Phase 4b P1 on #886).
            # Two comment events close together produce two concurrent sweeps,
            # and because same-name check runs supersede one another, an OLDER
            # run finishing last can republish a stale SUCCESS over a newer,
            # correct FAILURE — leaving the required check green on a summary
            # whose acknowledgement was just edited or deleted.
            #
            # Fixed by compare-and-swap on the surface the verdict is computed
            # from, NOT by a `concurrency:` block. mergepath#843 established
            # that adding `concurrency` to a job publishing a required check
            # cancels the PENDING member even with `cancel-in-progress: false`,
            # leaving a `cancelled` native check that blocks merge permanently
            # and cannot be retired by a rerun. On a gate with
            # `enforce_admins: true` that trades a transient stale-green window
            # for an unfixable deadlock.
            #
            # So: fingerprint the PR-comment surface before the gate runs, and
            # again after. If it moved, another event has superseded this
            # snapshot — skip the publish and let that run's (newer) verdict
            # stand. Nothing is cancelled, so no run ever owes a check_run it
            # cannot deliver, and the scheduled sweep remains the backstop.
            #
            # The fingerprint covers each comment's BODY, not just its identity
            # metadata (Codex P1 on #886). GitHub reports `updated_at` at second
            # resolution, so an acknowledgement or summary edited twice inside
            # one second changes the verdict while `id:updated_at` stays
            # byte-identical — and the guard would then wave through exactly the
            # stale publication it exists to stop. The body is what the verdict
            # is computed from, so the body is what has to be compared.
            #
            # Raw content rather than a digest, deliberately: hashing would add
            # a dependency whose absence makes both fingerprints degrade to the
            # same value, which reads as "unchanged" and silently disables the
            # guard. A large shell variable costs nothing here.
            #
            # The record separator is written as the jq ESCAPE `\u001e`, never
            # as a raw control byte (Codex P1 on #886). A literal NUL in the
            # workflow source makes the YAML document invalid — Ruby Psych
            # rejects it with "control characters are not allowed" — and GitHub
            # would then refuse to register the workflow at all, silently
            # removing a required check rather than failing a run. jq expands
            # the escape at runtime, so the delimiter is still a byte that
            # cannot occur in a comment body, while the file stays printable.
            # The snapshot covers EVERY surface the verdict is computed from,
            # and that is all FOUR of them (Codex P1 on #886). Sampling only the
            # PR-comment and review-object surfaces left the gate's ORIGINAL and
            # primary input unguarded: the verdict counts unresolved blocking
            # INLINE findings, and it computes those from pulls/{pr}/comments
            # (the finding bodies the tier ladder grades) and from GraphQL
            # reviewThreads (`isResolved`). A thread resolved — or a finding
            # posted, edited, or deleted — between the gate's read and the
            # Checks API POST leaves a comments+reviews fingerprint
            # byte-identical, so the guard waves through a verdict computed
            # against a surface that has since moved: a stale success
            # republished over a now-unresolved blocking finding, standing until
            # the next sweep. The review-object part is here for the same reason
            # one step earlier — with REQUIRE_REVIEW_SUMMARY set, the gate
            # reads pulls/{pr}/reviews to decide whether a current-head run is
            # awaiting its summary, and a review submitted inside that window
            # republished green over the pull_request_review job's rc 3 red. A
            # surface the verdict depends on and the guard does not sample is
            # not guarded.
            #
            # The thread part samples `id:isResolved` and not the thread's
            # comment ids: resolution state is the only thing that surface
            # contributes to the verdict, and the finding bodies it would
            # otherwise duplicate are already covered by the inline part.
            #
            # ANY read failing fails the WHOLE fingerprint, which the caller
            # answers by skipping the publication. A half-read surface must never
            # become a fingerprint: it would compare equal to the other run's
            # half-read and read as "unchanged", which is the guard silently
            # disabling itself — the same reasoning as the no-sentinel rule
            # below.
            #
            # The parts are joined with the OCTAL escape `\035` (group
            # separator), never the raw byte that escape stands for: POSIX printf
            # defines octal escapes while `\uNNNN` is a bash 4.2+ extension, and
            # a byte no comment, review, or node id can contain is what keeps the
            # parts unambiguous. Same no-raw-control-byte rule as the record
            # separator above — the escape is expanded at runtime and the YAML
            # source stays printable. A raw control byte anywhere in this file
            # makes the whole document unloadable (Ruby Psych: "control
            # characters are not allowed"), which unregisters a required check
            # instead of failing a run.
            cr_surface_fp() {
              local comments reviews inline threads
              comments=$(gh api "repos/$REPO/issues/$1/comments" --paginate \
                --jq '[.[] | "\(.id):\(.updated_at):\(.body // "")"] | sort | join("\u001e")') || return 1
              reviews=$(gh api "repos/$REPO/pulls/$1/reviews" --paginate \
                --jq '[.[] | "\(.id):\(.state):\(.commit_id // ""):\(.submitted_at // ""):\(.body // "")"] | sort | join("\u001e")') || return 1
              inline=$(gh api "repos/$REPO/pulls/$1/comments" --paginate \
                --jq '[.[] | "\(.id):\(.updated_at):\(.body // "")"] | sort | join("\u001e")') || return 1
              threads=$(gh api graphql --paginate \
                -F owner="${REPO%%/*}" -F name="${REPO##*/}" -F pr="$1" \
                -f query='query($owner: String!, $name: String!, $pr: Int!, $endCursor: String) {
                  repository(owner: $owner, name: $name) {
                    pullRequest(number: $pr) {
                      reviewThreads(first: 100, after: $endCursor) {
                        pageInfo { hasNextPage endCursor }
                        nodes { id isResolved }
                      }
                    }
                  }
                }' \
                --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | "\(.id):\(.isResolved)"] | sort | join("\u001e")') || return 1
              printf '%s\035%s\035%s\035%s' "$comments" "$reviews" "$inline" "$threads"
            }

            # A read failure is NOT serialized into a sentinel: $RANDOM is not
            # a collision-proof identity, and the guard's contract is to
            # publish only after observing one stable comment surface. Keep the
            # read status separately and skip publication whenever either
            # snapshot is unreadable. The next issue-comment event or scheduled
            # sweep retries from a fresh snapshot.
            set +e
            pre_fp=$(cr_surface_fp "$PR")
            pre_fp_rc=$?
            set -e

            CR_EVIDENCE_REPORT=$(mktemp) || { had_infra_error=1; echo "::endgroup::"; continue; }
            export CR_EVIDENCE_REPORT
            CR_EVIDENCE_FAILURE=""
            [ "$pre_fp_rc" -eq 0 ] || CR_EVIDENCE_FAILURE="fingerprint-read-failed"
            export CR_EVIDENCE_FAILURE
            set +e
            output=$(scripts/coderabbit-severity-gate.sh "$PR" "$REPO" 2>&1)
            rc=$?
            set -e
            echo "$output"

            # issue_comment path (#2286): the gate died on the exhausted
            # installation budget. Stop here, with no further call: this
            # PR's open generation stays in progress (blocking, and due for
            # the publisher's first pass that can afford it).
            if [ "$budget_lib" = true ] && [ "$rc" -eq 2 ] && ib_rate_limited "$output"; then
              echo "::warning::PR #$PR: the gate failed on the exhausted installation API budget; leaving generation $generation_id in progress for the publisher to re-evaluate (#2286)."
              budget_stopped=1
              echo "::endgroup::"
              break
            fi

            set +e
            post_fp=$(cr_surface_fp "$PR")
            post_fp_rc=$?
            set -e
            # The gate's own FAIL-CLOSED exit outranks every snapshot guard
            # (Codex P1 on #886). rc 2 publishes a failure (see the case below),
            # but both `continue`s underneath used to run FIRST, and the two
            # failures they skip on are correlated rather than independent: the
            # fingerprint and the gate read the SAME issues/{pr}/comments
            # endpoint, so an endpoint that is unreadable makes pre/post_fp_rc
            # nonzero AND the gate exit 2 in the same breath. The skip then
            # swallowed the fail-closed verdict and left whatever check_run was
            # already on the head standing — which since #832 can be a SUCCESS
            # recorded before an acknowledgement was edited away. That is the
            # exact hole the round-6 rc 2 fix closed, reopened through the guard,
            # and reopened in the common case rather than a rare one.
            #
            # Safe to publish past a guard that cannot compare, because rc 2 is
            # not a verdict read off a stale surface — it is "this run could not
            # read", and the failure it posts is retired by the next sweep the
            # moment the read succeeds. That is what separates it from the rc 3
            # hold below, which must not mint a red no arm can retire.
            gate_infra_error=0
            case "$rc" in
              0|1|3) ;;
              *) gate_infra_error=1 ;;
            esac
            if [ "$gate_infra_error" -eq 0 ] \
              && { [ "$pre_fp_rc" -ne 0 ] || [ "$post_fp_rc" -ne 0 ]; }; then
              echo "::error::PR #$PR comment surface could not be fingerprinted; closing only this generation red."
              if [ "$rc" -eq 0 ]; then
                : >"$CR_EVIDENCE_REPORT"
                set +e
                output=$(CR_EVIDENCE_FAILURE="fingerprint-read-failed" scripts/coderabbit-severity-gate.sh "$PR" "$REPO" 2>&1)
                rc=$?
                set -e
              fi
              had_infra_error=1
            fi
            if [ "$gate_infra_error" -eq 0 ] && [ "$pre_fp" != "$post_fp" ]; then
              # Deliberately a NOTICE, not a warning or error: a superseded
              # snapshot is the guard working, not a failure. The run that
              # caused the change publishes the current verdict.
              echo "::notice::PR #$PR comment surface changed while the gate ran; closing this generation red for a fresh evaluation."
              : >"$CR_EVIDENCE_REPORT"
              rc=2
              had_infra_error=1
            fi

            case "$rc" in
              0) conclusion="success" ;;
              1) conclusion="failure" ;;
              3) conclusion="failure" ;;
              *)
                # rc 2 PUBLISHES A FAILURE, it does not skip (Codex P1 round 6
                # on #886). Skipping left whatever check_run was already on the
                # head standing — and since #832 that stale check can be a
                # SUCCESS recorded before an acknowledgement was edited or
                # deleted, so branch protection would let the now-unacknowledged
                # summary merge until a later sweep happened to succeed. The
                # gate's own rc 2 is fail-closed for exactly this reason; the
                # sweep has to carry that through to the check it publishes
                # rather than quietly declining to publish one. The snapshot
                # guards above are ordered behind this for the same reason —
                # see the `gate_infra_error` note there.
                echo "::error::coderabbit-severity-gate.sh rc=$rc on PR #$PR (config/usage error)"
                had_infra_error=1
                conclusion="failure"
                ;;
            esac

            # Truncate to stay under GitHub's 65535-char summary limit.
            # Bash slice, NOT `printf | head -c`: under `set -euo pipefail`
            # a >60KB output makes head close the pipe early, printf takes
            # SIGPIPE (141), pipefail propagates it, and `summary=$(...)`
            # aborts the sweep BEFORE the check_run POST — fail-open on the
            # UI-resolve path this sweep exists to close. Slicing is
            # pipefail-safe + char-based (same fix as codex-p1-gate.yml).
            summary="${output:0:60000}"

            # Posting the check_run IS the sweep's whole purpose — it's what
            # supersedes the stale red required-check after a UI
            # thread-resolve. If the POST fails, the sweep did not do its
            # job; that's an infra error, not a warning.
            if ! rcg_close "$REPO" "$PR" "$head_sha" "$CHECK_NAME" "$generation_id" "$conclusion" \
              "CodeRabbit severity gate (scheduled re-evaluation)" "$summary"; then
              echo "::error::Failed to post check_run for PR #$PR — stale required check not refreshed."
              had_infra_error=1
            fi
            echo "::endgroup::"
          done <<<"$PRS"
          if [ "$budget_stopped" -eq 1 ]; then
            echo "::notice::Stopped at an installation API rate-limit failure (#2286); the publisher re-evaluates the commented PR once the budget allows."
          fi
          if [ "$had_infra_error" -ne 0 ]; then
            echo "::error::Sweep finished with one or more infra errors"
            exit 1
          fi
