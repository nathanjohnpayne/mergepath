name: Auto-clear blocking labels

# Closes the manual-label-removal toil documented in #191.
#
# When the codex-review-check.sh merge gate clears (CI green +
# reviewer-identity APPROVED + Codex cleared on HEAD), this workflow
# removes the `needs-external-review` label automatically. Without it,
# every over-threshold PR requires the human to do
# `gh pr edit <N> --remove-label needs-external-review` after agents
# have done all the actual review work.
#
# Scope: ONLY removes `needs-external-review`. `needs-human-review`,
# `policy-violation`, and `human-hold` remain manual-only by design (see
# REVIEW_POLICY.md § Agent prohibitions). The doctrine carve-out for
# this workflow ships in #196.

on:
  # `edited` + `reopened` (#730): a body/title edit is the reliable way to
  # re-fire the merge-clearance gate for a claude-authored Phase-4 PR after a
  # LATE Codex clearance — an `issue_comment` (Codex's verdict) does not fire
  # `pull_request` workflows, but a body edit does. Before #730 that nudge
  # re-evaluated the gate yet never prompted auto-clear on the PR head, so
  # `needs-external-review` stayed stuck until the 5-min sweep or a human
  # removed it (observed on #729). This trigger gives DIRECT PR context
  # (`.pull_request.number`) with no dependency on the flaky
  # `workflow_run.pull_requests` array. `reopened` covers a reopen with the
  # label still present. The `unlabeled`-self-fire guard below still applies.
  pull_request_target:
    types: [synchronize, edited, reopened, labeled, unlabeled]
  # workflow_run fires on completion of OTHER workflows. We target
  # the three that produce the required-check signals codex-review-
  # check.sh inspects: PR Review Policy (Label Gate, Self-Review,
  # External Review Check), Agent Review Pipeline (auto-merge-on-
  # approval, detect-disagreement, etc.), and repo-lint (lint).
  # This replaces the prior `check_suite` trigger, which (per codex
  # P1 on PR #202) does NOT fire for suites created by GitHub
  # Actions — only for external CI providers. Without workflow_run,
  # the common path of "reviewer approves → Actions CI catches up →
  # gate now passes" produced no event and the label stayed stuck.
  #
  # "repo-lint-local" (#655) is a consumer's optional, never-propagated
  # repo_lint_local.yml annex (#601) — a per-consumer workflow named
  # exactly this (verified against a live consumer annex; mergepath
  # itself carries no such workflow, so this entry never fires here).
  # Without it, this workflow's re-evaluation of a consumer's
  # needs-external-review label only learns about a repo-lint-local
  # completion via the 5-minute scheduled sweep below, not immediately.
  # codex-review-check.sh's gate (a) is what actually enforces a red
  # repo-lint-local as blocking (see scripts/codex-review-check.sh);
  # this entry only improves how promptly that re-evaluation runs.
  #
  # #655 Codex P3 round 11 ("include the unnamed annex workflow
  # trigger"): workflow_run matches by the target workflow's displayed
  # NAME, which for an annex that omits a top-level `name:` (a case the
  # gate code has explicitly supported since round 6) is the workflow
  # FILE PATH, not the literal "repo-lint-local" above. Listing the file
  # path too closes that gap for this promptness-only trigger; the
  # scheduled sweep below still covers it either way, just less
  # immediately.
  # "Merge Clearance Gate" (#730): its SUCCESS is the most direct signal that
  # clearance state changed, and — unlike "PR Review Policy" — it actually
  # REACHES `conclusion: success` when the gate clears. PR Review Policy's
  # Label Gate job is red for as long as `needs-external-review` is present, so
  # that workflow can never complete `success` while the label is up; the
  # `conclusion != success` skip in the resolve step below therefore means it
  # never triggers auto-clear (a chicken-and-egg the gate workflow avoids
  # because it is not itself gated on the label). Adding the gate closes the
  # gap where a late Codex clearance flips the gate green but no listened
  # workflow fires auto-clear on the PR head (observed on #729).
  workflow_run:
    workflows:
      - "PR Review Policy"
      - "Agent Review Pipeline"
      - "Merge Clearance Gate"
      - "repo-lint"
      - "repo-lint-local"
      - ".github/workflows/repo_lint_local.yml"
    types: [completed]
  # #2239: the authoritative `Merge clearance gate` verdict is posted by
  # required-check-publisher.yml, which none of the workflow_run parents above
  # observes. When a publisher pass posts a GREEN verdict on the head of a PR
  # that still carries needs-external-review, its nominate-auto-clear job sends
  # this event carrying only the PR number, so the label goes within one run
  # instead of waiting for the sweep below. The same job nominates a
  # label-absent PR whose newest auto-clear-blocking-labels check-run is a
  # failure, so a heal that failed after a removal is retried (#2205).
  # repository_dispatch has no ref: GitHub runs only the default branch's copy
  # of this file, and a GITHUB_TOKEN dispatch does start a run. The payload is
  # trusted for nothing beyond the PR number: the evaluate-and-clear job
  # re-derives clearance from live state exactly as for every other event, and
  # fences the live head/base before the DELETE.
  repository_dispatch:
    types: [auto-clear-evaluate]
  # Periodic sweep — catches the 👍-after-last-push case (codex
  # reacts on the PR issue but no synchronize / review / workflow_run
  # event fires, so the event-driven path stays inert). Runs every
  # 5 minutes against any open PR carrying needs-external-review.
  # Idempotent (no-op when label absent or gate not yet met). Sub-C
  # of #191. See scheduled-sweep job below for the cadence knob.
  #
  # Tightened from 15→5 min in mergepath#324 to close the
  # 👍-after-last-push gap observed across the mergepath#250 Phase D
  # propagation fanout (3 of 6 consumer PRs needed manual
  # request-label-removal.sh because no event-driven trigger
  # fired and the prior 15-min sweep stranded them for up to 15 min
  # after Codex cleared). 3× the API quota cost, but a meaningfully
  # shorter blocker window. The PAT-driven label removal added in
  # #324 also helps — but the sweep is still the only backstop for
  # the no-event path. It also re-enters the approval continuation for open
  # approved PRs. That backstop covers a consumer annex with a custom display
  # name, which cannot be enumerated in workflow_run.workflows.
  schedule:
    - cron: '*/5 * * * *'

permissions:
  pull-requests: write
  contents: read
  # codex-review-check.sh drills statusCheckRollup →
  # checkSuite.workflowRun, which needs `actions: read` in addition
  # to the `checks` scope. Without it the GraphQL fails with `Resource
  # not accessible by integration` and the gate evaluation aborts
  # with rc=3, leaving `needs-external-review` stuck on every
  # consumer PR after Codex approves. Surfaced on
  # nathanjohnpayne/matchline#233 (#306 propagation canary); see
  # #310 for the full repro + permission scope rationale.
  actions: read
  # `issues: read` is required because codex-review-check.sh reads
  # the issues-scoped /issues/{pr}/timeline (force-push anchor). PR
  # reactions are not a Codex-clearance input; comment reactions are
  # read only by the opt-in request diagnostics
  # (CODEX_REVIEW_CHECK_REPORT_REQUEST_EVIDENCE=1), which these jobs
  # do not enable. On a restricted-default GITHUB_TOKEN an omitted
  # scope defaults to `none`, so the timeline read 403s and the gate
  # aborts with rc=3,
  # leaving `needs-external-review` stuck even after Codex clears.
  # Same class as the merge-clearance-gate.yml fix on PR #429; see
  # #431.
  issues: read
  # `checks: write` is required so the "Surface infra failure as
  # check-run" step (#324) can POST a failed check-run to the PR's
  # checks tab when this workflow hits an infrastructure error
  # (failed label read, failed label removal, codex-review-check.sh
  # rc=3, contract-drift rc). Without a visible check-run, flake
  # recurrences are invisible unless someone happens to look at the
  # workflow run log. `write` supersets `read`, so this single entry
  # also covers codex-review-check.sh's check-reading need — do NOT
  # re-add a separate `checks: read` key: a duplicate `checks:` map
  # key is a startup-failure-level workflow file error (#324 shipped
  # exactly that regression; the parser rejected the file and every
  # trigger produced a zero-job failed run, so the label never
  # auto-cleared).
  checks: write
  # Required for scripts/workflow/approval-merge-continuation.sh's
  # review-feedback-accounting.sh call (both jobs below reach it), which
  # reads code-scanning/alerts to grade a github-advanced-security[bot]
  # finding's severity (#1101). That call runs under ACCOUNTING_GH_TOKEN
  # (this workflow's GITHUB_TOKEN, not the ambient AUTHOR_MERGE_TOKEN the
  # continuation steps otherwise use) specifically so this block can reach
  # it — CodeRabbit on PR #1106.
  security-events: read

jobs:
  evaluate-and-clear:
    name: Re-evaluate codex-review-check gate
    runs-on: ubuntu-latest
    # These are environment secrets, never repository secrets. The environment
    # permits only main-associated deployments, so a candidate-controlled
    # pull_request/pull_request_review workflow cannot request either PAT.
    environment: merge-queue-policy
    # Self-fire loop guard: when this workflow's label removal fires
    # the `unlabeled` event for `needs-external-review`, skip — we
    # just removed it; nothing to do.
    # Schedule guard: cron runs the scheduled-sweep job below; the
    # event-driven path is moot for scheduled invocations. CR Major
    # on PR #213 r2 — without this, every 15-min cron paid for an
    # extra checkout-only no-op job.
    if: |
      github.event_name != 'schedule' &&
      !(
        github.event_name == 'pull_request_target' &&
        github.event.action == 'unlabeled' &&
        github.event.label.name == 'needs-external-review'
      )
    steps:
      - name: Checkout repo (for codex-review-check.sh)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # SECURITY: pin to the default branch so we always run the
          # TRUSTED copy of scripts/codex-review-check.sh — never a
          # candidate version. pull_request_review reaches this path only
          # indirectly, after Agent Review Pipeline completes and emits the
          # trusted-definition workflow_run event.
          ref: ${{ github.event.repository.default_branch }}
          # Need full history so codex-review-check can inspect the
          # PR HEAD against base. The script doesn't currently do that
          # but a future tightening might.
          fetch-depth: 0
          # Explicit-token gh only, no authenticated git, so don't leave the
          # checkout token in .git/config (#548 / Codex #550).
          persist-credentials: false

      - name: Installation budget guard (#2286)
        # Reads GET /rate_limit (free) for this workflow's GITHUB_TOKEN
        # through the publisher's own reader,
        # scripts/workflow/installation-budget.sh. When the installation
        # budget cannot cover one evaluation plus the reserve, nothing below
        # runs: no PR is resolved or evaluated, no label is removed (the
        # label stays, which keeps Label Gate red: fail closed), and no
        # auto-clear-blocking-labels check-run is posted (an infra-failure
        # run there would make the PR UNSTABLE until healed, #2193). The
        # job ends green with a notice. The PR is re-evaluated by the */5
        # scheduled sweep below, which is not budget-guarded, and by the
        # publisher's auto-clear nomination after its next green clearance
        # verdict. An unreadable budget, or a default branch without the
        # library, evaluates as before.
        id: budget
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # Installation-token cost of one evaluation (codex-review-check.sh
          # itself runs on the CI PAT: 20 REST and 3 GraphQL measured on
          # #2249): the live head/base read, the pre-DELETE fence read, the
          # protective-retraction reads of approval-merge-continuation.sh
          # (about 4, counted from the script), the workflow_run fallback's
          # open-PR list (one GraphQL query) and, on a workflow_run event,
          # the continuation step's retraction reads again. The reserve
          # matches the other event workflows (#2286).
          BUDGET_PER_EVAL_REQUESTS: "15"
          BUDGET_RESERVE_REQUESTS: "200"
          BUDGET_PER_EVAL_GRAPHQL_POINTS: "5"
          BUDGET_GRAPHQL_RESERVE_POINTS: "75"
        run: |
          set -uo pipefail
          if [ ! -r scripts/workflow/installation-budget.sh ]; then
            echo "::notice::scripts/workflow/installation-budget.sh is not on the default branch yet; evaluating without the budget guard (#2286)."
            exit 0
          fi
          # shellcheck source=scripts/workflow/installation-budget.sh
          . scripts/workflow/installation-budget.sh
          ib_read "$BUDGET_PER_EVAL_REQUESTS" "$BUDGET_RESERVE_REQUESTS" \
            "$BUDGET_PER_EVAL_GRAPHQL_POINTS" "$BUDGET_GRAPHQL_RESERVE_POINTS"
          if ib_affordable 1; then
            exit 0
          fi
          echo "::notice::Budget guard (#2286): $rl_remaining REST request(s) and ${gql_remaining:-?} GraphQL point(s) remain until ${RATE_LIMIT_RESET_ISO:-the window resets}, short of one evaluation ($BUDGET_PER_EVAL_REQUESTS requests) plus the $BUDGET_RESERVE_REQUESTS-request reserve. Not evaluating: needs-external-review stays where it is, nothing is written, and the */5 sweep re-evaluates."
          echo "skip=true" >> "$GITHUB_OUTPUT"

      - name: Resolve PR number from event
        id: pr
        if: steps.budget.outputs.skip != 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_JSON: ${{ toJSON(github.event) }}
          # #730: read-only `gh pr list` fallback when workflow_run.pull_requests
          # is empty. GITHUB_TOKEN suffices (pull-requests: read is covered by
          # the workflow's pull-requests: write). No PR-controlled input reaches
          # a shell eval here — HEAD_SHA comes from the trusted event payload and
          # is only used in a jq `select`.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Each event surfaces PR number(s) differently. Emit a
          # newline-separated list (most events have exactly one PR).
          # workflow_run.completed can attach to multiple PRs in
          # principle, so we enumerate.
          case "$EVENT_NAME" in
            pull_request_target)
              prs=$(jq -r '.pull_request.number' <<<"$EVENT_JSON")
              ;;
            workflow_run)
              # Only act on successful runs of the listened workflows;
              # a failed lint or PR Review Policy run won't have
              # changed the gate state, so don't bother re-evaluating.
              conclusion=$(jq -r '.workflow_run.conclusion' <<<"$EVENT_JSON")
              if [ "$conclusion" != "success" ]; then
                echo "workflow_run conclusion=$conclusion (not success); skipping." >&2
                echo "numbers=" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              prs=$(jq -r '.workflow_run.pull_requests[].number' <<<"$EVENT_JSON")
              # #730: `workflow_run.pull_requests` is frequently EMPTY even for a
              # run whose head IS a PR head (a documented GitHub quirk for
              # same-repo PR runs, and always empty for push / issue_comment /
              # schedule-triggered runs). Without a fallback, a listened workflow
              # (notably the newly-added "Merge Clearance Gate") completing
              # SUCCESS on the PR head resolves NO PR here and the label stays
              # stuck. Fall back to the open PR whose head SHA == the run's
              # head_sha. When head_sha is a default-branch commit (the
              # concurrent-main-merge case that stole the events on #729), no
              # open PR matches → empty → correct no-op.
              if [ -z "$prs" ]; then
                HEAD_SHA=$(jq -r '.workflow_run.head_sha // empty' <<<"$EVENT_JSON")
                if [ -n "$HEAD_SHA" ]; then
                  echo "workflow_run.pull_requests empty; resolving open PRs by head_sha=$HEAD_SHA (#730)." >&2
                  # --limit 500 (mirrors the scheduled sweep) so a match beyond
                  # gh's default 30 open PRs isn't missed.
                  prs=$(gh pr list --repo "$REPO" --state open --limit 500 --json number,headRefOid 2>/dev/null \
                    | jq -r --arg sha "$HEAD_SHA" '.[] | select(.headRefOid == $sha) | .number' 2>/dev/null || true)
                fi
              fi
              ;;
            repository_dispatch)
              # #2239/#2205: a publisher nomination. Only the PR number is
              # read from the payload, and only a positive integer is
              # accepted; everything else is re-derived from live state by
              # the next step. Anything malformed fails the run as an alarm
              # (the publisher only ever sends an integer) and evaluates
              # nothing.
              action=$(jq -r '.action // empty' <<<"$EVENT_JSON")
              if [ "$action" != "auto-clear-evaluate" ]; then
                echo "repository_dispatch action '$action' is not auto-clear-evaluate; skipping." >&2
                echo "numbers=" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              prs=$(jq -r '.client_payload.pr // empty | tostring' <<<"$EVENT_JSON")
              if ! [[ "$prs" =~ ^[1-9][0-9]{0,9}$ ]]; then
                echo "::error::repository_dispatch client_payload.pr is not a positive integer: '$prs'"
                echo "numbers=" >> "$GITHUB_OUTPUT"
                exit 1
              fi
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 0  # don't fail; just skip
              ;;
          esac
          if [ -z "$prs" ]; then
            echo "No PR number resolvable from event; skipping." >&2
            echo "numbers=" >> "$GITHUB_OUTPUT"
          else
            # Multi-line output: use a heredoc per Actions docs.
            {
              echo 'numbers<<EOF'
              echo "$prs"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Re-evaluate gate per PR + remove label on pass
        id: clear
        if: steps.pr.outputs.numbers != ''
        env:
          # PAT-driven label removal (#315/#324). GITHUB_TOKEN-driven
          # events do NOT trigger downstream workflows (recursion
          # prevention) — pr-review-policy.yml's Label Gate would
          # stay stuck on the pre-clear failure state until the next
          # push or label toggle. A PAT-driven event triggers
          # downstream workflows normally, so Label Gate re-fires and
          # mergeStateStatus flips to CLEAN within seconds rather
          # than stalling until something else fires the policy
          # workflow. Closes mergepath#315. Prefers the CI-actor
          # service account (CI_ACTOR_TOKEN, nathanpayne-robot),
          # falling back to REVIEWER_ASSIGNMENT_TOKEN where that
          # secret is not provisioned. Either way it must be a PAT,
          # not GITHUB_TOKEN, or the label write fires no re-arm.
          GH_TOKEN: ${{ secrets.CI_ACTOR_TOKEN || secrets.REVIEWER_ASSIGNMENT_TOKEN }}
          WORKFLOW_TOKEN: ${{ github.token }}
          AUTHOR_TOKEN: ${{ secrets.AUTHOR_MERGE_TOKEN }}
          # Dedicated target-admin and source-read tokens for the queue proof.
          QUEUE_POLICY_TOKEN: ${{ secrets.MERGE_QUEUE_POLICY_TOKEN }}
          QUEUE_SOURCE_TOKEN: ${{ secrets.MERGE_QUEUE_SOURCE_TOKEN }}
          PR_NUMBERS: ${{ steps.pr.outputs.numbers }}
          REPO: ${{ github.repository }}
          # For resolve_base_policy.sh's base-pinned form in the pin-bump lane.
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # #2193: selects which label-absent PRs are heal candidates below.
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          # Budget stop knobs (#2286): the same values as the budget guard
          # step above.
          BUDGET_PER_EVAL_REQUESTS: "15"
          BUDGET_RESERVE_REQUESTS: "200"
          BUDGET_PER_EVAL_GRAPHQL_POINTS: "5"
          BUDGET_GRAPHQL_RESERVE_POINTS: "75"
        run: |
          set -euo pipefail
          # Source the gh-retry helper (#324). with_gh_retry wraps gh
          # calls in 3×30s retry on transient failures (HTTP 5xx,
          # rate-limit, "Resource not accessible by integration") so a
          # flaky read or write doesn't silently leave the label stuck.
          source scripts/lib/gh-retry-helpers.sh
          # codex-review-check.sh exits:
          #   0 = gate passes
          #   1 = gate fails (one or more of CI/reviewer/codex not met)
          #   3 = config/arg error (real infrastructure failure)
          # CR Major on PR #202 r1: every gh call gets explicit error
          # handling so a transient failure (rate limit, 5xx) on one
          # PR doesn't abort the sweep, AND no early gh failure is
          # silently swallowed by an asymmetric set -e/+e dance.
          # CR Major on PR #202 r2: rc=3 (infrastructure error) sets a
          # sentinel; after the sweep finishes we exit non-zero if any
          # PR hit it, so the workflow doesn't go green when gate
          # evaluation was actually impossible.
          had_infra_error=0
          failing_prs=""
          cleared_prs=""
          # #2193: PRs this pass evaluated without an infrastructure error and
          # left with needs-external-review absent. The "Heal stale auto-clear
          # infra-failure check-runs" step supersedes a stale failed
          # auto-clear-blocking-labels check-run on each one's head.
          heal_prs=""
          # Budget stop (#2286). Before EVERY PR the installation budget is
          # read again (GET /rate_limit, free, with this workflow's own
          # token), so a run that resolved several PRs stops as soon as the
          # budget cannot cover the next one, whether or not an earlier PR
          # failed (Codex P2 on #2298). A stopped PR is left untouched: its
          # label stays, fail closed, nothing is posted on it, and the */5
          # sweep re-evaluates it. A PR that was evaluated and failed keeps
          # its infrastructure error and its diagnostic check-run whatever
          # the budget reads afterwards: the budget never reclassifies a
          # failure (Codex P2 on #2298). Without the library, or with an
          # unreadable budget, every PR is evaluated as before.
          budget_lib=false
          if [ -r scripts/workflow/installation-budget.sh ]; then
            # shellcheck source=scripts/workflow/installation-budget.sh
            . scripts/workflow/installation-budget.sh
            budget_lib=true
          fi
          budget_stopped=""
          budget_stop_check() {  # <PR>: exit 0 = stop before evaluating it
            [ "$budget_lib" = true ] || return 1
            GH_TOKEN="$WORKFLOW_TOKEN" ib_read "$BUDGET_PER_EVAL_REQUESTS" "$BUDGET_RESERVE_REQUESTS" \
              "$BUDGET_PER_EVAL_GRAPHQL_POINTS" "$BUDGET_GRAPHQL_RESERVE_POINTS" >/dev/null
            if [ "$budget_known" -eq 1 ] && ! ib_affordable 1; then
              budget_stopped=" #$1 and any later PR"
              return 0
            fi
            return 1
          }
          while IFS= read -r PR; do
            [ -z "$PR" ] && continue
            if budget_stop_check "$PR"; then
              break
            fi
            echo "::group::Evaluating PR #$PR"

            # Skip if label not present (no-op, common case on
            # synchronize/workflow_run for under-threshold PRs).
            if ! HAS_LABEL=$(with_gh_retry gh pr view "$PR" --repo "$REPO" --json labels \
              --jq '[.labels[].name] | contains(["needs-external-review"])'); then
              # Infra error — NOT a warning-only skip. This workflow
              # exists to clear a merge-blocking label; if it can't even
              # read the label state, it must NOT report success. A
              # rate-limit / network / API error here previously let
              # the job go green while a PR stayed stuck. (CodeRabbit
              # Major, #271.)
              echo "::error::Failed to query labels for PR #$PR — cannot evaluate."
              had_infra_error=1
              failing_prs="$failing_prs $PR"
              echo "::endgroup::"
              continue
            fi
            if [ "$HAS_LABEL" != "true" ]; then
              echo "Label needs-external-review not present; nothing to clear."
              # #2193: a PR whose label is already gone can still carry a
              # stale failed auto-clear-blocking-labels check-run, and the
              # scheduled sweep visits only PRs the search index still lists
              # as labeled, so this event is often its only heal path (a
              # body-edit `edited` nudge being the deliberate one). Limited to
              # pull_request_target actions other than `synchronize`: a fresh
              # push carries a head no infra failure was posted on, and
              # workflow_run fires several times per push, so either would
              # spend installation-token reads for nothing. The heal step
              # itself posts only when the newest run on the head is a failure.
              # A repository_dispatch nomination of a label-absent PR is the
              # routine retry (#2205): the publisher sends one only after it
              # read a failed newest auto-clear-blocking-labels run on the
              # head, so this candidate is the case the heal exists for.
              if { [ "${EVENT_NAME:-}" = "pull_request_target" ] \
                   && [ "${EVENT_ACTION:-}" != "synchronize" ]; } \
                 || [ "${EVENT_NAME:-}" = "repository_dispatch" ]; then
                heal_prs="$heal_prs $PR"
              fi
              echo "::endgroup::"
              continue
            fi

            # --- Dependabot action-pin bump lane (mergepath#2164) --------
            # A Dependabot PR that only bumps action pins under
            # .github/workflows/ carries needs-external-review solely because
            # `.github/**` is a protected path, and codex-review-check.sh can
            # never clear it (Codex does not review Dependabot PRs). This is
            # the TRUSTED removal authority for that label: default-branch
            # code, a trusted trigger, and the proof re-derived here against
            # the LIVE head/base pair by scripts/workflow/
            # dependabot_pin_bump_exemption.sh — Dependabot-only, GitHub-
            # committed, signature-verified commits, and a diff confined to
            # `uses:` pin lines. The labeler's own non-application and its
            # diagnostic marker grant nothing here. rc 1 (not a pin-only
            # Dependabot PR, including every non-Dependabot PR) falls through
            # to the ordinary merge-gate evaluation; rc 3 (no verdict
            # reachable) is an infrastructure error like a gate rc 3, so the
            # job fails loudly and the next event or sweep retries. The
            # helper reads under the workflow token: three GET reads, no PAT
            # quota. See REVIEW_POLICY.md § Dependabot action-pin bump lane.
            # Latest needs-external-review label event as "<event>:<actor>"
            # ("none" when there is none); nonzero on a failed read.
            # Paginated: a long-lived PR's timeline exceeds one page. Used
            # before the proof and again immediately before the DELETE.
            lane_latest_label_event() {
              GH_TOKEN="$WORKFLOW_TOKEN" gh api --paginate "repos/$REPO/issues/$PR/timeline" \
                | jq -rs '[ (add // []) | .[]
                            | select((.event == "labeled" or .event == "unlabeled")
                                     and (.label.name // "") == "needs-external-review") ]
                          | sort_by(.created_at, .id) | last
                          | if . == null then "none" else "\(.event):\(.actor.login // "<unknown>")" end'
            }
            gate_source=codex
            PIN_JSON=""
            pin_rc=1
            LANE_HEAD=""
            LANE_BASE=""
            LANE_BASE_REF=""
            LANE_AUTHOR=""
            if [ -x scripts/workflow/dependabot_pin_bump_exemption.sh ] \
               && [ -x scripts/workflow/resolve_base_policy.sh ]; then
              # ONE captured live head/base/ref/author read feeds everything
              # below: the policy resolution, the ownership check, the
              # helper's pinned pair and the pre-delete fence. Resolving the
              # policy from an unpinned base and then proving a different
              # live pair would let a retarget between the two reads judge a
              # release-branch PR by the old base's policy.
              set +e
              LANE_TRIPLE=$(GH_TOKEN="$WORKFLOW_TOKEN" gh api "repos/$REPO/pulls/$PR" \
                --jq '[.head.sha, .base.sha, .base.ref, .user.login] | @tsv')
              triple_rc=$?
              set -e
              LANE_HEAD=$(cut -f1 <<<"$LANE_TRIPLE")
              LANE_BASE=$(cut -f2 <<<"$LANE_TRIPLE")
              LANE_BASE_REF=$(cut -f3 <<<"$LANE_TRIPLE")
              LANE_AUTHOR=$(cut -f4 <<<"$LANE_TRIPLE")
              if [ "$triple_rc" -ne 0 ] || ! [[ "$LANE_HEAD" =~ ^[0-9a-f]{40}$ ]] \
                 || ! [[ "$LANE_BASE" =~ ^[0-9a-f]{40}$ ]] || [ -z "$LANE_BASE_REF" ] \
                 || [ -z "$LANE_AUTHOR" ]; then
                pin_rc=3
                PIN_JSON='{"reason":"the live PR head, base, base ref and author could not be read"}'
              elif [ "$LANE_AUTHOR" != 'dependabot[bot]' ]; then
                # Not a Dependabot PR: the lane cannot apply (the helper would
                # return the same not-exempt verdict), so skip the policy
                # materialization, the timeline read and the proof instead of
                # spending installation-token reads on every labeled PR in
                # every sweep. Falls through to the ordinary merge gate.
                pin_rc=1
                PIN_JSON=$(jq -nc --arg a "$LANE_AUTHOR" \
                  '{reason:("PR author is " + $a + ", not dependabot[bot]; the lane does not apply")}')
              else
                # The policy that governs a PR is its BASE branch's (#769): a
                # release branch that opts the lane out must be honored here
                # exactly as the classifier honors it. MATERIALIZED at the
                # captured base SHA even for a default-branch base: without
                # --materialize-default the resolver returns this checkout's
                # own copy for a default base and ignores --base-sha, so a
                # default branch that advanced after this checkout (opting the
                # lane out, adding a narrower protected path, lowering the
                # threshold) would be judged by the older policy. The result
                # is always a temp file; an unknown base policy is exit 2 and
                # fails closed below.
                LANE_POLICY=""
                set +e
                LANE_POLICY=$(GH_TOKEN="$WORKFLOW_TOKEN" bash scripts/workflow/resolve_base_policy.sh \
                  --repo "$REPO" --base-ref "$LANE_BASE_REF" --base-sha "$LANE_BASE" \
                  --default-branch "$DEFAULT_BRANCH" --default-config .github/review-policy.yml \
                  --materialize-default)
                policy_rc=$?
                set -e
                if [ "$policy_rc" -ne 0 ] || [ -z "$LANE_POLICY" ] || [ ! -f "$LANE_POLICY" ]; then
                  pin_rc=3
                  PIN_JSON='{"reason":"the governing base policy could not be resolved"}'
                else
                  # Only a POLICY-APPLIED label is the lane's to clear: the
                  # latest needs-external-review label event must be a
                  # github-actions[bot] application. A human force-on, or a
                  # human re-application after an automated removal, is
                  # Phase 4 by decision and stays until the merge gate clears
                  # it or the human removes it. Re-checked at the DELETE.
                  set +e
                  LANE_OWNER=$(lane_latest_label_event)
                  owner_rc=$?
                  set -e
                  if [ "$owner_rc" -ne 0 ] || [ -z "$LANE_OWNER" ]; then
                    pin_rc=3
                    PIN_JSON='{"reason":"the needs-external-review label timeline could not be read"}'
                  elif [ "$LANE_OWNER" != 'labeled:github-actions[bot]' ]; then
                    pin_rc=1
                    PIN_JSON=$(jq -nc --arg o "$LANE_OWNER" \
                      '{reason:("the latest needs-external-review label event is " + $o + ", not a policy-workflow application; the lane clears only a policy-applied label")}')
                  else
                    set +e
                    PIN_JSON=$(GH_TOKEN="$WORKFLOW_TOKEN" bash scripts/workflow/dependabot_pin_bump_exemption.sh \
                      --repo "$REPO" --pr "$PR" --head "$LANE_HEAD" --base "$LANE_BASE" --config "$LANE_POLICY")
                    pin_rc=$?
                    set -e
                  fi
                fi
                # The resolver hands back a temp file only for a non-default
                # base; the default path is the checkout's own file.
                if [ -n "$LANE_POLICY" ] && [ "$LANE_POLICY" != .github/review-policy.yml ]; then
                  rm -f "$LANE_POLICY"
                fi
              fi
            else
              echo "Dependabot pin-bump lane: trusted helper or base-policy resolver absent on the default branch (pre-mergepath#2164 checkout); evaluating the merge gate only."
            fi
            PIN_REASON=$(jq -r '.reason // "no reason reported"' <<<"$PIN_JSON" 2>/dev/null || echo "no reason reported")
            case "$pin_rc" in
              0)
                rc=0
                gate_source=dependabot-pin-bump
                echo "Dependabot pin-bump lane: VERIFIED on the live head/base pair — $PIN_REASON"
                ;;
              1)
                echo "Dependabot pin-bump lane: not applicable — $PIN_REASON"
                # #2239: capture the live head/base the merge gate is about to
                # judge, so the DELETE below can be fenced against it. The
                # lane's own read above is reused when it ran; otherwise one
                # read under the workflow token, here.
                if ! [[ "$LANE_HEAD" =~ ^[0-9a-f]{40}$ ]] || ! [[ "$LANE_BASE" =~ ^[0-9a-f]{40}$ ]]; then
                  set +e
                  LANE_PAIR=$(GH_TOKEN="$WORKFLOW_TOKEN" gh api "repos/$REPO/pulls/$PR" \
                    --jq '[.head.sha, .base.sha] | @tsv')
                  set -e
                  LANE_HEAD=$(cut -f1 <<<"$LANE_PAIR")
                  LANE_BASE=$(cut -f2 <<<"$LANE_PAIR")
                fi
                if ! [[ "$LANE_HEAD" =~ ^[0-9a-f]{40}$ ]] || ! [[ "$LANE_BASE" =~ ^[0-9a-f]{40}$ ]]; then
                  echo "::error::Could not read the live head/base of PR #$PR before evaluating the merge gate."
                  rc=3
                else
                  set +e
                  scripts/codex-review-check.sh "$PR"
                  rc=$?
                  set -e
                fi
                ;;
              *)
                echo "::error::Dependabot pin-bump lane could not reach a verdict on PR #$PR (rc=$pin_rc): $PIN_REASON"
                rc=3
                ;;
            esac

            case "$rc" in
              0)
                # Retract any durable request while needs-external-review is
                # still a blocker. Deleting the last blocking label first can
                # let GitHub consume an older arm before the continuation step
                # gets a chance to clean it up. Dependabot is preserved inside
                # the helper because its dedicated workflow owns that lane.
                if [ ! -f scripts/workflow/approval-merge-continuation.sh ] \
                   || ! grep -Fq 'APPROVAL_PROTECTIVE_RETRACTION_V2' scripts/workflow/approval-merge-continuation.sh; then
                  echo "::error::Protective retraction helper is unavailable; refusing to remove needs-external-review from PR #$PR."
                  had_infra_error=1
                  failing_prs="$failing_prs $PR"
                  echo "::endgroup::"
                  continue
                fi
                set +e
                GH_TOKEN="$WORKFLOW_TOKEN" MERGEPATH_AUTHOR_TOKEN="$AUTHOR_TOKEN" \
                  MERGEPATH_QUEUE_POLICY_TOKEN="$QUEUE_POLICY_TOKEN" \
                  MERGEPATH_QUEUE_SOURCE_TOKEN="$QUEUE_SOURCE_TOKEN" \
                  bash scripts/workflow/approval-merge-continuation.sh \
                  --retract-unsafe-only "$PR" "$REPO"
                protective_rc=$?
                set -e
                if [ "$protective_rc" -eq 4 ]; then
                  # Exit 4 is the helper's benign not-ready verdict (#1159): the
                  # standing auto-merge request is either outside the #1058 queue
                  # boundary or a queue-governed arm retained within it. Nothing
                  # was mutated and no dependency is broken, so this must not set
                  # the infrastructure sentinel or emit a per-PR failure diagnostic.
                  # The label still stays:
                  # removing the last blocker while an arm stands would let
                  # GitHub consume it, which is the hazard this retraction
                  # exists to prevent. Every other nonzero keeps failing below.
                  echo "::notice::PR #$PR has a standing auto-merge request outside the #1058 queue boundary or a queue-governed arm retained within it; leaving needs-external-review in place until it is dispositioned."
                  echo "::endgroup::"
                  continue
                fi
                if [ "$protective_rc" -ne 0 ]; then
                  echo "::error::Protective retraction failed rc=$protective_rc; refusing to remove needs-external-review from PR #$PR."
                  had_infra_error=1
                  failing_prs="$failing_prs $PR"
                  echo "::endgroup::"
                  continue
                fi
                # Pin-bump lane: the helper fenced the live pair at the end of
                # its proof, but the protective retraction above made several
                # API calls since. A non-pin push onto the Dependabot branch in
                # that window would otherwise have the label removed for a
                # head the proof never covered, and the resulting `unlabeled`
                # event does not re-add it (#969). Re-read the pair under the
                # workflow token immediately before the DELETE and require it
                # to equal the PROVEN pair; a move leaves the label for the
                # next evaluation, an unreadable pair is an infrastructure
                # error. Bounds the write without claiming atomicity.
                if [ "$gate_source" = dependabot-pin-bump ]; then
                  if ! live_pair=$(GH_TOKEN="$WORKFLOW_TOKEN" gh api "repos/$REPO/pulls/$PR" \
                       --jq '[.head.sha, .base.sha] | @tsv'); then
                    echo "::error::Could not re-read the live head/base of PR #$PR before removing needs-external-review for the pin-bump lane."
                    had_infra_error=1
                    failing_prs="$failing_prs $PR"
                    echo "::endgroup::"
                    continue
                  fi
                  proven_pair=$(jq -r '[.head, .base] | @tsv' <<<"$PIN_JSON")
                  captured_pair=$(printf '%s\t%s' "$LANE_HEAD" "$LANE_BASE")
                  if [ -z "$live_pair" ] || [ "$live_pair" != "$proven_pair" ] \
                     || [ "$live_pair" != "$captured_pair" ]; then
                    echo "PR #$PR head/base moved after the pin-bump proof (proven: $proven_pair; live: ${live_pair:-unreadable}); leaving needs-external-review for the next evaluation."
                    echo "::endgroup::"
                    continue
                  fi
                  # Ownership too: a human who removed and re-applied the
                  # label while the proof and retraction ran leaves the pair
                  # unchanged, and that re-application is a force-on this
                  # lane must not clear.
                  set +e
                  live_owner=$(lane_latest_label_event)
                  live_owner_rc=$?
                  set -e
                  if [ "$live_owner_rc" -ne 0 ] || [ -z "$live_owner" ]; then
                    echo "::error::Could not re-read the needs-external-review label timeline of PR #$PR before removal for the pin-bump lane."
                    had_infra_error=1
                    failing_prs="$failing_prs $PR"
                    echo "::endgroup::"
                    continue
                  fi
                  if [ "$live_owner" != 'labeled:github-actions[bot]' ]; then
                    echo "PR #$PR needs-external-review was re-applied by $live_owner after the pin-bump proof; leaving it for the next evaluation."
                    echo "::endgroup::"
                    continue
                  fi
                else
                  # #2239: the same fence for the merge-gate path.
                  # codex-review-check.sh judged whatever head was live while
                  # it ran, and a push during it or during the protective
                  # retraction would otherwise have the label removed from a
                  # head nobody evaluated (the publisher's repository_dispatch
                  # nomination makes this path run while a PR is still being
                  # pushed to). The pair captured before the gate must still
                  # be live; a move leaves the label for the new head's own
                  # events, an unreadable pair is an infrastructure error.
                  if ! live_pair=$(GH_TOKEN="$WORKFLOW_TOKEN" gh api "repos/$REPO/pulls/$PR" \
                       --jq '[.head.sha, .base.sha] | @tsv'); then
                    echo "::error::Could not re-read the live head/base of PR #$PR before removing needs-external-review."
                    had_infra_error=1
                    failing_prs="$failing_prs $PR"
                    echo "::endgroup::"
                    continue
                  fi
                  captured_pair=$(printf '%s\t%s' "$LANE_HEAD" "$LANE_BASE")
                  if [ -z "$live_pair" ] || [ "$live_pair" != "$captured_pair" ]; then
                    echo "PR #$PR head/base moved while the merge gate was evaluated (evaluated: $captured_pair; live: ${live_pair:-unreadable}); leaving needs-external-review for the next evaluation."
                    echo "::endgroup::"
                    continue
                  fi
                fi
                echo "Gate passes — removing needs-external-review label."
                # Single (non-retried) removal, then verify end state with a
                # retried READ (#465): retrying the removal can double-fire
                # downstream label-event workflows. Authoritative success = the
                # label is gone, not the write's exit code (fail-closed #271).
                #
                # #827: the removal is a REST DELETE, NOT
                # `gh pr edit --remove-label`, because only the DELETE's HTTP
                # status distinguishes "THIS run removed the label" from "the
                # label was already gone". `gh pr edit --remove-label` is backed
                # by the idempotent GraphQL removeLabelsFromLabelable mutation
                # and exits 0 even when the label was never present, so neither
                # its exit code nor the `still_present` read below can attribute
                # the removal. Gating the attribution comment on mere ABSENCE is
                # what produced duplicate comments: this workflow has no
                # concurrency group (a per-PR one is not expressible for
                # workflow_run, whose PR is resolved in a step), so several runs
                # clear the HAS_LABEL check above, one write wins, and every one
                # of them then reads "absent" and comments. On #797 that made 15
                # comments for 5 real removals. DELETE
                # /issues/{n}/labels/{name} returns 404 when the label is not on
                # the issue, so exactly one racing run sees 2xx.
                del_out=$(gh api "repos/$REPO/issues/$PR/labels/needs-external-review" -X DELETE -i --silent 2>/dev/null || true)
                del_status=$(printf '%s\n' "$del_out" | awk 'NR==1{print $2; exit}')
                still_present=$(with_gh_retry gh pr view "$PR" --repo "$REPO" --json labels --jq 'any(.labels[]?; .name == "needs-external-review")' || echo "unknown")
                if [ "$still_present" != "false" ]; then
                  echo "::error::Failed to remove needs-external-review on PR #$PR — label still stuck (state: $still_present, DELETE HTTP ${del_status:-none})."
                  had_infra_error=1
                  failing_prs="$failing_prs $PR"
                  echo "::endgroup::"
                  continue
                fi
                # #2193: the label is confirmed absent after a clean pass, so
                # this head is a heal candidate whoever performed the removal.
                heal_prs="$heal_prs $PR"
                # End state is correct. Comment ONLY if THIS run performed the
                # removal (#827) — a 404 means another run or an earlier sweep
                # already cleared it, and the desired end state holds either way.
                case "$del_status" in
                  200|204)
                    cleared_prs="$cleared_prs $PR"
                    # Direct string body (NOT a heredoc — heredoc closing
                    # delimiter must be column-0 unless using `<<-` with
                    # tabs; YAML run blocks make that brittle).
                    if [ "$gate_source" = dependabot-pin-bump ]; then
                      # The evidence the lane acted on: the verified pair, the
                      # provenance verdict and the pinned files. Diagnostic
                      # marker; no reader treats it as authority.
                      comment_body=$(printf '%s\n%s\n\n%s\n\n%s\n%s\n%s\n\n%s' \
                        "<!-- mergepath-dependabot-pin-bump:v1 verified-head=$(jq -r '.head' <<<"$PIN_JSON") verified-base=$(jq -r '.base' <<<"$PIN_JSON") -->" \
                        "**Automated label removal — Dependabot action-pin bump lane** ✅ (head \`$(jq -r '.head' <<<"$PIN_JSON")\`, base \`$(jq -r '.base' <<<"$PIN_JSON")\`)" \
                        "This Dependabot PR touches \`.github/workflows/\` only through action pins, so it is exempt from the \`.github/**\` protected-path external-review rule (REVIEW_POLICY.md § Dependabot action-pin bump lane). Removed \`needs-external-review\` so Label Gate passes. Proven on the live head/base pair by the trusted \`scripts/workflow/dependabot_pin_bump_exemption.sh\`:" \
                        "- Commit provenance: $(jq -r '.provenance' <<<"$PIN_JSON")" \
                        "- Diff shape: $(jq -r '.pins' <<<"$PIN_JSON") action pin line(s) across $(jq -r '.files | length' <<<"$PIN_JSON") workflow file(s); every changed line is a \`uses:\` ref or its pin comment, and nothing else changed" \
                        "$(jq -r '.files[] | "  - `\(.filename)`: \(.pins) pin line(s)"' <<<"$PIN_JSON")" \
                        "The PR still needs CI green and the Dependabot reviewer-identity \`APPROVED\` on this head (Merge clearance gate). See [.github/workflows/auto-clear-blocking-labels.yml](.github/workflows/auto-clear-blocking-labels.yml) for the trigger doctrine.")
                    else
                      comment_body='**Automated label removal.** `scripts/codex-review-check.sh` cleared the merge gate on this HEAD (CI green + reviewer-identity APPROVED + Codex cleared). Removed `needs-external-review` so Label Gate passes and the PR can merge. See [.github/workflows/auto-clear-blocking-labels.yml](.github/workflows/auto-clear-blocking-labels.yml) (#191/#195) for the trigger doctrine.'
                    fi
                    # #530 (IMPLEMENTED — was DEFER+DOCUMENT, human-ratified
                    # 2026-06-28): this attribution-comment POST is
                    # NON-idempotent, so it is deliberately NOT wrapped in
                    # with_gh_retry. A retry after a timeout-after-accept would
                    # post a DUPLICATE comment; a single unretried attempt
                    # cannot. Failure stays warn-only (non-fatal) and is purely
                    # cosmetic — the label is already cleared and the workflow
                    # log records the action. The other retried writes here are
                    # check-runs keyed on (name, head_sha), which GitHub UPSERTS
                    # (idempotent), so those stay wrapped.
                    gh pr comment "$PR" --repo "$REPO" --body "$comment_body" \
                      || echo "::warning::Failed to post attribution comment for PR #$PR"
                    ;;
                  404)
                    echo "needs-external-review was already absent (DELETE HTTP 404) — another run or sweep cleared it; skipping the attribution comment (#827)."
                    ;;
                  *)
                    echo "::warning::Unexpected DELETE HTTP '${del_status:-none}' for needs-external-review on PR #$PR; label is confirmed absent, so skipping the attribution comment rather than risking a duplicate (#827)."
                    ;;
                esac
                ;;
              1)
                echo "Gate not yet met — leaving label in place."
                ;;
              3)
                echo "::error::codex-review-check.sh config/arg error (rc=3) on PR #$PR"
                # Don't exit non-zero mid-loop — keep sweeping other
                # PRs on a multi-PR workflow_run trigger. But set
                # the sentinel so the job exits non-zero at the end.
                had_infra_error=1
                failing_prs="$failing_prs $PR"
                ;;
              *)
                echo "::error::codex-review-check.sh unexpected rc=$rc on PR #$PR (contract drift — failing job)"
                # Fail-closed: any rc outside 0/1/3 is contract drift.
                # Better to fail loudly than leave the label stuck
                # behind a silently-broken gate. CR Major on PR #202 r3.
                had_infra_error=1
                failing_prs="$failing_prs $PR"
                ;;
            esac
            echo "::endgroup::"
          done <<<"$PR_NUMBERS"
          if [ -n "$budget_stopped" ]; then
            echo "::warning::Stopped before an exhausted installation API budget (#2286). Not evaluated:$budget_stopped. Each keeps needs-external-review untouched; the */5 sweep re-evaluates."
            echo "budget_stopped=true" >> "$GITHUB_OUTPUT"
          fi
          # Surface the infra-error sentinel + per-PR list to the next
          # step (#324 round 2 codex P2) so the check-run can be posted
          # with the correct head SHA per PR. failing_prs is space-
          # separated, may have a leading space — `echo` collapses it.
          echo "HAD_INFRA_ERROR=$had_infra_error" >> "$GITHUB_ENV"
          # shellcheck disable=SC2086  # intentional word-splitting to trim
          echo "HAD_INFRA_ERROR_PRS=$(echo $failing_prs)" >> "$GITHUB_ENV"
          # A PR whose external-review label was removed in THIS pass must
          # wait for the label-policy workflow to publish its new verdict.
          # The continuation step skips it until that later workflow_run.
          # shellcheck disable=SC2086  # intentional word-splitting to trim
          echo "cleared_prs=$(echo $cleared_prs)" >> "$GITHUB_OUTPUT"
          # #2193: deduplicated heal candidates, minus any PR that also hit an
          # infrastructure error in this pass (a repeated PR number), which
          # the surfacing step owns.
          heal_out=""
          for heal_pr in $heal_prs; do
            case " $failing_prs $heal_out " in
              *" $heal_pr "*) ;;
              *) heal_out="$heal_out $heal_pr" ;;
            esac
          done
          # shellcheck disable=SC2086  # intentional word-splitting to trim
          echo "heal_prs=$(echo $heal_out)" >> "$GITHUB_OUTPUT"
          exit "$had_infra_error"

      - name: Continue approved PRs after completed checks
        # Not after a budget stop (#2286): the continuation spends the same
        # installation token, and the */5 sweep's continuation backstop
        # re-enters every open approved PR.
        if: github.event_name == 'workflow_run' && steps.pr.outputs.numbers != '' && steps.clear.outputs.budget_stopped != 'true'
        env:
          AUTHOR_TOKEN: ${{ secrets.AUTHOR_MERGE_TOKEN }}
          WORKFLOW_TOKEN: ${{ github.token }}
          QUEUE_POLICY_TOKEN: ${{ secrets.MERGE_QUEUE_POLICY_TOKEN }}
          QUEUE_SOURCE_TOKEN: ${{ secrets.MERGE_QUEUE_SOURCE_TOKEN }}
          # Routes ONLY the review-feedback-accounting.sh call inside
          # approval-merge-continuation.sh through GITHUB_TOKEN instead of the
          # author token used by normal continuation (#1101, CodeRabbit on PR
          # #1106). See this job's permissions block for why.
          ACCOUNTING_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBERS: ${{ steps.pr.outputs.numbers }}
          CLEARED_PRS: ${{ steps.clear.outputs.cleared_prs }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/workflow/approval-merge-continuation.sh ]; then
            echo "::notice::Approval continuation helper is not on the trusted default branch yet; skipping this first-rollout event."
            exit 0
          fi
          if ! grep -Fq 'APPROVAL_PROTECTIVE_RETRACTION_V2' scripts/workflow/approval-merge-continuation.sh; then
            echo "::notice::Approval continuation predates governing-policy protective retraction; skipping this first-rollout event."
            exit 0
          fi
          continuation_infra_error=0
          continuation_failing_prs=""
          while IFS= read -r PR; do
            [ -n "$PR" ] || continue
            case " $CLEARED_PRS " in
              *" $PR "*)
                echo "PR #$PR had needs-external-review removed in this pass; waiting for the resulting policy workflow completion."
                continue
                ;;
            esac
            set +e
            GH_TOKEN="$WORKFLOW_TOKEN" MERGEPATH_AUTHOR_TOKEN="$AUTHOR_TOKEN" \
              MERGEPATH_QUEUE_POLICY_TOKEN="$QUEUE_POLICY_TOKEN" \
              MERGEPATH_QUEUE_SOURCE_TOKEN="$QUEUE_SOURCE_TOKEN" \
              bash scripts/workflow/approval-merge-continuation.sh \
              --retract-unsafe-only "$PR" "$REPO"
            protective_rc=$?
            if [ "$protective_rc" -eq 0 ] && [ -z "${AUTHOR_TOKEN:-}" ]; then
              echo "::notice::AUTHOR_MERGE_TOKEN is not configured; protective retraction completed but author-token continuation remains disabled."
              rc=0
            elif [ "$protective_rc" -eq 0 ]; then
              GH_TOKEN="$AUTHOR_TOKEN" MERGEPATH_AUTHOR_TOKEN="$AUTHOR_TOKEN" \
                MERGEPATH_PROTECTIVE_TOKEN="$WORKFLOW_TOKEN" \
                MERGEPATH_QUEUE_POLICY_TOKEN="$QUEUE_POLICY_TOKEN" \
                MERGEPATH_QUEUE_SOURCE_TOKEN="$QUEUE_SOURCE_TOKEN" \
                MERGEPATH_PROTECTIVE_RETRACTION_DONE=1 \
                bash scripts/workflow/approval-merge-continuation.sh "$PR" "$REPO"
              rc=$?
            else
              rc=$protective_rc
            fi
            set -e
            case "$rc" in
              0) ;;
              4) echo "PR #$PR is not merge-ready on this event; a later completion event will re-evaluate it." ;;
              *)
                echo "::error::Approval continuation hit infrastructure/config error rc=$rc on PR #$PR."
                continuation_infra_error=1
                continuation_failing_prs="$continuation_failing_prs $PR"
                ;;
            esac
          done <<<"$PR_NUMBERS"
          echo "CONTINUATION_INFRA_ERROR=$continuation_infra_error" >> "$GITHUB_ENV"
          # shellcheck disable=SC2086  # intentional word-splitting to trim
          echo "CONTINUATION_INFRA_ERROR_PRS=$(echo $continuation_failing_prs)" >> "$GITHUB_ENV"
          exit "$continuation_infra_error"

      - name: Surface approval continuation failures as per-PR check-runs
        if: always() && env.CONTINUATION_INFRA_ERROR == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/workflow/report-approval-continuation-failures.sh ]; then
            echo "::notice::Continuation failure reporter is not on the trusted default branch yet; the workflow log remains authoritative for this first rollout."
            exit 0
          fi
          bash scripts/workflow/report-approval-continuation-failures.sh \
            "$REPO" "$RUN_URL" "${CONTINUATION_INFRA_ERROR_PRS:-}"

      - name: Surface infra failure as per-PR check-runs
        # Run even when the prior step failed — `if: always()` + the
        # HAD_INFRA_ERROR sentinel so we only post failed check-runs
        # when the prior step actually hit an infra error (not when
        # everything was clean or only gate-evaluation said "not yet
        # met").
        #
        # Per-PR check-runs (#324 round 2 codex P2): the prior version
        # used `head_sha: ${{ github.sha }}`, but on workflow_run /
        # pull_request_target / schedule, github.sha resolves to a
        # default-branch commit, not the affected PR's head, so the
        # annotation landed on the wrong commit and missed the target
        # PR's Checks tab. Posting one check-run per failing PR fixes
        # both the wrong-commit problem and the lost-visibility
        # problem, at the cost of one extra `gh pr view` per failure
        # (cheap, only on the error path).
        if: always() && env.HAD_INFRA_ERROR == '1'
        env:
          # check-run POST works with GITHUB_TOKEN + `checks: write`
          # (added above). No PAT needed for this annotation surface.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source scripts/lib/gh-retry-helpers.sh
          REPO='${{ github.repository }}'
          RUN_URL='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          # HAD_INFRA_ERROR_PRS is a space-separated list set by the
          # prior step at each had_infra_error=1 site. Empty list →
          # nothing to surface (defensive: should not happen given
          # HAD_INFRA_ERROR is set).
          if [ -z "${HAD_INFRA_ERROR_PRS:-}" ]; then
            echo "::warning::HAD_INFRA_ERROR=1 but HAD_INFRA_ERROR_PRS is empty — skipping check-run emission."
            exit 0
          fi
          for PR in $HAD_INFRA_ERROR_PRS; do
            echo "::group::Posting infra-failure check-run for PR #$PR"
            if ! HEAD_SHA=$(with_gh_retry gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid); then
              echo "::warning::Failed to resolve head SHA for PR #$PR — skipping check-run."
              echo "::endgroup::"
              continue
            fi
            if current_has_label=$(with_gh_retry gh pr view "$PR" --repo "$REPO" --json labels --jq 'any(.labels[]?; .name == "needs-external-review")'); then
              :
            else
              echo "::warning::Failed to re-read needs-external-review on PR #$PR before posting the infra-failure check-run."
              current_has_label=unknown
            fi
            if [ "$current_has_label" = "false" ]; then
              # Issue #499: the label removal can succeed while the
              # immediate verification read returns unknown. In that
              # case a later read proving the label is absent should
              # heal the synthetic check-run instead of leaving a
              # permanent failure on the PR's Checks tab.
              with_gh_retry gh api "repos/$REPO/check-runs" \
                -X POST \
                -f name='auto-clear-blocking-labels' \
                -f "head_sha=$HEAD_SHA" \
                -f status='completed' \
                -f conclusion='success' \
                -F "output[title]=Auto-clear confirmed needs-external-review absent" \
                -F "output[summary]=PR #$PR — a prior verification failed, but a later read confirmed the label is absent. See workflow run logs: $RUN_URL" \
                || echo "::warning::Failed to post healed check-run for PR #$PR (workflow log still confirms the label is absent)."
              echo "::endgroup::"
              continue
            fi
            with_gh_retry gh api "repos/$REPO/check-runs" \
              -X POST \
              -f name='auto-clear-blocking-labels' \
              -f "head_sha=$HEAD_SHA" \
              -f status='completed' \
              -f conclusion='failure' \
              -F "output[title]=Auto-clear hit an infrastructure error" \
              -F "output[summary]=PR #$PR — see workflow run logs: $RUN_URL" \
              || echo "::warning::Failed to post check-run for PR #$PR (annotation lost; workflow log still surfaces the failure)."
            echo "::endgroup::"
          done

      - name: Heal stale auto-clear infra-failure check-runs
        # #2193: a clean pass that leaves needs-external-review absent
        # supersedes a stale failed auto-clear-blocking-labels check-run, which
        # otherwise stays the newest run on the head, drives the PR UNSTABLE
        # and makes gh-pr-guard.sh refuse the merge. The helper posts only
        # when the newest such run on the live head is a failure, and fences
        # the POST on a fresh head/label read before each of its retried
        # attempts (#2205). A heal that still fails is retried by the next
        # publisher full pass that posts a green clearance verdict on the
        # head: it reads the newest run and nominates the PR back here
        # through repository_dispatch (see required-check-publisher.yml's
        # nominate-auto-clear job). Last in the job so a helper
        # fault can never skip the label-clear or continuation steps;
        # !cancelled() so it still runs when the clear step exited non-zero
        # for a DIFFERENT PR's infrastructure error.
        if: ${{ !cancelled() && steps.clear.outputs.heal_prs != '' }}
        env:
          # Check-runs can only be created by a GitHub App: GITHUB_TOKEN with
          # `checks: write`, never a PAT.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAL_PRS: ${{ steps.clear.outputs.heal_prs }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/workflow/heal-auto-clear-infra-check.sh ]; then
            echo "::notice::Auto-clear heal helper is not on the trusted default branch yet; skipping this first-rollout pass."
            exit 0
          fi
          bash scripts/workflow/heal-auto-clear-infra-check.sh "$REPO" "$RUN_URL" event "$HEAL_PRS"

  scheduled-sweep:
    name: Periodic sweep for stale needs-external-review labels
    # Catches the 👍-after-last-push case (#197). Only fires on
    # schedule; the event-driven evaluate-and-clear job above
    # handles the common path. Idempotent: running twice on the
    # same PR with no state change is a no-op (label-present check
    # + read-only gate evaluation).
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    environment: merge-queue-policy
    steps:
      - name: Checkout repo (for codex-review-check.sh)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Schedule events have no PR context, so default GITHUB_REF
          # is the default branch already — pin explicitly for
          # consistency with the security stance of the event-driven
          # job above.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          # Explicit-token gh only, no authenticated git, so don't leave the
          # checkout token in .git/config (#548 / Codex #550).
          persist-credentials: false

      - name: Find PRs carrying needs-external-review
        id: find
        env:
          # Read-only list query. GITHUB_TOKEN is sufficient here —
          # the PAT-switch in the next step is what triggers downstream
          # workflows when the label is actually removed.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          source scripts/lib/gh-retry-helpers.sh
          # Read the per-repo cadence/enable knob from review-policy.yml.
          # Defaults: enabled=true. Operators can opt out by setting
          #   auto_clear_labels:
          #     scheduled_sweep_enabled: false
          # in their .github/review-policy.yml.
          CONFIG=".github/review-policy.yml"
          enabled=true
          if [ -f "$CONFIG" ]; then
            # CR Major on PR #213: strip trailing YAML comments
            # before comparing — `false  # opt out` was previously
            # being parsed as `false#optout`, leaving the sweep
            # enabled even when the operator explicitly disabled it.
            val=$(awk '
              /^auto_clear_labels:/ {in_block=1; next}
              in_block && /^[^[:space:]]/ {exit}
              in_block && /^[[:space:]]+scheduled_sweep_enabled:/ {
                sub(/#.*/, "")
                gsub(/.*: */, "")
                gsub(/[[:space:]]/, "")
                print
                exit
              }
            ' "$CONFIG")
            [ "$val" = "false" ] && enabled=false
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if [ "$enabled" = "false" ]; then
            echo "Scheduled sweep disabled for $REPO via review-policy.yml; skipping."
            echo "prs=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # List open PRs carrying the label. CR Major on PR #213:
          # `--limit 500` overrides gh's default of 30 so the sweep
          # processes ALL matching PRs in repos with high open-PR
          # counts. 500 is comfortably above any realistic limit for
          # a single repo's needs-external-review queue (would imply
          # ~500 PRs awaiting review — itself an alarm).
          # CR Major on PR #213 r2: capture gh output + exit status
          # separately. The prior `mapfile -t prs < <(gh ...)` form
          # swallowed gh's exit code via process substitution, so a
          # gh failure (auth, rate limit, network) silently became
          # "0 PRs found" and the sweep no-op'd instead of failing
          # loudly.
          if ! prs_raw=$(with_gh_retry gh pr list --repo "$REPO" --state open \
            --label needs-external-review --limit 500 \
            --json number --jq '.[].number'); then
            echo "::error::Failed to list open PRs with needs-external-review on $REPO"
            exit 1
          fi
          prs=()
          if [ -n "$prs_raw" ]; then
            mapfile -t prs <<<"$prs_raw"
          fi
          echo "Found ${#prs[@]} PR(s) with needs-external-review on $REPO"
          if [ "${#prs[@]}" -eq 0 ]; then
            echo "prs=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo 'prs<<EOF'
            printf '%s\n' "${prs[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Re-evaluate gate per PR
        id: sweep
        if: steps.find.outputs.prs != ''
        env:
          # PAT-driven label removal (#315/#324). See
          # evaluate-and-clear job above for the rationale; same
          # secret, same recursion-prevention bypass. Without the
          # PAT, the scheduled sweep would remove the label but
          # downstream workflows (pr-review-policy.yml Label Gate)
          # would not re-fire — so mergeStateStatus would stay
          # BLOCKED until the next push or manual nudge, defeating
          # the sweep's purpose.
          GH_TOKEN: ${{ secrets.CI_ACTOR_TOKEN || secrets.REVIEWER_ASSIGNMENT_TOKEN }}
          WORKFLOW_TOKEN: ${{ github.token }}
          AUTHOR_TOKEN: ${{ secrets.AUTHOR_MERGE_TOKEN }}
          # Dedicated target-admin and source-read tokens for the queue proof.
          QUEUE_POLICY_TOKEN: ${{ secrets.MERGE_QUEUE_POLICY_TOKEN }}
          QUEUE_SOURCE_TOKEN: ${{ secrets.MERGE_QUEUE_SOURCE_TOKEN }}
          PRS: ${{ steps.find.outputs.prs }}
          REPO: ${{ github.repository }}
          # For resolve_base_policy.sh's base-pinned form in the pin-bump lane.
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          source scripts/lib/gh-retry-helpers.sh
          had_infra_error=0
          failing_prs=""
          # #2193: heal candidates — see the evaluate-and-clear job above.
          heal_prs=""
          while IFS= read -r PR; do
            [ -z "$PR" ] && continue
            echo "::group::Sweep PR #$PR"

            # #827: re-verify the label against the AUTHORITATIVE labels
            # endpoint before doing any work. The PR list above comes from
            # `gh pr list --label`, which resolves through the GraphQL
            # `search()` API — GitHub's eventually-consistent search index,
            # NOT live label state. A PR whose label was cleared keeps
            # appearing in that index long after the fact (observed on #797:
            # ~3.5h, across 9 consecutive sweeps). Without this precheck the
            # sweep ran a full codex-review-check.sh evaluation, issued a
            # no-op removal, read "absent", and posted an attribution comment
            # for a label it never removed — 8 spurious comments on #797.
            # Mirrors the evaluate-and-clear job's HAS_LABEL check.
            if ! HAS_LABEL=$(with_gh_retry gh pr view "$PR" --repo "$REPO" --json labels \
              --jq '[.labels[].name] | contains(["needs-external-review"])'); then
              echo "::error::Failed to query labels for PR #$PR — cannot evaluate."
              had_infra_error=1
              failing_prs="$failing_prs $PR"
              echo "::endgroup::"
              continue
            fi
            if [ "$HAS_LABEL" != "true" ]; then
              echo "Label needs-external-review not present (stale search-index hit); nothing to clear."
              # #2193: the index lags a removal for hours (#827), which is
              # exactly the window in which a stale failed check-run from the
              # pre-removal outage needs superseding (for example after a
              # human removal, whose `unlabeled` event the event-driven job
              # skips). The heal step reads two endpoints and posts only when
              # the newest run on the head is a failure.
              heal_prs="$heal_prs $PR"
              echo "::endgroup::"
              continue
            fi

            # Dependabot action-pin bump lane (mergepath#2164) — the sweep is
            # the backstop for this lane: the labeler applies the label with
            # GITHUB_TOKEN, which fires no `labeled` run here, so a pin-only
            # Dependabot PR labeled by an older or fail-closed labeler is
            # cleared by this sweep within one interval. Same proof, same
            # verdict mapping as the event-driven job above.
            # Latest needs-external-review label event as "<event>:<actor>"
            # ("none" when there is none); nonzero on a failed read.
            # Paginated: a long-lived PR's timeline exceeds one page. Used
            # before the proof and again immediately before the DELETE.
            lane_latest_label_event() {
              GH_TOKEN="$WORKFLOW_TOKEN" gh api --paginate "repos/$REPO/issues/$PR/timeline" \
                | jq -rs '[ (add // []) | .[]
                            | select((.event == "labeled" or .event == "unlabeled")
                                     and (.label.name // "") == "needs-external-review") ]
                          | sort_by(.created_at, .id) | last
                          | if . == null then "none" else "\(.event):\(.actor.login // "<unknown>")" end'
            }
            gate_source=codex
            PIN_JSON=""
            pin_rc=1
            LANE_HEAD=""
            LANE_BASE=""
            LANE_BASE_REF=""
            LANE_AUTHOR=""
            if [ -x scripts/workflow/dependabot_pin_bump_exemption.sh ] \
               && [ -x scripts/workflow/resolve_base_policy.sh ]; then
              # ONE captured live head/base/ref/author read feeds everything
              # below: the policy resolution, the ownership check, the
              # helper's pinned pair and the pre-delete fence. Resolving the
              # policy from an unpinned base and then proving a different
              # live pair would let a retarget between the two reads judge a
              # release-branch PR by the old base's policy.
              set +e
              LANE_TRIPLE=$(GH_TOKEN="$WORKFLOW_TOKEN" gh api "repos/$REPO/pulls/$PR" \
                --jq '[.head.sha, .base.sha, .base.ref, .user.login] | @tsv')
              triple_rc=$?
              set -e
              LANE_HEAD=$(cut -f1 <<<"$LANE_TRIPLE")
              LANE_BASE=$(cut -f2 <<<"$LANE_TRIPLE")
              LANE_BASE_REF=$(cut -f3 <<<"$LANE_TRIPLE")
              LANE_AUTHOR=$(cut -f4 <<<"$LANE_TRIPLE")
              if [ "$triple_rc" -ne 0 ] || ! [[ "$LANE_HEAD" =~ ^[0-9a-f]{40}$ ]] \
                 || ! [[ "$LANE_BASE" =~ ^[0-9a-f]{40}$ ]] || [ -z "$LANE_BASE_REF" ] \
                 || [ -z "$LANE_AUTHOR" ]; then
                pin_rc=3
                PIN_JSON='{"reason":"the live PR head, base, base ref and author could not be read"}'
              elif [ "$LANE_AUTHOR" != 'dependabot[bot]' ]; then
                # Not a Dependabot PR: the lane cannot apply (the helper would
                # return the same not-exempt verdict), so skip the policy
                # materialization, the timeline read and the proof instead of
                # spending installation-token reads on every labeled PR in
                # every sweep. Falls through to the ordinary merge gate.
                pin_rc=1
                PIN_JSON=$(jq -nc --arg a "$LANE_AUTHOR" \
                  '{reason:("PR author is " + $a + ", not dependabot[bot]; the lane does not apply")}')
              else
                # The policy that governs a PR is its BASE branch's (#769): a
                # release branch that opts the lane out must be honored here
                # exactly as the classifier honors it. MATERIALIZED at the
                # captured base SHA even for a default-branch base: without
                # --materialize-default the resolver returns this checkout's
                # own copy for a default base and ignores --base-sha, so a
                # default branch that advanced after this checkout (opting the
                # lane out, adding a narrower protected path, lowering the
                # threshold) would be judged by the older policy. The result
                # is always a temp file; an unknown base policy is exit 2 and
                # fails closed below.
                LANE_POLICY=""
                set +e
                LANE_POLICY=$(GH_TOKEN="$WORKFLOW_TOKEN" bash scripts/workflow/resolve_base_policy.sh \
                  --repo "$REPO" --base-ref "$LANE_BASE_REF" --base-sha "$LANE_BASE" \
                  --default-branch "$DEFAULT_BRANCH" --default-config .github/review-policy.yml \
                  --materialize-default)
                policy_rc=$?
                set -e
                if [ "$policy_rc" -ne 0 ] || [ -z "$LANE_POLICY" ] || [ ! -f "$LANE_POLICY" ]; then
                  pin_rc=3
                  PIN_JSON='{"reason":"the governing base policy could not be resolved"}'
                else
                  # Only a POLICY-APPLIED label is the lane's to clear: the
                  # latest needs-external-review label event must be a
                  # github-actions[bot] application. A human force-on, or a
                  # human re-application after an automated removal, is
                  # Phase 4 by decision and stays until the merge gate clears
                  # it or the human removes it. Re-checked at the DELETE.
                  set +e
                  LANE_OWNER=$(lane_latest_label_event)
                  owner_rc=$?
                  set -e
                  if [ "$owner_rc" -ne 0 ] || [ -z "$LANE_OWNER" ]; then
                    pin_rc=3
                    PIN_JSON='{"reason":"the needs-external-review label timeline could not be read"}'
                  elif [ "$LANE_OWNER" != 'labeled:github-actions[bot]' ]; then
                    pin_rc=1
                    PIN_JSON=$(jq -nc --arg o "$LANE_OWNER" \
                      '{reason:("the latest needs-external-review label event is " + $o + ", not a policy-workflow application; the lane clears only a policy-applied label")}')
                  else
                    set +e
                    PIN_JSON=$(GH_TOKEN="$WORKFLOW_TOKEN" bash scripts/workflow/dependabot_pin_bump_exemption.sh \
                      --repo "$REPO" --pr "$PR" --head "$LANE_HEAD" --base "$LANE_BASE" --config "$LANE_POLICY")
                    pin_rc=$?
                    set -e
                  fi
                fi
                # The resolver hands back a temp file only for a non-default
                # base; the default path is the checkout's own file.
                if [ -n "$LANE_POLICY" ] && [ "$LANE_POLICY" != .github/review-policy.yml ]; then
                  rm -f "$LANE_POLICY"
                fi
              fi
            else
              echo "Dependabot pin-bump lane: trusted helper or base-policy resolver absent on the default branch (pre-mergepath#2164 checkout); evaluating the merge gate only."
            fi
            PIN_REASON=$(jq -r '.reason // "no reason reported"' <<<"$PIN_JSON" 2>/dev/null || echo "no reason reported")
            case "$pin_rc" in
              0)
                rc=0
                gate_source=dependabot-pin-bump
                echo "Dependabot pin-bump lane: VERIFIED on the live head/base pair — $PIN_REASON"
                ;;
              1)
                echo "Dependabot pin-bump lane: not applicable — $PIN_REASON"
                # #2239: capture the live head/base the merge gate is about to
                # judge, so the DELETE below can be fenced against it. The
                # lane's own read above is reused when it ran; otherwise one
                # read under the workflow token, here.
                if ! [[ "$LANE_HEAD" =~ ^[0-9a-f]{40}$ ]] || ! [[ "$LANE_BASE" =~ ^[0-9a-f]{40}$ ]]; then
                  set +e
                  LANE_PAIR=$(GH_TOKEN="$WORKFLOW_TOKEN" gh api "repos/$REPO/pulls/$PR" \
                    --jq '[.head.sha, .base.sha] | @tsv')
                  set -e
                  LANE_HEAD=$(cut -f1 <<<"$LANE_PAIR")
                  LANE_BASE=$(cut -f2 <<<"$LANE_PAIR")
                fi
                if ! [[ "$LANE_HEAD" =~ ^[0-9a-f]{40}$ ]] || ! [[ "$LANE_BASE" =~ ^[0-9a-f]{40}$ ]]; then
                  echo "::error::Could not read the live head/base of PR #$PR before evaluating the merge gate."
                  rc=3
                else
                  set +e
                  scripts/codex-review-check.sh "$PR"
                  rc=$?
                  set -e
                fi
                ;;
              *)
                echo "::error::Dependabot pin-bump lane could not reach a verdict on PR #$PR (rc=$pin_rc): $PIN_REASON"
                rc=3
                ;;
            esac
            case "$rc" in
              0)
                # Match the event-driven clear path: remove any unsafe durable
                # request while the label still blocks GitHub from consuming
                # it. The helper preserves Dependabot's dedicated lane.
                if [ ! -f scripts/workflow/approval-merge-continuation.sh ] \
                   || ! grep -Fq 'APPROVAL_PROTECTIVE_RETRACTION_V2' scripts/workflow/approval-merge-continuation.sh; then
                  echo "::error::Protective retraction helper is unavailable; refusing to remove needs-external-review from PR #$PR."
                  had_infra_error=1
                  failing_prs="$failing_prs $PR"
                  echo "::endgroup::"
                  continue
                fi
                set +e
                GH_TOKEN="$WORKFLOW_TOKEN" MERGEPATH_AUTHOR_TOKEN="$AUTHOR_TOKEN" \
                  MERGEPATH_QUEUE_POLICY_TOKEN="$QUEUE_POLICY_TOKEN" \
                  MERGEPATH_QUEUE_SOURCE_TOKEN="$QUEUE_SOURCE_TOKEN" \
                  bash scripts/workflow/approval-merge-continuation.sh \
                  --retract-unsafe-only "$PR" "$REPO"
                protective_rc=$?
                set -e
                if [ "$protective_rc" -eq 4 ]; then
                  # Exit 4 is the helper's benign not-ready verdict (#1159): the
                  # standing auto-merge request is either outside the #1058 queue
                  # boundary or a queue-governed arm retained within it. Nothing
                  # was mutated and no dependency is broken, so this must not set
                  # the infrastructure sentinel or emit a per-PR failure diagnostic.
                  # The label still stays:
                  # removing the last blocker while an arm stands would let
                  # GitHub consume it, which is the hazard this retraction
                  # exists to prevent. Every other nonzero keeps failing below.
                  echo "::notice::PR #$PR has a standing auto-merge request outside the #1058 queue boundary or a queue-governed arm retained within it; leaving needs-external-review in place until it is dispositioned."
                  echo "::endgroup::"
                  continue
                fi
                if [ "$protective_rc" -ne 0 ]; then
                  echo "::error::Protective retraction failed rc=$protective_rc; refusing to remove needs-external-review from PR #$PR."
                  had_infra_error=1
                  failing_prs="$failing_prs $PR"
                  echo "::endgroup::"
                  continue
                fi
                # Pin-bump lane: the helper fenced the live pair at the end of
                # its proof, but the protective retraction above made several
                # API calls since. A non-pin push onto the Dependabot branch in
                # that window would otherwise have the label removed for a
                # head the proof never covered, and the resulting `unlabeled`
                # event does not re-add it (#969). Re-read the pair under the
                # workflow token immediately before the DELETE and require it
                # to equal the PROVEN pair; a move leaves the label for the
                # next evaluation, an unreadable pair is an infrastructure
                # error. Bounds the write without claiming atomicity.
                if [ "$gate_source" = dependabot-pin-bump ]; then
                  if ! live_pair=$(GH_TOKEN="$WORKFLOW_TOKEN" gh api "repos/$REPO/pulls/$PR" \
                       --jq '[.head.sha, .base.sha] | @tsv'); then
                    echo "::error::Could not re-read the live head/base of PR #$PR before removing needs-external-review for the pin-bump lane."
                    had_infra_error=1
                    failing_prs="$failing_prs $PR"
                    echo "::endgroup::"
                    continue
                  fi
                  proven_pair=$(jq -r '[.head, .base] | @tsv' <<<"$PIN_JSON")
                  captured_pair=$(printf '%s\t%s' "$LANE_HEAD" "$LANE_BASE")
                  if [ -z "$live_pair" ] || [ "$live_pair" != "$proven_pair" ] \
                     || [ "$live_pair" != "$captured_pair" ]; then
                    echo "PR #$PR head/base moved after the pin-bump proof (proven: $proven_pair; live: ${live_pair:-unreadable}); leaving needs-external-review for the next evaluation."
                    echo "::endgroup::"
                    continue
                  fi
                  # Ownership too: a human who removed and re-applied the
                  # label while the proof and retraction ran leaves the pair
                  # unchanged, and that re-application is a force-on this
                  # lane must not clear.
                  set +e
                  live_owner=$(lane_latest_label_event)
                  live_owner_rc=$?
                  set -e
                  if [ "$live_owner_rc" -ne 0 ] || [ -z "$live_owner" ]; then
                    echo "::error::Could not re-read the needs-external-review label timeline of PR #$PR before removal for the pin-bump lane."
                    had_infra_error=1
                    failing_prs="$failing_prs $PR"
                    echo "::endgroup::"
                    continue
                  fi
                  if [ "$live_owner" != 'labeled:github-actions[bot]' ]; then
                    echo "PR #$PR needs-external-review was re-applied by $live_owner after the pin-bump proof; leaving it for the next evaluation."
                    echo "::endgroup::"
                    continue
                  fi
                else
                  # #2239: the same fence for the merge-gate path.
                  # codex-review-check.sh judged whatever head was live while
                  # it ran, and a push during it or during the protective
                  # retraction would otherwise have the label removed from a
                  # head nobody evaluated (the publisher's repository_dispatch
                  # nomination makes this path run while a PR is still being
                  # pushed to). The pair captured before the gate must still
                  # be live; a move leaves the label for the new head's own
                  # events, an unreadable pair is an infrastructure error.
                  if ! live_pair=$(GH_TOKEN="$WORKFLOW_TOKEN" gh api "repos/$REPO/pulls/$PR" \
                       --jq '[.head.sha, .base.sha] | @tsv'); then
                    echo "::error::Could not re-read the live head/base of PR #$PR before removing needs-external-review."
                    had_infra_error=1
                    failing_prs="$failing_prs $PR"
                    echo "::endgroup::"
                    continue
                  fi
                  captured_pair=$(printf '%s\t%s' "$LANE_HEAD" "$LANE_BASE")
                  if [ -z "$live_pair" ] || [ "$live_pair" != "$captured_pair" ]; then
                    echo "PR #$PR head/base moved while the merge gate was evaluated (evaluated: $captured_pair; live: ${live_pair:-unreadable}); leaving needs-external-review for the next evaluation."
                    echo "::endgroup::"
                    continue
                  fi
                fi
                echo "Gate passes — removing needs-external-review label."
                # Single (non-retried) REST DELETE + retried verify (#465/#827)
                # — see the evaluate-and-clear job above for the full rationale
                # on why the DELETE's HTTP status, not the end-state read, is
                # what attributes the removal to this run.
                del_out=$(gh api "repos/$REPO/issues/$PR/labels/needs-external-review" -X DELETE -i --silent 2>/dev/null || true)
                del_status=$(printf '%s\n' "$del_out" | awk 'NR==1{print $2; exit}')
                still_present=$(with_gh_retry gh pr view "$PR" --repo "$REPO" --json labels --jq 'any(.labels[]?; .name == "needs-external-review")' || echo "unknown")
                if [ "$still_present" = "false" ]; then
                  # #2193: confirmed absent after a clean pass — heal candidate.
                  heal_prs="$heal_prs $PR"
                  # Comment ONLY if THIS sweep performed the removal (#827).
                  case "$del_status" in
                    200|204)
                      if [ "$gate_source" = dependabot-pin-bump ]; then
                        comment_body=$(printf '%s\n%s\n\n%s\n\n%s\n%s\n%s\n\n%s' \
                          "<!-- mergepath-dependabot-pin-bump:v1 verified-head=$(jq -r '.head' <<<"$PIN_JSON") verified-base=$(jq -r '.base' <<<"$PIN_JSON") -->" \
                          "**Automated label removal (scheduled sweep) — Dependabot action-pin bump lane** ✅ (head \`$(jq -r '.head' <<<"$PIN_JSON")\`, base \`$(jq -r '.base' <<<"$PIN_JSON")\`)" \
                          "This Dependabot PR touches \`.github/workflows/\` only through action pins, so it is exempt from the \`.github/**\` protected-path external-review rule (REVIEW_POLICY.md § Dependabot action-pin bump lane). Removed \`needs-external-review\` so Label Gate passes. Proven on the live head/base pair by the trusted \`scripts/workflow/dependabot_pin_bump_exemption.sh\`:" \
                          "- Commit provenance: $(jq -r '.provenance' <<<"$PIN_JSON")" \
                          "- Diff shape: $(jq -r '.pins' <<<"$PIN_JSON") action pin line(s) across $(jq -r '.files | length' <<<"$PIN_JSON") workflow file(s); every changed line is a \`uses:\` ref or its pin comment, and nothing else changed" \
                          "$(jq -r '.files[] | "  - `\(.filename)`: \(.pins) pin line(s)"' <<<"$PIN_JSON")" \
                          "The PR still needs CI green and the Dependabot reviewer-identity \`APPROVED\` on this head (Merge clearance gate). See [.github/workflows/auto-clear-blocking-labels.yml](.github/workflows/auto-clear-blocking-labels.yml) for the sweep doctrine.")
                      else
                        comment_body='**Automated label removal (scheduled sweep).** `scripts/codex-review-check.sh` cleared the merge gate on this HEAD between event triggers (for example, an anchored Codex verdict or review arriving between event-driven evaluations). Removed `needs-external-review`. See [.github/workflows/auto-clear-blocking-labels.yml](.github/workflows/auto-clear-blocking-labels.yml) (#191/#197) for the sweep doctrine.'
                      fi
                      # #530: non-idempotent comment POST — deliberately
                      # unretried (a single attempt cannot duplicate); see the
                      # event-driven job above for the full rationale. Failure
                      # is warn-only.
                      gh pr comment "$PR" --repo "$REPO" --body "$comment_body" \
                        || echo "::warning::Failed to post attribution comment for PR #$PR"
                      ;;
                    404)
                      echo "needs-external-review was already absent (DELETE HTTP 404) — another run or sweep cleared it; skipping the attribution comment (#827)."
                      ;;
                    *)
                      echo "::warning::Unexpected DELETE HTTP '${del_status:-none}' for needs-external-review on PR #$PR; label is confirmed absent, so skipping the attribution comment rather than risking a duplicate (#827)."
                      ;;
                  esac
                else
                  # Removal did not take (label still present or verify read
                  # failed) — infra error, not warning-only. The sweep must
                  # not report success when the label is still stuck
                  # (CodeRabbit Major, #271; verify-end-state per #465).
                  echo "::error::Failed to remove needs-external-review on PR #$PR — label still stuck (state: $still_present, DELETE HTTP ${del_status:-none})."
                  had_infra_error=1
                  failing_prs="$failing_prs $PR"
                fi
                ;;
              1) echo "Gate not yet met — leaving label in place." ;;
              3) echo "::error::codex-review-check.sh rc=3 on PR #$PR"; had_infra_error=1; failing_prs="$failing_prs $PR" ;;
              *) echo "::error::unexpected rc=$rc on PR #$PR"; had_infra_error=1; failing_prs="$failing_prs $PR" ;;
            esac
            echo "::endgroup::"
          done <<<"$PRS"
          # Surface the infra-error sentinel + per-PR list to the next
          # step (#324 round 2 codex P2). See evaluate-and-clear job
          # for the rationale (correct head SHA per failing PR).
          echo "HAD_INFRA_ERROR=$had_infra_error" >> "$GITHUB_ENV"
          # shellcheck disable=SC2086  # intentional word-splitting to trim
          echo "HAD_INFRA_ERROR_PRS=$(echo $failing_prs)" >> "$GITHUB_ENV"
          # #2193: deduplicated heal candidates minus this pass's infra failures.
          heal_out=""
          for heal_pr in $heal_prs; do
            case " $failing_prs $heal_out " in
              *" $heal_pr "*) ;;
              *) heal_out="$heal_out $heal_pr" ;;
            esac
          done
          # shellcheck disable=SC2086  # intentional word-splitting to trim
          echo "heal_prs=$(echo $heal_out)" >> "$GITHUB_OUTPUT"
          exit "$had_infra_error"

      - name: Find open approved PRs for the continuation backstop
        id: approved
        if: steps.find.outputs.enabled != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          source scripts/lib/gh-retry-helpers.sh
          # workflow_run accepts only literal workflow display names. A valid
          # consumer repo_lint_local.yml may choose any name, so its completion
          # cannot always wake the event-driven continuation above. The existing
          # five-minute sweep is the bounded backstop; search narrows it to PRs
          # GitHub considers approved, and the continuation re-verifies the
          # registered reviewer's latest state authoritatively.
          if ! prs=$(with_gh_retry gh pr list --repo "$REPO" --state open \
            --search 'review:approved' --limit 500 --json number --jq '.[].number'); then
            echo "::error::Failed to list open approved PRs on $REPO"
            exit 1
          fi
          if [ -z "$prs" ]; then
            echo "prs=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo 'prs<<EOF'
            echo "$prs"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Continue approved PRs after custom-workflow completions
        if: steps.find.outputs.enabled != 'false' && steps.approved.outputs.prs != ''
        env:
          AUTHOR_TOKEN: ${{ secrets.AUTHOR_MERGE_TOKEN }}
          WORKFLOW_TOKEN: ${{ github.token }}
          QUEUE_POLICY_TOKEN: ${{ secrets.MERGE_QUEUE_POLICY_TOKEN }}
          QUEUE_SOURCE_TOKEN: ${{ secrets.MERGE_QUEUE_SOURCE_TOKEN }}
          # Routes ONLY the review-feedback-accounting.sh call inside
          # approval-merge-continuation.sh through GITHUB_TOKEN instead of the
          # author token used by normal continuation (#1101, CodeRabbit on PR
          # #1106). See this job's permissions block for why.
          ACCOUNTING_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRS: ${{ steps.approved.outputs.prs }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/workflow/approval-merge-continuation.sh ]; then
            echo "::notice::Approval continuation helper is not on the trusted default branch yet; skipping this first-rollout sweep."
            exit 0
          fi
          if ! grep -Fq 'APPROVAL_PROTECTIVE_RETRACTION_V2' scripts/workflow/approval-merge-continuation.sh; then
            echo "::notice::Approval continuation predates governing-policy protective retraction; skipping this first-rollout sweep."
            exit 0
          fi
          continuation_infra_error=0
          continuation_failing_prs=""
          while IFS= read -r PR; do
            [ -n "$PR" ] || continue
            set +e
            GH_TOKEN="$WORKFLOW_TOKEN" MERGEPATH_AUTHOR_TOKEN="$AUTHOR_TOKEN" \
              MERGEPATH_QUEUE_POLICY_TOKEN="$QUEUE_POLICY_TOKEN" \
              MERGEPATH_QUEUE_SOURCE_TOKEN="$QUEUE_SOURCE_TOKEN" \
              bash scripts/workflow/approval-merge-continuation.sh \
              --retract-unsafe-only "$PR" "$REPO"
            protective_rc=$?
            if [ "$protective_rc" -eq 0 ] && [ -z "${AUTHOR_TOKEN:-}" ]; then
              echo "::notice::AUTHOR_MERGE_TOKEN is not configured; protective retraction completed but scheduled author-token continuation remains disabled."
              rc=0
            elif [ "$protective_rc" -eq 0 ]; then
              GH_TOKEN="$AUTHOR_TOKEN" MERGEPATH_AUTHOR_TOKEN="$AUTHOR_TOKEN" \
                MERGEPATH_PROTECTIVE_TOKEN="$WORKFLOW_TOKEN" \
                MERGEPATH_QUEUE_POLICY_TOKEN="$QUEUE_POLICY_TOKEN" \
                MERGEPATH_QUEUE_SOURCE_TOKEN="$QUEUE_SOURCE_TOKEN" \
                MERGEPATH_PROTECTIVE_RETRACTION_DONE=1 \
                bash scripts/workflow/approval-merge-continuation.sh "$PR" "$REPO"
              rc=$?
            else
              rc=$protective_rc
            fi
            set -e
            case "$rc" in
              0) ;;
              4) echo "PR #$PR is not merge-ready; a later event or sweep will re-evaluate it." ;;
              *)
                echo "::error::Scheduled approval continuation hit infrastructure/config error rc=$rc on PR #$PR."
                continuation_infra_error=1
                continuation_failing_prs="$continuation_failing_prs $PR"
                ;;
            esac
          done <<<"$PRS"
          echo "CONTINUATION_INFRA_ERROR=$continuation_infra_error" >> "$GITHUB_ENV"
          # shellcheck disable=SC2086  # intentional word-splitting to trim
          echo "CONTINUATION_INFRA_ERROR_PRS=$(echo $continuation_failing_prs)" >> "$GITHUB_ENV"
          exit "$continuation_infra_error"

      - name: Surface approval continuation failures as per-PR check-runs
        if: always() && env.CONTINUATION_INFRA_ERROR == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/workflow/report-approval-continuation-failures.sh ]; then
            echo "::notice::Continuation failure reporter is not on the trusted default branch yet; the workflow log remains authoritative for this first rollout."
            exit 0
          fi
          bash scripts/workflow/report-approval-continuation-failures.sh \
            "$REPO" "$RUN_URL" "${CONTINUATION_INFRA_ERROR_PRS:-}"

      - name: Surface infra failure as per-PR check-runs
        # Mirrors evaluate-and-clear's surfacing step. See that step's
        # comments for the per-PR check-run rationale (#324 round 2 P2).
        if: always() && env.HAD_INFRA_ERROR == '1'
        env:
          # check-run POST works with GITHUB_TOKEN + `checks: write`.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source scripts/lib/gh-retry-helpers.sh
          REPO='${{ github.repository }}'
          RUN_URL='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          if [ -z "${HAD_INFRA_ERROR_PRS:-}" ]; then
            echo "::warning::HAD_INFRA_ERROR=1 but HAD_INFRA_ERROR_PRS is empty — skipping check-run emission."
            exit 0
          fi
          for PR in $HAD_INFRA_ERROR_PRS; do
            echo "::group::Posting infra-failure check-run for PR #$PR (sweep)"
            if ! HEAD_SHA=$(with_gh_retry gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid); then
              echo "::warning::Failed to resolve head SHA for PR #$PR — skipping check-run."
              echo "::endgroup::"
              continue
            fi
            if current_has_label=$(with_gh_retry gh pr view "$PR" --repo "$REPO" --json labels --jq 'any(.labels[]?; .name == "needs-external-review")'); then
              :
            else
              echo "::warning::Failed to re-read needs-external-review on PR #$PR before posting the infra-failure check-run (sweep)."
              current_has_label=unknown
            fi
            if [ "$current_has_label" = "false" ]; then
              # Issue #499: the label removal can succeed while the
              # immediate verification read returns unknown. In that
              # case a later read proving the label is absent should
              # heal the synthetic check-run instead of leaving a
              # permanent failure on the PR's Checks tab.
              with_gh_retry gh api "repos/$REPO/check-runs" \
                -X POST \
                -f name='auto-clear-blocking-labels' \
                -f "head_sha=$HEAD_SHA" \
                -f status='completed' \
                -f conclusion='success' \
                -F "output[title]=Auto-clear confirmed needs-external-review absent (scheduled sweep)" \
                -F "output[summary]=PR #$PR — a prior sweep verification failed, but a later read confirmed the label is absent. See workflow run logs: $RUN_URL" \
                || echo "::warning::Failed to post healed sweep check-run for PR #$PR (workflow log still confirms the label is absent)."
              echo "::endgroup::"
              continue
            fi
            with_gh_retry gh api "repos/$REPO/check-runs" \
              -X POST \
              -f name='auto-clear-blocking-labels' \
              -f "head_sha=$HEAD_SHA" \
              -f status='completed' \
              -f conclusion='failure' \
              -F "output[title]=Auto-clear hit an infrastructure error (scheduled sweep)" \
              -F "output[summary]=PR #$PR — see workflow run logs: $RUN_URL" \
              || echo "::warning::Failed to post check-run for PR #$PR (annotation lost; workflow log still surfaces the failure)."
            echo "::endgroup::"
          done

      - name: Heal stale auto-clear infra-failure check-runs (sweep)
        # #2193: mirrors the evaluate-and-clear job's heal step; see its
        # comments. Last in the job for the same reason.
        if: ${{ !cancelled() && steps.sweep.outputs.heal_prs != '' }}
        env:
          # Check-runs can only be created by a GitHub App: GITHUB_TOKEN with
          # `checks: write`, never a PAT.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAL_PRS: ${{ steps.sweep.outputs.heal_prs }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/workflow/heal-auto-clear-infra-check.sh ]; then
            echo "::notice::Auto-clear heal helper is not on the trusted default branch yet; skipping this first-rollout sweep."
            exit 0
          fi
          bash scripts/workflow/heal-auto-clear-infra-check.sh "$REPO" "$RUN_URL" sweep "$HEAL_PRS"
