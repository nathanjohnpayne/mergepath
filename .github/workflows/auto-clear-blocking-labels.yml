name: Auto-clear blocking labels

# Closes the manual-label-removal toil documented in #191.
#
# When the codex-review-check.sh merge gate clears (CI green +
# reviewer-identity APPROVED + Codex cleared on HEAD), this workflow
# removes the `needs-external-review` label automatically. Without it,
# every over-threshold PR requires the human to do
# `gh pr edit <N> --remove-label needs-external-review` after agents
# have done all the actual review work.
#
# Scope: ONLY removes `needs-external-review`. `needs-human-review`,
# `policy-violation`, and `human-hold` remain manual-only by design (see
# REVIEW_POLICY.md § Agent prohibitions). The doctrine carve-out for
# this workflow ships in #196.

on:
  # `edited` + `reopened` (#730): a body/title edit is the reliable way to
  # re-fire the merge-clearance gate for a claude-authored Phase-4 PR after a
  # LATE Codex clearance — an `issue_comment` (Codex's verdict) does not fire
  # `pull_request` workflows, but a body edit does. Before #730 that nudge
  # re-evaluated the gate yet never prompted auto-clear on the PR head, so
  # `needs-external-review` stayed stuck until the 5-min sweep or a human
  # removed it (observed on #729). This trigger gives DIRECT PR context
  # (`.pull_request.number`) with no dependency on the flaky
  # `workflow_run.pull_requests` array. `reopened` covers a reopen with the
  # label still present. The `unlabeled`-self-fire guard below still applies.
  pull_request_target:
    types: [synchronize, edited, reopened, labeled, unlabeled]
  # workflow_run fires on completion of OTHER workflows. We target
  # the three that produce the required-check signals codex-review-
  # check.sh inspects: PR Review Policy (Label Gate, Self-Review,
  # External Review Check), Agent Review Pipeline (auto-merge-on-
  # approval, detect-disagreement, etc.), and repo-lint (lint).
  # This replaces the prior `check_suite` trigger, which (per codex
  # P1 on PR #202) does NOT fire for suites created by GitHub
  # Actions — only for external CI providers. Without workflow_run,
  # the common path of "reviewer approves → Actions CI catches up →
  # gate now passes" produced no event and the label stayed stuck.
  #
  # "repo-lint-local" (#655) is a consumer's optional, never-propagated
  # repo_lint_local.yml annex (#601) — a per-consumer workflow named
  # exactly this (verified against a live consumer annex; mergepath
  # itself carries no such workflow, so this entry never fires here).
  # Without it, this workflow's re-evaluation of a consumer's
  # needs-external-review label only learns about a repo-lint-local
  # completion via the 5-minute scheduled sweep below, not immediately.
  # codex-review-check.sh's gate (a) is what actually enforces a red
  # repo-lint-local as blocking (see scripts/codex-review-check.sh);
  # this entry only improves how promptly that re-evaluation runs.
  #
  # #655 Codex P3 round 11 ("include the unnamed annex workflow
  # trigger"): workflow_run matches by the target workflow's displayed
  # NAME, which for an annex that omits a top-level `name:` (a case the
  # gate code has explicitly supported since round 6) is the workflow
  # FILE PATH, not the literal "repo-lint-local" above. Listing the file
  # path too closes that gap for this promptness-only trigger; the
  # scheduled sweep below still covers it either way, just less
  # immediately.
  # "Merge Clearance Gate" (#730): its SUCCESS is the most direct signal that
  # clearance state changed, and — unlike "PR Review Policy" — it actually
  # REACHES `conclusion: success` when the gate clears. PR Review Policy's
  # Label Gate job is red for as long as `needs-external-review` is present, so
  # that workflow can never complete `success` while the label is up; the
  # `conclusion != success` skip in the resolve step below therefore means it
  # never triggers auto-clear (a chicken-and-egg the gate workflow avoids
  # because it is not itself gated on the label). Adding the gate closes the
  # gap where a late Codex clearance flips the gate green but no listened
  # workflow fires auto-clear on the PR head (observed on #729).
  workflow_run:
    workflows:
      - "PR Review Policy"
      - "Agent Review Pipeline"
      - "Merge Clearance Gate"
      - "repo-lint"
      - "repo-lint-local"
      - ".github/workflows/repo_lint_local.yml"
    types: [completed]
  # #2239: the authoritative `Merge clearance gate` verdict is posted by
  # required-check-publisher.yml, which none of the workflow_run parents above
  # observes. When a publisher pass posts a GREEN verdict on the head of a PR
  # that still carries needs-external-review, its nominate-auto-clear job sends
  # this event carrying only the PR number, so the label goes within one run
  # instead of waiting for the sweep below. The same job nominates a
  # label-absent PR whose newest auto-clear-blocking-labels check-run is a
  # failure, so a heal that failed after a removal is retried (#2205).
  # repository_dispatch has no ref: GitHub runs only the default branch's copy
  # of this file, and a GITHUB_TOKEN dispatch does start a run. The payload is
  # trusted for nothing beyond the PR number: the evaluate-and-clear job
  # re-derives clearance from live state exactly as for every other event, and
  # fences the live head/base before the DELETE.
  repository_dispatch:
    types: [auto-clear-evaluate]
  # Periodic sweep — catches the 👍-after-last-push case (codex
  # reacts on the PR issue but no synchronize / review / workflow_run
  # event fires, so the event-driven path stays inert). Runs every
  # 5 minutes against any open PR carrying needs-external-review.
  # Idempotent (no-op when label absent or gate not yet met). Sub-C
  # of #191. See scheduled-sweep job below for the cadence knob.
  #
  # Tightened from 15→5 min in mergepath#324 to close the
  # 👍-after-last-push gap observed across the mergepath#250 Phase D
  # propagation fanout (3 of 6 consumer PRs needed manual
  # request-label-removal.sh because no event-driven trigger
  # fired and the prior 15-min sweep stranded them for up to 15 min
  # after Codex cleared). 3× the API quota cost, but a meaningfully
  # shorter blocker window. The PAT-driven label removal added in
  # #324 also helps — but the sweep is still the only backstop for
  # the no-event path. It also re-enters the approval continuation for open
  # approved PRs. That backstop covers a consumer annex with a custom display
  # name, which cannot be enumerated in workflow_run.workflows.
  schedule:
    - cron: '*/5 * * * *'

permissions:
  pull-requests: write
  contents: read
  # codex-review-check.sh drills statusCheckRollup →
  # checkSuite.workflowRun, which needs `actions: read` in addition
  # to the `checks` scope. Without it the GraphQL fails with `Resource
  # not accessible by integration` and the gate evaluation aborts
  # with rc=3, leaving `needs-external-review` stuck on every
  # consumer PR after Codex approves. Surfaced on
  # nathanjohnpayne/matchline#233 (#306 propagation canary); see
  # #310 for the full repro + permission scope rationale.
  actions: read
  # `issues: read` is required because codex-review-check.sh reads
  # issues-scoped endpoints: /issues/{pr}/reactions (Codex 👍
  # clearance) and /issues/{pr}/timeline (force-push anchor). On a
  # restricted-default GITHUB_TOKEN an omitted scope defaults to
  # `none`, so those reads 403 and the gate aborts with rc=3,
  # leaving `needs-external-review` stuck even after Codex clears.
  # Same class as the merge-clearance-gate.yml fix on PR #429; see
  # #431.
  issues: read
  # `checks: write` is required so the "Surface infra failure as
  # check-run" step (#324) can POST a failed check-run to the PR's
  # checks tab when this workflow hits an infrastructure error
  # (failed label read, failed label removal, codex-review-check.sh
  # rc=3, contract-drift rc). Without a visible check-run, flake
  # recurrences are invisible unless someone happens to look at the
  # workflow run log. `write` supersets `read`, so this single entry
  # also covers codex-review-check.sh's check-reading need — do NOT
  # re-add a separate `checks: read` key: a duplicate `checks:` map
  # key is a startup-failure-level workflow file error (#324 shipped
  # exactly that regression; the parser rejected the file and every
  # trigger produced a zero-job failed run, so the label never
  # auto-cleared).
  checks: write
  # Required for scripts/workflow/approval-merge-continuation.sh's
  # review-feedback-accounting.sh call (both jobs below reach it), which
  # reads code-scanning/alerts to grade a github-advanced-security[bot]
  # finding's severity (#1101). That call runs under ACCOUNTING_GH_TOKEN
  # (this workflow's GITHUB_TOKEN, not the ambient AUTHOR_MERGE_TOKEN the
  # continuation steps otherwise use) specifically so this block can reach
  # it — CodeRabbit on PR #1106.
  security-events: read

jobs:
  evaluate-and-clear:
    name: Re-evaluate codex-review-check gate
    runs-on: ubuntu-latest
    # These are environment secrets, never repository secrets. The environment
    # permits only main-associated deployments, so a candidate-controlled
    # pull_request/pull_request_review workflow cannot request either PAT.
    environment: merge-queue-policy
    outputs:
      candidate_prs: ${{ steps.pr.outputs.numbers }}
      protected_pairs: ${{ steps.clear.outputs.protected_pairs }}
    # Self-fire loop guard: when this workflow's label removal fires
    # the `unlabeled` event for `needs-external-review`, skip — we
    # just removed it; nothing to do.
    # Schedule guard: cron runs the scheduled-sweep job below; the
    # event-driven path is moot for scheduled invocations. CR Major
    # on PR #213 r2 — without this, every 15-min cron paid for an
    # extra checkout-only no-op job.
    if: |
      github.event_name != 'schedule' &&
      !(
        github.event_name == 'pull_request_target' &&
        github.event.action == 'unlabeled' &&
        github.event.label.name == 'needs-external-review'
      )
    steps:
      - name: Checkout repo (for codex-review-check.sh)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # SECURITY: pin to the default branch so we always run the
          # TRUSTED copy of scripts/codex-review-check.sh — never a
          # candidate version. pull_request_review reaches this path only
          # indirectly, after Agent Review Pipeline completes and emits the
          # trusted-definition workflow_run event.
          ref: ${{ github.event.repository.default_branch }}
          # Need full history so codex-review-check can inspect the
          # PR HEAD against base. The script doesn't currently do that
          # but a future tightening might.
          fetch-depth: 0
          # Explicit-token gh only, no authenticated git, so don't leave the
          # checkout token in .git/config (#548 / Codex #550).
          persist-credentials: false

      - name: Resolve PR number from event
        id: pr
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_JSON: ${{ toJSON(github.event) }}
          # #730: read-only `gh pr list` fallback when workflow_run.pull_requests
          # is empty. GITHUB_TOKEN suffices (pull-requests: read is covered by
          # the workflow's pull-requests: write). No PR-controlled input reaches
          # a shell eval here — HEAD_SHA comes from the trusted event payload and
          # is only used in a jq `select`.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Each event surfaces PR number(s) differently. Emit a
          # newline-separated list (most events have exactly one PR).
          # workflow_run.completed can attach to multiple PRs in
          # principle, so we enumerate.
          case "$EVENT_NAME" in
            pull_request_target)
              prs=$(jq -r '.pull_request.number' <<<"$EVENT_JSON")
              ;;
            workflow_run)
              # Only act on successful runs of the listened workflows;
              # a failed lint or PR Review Policy run won't have
              # changed the gate state, so don't bother re-evaluating.
              conclusion=$(jq -r '.workflow_run.conclusion' <<<"$EVENT_JSON")
              if [ "$conclusion" != "success" ]; then
                echo "workflow_run conclusion=$conclusion (not success); skipping." >&2
                echo "numbers=" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              prs=$(jq -r '.workflow_run.pull_requests[].number' <<<"$EVENT_JSON")
              # #730: `workflow_run.pull_requests` is frequently EMPTY even for a
              # run whose head IS a PR head (a documented GitHub quirk for
              # same-repo PR runs, and always empty for push / issue_comment /
              # schedule-triggered runs). Without a fallback, a listened workflow
              # (notably the newly-added "Merge Clearance Gate") completing
              # SUCCESS on the PR head resolves NO PR here and the label stays
              # stuck. Fall back to the open PR whose head SHA == the run's
              # head_sha. When head_sha is a default-branch commit (the
              # concurrent-main-merge case that stole the events on #729), no
              # open PR matches → empty → correct no-op.
              if [ -z "$prs" ]; then
                HEAD_SHA=$(jq -r '.workflow_run.head_sha // empty' <<<"$EVENT_JSON")
                if [ -n "$HEAD_SHA" ]; then
                  echo "workflow_run.pull_requests empty; resolving open PRs by head_sha=$HEAD_SHA (#730)." >&2
                  # --limit 500 (mirrors the scheduled sweep) so a match beyond
                  # gh's default 30 open PRs isn't missed.
                  prs=$(gh pr list --repo "$REPO" --state open --limit 500 --json number,headRefOid 2>/dev/null \
                    | jq -r --arg sha "$HEAD_SHA" '.[] | select(.headRefOid == $sha) | .number' 2>/dev/null || true)
                fi
              fi
              ;;
            repository_dispatch)
              # #2239/#2205: a publisher nomination. Only the PR number is
              # read from the payload, and only a positive integer is
              # accepted; everything else is re-derived from live state by
              # the next step. Anything malformed fails the run as an alarm
              # (the publisher only ever sends an integer) and evaluates
              # nothing.
              action=$(jq -r '.action // empty' <<<"$EVENT_JSON")
              if [ "$action" != "auto-clear-evaluate" ]; then
                echo "repository_dispatch action '$action' is not auto-clear-evaluate; skipping." >&2
                echo "numbers=" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              prs=$(jq -r '.client_payload.pr // empty | tostring' <<<"$EVENT_JSON")
              if ! [[ "$prs" =~ ^[1-9][0-9]{0,9}$ ]]; then
                echo "::error::repository_dispatch client_payload.pr is not a positive integer: '$prs'"
                echo "numbers=" >> "$GITHUB_OUTPUT"
                exit 1
              fi
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 0  # don't fail; just skip
              ;;
          esac
          if [ -z "$prs" ]; then
            echo "No PR number resolvable from event; skipping." >&2
            echo "numbers=" >> "$GITHUB_OUTPUT"
          else
            # Multi-line output: use a heredoc per Actions docs.
            {
              echo 'numbers<<EOF'
              echo "$prs"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Re-evaluate gate per PR + remove label on pass
        id: clear
        if: steps.pr.outputs.numbers != ''
        env:
          # PAT-driven label removal (#315/#324). GITHUB_TOKEN-driven
          # events do NOT trigger downstream workflows (recursion
          # prevention) — pr-review-policy.yml's Label Gate would
          # stay stuck on the pre-clear failure state until the next
          # push or label toggle. A PAT-driven event triggers
          # downstream workflows normally, so Label Gate re-fires and
          # mergeStateStatus flips to CLEAN within seconds rather
          # than stalling until something else fires the policy
          # workflow. Closes mergepath#315. Prefers the CI-actor
          # service account (CI_ACTOR_TOKEN, nathanpayne-robot),
          # falling back to REVIEWER_ASSIGNMENT_TOKEN where that
          # secret is not provisioned. Either way it must be a PAT,
          # not GITHUB_TOKEN, or the label write fires no re-arm.
          GH_TOKEN: ${{ github.token }}
          CLEAR_PHASE: protect
          WORKFLOW_TOKEN: ${{ github.token }}
          AUTHOR_TOKEN: ${{ secrets.AUTHOR_MERGE_TOKEN }}
          # Dedicated target-admin and source-read tokens for the queue proof.
          QUEUE_POLICY_TOKEN: ${{ secrets.MERGE_QUEUE_POLICY_TOKEN }}
          QUEUE_SOURCE_TOKEN: ${{ secrets.MERGE_QUEUE_SOURCE_TOKEN }}
          PR_NUMBERS: ${{ steps.pr.outputs.numbers }}
          REPO: ${{ github.repository }}
          # For resolve_base_policy.sh's base-pinned form in the pin-bump lane.
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # #2193: selects which label-absent PRs are heal candidates below.
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          bash scripts/workflow/auto-clear-event.sh

      - name: Continue approved PRs after completed checks
        if: github.event_name == 'workflow_run' && steps.pr.outputs.numbers != ''
        env:
          AUTHOR_TOKEN: ${{ secrets.AUTHOR_MERGE_TOKEN }}
          WORKFLOW_TOKEN: ${{ github.token }}
          QUEUE_POLICY_TOKEN: ${{ secrets.MERGE_QUEUE_POLICY_TOKEN }}
          QUEUE_SOURCE_TOKEN: ${{ secrets.MERGE_QUEUE_SOURCE_TOKEN }}
          # Routes ONLY the review-feedback-accounting.sh call inside
          # approval-merge-continuation.sh through GITHUB_TOKEN instead of the
          # author token used by normal continuation (#1101, CodeRabbit on PR
          # #1106). See this job's permissions block for why.
          ACCOUNTING_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBERS: ${{ steps.pr.outputs.numbers }}
          CLEARED_PRS: ${{ steps.clear.outputs.cleared_prs }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/workflow/approval-merge-continuation.sh ]; then
            echo "::notice::Approval continuation helper is not on the trusted default branch yet; skipping this first-rollout event."
            exit 0
          fi
          if ! grep -Fq 'APPROVAL_PROTECTIVE_RETRACTION_V2' scripts/workflow/approval-merge-continuation.sh; then
            echo "::notice::Approval continuation predates governing-policy protective retraction; skipping this first-rollout event."
            exit 0
          fi
          continuation_infra_error=0
          continuation_failing_prs=""
          while IFS= read -r PR; do
            [ -n "$PR" ] || continue
            case " $CLEARED_PRS " in
              *" $PR "*)
                echo "PR #$PR had needs-external-review removed in this pass; waiting for the resulting policy workflow completion."
                continue
                ;;
            esac
            set +e
            GH_TOKEN="$WORKFLOW_TOKEN" MERGEPATH_AUTHOR_TOKEN="$AUTHOR_TOKEN" \
              MERGEPATH_QUEUE_POLICY_TOKEN="$QUEUE_POLICY_TOKEN" \
              MERGEPATH_QUEUE_SOURCE_TOKEN="$QUEUE_SOURCE_TOKEN" \
              bash scripts/workflow/approval-merge-continuation.sh \
              --retract-unsafe-only "$PR" "$REPO"
            protective_rc=$?
            if [ "$protective_rc" -eq 0 ] && [ -z "${AUTHOR_TOKEN:-}" ]; then
              echo "::notice::AUTHOR_MERGE_TOKEN is not configured; protective retraction completed but author-token continuation remains disabled."
              rc=0
            elif [ "$protective_rc" -eq 0 ]; then
              GH_TOKEN="$AUTHOR_TOKEN" MERGEPATH_AUTHOR_TOKEN="$AUTHOR_TOKEN" \
                MERGEPATH_PROTECTIVE_TOKEN="$WORKFLOW_TOKEN" \
                MERGEPATH_QUEUE_POLICY_TOKEN="$QUEUE_POLICY_TOKEN" \
                MERGEPATH_QUEUE_SOURCE_TOKEN="$QUEUE_SOURCE_TOKEN" \
                MERGEPATH_PROTECTIVE_RETRACTION_DONE=1 \
                bash scripts/workflow/approval-merge-continuation.sh "$PR" "$REPO"
              rc=$?
            else
              rc=$protective_rc
            fi
            set -e
            case "$rc" in
              0) ;;
              4) echo "PR #$PR is not merge-ready on this event; a later completion event will re-evaluate it." ;;
              *)
                echo "::error::Approval continuation hit infrastructure/config error rc=$rc on PR #$PR."
                continuation_infra_error=1
                continuation_failing_prs="$continuation_failing_prs $PR"
                ;;
            esac
          done <<<"$PR_NUMBERS"
          echo "CONTINUATION_INFRA_ERROR=$continuation_infra_error" >> "$GITHUB_ENV"
          # shellcheck disable=SC2086  # intentional word-splitting to trim
          echo "CONTINUATION_INFRA_ERROR_PRS=$(echo $continuation_failing_prs)" >> "$GITHUB_ENV"
          exit "$continuation_infra_error"

      - name: Surface approval continuation failures as per-PR check-runs
        if: always() && env.CONTINUATION_INFRA_ERROR == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/workflow/report-approval-continuation-failures.sh ]; then
            echo "::notice::Continuation failure reporter is not on the trusted default branch yet; the workflow log remains authoritative for this first rollout."
            exit 0
          fi
          bash scripts/workflow/report-approval-continuation-failures.sh \
            "$REPO" "$RUN_URL" "${CONTINUATION_INFRA_ERROR_PRS:-}"

      - name: Surface infra failure as per-PR check-runs
        # Run even when the prior step failed — `if: always()` + the
        # HAD_INFRA_ERROR sentinel so we only post failed check-runs
        # when the prior step actually hit an infra error (not when
        # everything was clean or only gate-evaluation said "not yet
        # met").
        #
        # Per-PR check-runs (#324 round 2 codex P2): the prior version
        # used `head_sha: ${{ github.sha }}`, but on workflow_run /
        # pull_request_target / schedule, github.sha resolves to a
        # default-branch commit, not the affected PR's head, so the
        # annotation landed on the wrong commit and missed the target
        # PR's Checks tab. Posting one check-run per failing PR fixes
        # both the wrong-commit problem and the lost-visibility
        # problem, at the cost of one extra `gh pr view` per failure
        # (cheap, only on the error path).
        if: always() && env.HAD_INFRA_ERROR == '1'
        env:
          # check-run POST works with GITHUB_TOKEN + `checks: write`
          # (added above). No PAT needed for this annotation surface.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source scripts/lib/gh-retry-helpers.sh
          REPO='${{ github.repository }}'
          RUN_URL='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          # HAD_INFRA_ERROR_PRS is a space-separated list set by the
          # prior step at each had_infra_error=1 site. Empty list →
          # nothing to surface (defensive: should not happen given
          # HAD_INFRA_ERROR is set).
          if [ -z "${HAD_INFRA_ERROR_PRS:-}" ]; then
            echo "::warning::HAD_INFRA_ERROR=1 but HAD_INFRA_ERROR_PRS is empty — skipping check-run emission."
            exit 0
          fi
          for PR in $HAD_INFRA_ERROR_PRS; do
            echo "::group::Posting infra-failure check-run for PR #$PR"
            if ! HEAD_SHA=$(with_gh_retry gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid); then
              echo "::warning::Failed to resolve head SHA for PR #$PR — skipping check-run."
              echo "::endgroup::"
              continue
            fi
            if current_has_label=$(with_gh_retry gh pr view "$PR" --repo "$REPO" --json labels --jq 'any(.labels[]?; .name == "needs-external-review")'); then
              :
            else
              echo "::warning::Failed to re-read needs-external-review on PR #$PR before posting the infra-failure check-run."
              current_has_label=unknown
            fi
            if [ "$current_has_label" = "false" ]; then
              # Issue #499: the label removal can succeed while the
              # immediate verification read returns unknown. In that
              # case a later read proving the label is absent should
              # heal the synthetic check-run instead of leaving a
              # permanent failure on the PR's Checks tab.
              with_gh_retry gh api "repos/$REPO/check-runs" \
                -X POST \
                -f name='auto-clear-blocking-labels' \
                -f "head_sha=$HEAD_SHA" \
                -f status='completed' \
                -f conclusion='success' \
                -F "output[title]=Auto-clear confirmed needs-external-review absent" \
                -F "output[summary]=PR #$PR — a prior verification failed, but a later read confirmed the label is absent. See workflow run logs: $RUN_URL" \
                || echo "::warning::Failed to post healed check-run for PR #$PR (workflow log still confirms the label is absent)."
              echo "::endgroup::"
              continue
            fi
            with_gh_retry gh api "repos/$REPO/check-runs" \
              -X POST \
              -f name='auto-clear-blocking-labels' \
              -f "head_sha=$HEAD_SHA" \
              -f status='completed' \
              -f conclusion='failure' \
              -F "output[title]=Auto-clear hit an infrastructure error" \
              -F "output[summary]=PR #$PR — see workflow run logs: $RUN_URL" \
              || echo "::warning::Failed to post check-run for PR #$PR (annotation lost; workflow log still surfaces the failure)."
            echo "::endgroup::"
          done

      - name: Heal stale auto-clear infra-failure check-runs
        # #2193: a clean pass that leaves needs-external-review absent
        # supersedes a stale failed auto-clear-blocking-labels check-run, which
        # otherwise stays the newest run on the head, drives the PR UNSTABLE
        # and makes gh-pr-guard.sh refuse the merge. The helper posts only
        # when the newest such run on the live head is a failure, and fences
        # the POST on a fresh head/label read before each of its retried
        # attempts (#2205). A heal that still fails is retried by the next
        # publisher full pass that posts a green clearance verdict on the
        # head: it reads the newest run and nominates the PR back here
        # through repository_dispatch (see required-check-publisher.yml's
        # nominate-auto-clear job). Last in the job so a helper
        # fault can never skip the label-clear or continuation steps;
        # !cancelled() so it still runs when the clear step exited non-zero
        # for a DIFFERENT PR's infrastructure error.
        if: ${{ !cancelled() && steps.clear.outputs.heal_prs != '' }}
        env:
          # Check-runs can only be created by a GitHub App: GITHUB_TOKEN with
          # `checks: write`, never a PAT.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAL_PRS: ${{ steps.clear.outputs.heal_prs }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/workflow/heal-auto-clear-infra-check.sh ]; then
            echo "::notice::Auto-clear heal helper is not on the trusted default branch yet; skipping this first-rollout pass."
            exit 0
          fi
          bash scripts/workflow/heal-auto-clear-infra-check.sh "$REPO" "$RUN_URL" event "$HEAL_PRS"

  scheduled-sweep:
    name: Periodic sweep for stale needs-external-review labels
    # Catches the 👍-after-last-push case (#197). Only fires on
    # schedule; the event-driven evaluate-and-clear job above
    # handles the common path. Idempotent: running twice on the
    # same PR with no state change is a no-op (label-present check
    # + read-only gate evaluation).
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    environment: merge-queue-policy
    outputs:
      candidate_prs: ${{ steps.find.outputs.prs }}
      protected_pairs: ${{ steps.sweep.outputs.protected_pairs }}
    steps:
      - name: Checkout repo (for codex-review-check.sh)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Schedule events have no PR context, so default GITHUB_REF
          # is the default branch already — pin explicitly for
          # consistency with the security stance of the event-driven
          # job above.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          # Explicit-token gh only, no authenticated git, so don't leave the
          # checkout token in .git/config (#548 / Codex #550).
          persist-credentials: false

      - name: Find PRs carrying needs-external-review
        id: find
        env:
          # Read-only list query. GITHUB_TOKEN is sufficient here —
          # the PAT-switch in the next step is what triggers downstream
          # workflows when the label is actually removed.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          source scripts/lib/gh-retry-helpers.sh
          # Read the per-repo cadence/enable knob from review-policy.yml.
          # Defaults: enabled=true. Operators can opt out by setting
          #   auto_clear_labels:
          #     scheduled_sweep_enabled: false
          # in their .github/review-policy.yml.
          CONFIG=".github/review-policy.yml"
          enabled=true
          if [ -f "$CONFIG" ]; then
            # CR Major on PR #213: strip trailing YAML comments
            # before comparing — `false  # opt out` was previously
            # being parsed as `false#optout`, leaving the sweep
            # enabled even when the operator explicitly disabled it.
            val=$(awk '
              /^auto_clear_labels:/ {in_block=1; next}
              in_block && /^[^[:space:]]/ {exit}
              in_block && /^[[:space:]]+scheduled_sweep_enabled:/ {
                sub(/#.*/, "")
                gsub(/.*: */, "")
                gsub(/[[:space:]]/, "")
                print
                exit
              }
            ' "$CONFIG")
            [ "$val" = "false" ] && enabled=false
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if [ "$enabled" = "false" ]; then
            echo "Scheduled sweep disabled for $REPO via review-policy.yml; skipping."
            echo "prs=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # List open PRs carrying the label. CR Major on PR #213:
          # `--limit 500` overrides gh's default of 30 so the sweep
          # processes ALL matching PRs in repos with high open-PR
          # counts. 500 is comfortably above any realistic limit for
          # a single repo's needs-external-review queue (would imply
          # ~500 PRs awaiting review — itself an alarm).
          # CR Major on PR #213 r2: capture gh output + exit status
          # separately. The prior `mapfile -t prs < <(gh ...)` form
          # swallowed gh's exit code via process substitution, so a
          # gh failure (auth, rate limit, network) silently became
          # "0 PRs found" and the sweep no-op'd instead of failing
          # loudly.
          if ! prs_raw=$(with_gh_retry gh pr list --repo "$REPO" --state open \
            --label needs-external-review --limit 500 \
            --json number --jq '.[].number'); then
            echo "::error::Failed to list open PRs with needs-external-review on $REPO"
            exit 1
          fi
          prs=()
          if [ -n "$prs_raw" ]; then
            mapfile -t prs <<<"$prs_raw"
          fi
          echo "Found ${#prs[@]} PR(s) with needs-external-review on $REPO"
          if [ "${#prs[@]}" -eq 0 ]; then
            echo "prs=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo 'prs<<EOF'
            printf '%s\n' "${prs[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Re-evaluate gate per PR
        id: sweep
        if: steps.find.outputs.prs != ''
        env:
          # PAT-driven label removal (#315/#324). See
          # evaluate-and-clear job above for the rationale; same
          # secret, same recursion-prevention bypass. Without the
          # PAT, the scheduled sweep would remove the label but
          # downstream workflows (pr-review-policy.yml Label Gate)
          # would not re-fire — so mergeStateStatus would stay
          # BLOCKED until the next push or manual nudge, defeating
          # the sweep's purpose.
          GH_TOKEN: ${{ github.token }}
          CLEAR_PHASE: protect
          WORKFLOW_TOKEN: ${{ github.token }}
          AUTHOR_TOKEN: ${{ secrets.AUTHOR_MERGE_TOKEN }}
          # Dedicated target-admin and source-read tokens for the queue proof.
          QUEUE_POLICY_TOKEN: ${{ secrets.MERGE_QUEUE_POLICY_TOKEN }}
          QUEUE_SOURCE_TOKEN: ${{ secrets.MERGE_QUEUE_SOURCE_TOKEN }}
          PRS: ${{ steps.find.outputs.prs }}
          REPO: ${{ github.repository }}
          # For resolve_base_policy.sh's base-pinned form in the pin-bump lane.
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          bash scripts/workflow/auto-clear-sweep.sh

      - name: Find open approved PRs for the continuation backstop
        id: approved
        if: steps.find.outputs.enabled != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          source scripts/lib/gh-retry-helpers.sh
          # workflow_run accepts only literal workflow display names. A valid
          # consumer repo_lint_local.yml may choose any name, so its completion
          # cannot always wake the event-driven continuation above. The existing
          # five-minute sweep is the bounded backstop; search narrows it to PRs
          # GitHub considers approved, and the continuation re-verifies the
          # registered reviewer's latest state authoritatively.
          if ! prs=$(with_gh_retry gh pr list --repo "$REPO" --state open \
            --search 'review:approved' --limit 500 --json number --jq '.[].number'); then
            echo "::error::Failed to list open approved PRs on $REPO"
            exit 1
          fi
          if [ -z "$prs" ]; then
            echo "prs=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo 'prs<<EOF'
            echo "$prs"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Continue approved PRs after custom-workflow completions
        if: steps.find.outputs.enabled != 'false' && steps.approved.outputs.prs != ''
        env:
          AUTHOR_TOKEN: ${{ secrets.AUTHOR_MERGE_TOKEN }}
          WORKFLOW_TOKEN: ${{ github.token }}
          QUEUE_POLICY_TOKEN: ${{ secrets.MERGE_QUEUE_POLICY_TOKEN }}
          QUEUE_SOURCE_TOKEN: ${{ secrets.MERGE_QUEUE_SOURCE_TOKEN }}
          # Routes ONLY the review-feedback-accounting.sh call inside
          # approval-merge-continuation.sh through GITHUB_TOKEN instead of the
          # author token used by normal continuation (#1101, CodeRabbit on PR
          # #1106). See this job's permissions block for why.
          ACCOUNTING_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRS: ${{ steps.approved.outputs.prs }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/workflow/approval-merge-continuation.sh ]; then
            echo "::notice::Approval continuation helper is not on the trusted default branch yet; skipping this first-rollout sweep."
            exit 0
          fi
          if ! grep -Fq 'APPROVAL_PROTECTIVE_RETRACTION_V2' scripts/workflow/approval-merge-continuation.sh; then
            echo "::notice::Approval continuation predates governing-policy protective retraction; skipping this first-rollout sweep."
            exit 0
          fi
          continuation_infra_error=0
          continuation_failing_prs=""
          while IFS= read -r PR; do
            [ -n "$PR" ] || continue
            set +e
            GH_TOKEN="$WORKFLOW_TOKEN" MERGEPATH_AUTHOR_TOKEN="$AUTHOR_TOKEN" \
              MERGEPATH_QUEUE_POLICY_TOKEN="$QUEUE_POLICY_TOKEN" \
              MERGEPATH_QUEUE_SOURCE_TOKEN="$QUEUE_SOURCE_TOKEN" \
              bash scripts/workflow/approval-merge-continuation.sh \
              --retract-unsafe-only "$PR" "$REPO"
            protective_rc=$?
            if [ "$protective_rc" -eq 0 ] && [ -z "${AUTHOR_TOKEN:-}" ]; then
              echo "::notice::AUTHOR_MERGE_TOKEN is not configured; protective retraction completed but scheduled author-token continuation remains disabled."
              rc=0
            elif [ "$protective_rc" -eq 0 ]; then
              GH_TOKEN="$AUTHOR_TOKEN" MERGEPATH_AUTHOR_TOKEN="$AUTHOR_TOKEN" \
                MERGEPATH_PROTECTIVE_TOKEN="$WORKFLOW_TOKEN" \
                MERGEPATH_QUEUE_POLICY_TOKEN="$QUEUE_POLICY_TOKEN" \
                MERGEPATH_QUEUE_SOURCE_TOKEN="$QUEUE_SOURCE_TOKEN" \
                MERGEPATH_PROTECTIVE_RETRACTION_DONE=1 \
                bash scripts/workflow/approval-merge-continuation.sh "$PR" "$REPO"
              rc=$?
            else
              rc=$protective_rc
            fi
            set -e
            case "$rc" in
              0) ;;
              4) echo "PR #$PR is not merge-ready; a later event or sweep will re-evaluate it." ;;
              *)
                echo "::error::Scheduled approval continuation hit infrastructure/config error rc=$rc on PR #$PR."
                continuation_infra_error=1
                continuation_failing_prs="$continuation_failing_prs $PR"
                ;;
            esac
          done <<<"$PRS"
          echo "CONTINUATION_INFRA_ERROR=$continuation_infra_error" >> "$GITHUB_ENV"
          # shellcheck disable=SC2086  # intentional word-splitting to trim
          echo "CONTINUATION_INFRA_ERROR_PRS=$(echo $continuation_failing_prs)" >> "$GITHUB_ENV"
          exit "$continuation_infra_error"

      - name: Surface approval continuation failures as per-PR check-runs
        if: always() && env.CONTINUATION_INFRA_ERROR == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/workflow/report-approval-continuation-failures.sh ]; then
            echo "::notice::Continuation failure reporter is not on the trusted default branch yet; the workflow log remains authoritative for this first rollout."
            exit 0
          fi
          bash scripts/workflow/report-approval-continuation-failures.sh \
            "$REPO" "$RUN_URL" "${CONTINUATION_INFRA_ERROR_PRS:-}"

      - name: Surface infra failure as per-PR check-runs
        # Mirrors evaluate-and-clear's surfacing step. See that step's
        # comments for the per-PR check-run rationale (#324 round 2 P2).
        if: always() && env.HAD_INFRA_ERROR == '1'
        env:
          # check-run POST works with GITHUB_TOKEN + `checks: write`.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source scripts/lib/gh-retry-helpers.sh
          REPO='${{ github.repository }}'
          RUN_URL='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          if [ -z "${HAD_INFRA_ERROR_PRS:-}" ]; then
            echo "::warning::HAD_INFRA_ERROR=1 but HAD_INFRA_ERROR_PRS is empty — skipping check-run emission."
            exit 0
          fi
          for PR in $HAD_INFRA_ERROR_PRS; do
            echo "::group::Posting infra-failure check-run for PR #$PR (sweep)"
            if ! HEAD_SHA=$(with_gh_retry gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid); then
              echo "::warning::Failed to resolve head SHA for PR #$PR — skipping check-run."
              echo "::endgroup::"
              continue
            fi
            if current_has_label=$(with_gh_retry gh pr view "$PR" --repo "$REPO" --json labels --jq 'any(.labels[]?; .name == "needs-external-review")'); then
              :
            else
              echo "::warning::Failed to re-read needs-external-review on PR #$PR before posting the infra-failure check-run (sweep)."
              current_has_label=unknown
            fi
            if [ "$current_has_label" = "false" ]; then
              # Issue #499: the label removal can succeed while the
              # immediate verification read returns unknown. In that
              # case a later read proving the label is absent should
              # heal the synthetic check-run instead of leaving a
              # permanent failure on the PR's Checks tab.
              with_gh_retry gh api "repos/$REPO/check-runs" \
                -X POST \
                -f name='auto-clear-blocking-labels' \
                -f "head_sha=$HEAD_SHA" \
                -f status='completed' \
                -f conclusion='success' \
                -F "output[title]=Auto-clear confirmed needs-external-review absent (scheduled sweep)" \
                -F "output[summary]=PR #$PR — a prior sweep verification failed, but a later read confirmed the label is absent. See workflow run logs: $RUN_URL" \
                || echo "::warning::Failed to post healed sweep check-run for PR #$PR (workflow log still confirms the label is absent)."
              echo "::endgroup::"
              continue
            fi
            with_gh_retry gh api "repos/$REPO/check-runs" \
              -X POST \
              -f name='auto-clear-blocking-labels' \
              -f "head_sha=$HEAD_SHA" \
              -f status='completed' \
              -f conclusion='failure' \
              -F "output[title]=Auto-clear hit an infrastructure error (scheduled sweep)" \
              -F "output[summary]=PR #$PR — see workflow run logs: $RUN_URL" \
              || echo "::warning::Failed to post check-run for PR #$PR (annotation lost; workflow log still surfaces the failure)."
            echo "::endgroup::"
          done

      - name: Heal stale auto-clear infra-failure check-runs (sweep)
        # #2193: mirrors the evaluate-and-clear job's heal step; see its
        # comments. Last in the job for the same reason.
        if: ${{ !cancelled() && steps.sweep.outputs.heal_prs != '' }}
        env:
          # Check-runs can only be created by a GitHub App: GITHUB_TOKEN with
          # `checks: write`, never a PAT.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAL_PRS: ${{ steps.sweep.outputs.heal_prs }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/workflow/heal-auto-clear-infra-check.sh ]; then
            echo "::notice::Auto-clear heal helper is not on the trusted default branch yet; skipping this first-rollout sweep."
            exit 0
          fi
          bash scripts/workflow/heal-auto-clear-infra-check.sh "$REPO" "$RUN_URL" sweep "$HEAL_PRS"

  clear-event-labels:
    needs: [evaluate-and-clear]
    if: needs.evaluate-and-clear.result == 'success' && needs.evaluate-and-clear.outputs.protected_pairs != '' && needs.evaluate-and-clear.outputs.protected_pairs != '[]'
    environment: review-automation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
      checks: read
      security-events: read
    steps:
      - name: Checkout trusted mutation code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Acquire the selected-repository automation token
        id: automation
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.REVIEW_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.REVIEW_AUTOMATION_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: write
          permission-issues: write
      - name: Re-evaluate the protected tuple and remove its label
        env:
          GH_TOKEN: ${{ steps.automation.outputs.token }}
          WORKFLOW_TOKEN: ${{ github.token }}
          PR_NUMBERS: ${{ needs.evaluate-and-clear.outputs.candidate_prs }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          CLEAR_PHASE: mutate
          PROTECTED_PAIRS: ${{ needs.evaluate-and-clear.outputs.protected_pairs }}
        run: |
          bash scripts/workflow/auto-clear-event.sh

  clear-sweep-labels:
    needs: [scheduled-sweep]
    if: needs.scheduled-sweep.result == 'success' && needs.scheduled-sweep.outputs.protected_pairs != '' && needs.scheduled-sweep.outputs.protected_pairs != '[]'
    environment: review-automation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
      checks: read
      security-events: read
    steps:
      - name: Checkout trusted mutation code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Acquire the selected-repository automation token
        id: automation
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.REVIEW_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.REVIEW_AUTOMATION_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: write
          permission-issues: write
      - name: Re-evaluate the protected tuple and remove its label
        env:
          GH_TOKEN: ${{ steps.automation.outputs.token }}
          WORKFLOW_TOKEN: ${{ github.token }}
          PRS: ${{ needs.scheduled-sweep.outputs.candidate_prs }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CLEAR_PHASE: mutate
          PROTECTED_PAIRS: ${{ needs.scheduled-sweep.outputs.protected_pairs }}
        run: |
          bash scripts/workflow/auto-clear-sweep.sh
