name: Late Codex findings

# #2881: record Codex findings that arrive after a PR merged.
#
# No merge gate can block a finding that lands after the merge. The merge
# gate's bounded wait for a requested Codex review ends in an explicit
# timed-out/substitute-used fallback, and a review still running then can
# report afterwards; Codex also posts findings as a plain issue comment with
# no companion review (mergepath#1120, five minutes after merge). This
# workflow turns each such finding into a durable, deduplicated follow-up
# issue (scripts/late-codex-findings.sh), never only a log line.
#
# Event runs cover a Codex comment, review or inline comment that is created
# or edited on a closed PR; the script itself checks that the PR merged and
# that the object changed after merge. The daily sweep re-reads PRs closed in
# the last two days, which covers missed events and fork PRs, whose review
# events carry a read-only token.
#
# This is not a merge gate and publishes no required check, so per-PR
# serialisation is safe here (the no-concurrency rule applies to gates). The
# sweep runs in its own group so a long sweep never cancels pending event
# runs; when an event run and the sweep race on one PR, the script converges
# on the lowest-numbered tracker and closes the duplicate, after recording its
# items there (Phase 4b on #2886).
#
# The event filter admits any App bot, because a consumer's policy may name a
# different codex.bot_login; the script resolves that login from the policy
# and ignores every other author.

on:
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  record:
    name: Record a late Codex finding
    if: >-
      (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.issue.state == 'closed'
        && endsWith(github.event.comment.user.login, '[bot]'))
      || ((github.event_name == 'pull_request_review' || github.event_name == 'pull_request_review_comment')
        && github.event.pull_request.state == 'closed'
        && endsWith(github.event.sender.login, '[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: late-codex-findings-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Checkout repo (default branch — trusted script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Record late findings for this PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number || github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          REVIEW_ID: ${{ github.event.review.id }}
        run: |
          set -euo pipefail
          case "$PR" in ''|*[!0-9]*) echo "::error::PR number is not a positive integer: '$PR'"; exit 1 ;; esac
          touched=()
          # A review has no edit timestamp; an edited-review event marks it changed now.
          if [ "$EVENT_NAME" = pull_request_review ] && [ "$EVENT_ACTION" = edited ]; then
            case "$REVIEW_ID" in ''|*[!0-9]*) ;; *) touched=(--touched "review:$REVIEW_ID") ;; esac
          fi
          scripts/late-codex-findings.sh --repo "$REPO" --pr "$PR" ${touched[@]+"${touched[@]}"}

  sweep:
    name: Late Codex findings sweep
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: late-codex-findings-sweep
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Checkout repo (default branch — trusted script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Sweep recently closed PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          scripts/late-codex-findings.sh --repo "$REPO" --sweep
