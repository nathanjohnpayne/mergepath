name: Weekly cross-repo drift audit

# Runs `scripts/sync-to-downstream.sh --audit` weekly to surface drift
# between mergepath's canonical/kit surface and the downstream consumers
# declared in `.mergepath-sync.yml`. See #168 for the propagation design
# and #215 for the `--audit` mode itself.
#
# Scope — read-only, on purpose:
#   This workflow ONLY runs `--audit`. It never runs `--sync-all` and
#   never opens consumer PRs. Auto-opening ~8 consumer PRs every week is
#   too aggressive; the cron's job is *visibility*, not propagation. A
#   human (or `scripts/sync-to-downstream.sh <commit-ish>`) drives the
#   actual propagation when drift is real.
#
# What it does on drift (`--audit` exits 1):
#   1. Writes a GitHub Actions job summary ($GITHUB_STEP_SUMMARY) with
#      the full per-consumer audit output, so drift is visible directly
#      on the run page.
#   2. Opens-or-updates a SINGLE tracking issue labelled
#      `propagation-drift`. It does not open a new issue every week —
#      it finds the existing open one and updates its body, or opens
#      one only if none exists. On a clean audit it closes any open
#      tracking issue.
#
# Auth model:
#   `scripts/sync-to-downstream.sh --audit` clones each consumer repo
#   (`gh repo clone`) and `git fetch`es cached clones. Several consumers
#   in `.mergepath-sync.yml` are private, so the default `GITHUB_TOKEN`
#   (scoped to this repo only) is insufficient. We use
#   `secrets.REVIEWER_ASSIGNMENT_TOKEN` — the cross-repo `nathanpayne-claude`
#   PAT already wired into `pr-audit.yml` and `weekly-feedback-sweep.yml`
#   for exactly this kind of cross-repo read. `gh auth setup-git` wires
#   that token into git's credential helper so the script's `git fetch`
#   on cached clones authenticates too.
#
# `--audit` exit codes (see scripts/sync-to-downstream.sh header):
#   0  clean — no drift
#   1  drift detected on at least one consumer x path
#   2  usage error / missing prerequisite (yq, manifest, ...)
#   3  fetch error — a consumer repo was unreachable
# A fetch error (3) is an infrastructure failure, NOT drift: the
# workflow fails loudly on 2 and 3 and does NOT touch the tracking
# issue, so a transient outage never gets mislabelled as drift.

on:
  schedule:
    # Mondays 08:00 UTC — an hour before pr-audit.yml / the feedback
    # sweep (both 09:00 UTC), so a drift issue is already open when
    # the human's weekly planning window starts.
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Audit downstream consumers for drift
    # Reject manual dispatch from a non-default ref (#550 Codex P1): on
    # workflow_dispatch GitHub runs the workflow DEFINITION from the chosen
    # ref, which the checkout pin cannot constrain — a feature branch could
    # leak REVIEWER_ASSIGNMENT_TOKEN before checkout. Scheduled runs and
    # default-branch dispatch pass; a feature-branch dispatch is skipped.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TRACKING_LABEL: propagation-drift
      ISSUE_TITLE: 'Cross-repo propagation drift detected'
    steps:
      - name: Checkout mergepath
        # Pin to the trusted default branch (#548): this workflow has a
        # workflow_dispatch trigger and runs scripts/sync-to-downstream.sh and
        # scripts/audit-propagation-lane.sh under the cross-repo
        # REVIEWER_ASSIGNMENT_TOKEN, so without an explicit ref a
        # manually-dispatched branch could run tampered scripts under that
        # privileged PAT. Always run the canonical scripts from the default
        # branch. persist-credentials:false is safe: cross-repo reads use
        # `gh auth setup-git` (a separate credential helper), not the
        # workspace checkout token.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Install yq (mikefarah/yq v4)
        # sync-to-downstream.sh requires mikefarah/yq v4+. The
        # ubuntu-latest runner ships a 4.x today, but pin so a
        # base-image change can't silently swap the parser.
        run: |
          set -euo pipefail
          # Accept an already-present yq ONLY if it is mikefarah/yq AND
          # major version 4+ — sync-to-downstream.sh's own require_yq()
          # rejects the kislyuk Python yq, and v3/v5 would parse the
          # manifest differently. A bare "mikefarah/yq" grep would let a
          # v3 install through.
          if command -v yq >/dev/null 2>&1 \
             && yq --version 2>&1 | grep -Eq 'mikefarah/yq.*version v[4-9]\.'; then
            echo "yq already present: $(yq --version)"
          else
            YQ_VERSION="v4.44.3"
            YQ_ASSET="yq_linux_amd64"
            tmp_yq="$(mktemp)"
            tmp_sums="$(mktemp)"
            tmp_order="$(mktemp)"
            # Download the binary + the release `checksums` and
            # `checksums_hashes_order` files and verify sha256 before
            # installing — the binary runs with sudo, so an unverified
            # download is a supply-chain hole.
            curl -fsSL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/${YQ_ASSET}" -o "$tmp_yq"
            curl -fsSL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/checksums" -o "$tmp_sums"
            curl -fsSL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/checksums_hashes_order" -o "$tmp_order"
            # mikefarah/yq's `checksums` rows are multi-hash:
            #   <asset> <hash_1> <hash_2> ... <hash_N>
            # where the hash column order is given by
            # `checksums_hashes_order` (one hash name per line, 1-based).
            # SHA-256 is NOT the last column, so derive its index from
            # the order file rather than hard-coding it — that survives
            # mikefarah adding/reordering hash algorithms in a future
            # release. The +1 accounts for the leading asset-name field.
            sha_line="$(grep -nx 'SHA-256' "$tmp_order" | cut -d: -f1)"
            if [ -z "$sha_line" ]; then
              echo "ERROR: SHA-256 not listed in the yq ${YQ_VERSION} checksums_hashes_order file" >&2
              exit 1
            fi
            sha_col=$((sha_line + 1))
            expected="$(awk -v a="$YQ_ASSET" -v c="$sha_col" '$1 == a { print $c }' "$tmp_sums")"
            if [ -z "$expected" ]; then
              echo "ERROR: no SHA-256 checksum for ${YQ_ASSET} in the yq ${YQ_VERSION} checksums file" >&2
              exit 1
            fi
            echo "${expected}  ${tmp_yq}" | sha256sum -c -
            sudo install -m 0755 "$tmp_yq" /usr/local/bin/yq
            rm -f "$tmp_yq" "$tmp_sums" "$tmp_order"
            yq --version
          fi

      - name: Verify gh is present
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            echo "ERROR: gh not installed on runner" >&2
            exit 1
          fi
          gh --version

      - name: Run the drift audit
        id: audit
        env:
          # Cross-repo READ path. REVIEWER_ASSIGNMENT_TOKEN is the
          # nathanpayne-claude PAT (CLAUDE.md § 1Password Reviewer PAT
          # Lookup). gh consumes it via GH_TOKEN; `gh auth setup-git`
          # below also makes the script's `git fetch` on cached clones
          # use it. Fail loudly if it's empty — a missing token would
          # otherwise surface as a string of fetch errors that look
          # like infrastructure flakiness.
          GH_TOKEN: ${{ secrets.REVIEWER_ASSIGNMENT_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::REVIEWER_ASSIGNMENT_TOKEN secret is empty — the audit needs cross-repo read access to clone private consumers."
            echo "        Set it in repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # Wire the PAT into git's credential helper so the script's
          # `git fetch` on cached consumer clones authenticates the
          # same way `gh repo clone` does.
          gh auth setup-git

          chmod +x scripts/sync-to-downstream.sh

          # Capture stdout+stderr to a file (for the job summary and the
          # tracking-issue body) while still streaming to the run log.
          set +e
          scripts/sync-to-downstream.sh --audit 2>&1 | tee audit-output.txt
          rc=${PIPESTATUS[0]}
          set -e

          echo "exit_code=${rc}" >> "$GITHUB_OUTPUT"
          echo "Audit exited with code ${rc}"

          case "${rc}" in
            0)
              echo "result=clean" >> "$GITHUB_OUTPUT"
              ;;
            1)
              echo "result=drift" >> "$GITHUB_OUTPUT"
              ;;
            2)
              echo "::error::sync-to-downstream.sh --audit exited 2 (usage error / missing prerequisite). This is NOT drift — failing the workflow."
              exit 2
              ;;
            3)
              echo "::error::sync-to-downstream.sh --audit exited 3 (consumer fetch error). This is an infrastructure failure, NOT drift — failing the workflow without touching the tracking issue."
              exit 3
              ;;
            *)
              echo "::error::sync-to-downstream.sh --audit exited with unexpected code ${rc} (contract drift). Failing the workflow."
              exit "${rc}"
              ;;
          esac

      # Propagation lane regression net (#434): the lane defaults ON in
      # the synced pr-review-policy.yml, but a consumer can still end
      # up lane-dark (pre-#434 workflow, explicit enabled: false,
      # overridden branch_prefix, or missing author_identity). This
      # audit reads each consumer's LIVE default branch and fails the
      # run when the lane would not fire — surfacing the regression
      # weekly instead of at the next sync wave.
      #
      # IMPORTANT: this step only RECORDS its result (lane_rc output).
      # Failing here would abort the job before the drift tracking
      # issue is opened/updated below, losing the file-drift visibility
      # in the same run that found a lane regression (Codex P2 on PR
      # #444). The "Fail on propagation lane regression" step at the
      # END of the job turns a recorded non-zero rc into the job
      # failure once the drift-issue path has completed.
      - name: Propagation lane audit
        id: lane_audit
        if: steps.audit.outputs.result == 'clean' || steps.audit.outputs.result == 'drift'
        env:
          GH_TOKEN: ${{ secrets.REVIEWER_ASSIGNMENT_TOKEN }}
        run: |
          set -uo pipefail
          chmod +x scripts/audit-propagation-lane.sh
          set +e
          scripts/audit-propagation-lane.sh 2>&1 | tee lane-audit-output.txt
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo
            echo "## Propagation lane audit (#434)"
            echo
            echo '```'
            cat lane-audit-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "lane_rc=${rc}" >> "$GITHUB_OUTPUT"
          echo "Lane audit exited ${rc} (deferred to the end-of-job gate)"

      - name: Summarise the audit per consumer
        # Findings-first reporting (#988). The raw audit stream grows with
        # the amount of drift, and it is the raw stream that has to be
        # budgeted when the report goes into a GitHub issue body. This
        # roll-up does not grow that way — it is exactly one line per
        # consumer no matter how much drift there is — so it can always be
        # carried WHOLE. Deriving it in its own step means the job summary
        # and the tracking issue report the same numbers from the same
        # derivation, and a truncated raw block never costs the report a
        # consumer's name.
        if: steps.audit.outputs.result == 'clean' || steps.audit.outputs.result == 'drift'
        run: |
          set -euo pipefail
          # `scripts/sync-to-downstream.sh --audit` prints, per consumer:
          #   <name> (<owner/repo>)            <- column 0, the header
          #     baseline: <branch>@<sha> ...
          #     <symbol> <path>  <detail>      <- two-space indent
          # The symbols are emit_status_line() / emit_skip_line() in that
          # script: ✓ in sync, ✗ drifted, ⊘ missing entirely, ↷ skipped
          # per .sync-overrides.yml. They are matched as literal byte
          # prefixes rather than by field index because the detail text
          # after the path is free-form.
          awk '
            /^[^ \t]/ && /\)$/ { consumer = $0; order[++n] = consumer; next }
            consumer == "" { next }
            index($0, "  ✓ ") == 1 { ok[consumer]++;      next }
            index($0, "  ✗ ") == 1 { drifted[consumer]++; next }
            index($0, "  ⊘ ") == 1 { missing[consumer]++; next }
            index($0, "  ↷ ") == 1 { skipped[consumer]++; next }
            END {
              for (i = 1; i <= n; i++) {
                c = order[i]
                printf "%s — in sync %d, drifted %d, missing %d, skipped %d\n", c, ok[c] + 0, drifted[c] + 0, missing[c] + 0, skipped[c] + 0
              }
            }
          ' audit-output.txt > consumer-summary.txt

          if [ ! -s consumer-summary.txt ]; then
            # No consumer header line was recognised. Do not fail the job —
            # the raw stream is still reportable — but never let an empty
            # roll-up read as "no consumer was affected", which is the
            # silent-audit failure mode this whole change exists to remove.
            echo "::warning::Could not derive a per-consumer summary from the audit output (no consumer header line matched). The reports fall back to the raw audit stream."
            echo "(per-consumer summary unavailable — the audit output did not parse into consumer sections; read the raw output below)" > consumer-summary.txt
          fi
          cat consumer-summary.txt

      - name: Write job summary
        # Runs for both clean (result=clean) and drift (result=drift).
        # The exit-2/3 paths above already failed the job and never
        # reach here, so the summary only ever reflects a real audit
        # verdict.
        if: steps.audit.outputs.result == 'clean' || steps.audit.outputs.result == 'drift'
        env:
          RESULT: ${{ steps.audit.outputs.result }}
        run: |
          {
            echo "# Weekly cross-repo drift audit"
            echo
            if [ "${RESULT}" = "clean" ]; then
              echo ":white_check_mark: **No drift.** Every consumer's canonical/kit surface matches mergepath HEAD."
            else
              echo ":warning: **Drift detected.** One or more consumers have diverged from mergepath's canonical/kit surface."
              echo
              echo "A tracking issue (label \`${TRACKING_LABEL}\`) has been opened or updated. Drive propagation with"
              echo "\`scripts/sync-to-downstream.sh <commit-ish>\` — this cron only reports, it does not open consumer PRs."
            fi
            echo
            echo "## Per-consumer summary"
            echo
            echo '```'
            cat consumer-summary.txt
            echo '```'
            echo
            echo "## Audit output"
            echo
            echo '```'
            cat audit-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure tracking label exists
        if: steps.audit.outputs.result == 'drift'
        env:
          GH_TOKEN: ${{ secrets.REVIEWER_ASSIGNMENT_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Idempotent: `gh label create` errors if the label already
          # exists, so swallow that specific case. Any other failure
          # is real and should surface.
          #
          # `--limit 500` overrides gh's default 30-item cap — without
          # it the existence check could miss an already-present
          # `propagation-drift` label in a repo with >30 labels, fall
          # into the create branch, and abort the drift path on the
          # resulting "already exists" error. 500 is comfortably above
          # any realistic label count. (Matches the `--limit` hardening
          # already in auto-clear-blocking-labels.yml's PR enumeration.)
          if gh label list --repo "$REPO" --limit 500 --json name --jq '.[].name' | grep -qx "$TRACKING_LABEL"; then
            echo "Label '$TRACKING_LABEL' already exists."
          else
            echo "Creating label '$TRACKING_LABEL'."
            gh label create "$TRACKING_LABEL" --repo "$REPO" \
              --color C5DEF5 \
              --description "Canonical/kit surface has drifted in a downstream consumer (weekly-drift-audit.yml)"
          fi

      - name: Open or update the drift tracking issue
        if: steps.audit.outputs.result == 'drift'
        env:
          GH_TOKEN: ${{ secrets.REVIEWER_ASSIGNMENT_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          today="$(date -u '+%Y-%m-%d')"

          # `wc` pads its count on some platforms; strip so the values are
          # usable as plain integers in arithmetic and in `[ -gt ]`.
          bytes_of() { wc -c < "$1" | tr -d '[:space:]'; }
          lines_of() { wc -l < "$1" | tr -d '[:space:]'; }

          # Self-contained fallback: the roll-up is produced by an earlier
          # step, and a report that dies because its summary file is absent
          # is the same class of failure as one that dies because its body
          # is too long.
          [ -f consumer-summary.txt ] || \
            echo "(per-consumer summary unavailable — the summarising step did not run)" > consumer-summary.txt

          # GitHub caps an issue body at 65536 characters and REJECTS the
          # whole createIssue / updateIssue call past it — it does not
          # truncate for you. This step used to inline the audit stream
          # unbounded, so from 2026-07-13 every weekly run detected drift
          # and then failed to file it, self-reinforcingly: the more drift
          # accumulated, the larger the report, and the more certain the
          # report was to be rejected — the lane went quiet exactly when it
          # had the most to say (#988).
          #
          # The body is therefore assembled in three pieces, and the raw
          # block is the ONLY one allowed to shrink:
          #   body-head.txt   prose + the COMPLETE per-consumer roll-up
          #   audit-block.txt the raw audit stream, budgeted by what is left
          #   body-tail.txt   the footer
          # Deriving the raw block's budget from the MEASURED size of the
          # fixed parts, rather than from a guessed constant, is what makes
          # "the body fits" a property of the assembly instead of a hope
          # about the input. Truncating the roll-up instead would drop
          # whole consumers from the report alphabetically — the opposite
          # of what a truncated report should lose.
          MAX_BODY=60000

          {
            echo "## Cross-repo propagation drift"
            echo
            echo "\`scripts/sync-to-downstream.sh --audit\` found drift between mergepath's"
            echo "canonical/kit surface and one or more downstream consumers declared in"
            echo "\`.mergepath-sync.yml\`."
            echo
            echo "- **Last audit:** ${today} (UTC)"
            echo "- **Run:** ${RUN_URL}"
            echo
            echo "### Per-consumer summary"
            echo
            echo "Complete: every consumer the audit walked is named here, even when the raw"
            echo "output below has to be truncated."
            echo
            echo '```'
            cat consumer-summary.txt
            echo '```'
            echo
            echo "### Audit output"
            echo
            echo '```'
          } > body-head.txt

          {
            echo '```'
            echo
            echo "---"
            echo
            echo "This issue is **maintained in place** by"
            echo "[\`.github/workflows/weekly-drift-audit.yml\`](.github/workflows/weekly-drift-audit.yml):"
            echo "each weekly run updates this body rather than opening a new issue, and a"
            echo "clean audit closes it automatically. To resolve drift, propagate the"
            echo "relevant mergepath commit(s) with \`scripts/sync-to-downstream.sh <commit-ish>\`"
            echo "(see #168). The cron is read-only and never opens consumer PRs itself."
            echo
            echo "cc @nathanjohnpayne"
          } > body-tail.txt

          # Reserve room for the truncation notice itself, so adding the
          # notice can never be what pushes the body back over the cap.
          notice_reserve=400
          budget=$(( MAX_BODY - $(bytes_of body-head.txt) - $(bytes_of body-tail.txt) - notice_reserve ))
          if [ "$budget" -lt 0 ]; then budget=0; fi

          total_lines="$(lines_of audit-output.txt)"
          cp audit-output.txt audit-block.txt
          omitted=0
          if [ "$(bytes_of audit-block.txt)" -gt "$budget" ]; then
            if [ "$budget" -le 0 ]; then
              # No room at all for the raw stream. BSD `head -c 0` is an
              # error ("illegal byte count") where GNU's is a no-op, so
              # special-case it rather than let the platform decide whether
              # the report gets filed.
              : > audit-block.txt
            else
              head -c "$budget" audit-block.txt > audit-block.cut
              # `head -c` cuts on a byte boundary, which can land mid-line
              # and mid-UTF-8-sequence — the audit's status symbols
              # (✓ ✗ ⊘ ↷) are multibyte. Dropping that last line is what
              # keeps the body valid text instead of a string carrying a
              # broken code point.
              sed '$d' audit-block.cut > audit-block.txt
              rm -f audit-block.cut
            fi
            omitted=$(( total_lines - $(lines_of audit-block.txt) ))
          fi

          {
            cat body-head.txt
            cat audit-block.txt
            if [ "$omitted" -gt 0 ]; then
              echo
              echo "[... truncated: ${omitted} of ${total_lines} audit output line(s) omitted to stay under"
              echo " GitHub's 65536-character issue-body cap. The per-consumer summary above is"
              echo " complete; the full stream is in the run log: ${RUN_URL} ...]"
            fi
            cat body-tail.txt
          } > issue-body.txt

          body_bytes="$(bytes_of issue-body.txt)"
          if [ "$body_bytes" -gt "$MAX_BODY" ]; then
            # Expected to be unreachable: the raw block was budgeted from
            # the measured overhead. Reaching it means the FIXED part alone
            # is oversized (an implausibly large consumer roll-up), so
            # clamp by whole lines and say so — a degraded report beats a
            # rejected call that takes the whole report down with it.
            head -c "$MAX_BODY" issue-body.txt > issue-body.cut
            sed '$d' issue-body.cut > issue-body.txt
            rm -f issue-body.cut
            printf '\n[... body hard-clamped at %s characters; full audit output in the run log: %s ...]\n' \
              "$MAX_BODY" "$RUN_URL" >> issue-body.txt
            echo "::warning::Drift issue body was ${body_bytes} characters after budgeting and had to be hard-clamped to ${MAX_BODY}. The per-consumer summary may be incomplete — read the run log: ${RUN_URL}"
          fi
          echo "Issue body assembled: $(bytes_of issue-body.txt) characters; ${omitted} of ${total_lines} audit line(s) omitted."

          # Find an existing OPEN tracking issue. Single source of truth:
          # the `propagation-drift` label. Take the lowest-numbered match
          # if (unexpectedly) more than one exists. `--limit 500`
          # overrides gh's default 30-item cap so the lookup can't miss
          # the tracking issue behind a backlog of >30 open issues.
          existing="$(gh issue list --repo "$REPO" --state open --limit 500 \
            --label "$TRACKING_LABEL" --json number --jq 'sort_by(.number) | .[0].number // ""')"

          # Every write below is wrapped so a failure names what was lost.
          # Bare `set -e` would fail the job with GitHub's raw API line and
          # nothing else — which is how six weeks of detected-but-unfiled
          # drift read as an unremarkable red cron.
          if [ -n "$existing" ]; then
            echo "Updating existing drift issue #${existing}."
            if ! gh issue edit "$existing" --repo "$REPO" \
              --title "${ISSUE_TITLE}" \
              --body-file issue-body.txt; then
              echo "::error::Drift WAS detected, but tracking issue #${existing} could not be updated (body: $(bytes_of issue-body.txt) characters, GitHub's cap is 65536). The findings are in this run's job summary only: ${RUN_URL}"
              exit 1
            fi
            gh issue comment "$existing" --repo "$REPO" \
              --body ":warning: Drift still present as of ${today} (UTC). Issue body refreshed — see [latest run](${RUN_URL})."
            echo "issue=${existing}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No open drift issue — opening one."
            if ! gh issue create --repo "$REPO" \
              --title "${ISSUE_TITLE}" \
              --label "$TRACKING_LABEL" \
              --body-file issue-body.txt; then
              echo "::error::Drift WAS detected, but no tracking issue could be opened (body: $(bytes_of issue-body.txt) characters, GitHub's cap is 65536). The findings are in this run's job summary only: ${RUN_URL}"
              exit 1
            fi
          fi

      - name: Close stale drift tracking issue on a clean audit
        if: steps.audit.outputs.result == 'clean'
        env:
          GH_TOKEN: ${{ secrets.REVIEWER_ASSIGNMENT_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          today="$(date -u '+%Y-%m-%d')"

          # Close every open tracking issue (normally zero or one).
          # No-op when none exist — the common steady-state case.
          # `--limit 500` overrides gh's default 30-item cap so the
          # cleanup can't leave a stale tracking issue open behind a
          # backlog of >30 open issues.
          mapfile -t open_issues < <(gh issue list --repo "$REPO" --state open --limit 500 \
            --label "$TRACKING_LABEL" --json number --jq '.[].number')

          if [ "${#open_issues[@]}" -eq 0 ]; then
            echo "Audit clean and no open drift issue — nothing to do."
            exit 0
          fi

          for n in "${open_issues[@]}"; do
            echo "Audit clean — closing drift issue #${n}."
            gh issue close "$n" --repo "$REPO" \
              --comment ":white_check_mark: Audit clean as of ${today} (UTC) — all consumers back in sync with mergepath's canonical/kit surface. Closing automatically. See [run](${RUN_URL})."
          done

      # Deferred gate for the lane audit (#434 / Codex P2 on PR #444):
      # runs LAST so the drift tracking-issue path above always
      # completes first, then turns a recorded lane regression into the
      # job failure it deserves.
      - name: Fail on propagation lane regression
        if: steps.lane_audit.outputs.lane_rc != '' && steps.lane_audit.outputs.lane_rc != '0'
        env:
          LANE_RC: ${{ steps.lane_audit.outputs.lane_rc }}
        run: |
          if [ "${LANE_RC}" = "1" ]; then
            echo "::error::Propagation lane would NOT fire on at least one consumer (see lane audit output above). Sync pr-review-policy.yml or investigate the consumer's review-policy.yml."
          else
            echo "::error::audit-propagation-lane.sh exited ${LANE_RC} (fetch/usage error) — infrastructure failure, not lane drift."
          fi
          exit "${LANE_RC}"
