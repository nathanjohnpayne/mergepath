name: PR Review Policy

on:
  pull_request:
    types: [opened, edited, synchronize, labeled, unlabeled]

permissions:
  pull-requests: write
  contents: read
  issues: read

jobs:
  self-review-check:
    name: Self-Review Required
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # The parser is loaded from the DEFAULT BRANCH, never from the PR head.
      # This job triggers on `pull_request`, so a default checkout would fetch
      # the proposed code and run the validator out of it — letting a PR
      # rewrite the gate that judges it, which is strictly worse than the line
      # grep this replaces. Same posture as agent-review.yml's trusted-helper
      # checkouts; persist-credentials off because nothing here needs an
      # authenticated git (#548).
      - name: Checkout trusted PR body validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # Pins the VALIDATOR's runtime, chosen on its own merits — an active LTS.
      # The parser imports exactly one thing (`node:fs`), so this buys
      # determinism against runner-image drift, not capability. Deliberately a
      # literal, not node-version-file: this workflow is canonical and lands
      # byte-identical on every consumer, most of which have no .nvmrc.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # Routes through the single tested entrypoint rather than invoking the
      # parser directly, so the contract has one implementation instead of a
      # shell copy and a YAML copy that drift apart.
      #
      # `--self-review-only` checks the heading and nothing else: no policy is
      # read and no claim is made about `Authoring-Agent:`. Widening this
      # required check to the identity contract is a separate policy change,
      # tracked in #1137.
      #
      # ORDERING, load-bearing: this flag landed on the default branch in its
      # own change (#1138) BEFORE this workflow started passing it. The
      # validator is loaded from the default branch, so a flag introduced
      # alongside its caller does not exist when the gate runs and the required
      # check dies on `usage:` — hit twice during #1132, once as a missing
      # script and once as a missing interface. Any future flag this gate
      # passes must land the same way.
      #
      # The body goes in on STDIN via env, so it is never interpolated into the
      # shell and never appears in argv.
      - name: Validate the PR body against the contract
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$PR_BODY" | scripts/validate-pr-body.sh --self-review-only

  label-gate:
    name: Label Gate
    needs: external-review-labeling
    if: always()
    runs-on: ubuntu-latest
    env:
      CLASSIFIER_RESULT: ${{ needs.external-review-labeling.result }}
    steps:
      - name: Block merge if blocking labels present
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // The classifier may add needs-external-review during this run.
            // Wait for it before reading live labels (#1251), and fail closed
            // if it did not complete: an unread classifier result cannot make
            // the event's pre-classification label set authoritative.
            if (process.env.CLASSIFIER_RESULT !== 'success') {
              core.setFailed(
                `External Review Check finished with ${process.env.CLASSIFIER_RESULT || 'an unknown result'}; ` +
                `failing closed before evaluating labels.`
              );
              return;
            }
            const blockingLabels = [
              'needs-external-review',
              'needs-human-review',
              'policy-violation',
              'human-hold',
            ];
            // Read the PR's LIVE labels, never context.payload's snapshot
            // (#1339). A re-run replays the ORIGINAL event payload, so a run
            // that failed on a since-removed label failed identically on
            // every re-run and could never be retired by one (#1318). A
            // failed read fails closed: "could not read the labels" must not
            // pass as "no blocking labels".
            const issue_number = context.payload.pull_request.number;
            let prLabels;
            try {
              const labels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                per_page: 100,
              });
              prLabels = labels.map(l => l.name);
            } catch (err) {
              core.setFailed(
                `Could not read the current labels of #${issue_number} (${err.message}); ` +
                `failing closed rather than treating an unread label set as clear.`
              );
              return;
            }
            const blockers = prLabels.filter(l => blockingLabels.includes(l));

            if (blockers.length > 0) {
              core.setFailed(
                `Merge blocked by label(s): ${blockers.join(', ')}. ` +
                `Per REVIEW_POLICY.md, the human is the tiebreaker and resolves blocking labels.`
              );
            }

  external-review-labeling:
    name: External Review Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The external-review check only reads local history (git diff / show
          # / worktree) and clones PUBLIC mergepath unauthenticated; it never
          # pushes or uses the workspace remote, so don't leave the checkout
          # token in .git/config (#548 defense-in-depth).
          persist-credentials: false

      - name: Check for external review triggers from review-policy.yml
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          NEEDS_REVIEW=false
          REASONS=""

          # A base with no .github/review-policy.yml predates the policy file.
          # This used to SKIP the whole check (needs_review=false), which let a
          # large or protected-path PR targeting such a base pass the label gate
          # with no external review at all — flagged by the wave audit on the
          # 4a8f804 wave. It now falls back to the DEFAULT-BRANCH policy, the
          # same rule scripts/workflow/resolve_base_policy.sh applies for a
          # confirmed 404, so every site treats "base predates the policy"
          # identically instead of one of them opting out.
          #
          # Trade-off, stated because it is a real behaviour change: a consumer
          # mid-bootstrap can have PRs whose base predates its policy file, and
          # those PRs now get evaluated against the policy the repo actually has
          # rather than waved through. That is the intended direction — the
          # policy exists on the default branch by then — but it can newly label
          # such a PR.
          BASE_HAS_POLICY=true
          if ! git cat-file -e "$BASE_SHA:.github/review-policy.yml" 2>/dev/null; then
            BASE_HAS_POLICY=false
            echo "NOTE: base commit has no .github/review-policy.yml (predates it) — falling back to the default-branch policy rather than skipping the external review check."
          fi

          CHANGED_FILES=$(git diff --name-only "$BASE_SHA"..."$HEAD_SHA")

          # --- Propagation PR review lane (mergepath#264 / #268) ---------
          # A PR opened by scripts/sync-to-downstream.sh is a verbatim
          # mirror of canonical/kit content ALREADY reviewed in its
          # upstream mergepath PR. It is huge by design and always
          # touches .github/** — so the line-count threshold and the
          # external_review_paths check below would flag every sync PR
          # for a redundant Phase 4 review of non-novel content.
          #
          # The lane exempts such a PR from external-review labeling —
          # but ONLY when it is PROVABLY a faithful mirror. Codex P1 on
          # #268 caught that a path-confinement-only check is a hole:
          # `.github/workflows/*` IS a manifest path, so a sync-branch
          # PR could hand-edit a workflow and skip review. The teeth is
          # therefore a byte-level comparison against mergepath itself.
          #
          # Recognition + verification, all sourced from TRUSTED inputs
          # (never the PR's own checkout, which the PR could tamper):
          #   1. config (enabled / branch_prefix / author_identity) is
          #      read from the BASE commit's review-policy.yml — a PR
          #      cannot self-qualify by editing policy in the PR.
          #      The lane defaults ON when the propagation_prs block is
          #      absent (mergepath#434): the enable flag lived only in
          #      consumer review-policy.yml, which is intentionally NOT
          #      synced, so no consumer ever had the block and the lane
          #      was dormant fleet-wide. An explicit `enabled: false`
          #      remains the opt-out. The default adds no new trust —
          #      recognition is still gated on the byte-level verify in
          #      step 3, and a PR cannot grant itself the default
          #      because it cannot edit its own BASE commit.
          #   2. branch name must start with propagation_prs.branch_prefix
          #      and PR author must be author_identity.
          #   3. the <sha> in the branch name (mergepath-sync/<sha> or
          #      mergepath-sync/sync-all-<sha>[-<scope-digest>]) is resolved
          #      to one full commit that must be ON mergepath's default
          #      branch's first-parent history, checked
          #      out from PUBLIC nathanjohnpayne/
          #      mergepath, and mergepath@<sha>'s OWN
          #      verify-propagation-pr.sh byte-compares every changed
          #      file against mergepath@<sha>'s content + manifest. A
          #      hand-edit of any file — manifest path or not — fails
          #      the byte-compare and the PR falls through to normal
          #      Phase 3/4 review.
          # See REVIEW_POLICY.md § Propagation PR review lane.
          PROPAGATION_LANE=false
          # Read a 2-space-indented scalar from a named YAML block in a
          # given file, anchored to the block header and stopping at the
          # next column-0 key (comment lines between header and field
          # don't matter). Quote- and inline-comment-stripped.
          prop_field() {  # <file> <block> <key>
            awk -v blk="$2" -v key="$3" '
              $0 ~ "^" blk ":" { in_blk = 1; next }
              in_blk && /^[^[:space:]#]/ { in_blk = 0 }
              in_blk && $1 == key":" {
                sub(/^[[:space:]]*[^:]+:[[:space:]]*/, "", $0)
                sub(/[[:space:]]*#.*$/, "", $0)
                gsub(/^"|"$/, "", $0)
                print
                exit
              }
            ' "$1"
          }
          # Read a TOP-LEVEL scalar (author_identity), stripping BOTH YAML
          # quote styles + a trailing comment + whitespace (#452). Mirrors
          # audit-propagation-lane.sh's policy_top_scalar so the live lane and
          # its weekly audit normalize author_identity identically — a
          # quoted-but-correct `author_identity: "nathanjohnpayne"` passes the
          # PR-author fingerprint below instead of failing on retained quotes.
          top_field() {  # <file> <key>
            awk -v key="$2" '
              /^[^[:space:]#]/ && $1 == key":" {
                sub(/^[^:]+:[[:space:]]*/, "", $0)
                gsub(/^["\x27]/, "", $0)
                gsub(/["\x27][[:space:]]*(#.*)?$/, "", $0)
                gsub(/[[:space:]]*#.*$/, "", $0)
                sub(/[[:space:]]+$/, "", $0)
                print
                exit
              }
            ' "$1"
          }
          # Lane config + author identity from the BASE commit, not the
          # PR. `git show` the base blobs into tempfiles.
          BASE_POLICY=$(mktemp)
          if ! git show "$BASE_SHA:.github/review-policy.yml" > "$BASE_POLICY" 2>/dev/null; then
            : > "$BASE_POLICY"   # absent on base → lane simply won't match
          fi
          PROP_ENABLED=$(prop_field "$BASE_POLICY" propagation_prs enabled)
          # Default ON when the key/block is absent (mergepath#434);
          # explicit `enabled: false` opts out.
          PROP_ENABLED=${PROP_ENABLED:-true}
          PROP_PREFIX=$(prop_field "$BASE_POLICY" propagation_prs branch_prefix)
          # Must match SYNC_BRANCH_PREFIX in scripts/sync-to-downstream.sh.
          PROP_PREFIX=${PROP_PREFIX:-mergepath-sync/}
          AUTHOR_ID=$(top_field "$BASE_POLICY" author_identity)
          rm -f "$BASE_POLICY"

          if [ "$PROP_ENABLED" = "true" ] && [ -n "$PROP_PREFIX" ] \
             && [ "${HEAD_REF#"$PROP_PREFIX"}" != "$HEAD_REF" ] \
             && [ "$PR_AUTHOR" = "$AUTHOR_ID" ]; then
            # Branch + author fingerprint matched. Now the teeth:
            # extract the source <sha> from the branch name, check out
            # PUBLIC mergepath at that sha, and run mergepath@<sha>'s
            # OWN verifier against this PR. Anything off → no lane.
            SYNC_KEY="${HEAD_REF#"$PROP_PREFIX"}"     # strip "mergepath-sync/"
            # Scoped keys are newly generated lowercase syntax. Preserve the
            # pre-existing mixed-case acceptance only for legacy SHA-only keys.
            if [[ "$SYNC_KEY" =~ ^sync-all-([0-9a-f]{7,40})-[0-9a-f]{12}$ ]]; then
              SYNC_SHA="${BASH_REMATCH[1]}"
            elif [[ "$SYNC_KEY" =~ ^sync-all-([0-9a-fA-F]{7,40})$ ]]; then
              SYNC_SHA="${BASH_REMATCH[1]}"
            else
              SYNC_SHA="$SYNC_KEY"
            fi
            if printf '%s' "$SYNC_SHA" | grep -qE '^[0-9a-fA-F]{7,40}$'; then
              MP_DIR=$(mktemp -d)
              # mergepath is public — no token needed. blob:none keeps
              # it cheap; the checkout fetches only the blobs it needs.
              #
              # Source-commit provenance: the branch-name SHA is chosen by
              # whoever pushed the branch and may name ANY commit in the
              # public repo, including one on an unmerged branch. Resolve
              # the (normally 7-char) key to exactly ONE full 40-hex commit
              # — an ambiguous abbreviation fails rev-parse — and require it
              # on the FIRST-PARENT history of mergepath's default branch, so
              # only a tree that existed there after mergepath's own review
              # can qualify (generic ancestry would also admit an
              # intermediate commit of a PR branch merged with a true merge). The base verifier re-checks both (it receives
              # the full SHA as its 5th argument); checking here too keeps a
              # consumer whose base verifier predates that check safe.
              SYNC_FULL_SHA=""
              MP_DEFAULT_REF=""
              if git clone --quiet --filter=blob:none \
                   https://github.com/nathanjohnpayne/mergepath "$MP_DIR" \
                 && SYNC_FULL_SHA=$(git -C "$MP_DIR" rev-parse --verify --quiet "${SYNC_SHA}^{commit}" 2>/dev/null) \
                 && [[ "$SYNC_FULL_SHA" =~ ^[0-9a-f]{40}$ ]] \
                 && MP_DEFAULT_REF=$(git -C "$MP_DIR" symbolic-ref --quiet refs/remotes/origin/HEAD 2>/dev/null) \
                 && [ -n "$MP_DEFAULT_REF" ] \
                 && MP_FIRST_PARENT=$(git -C "$MP_DIR" rev-list --first-parent "$MP_DEFAULT_REF" 2>/dev/null) \
                 && grep -Fxq "$SYNC_FULL_SHA" <<<"$MP_FIRST_PARENT" \
                 && git -C "$MP_DIR" checkout --quiet "$SYNC_FULL_SHA" 2>/dev/null; then
                SYNC_SHA="$SYNC_FULL_SHA"
                # #531: run the TRUSTED in-repo verifier from the PR's
                # BASE commit (propagated + reviewed; the PR cannot edit
                # its own base), NOT the verifier shipped inside the
                # runtime-cloned mergepath@<sha>. The clone ($MP_DIR) is
                # passed only as a DATA source (manifest + canonical
                # content); no shell is executed out of it. This removes
                # the RCE surface of running runtime-fetched code under a
                # `pull-requests: write` workflow. The base verifier
                # sources its helpers from its own dir, so they are the
                # base commit's trusted copies too. fetch-depth:0 above
                # guarantees BASE_SHA is present for the worktree add.
                BASE_TREE=$(mktemp -d)
                if git worktree add --quiet --detach "$BASE_TREE" "$BASE_SHA" 2>/dev/null; then
                  VERIFIER="$BASE_TREE/scripts/workflow/verify-propagation-pr.sh"
                  if [ ! -f "$VERIFIER" ]; then
                    echo "Propagation lane: base commit has no scripts/workflow/verify-propagation-pr.sh (consumer not yet on the vendored verifier) — not lane-eligible; falls through to normal review."
                  elif ! grep -q 'mergepath-verifier-contract: self-sourced-helpers-v1' "$VERIFIER"; then
                    # #545 (4a P1): a base verifier predating the #531
                    # self-sourcing hardening would source its helpers from
                    # the runtime-cloned mergepath ($MP_DIR) — fetched shell
                    # under a pull-requests: write job (RCE). Fail closed: do
                    # NOT run it; fall through to normal review. The lane turns
                    # on once the hardened verifier itself has propagated into
                    # the consumer base.
                    echo "Propagation lane: base verifier predates the #531 self-sourcing contract (no self-sourced-helpers-v1 tag) — not lane-eligible; falls through to normal review."
                  elif bash "$VERIFIER" "$MP_DIR" "$PWD" "$BASE_SHA" "$HEAD_SHA" "$SYNC_FULL_SHA"; then
                    PROPAGATION_LANE=true
                  fi
                  git worktree remove --force "$BASE_TREE" 2>/dev/null || rm -rf "$BASE_TREE"
                else
                  echo "Propagation lane: could not materialize the base-commit verifier (worktree add failed) — not lane-eligible."
                  rm -rf "$BASE_TREE"
                fi
              else
                echo "Propagation lane: mergepath@$SYNC_SHA does not resolve to exactly one commit on mergepath's default branch (resolved='${SYNC_FULL_SHA:-none}', default='${MP_DEFAULT_REF:-unknown}'), or could not be checked out — not lane-eligible."
              fi
              rm -rf "$MP_DIR"
            else
              echo "Propagation lane: branch '$HEAD_REF' has no resolvable mergepath SHA — not lane-eligible."
            fi
          fi
          if [ "$PROPAGATION_LANE" = "true" ]; then
            echo "Propagation PR review lane: VERIFIED faithful mirror of mergepath@$SYNC_SHA (branch=$HEAD_REF, author=$PR_AUTHOR)."
            echo "needs_review=false" >> "$GITHUB_OUTPUT"
            echo "propagation_lane=true" >> "$GITHUB_OUTPUT"
            echo "classification=propagation" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "propagation_lane=false" >> "$GITHUB_OUTPUT"

          # Compute the external-review trigger and same-content fingerprint
          # from GitHub's PR file list. The helper itself must come from the
          # trusted base tree, not the PR checkout: this job can write labels
          # and comments, and same-repo PRs can edit scripts/workflow/**.
          FILES_JSON=$(mktemp)
          set +e
          FILES_RAW=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files")
          files_rc=$?
          set -e
          if [ "$files_rc" -ne 0 ] || ! printf '%s\n' "$FILES_RAW" | jq -s 'add // []' > "$FILES_JSON"; then
            echo "External-review fail-closed: could not fetch PR files; requiring review."
            echo "needs_review=true" >> "$GITHUB_OUTPUT"
            echo "reasons=- Could not fetch PR files for external-review fingerprint; requiring review fail-closed" >> "$GITHUB_OUTPUT"
            echo "classification=fail-closed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Materialize the trusted trees. Neither the helper nor the config may
          # come from the PR checkout: this job can write labels and comments,
          # and same-repo PRs can edit scripts/workflow/** (#531 / #545).
          #
          # CONFIG always comes from the PR BASE tree, never the default branch
          # (#763, Codex P1). The policy that governs a PR is the policy of the
          # branch it targets: a PR onto a stricter non-default branch (a
          # release branch with a lower threshold or extra protected paths) must
          # be judged by THAT branch's .github/review-policy.yml. Reading config
          # from the default branch would silently ignore it. The earlier guard
          # in this job already proved BASE_SHA carries a review-policy.yml, so
          # this source is always available.
          #
          # HELPER prefers the PR base too, and falls back to the default branch
          # ONLY when the base predates the helper (#763). Pinning the helper to
          # the base alone made POLICY a function of the base's age: a PR opened
          # against any base predating these helpers forced needs_review=true for
          # every PR in this workflow, bypassing the threshold logic entirely and
          # staying stuck until the branch was rebased. Both trees are equally
          # untouchable by the PR, so the #531 trust property holds either way.
          #
          # The fallback can pair a NEWER helper with an OLDER config. That is
          # the safe skew direction — a current helper tolerates an older config
          # (missing keys take documented defaults); the reverse, an old helper
          # against a newer config, is the unsafe one and cannot arise here.
          TRUSTED_BASE_TREE=""
          TRUSTED_HELPER_TREE=""
          TRUSTED_CONFIG_TREE=""
          cleanup_trusted_trees() {
            # The helper tree IS the base tree in the common case; only remove
            # it once so the second pass can't log a spurious failure.
            for _t in "$TRUSTED_CONFIG_TREE" "$TRUSTED_HELPER_TREE" "$TRUSTED_BASE_TREE"; do
              [ -n "$_t" ] || continue
              git worktree remove --force "$_t" >/dev/null 2>&1 || rm -rf "$_t"
              # Stop after the base tree: in the common case the helper tree
              # IS the base tree, so a second pass would log a spurious failure.
              [ "$_t" != "$TRUSTED_BASE_TREE" ] || break
            done
          }
          trap cleanup_trusted_trees EXIT

          TRUSTED_BASE_TREE=$(mktemp -d)
          rmdir "$TRUSTED_BASE_TREE" 2>/dev/null || true
          if ! git worktree add --quiet --detach "$TRUSTED_BASE_TREE" "$BASE_SHA" 2>/dev/null; then
            echo "External-review fail-closed: could not materialize the PR base tree; requiring review."
            echo "needs_review=true" >> "$GITHUB_OUTPUT"
            echo "reasons=- Could not materialize the PR base tree for the external-review calculation; requiring review fail-closed" >> "$GITHUB_OUTPUT"
            echo "classification=fail-closed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Pair the config with the base tree, EXCEPT when the base predates
          # the policy file — then the default-branch copy is the only policy
          # that exists (see BASE_HAS_POLICY above).
          #
          # The fallback MUST come from a trusted origin/$DEFAULT_BRANCH
          # worktree, never a bare `.github/review-policy.yml` path: this job
          # is checked out at the PR MERGE COMMIT, so a bare path resolves
          # against the PR's own content and would let a PR whose base predates
          # the policy file supply the policy that judges it (CodeRabbit
          # Major on #768 — a regression introduced by this PR's earlier draft).
          # If neither the base nor the default branch yields a policy, fail
          # closed rather than fall back to anything the PR can write.
          if [ "$BASE_HAS_POLICY" = "true" ]; then
            TRUSTED_CONFIG="$TRUSTED_BASE_TREE/.github/review-policy.yml"
          else
            if git rev-parse --verify --quiet "origin/$DEFAULT_BRANCH^{commit}" >/dev/null 2>&1; then
              TRUSTED_CONFIG_TREE=$(mktemp -d)
              rmdir "$TRUSTED_CONFIG_TREE" 2>/dev/null || true
              if ! git worktree add --quiet --detach "$TRUSTED_CONFIG_TREE" "origin/$DEFAULT_BRANCH" 2>/dev/null \
                 || [ ! -f "$TRUSTED_CONFIG_TREE/.github/review-policy.yml" ]; then
                git worktree remove --force "$TRUSTED_CONFIG_TREE" >/dev/null 2>&1 || rm -rf "$TRUSTED_CONFIG_TREE"
                TRUSTED_CONFIG_TREE=""
              fi
            fi
            if [ -z "$TRUSTED_CONFIG_TREE" ]; then
              echo "External-review fail-closed: PR base has no .github/review-policy.yml and no trusted origin/$DEFAULT_BRANCH copy is available; requiring review."
              echo "needs_review=true" >> "$GITHUB_OUTPUT"
              echo "reasons=- No trusted review-policy.yml on the PR base or the default branch; requiring review fail-closed" >> "$GITHUB_OUTPUT"
              echo "classification=fail-closed" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            TRUSTED_CONFIG="$TRUSTED_CONFIG_TREE/.github/review-policy.yml"
            echo "NOTE: using the trusted origin/$DEFAULT_BRANCH review policy (the PR base predates the policy file)."
          fi

          TRUSTED_SOURCE=""
          if [ -x "$TRUSTED_BASE_TREE/scripts/workflow/external_review_fingerprint.sh" ]; then
            TRUSTED_HELPER_TREE="$TRUSTED_BASE_TREE"
            TRUSTED_SOURCE="the PR base ($BASE_SHA)"
          elif git rev-parse --verify --quiet "origin/$DEFAULT_BRANCH^{commit}" >/dev/null 2>&1; then
            TRUSTED_HELPER_TREE=$(mktemp -d)
            rmdir "$TRUSTED_HELPER_TREE" 2>/dev/null || true
            if git worktree add --quiet --detach "$TRUSTED_HELPER_TREE" "origin/$DEFAULT_BRANCH" 2>/dev/null \
               && [ -x "$TRUSTED_HELPER_TREE/scripts/workflow/external_review_fingerprint.sh" ]; then
              TRUSTED_SOURCE="origin/$DEFAULT_BRANCH (fallback: the PR base predates the helper)"
            else
              git worktree remove --force "$TRUSTED_HELPER_TREE" >/dev/null 2>&1 || rm -rf "$TRUSTED_HELPER_TREE"
              TRUSTED_HELPER_TREE=""
            fi
          fi

          if [ -z "$TRUSTED_SOURCE" ]; then
            echo "External-review fail-closed: neither the PR base nor origin/$DEFAULT_BRANCH carries an executable fingerprint helper; requiring review."
            echo "needs_review=true" >> "$GITHUB_OUTPUT"
            echo "reasons=- Trusted external-review fingerprint helper is unavailable on the PR base and the default branch; requiring review fail-closed" >> "$GITHUB_OUTPUT"
            echo "classification=fail-closed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "External-review: config from the PR base; helpers from $TRUSTED_SOURCE."

          TRUSTED_HELPER_DIR="$TRUSTED_HELPER_TREE/scripts/workflow"
          FINGERPRINT_HELPER="$TRUSTED_HELPER_DIR/external_review_fingerprint.sh"
          CARRY_HELPER="$TRUSTED_HELPER_DIR/external_review_carryforward.sh"
          CLEARANCE_HELPER="$TRUSTED_HELPER_TREE/scripts/codex-review-check.sh"

          set +e
          FINGERPRINT_JSON=$(bash "$FINGERPRINT_HELPER" \
            --repo "$REPO" \
            --pr "$PR_NUMBER" \
            --ref "$HEAD_SHA" \
            --config "$TRUSTED_CONFIG" \
            --files-json "$FILES_JSON")
          fingerprint_rc=$?
          set -e
          if [ "$fingerprint_rc" -ne 0 ]; then
            echo "External-review fail-closed: fingerprint helper failed (rc=$fingerprint_rc); requiring review."
            echo "needs_review=true" >> "$GITHUB_OUTPUT"
            echo "reasons=- External-review fingerprint helper failed; requiring review fail-closed" >> "$GITHUB_OUTPUT"
            echo "classification=fail-closed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NEEDS_REVIEW=$(echo "$FINGERPRINT_JSON" | jq -r '.requires_review')
          FINGERPRINT=$(echo "$FINGERPRINT_JSON" | jq -r '.fingerprint // ""')
          REASONS=$(echo "$FINGERPRINT_JSON" | jq -r '.reasons | map("- " + .) | join("%0A")')
          if [ "$NEEDS_REVIEW" = "false" ]; then
            echo "classification=under-threshold" >> "$GITHUB_OUTPUT"
          else
            echo "classification=external-required" >> "$GITHUB_OUTPUT"
          fi

          # A label delivery can arrive after Phase 4 already
          # cleared this exact head. Ask the canonical merge predicate rather
          # than reimplementing Codex / Phase 4b authority here. Its normal
          # mode retains reviewer identity, no-self-approval, latest-signal,
          # blocking-label, and current-head rules; only CI is skipped because
          # this required workflow would otherwise wait on itself.
          #
          # The governing config came from the event base. Bracket the helper
          # with live head+base reads so a push or retarget cannot turn that
          # event policy into a clearance claim about a different PR state.
          read_live_pair() {
            local pair
            if ! pair=$(gh api "repos/$REPO/pulls/$PR_NUMBER" \
              --jq '{head:.head.sha,base:.base.sha}'); then
              return 1
            fi
            if ! jq -e '
                select((.head | type) == "string" and (.head | test("^[0-9a-fA-F]{40}$")))
                | select((.base | type) == "string" and (.base | test("^[0-9a-fA-F]{40}$")))
              ' <<<"$pair" >/dev/null; then
              return 1
            fi
            printf '%s\n' "$pair"
          }
          publish_stale_event() {
            echo "External-review classification event no longer matches the live PR head/base; skipping stale result."
            echo "classification=stale-event" >> "$GITHUB_OUTPUT"
            echo "needs_review=false" >> "$GITHUB_OUTPUT"
            echo "reasons=" >> "$GITHUB_OUTPUT"
          }
          publish_clearance_failure() {
            echo "External-review clearance lookup failed closed: $1"
            echo "classification=fail-closed" >> "$GITHUB_OUTPUT"
            echo "needs_review=true" >> "$GITHUB_OUTPUT"
            echo "reasons=- External-review clearance lookup failed; requiring review fail-closed" >> "$GITHUB_OUTPUT"
          }

          if [ "$NEEDS_REVIEW" = "true" ] && [ -n "$FINGERPRINT" ] && [ -x "$CARRY_HELPER" ]; then
            set +e
            CARRY_JSON=$(bash "$CARRY_HELPER" \
              --repo "$REPO" \
              --pr "$PR_NUMBER" \
              --head "$HEAD_SHA" \
              --current-fingerprint "$FINGERPRINT" \
              --config "$TRUSTED_CONFIG" \
              --files-json "$FILES_JSON")
            carry_rc=$?
            set -e
            if [ "$carry_rc" -eq 0 ] && [ "$(echo "$CARRY_JSON" | jq -r '.carried')" = "true" ]; then
              SOURCE_COMMIT=$(echo "$CARRY_JSON" | jq -r '.source_commit')
              SOURCE_TIME=$(echo "$CARRY_JSON" | jq -r '.source_time')
              echo "External-review carry-forward: Codex already cleared the same external-review fingerprint on $SOURCE_COMMIT at $SOURCE_TIME; skipping needs-external-review on base-only sync (#705)."
              echo "classification=carried-forward" >> "$GITHUB_OUTPUT"
              echo "needs_review=false" >> "$GITHUB_OUTPUT"
              echo "reasons=" >> "$GITHUB_OUTPUT"
              exit 0
            elif [ "$carry_rc" -ne 0 ]; then
              echo "External-review carry-forward failed (rc=$carry_rc); requiring current-head review fail-closed."
              echo "classification=fail-closed" >> "$GITHUB_OUTPUT"
              echo "needs_review=true" >> "$GITHUB_OUTPUT"
              echo "reasons=- External-review carry-forward lookup failed (rc=$carry_rc); requiring review fail-closed" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # Preserve the distinct carried-forward classification above so it
          # remains eligible for #1321 reconciliation alongside under-threshold.
          # A later canonical gate clearance suppresses application but grants
          # no additional label-removal authority.
          if [ "$NEEDS_REVIEW" = "true" ] \
             && { [ "$EVENT_ACTION" = labeled ] || [ "$EVENT_ACTION" = unlabeled ]; }; then
            if [ ! -x "$CLEARANCE_HELPER" ]; then
              publish_clearance_failure "trusted canonical helper is unavailable"
              exit 0
            fi
            if ! LIVE_PAIR_BEFORE=$(read_live_pair); then
              publish_clearance_failure "could not read a valid live PR head/base pair"
              exit 0
            fi
            if [ "$(jq -r '.head' <<<"$LIVE_PAIR_BEFORE")" != "$HEAD_SHA" ] \
               || [ "$(jq -r '.base' <<<"$LIVE_PAIR_BEFORE")" != "$BASE_SHA" ]; then
              publish_stale_event
              exit 0
            fi

            set +e
            CODEX_REVIEW_CHECK_SKIP_CI=1 \
              CODEX_REVIEW_CHECK_REQUIRE_APPROVAL_ON_HEAD=1 \
              MERGEPATH_REVIEW_POLICY_PATH="$TRUSTED_CONFIG" \
              bash "$CLEARANCE_HELPER" "$PR_NUMBER" "$REPO"
            clearance_rc=$?
            set -e

            if [ "$clearance_rc" -eq 0 ]; then
              if ! LIVE_PAIR_AFTER=$(read_live_pair); then
                publish_clearance_failure "could not re-read a valid live PR head/base pair"
                exit 0
              fi
              if [ "$(jq -r '.head' <<<"$LIVE_PAIR_AFTER")" != "$HEAD_SHA" ] \
                 || [ "$(jq -r '.base' <<<"$LIVE_PAIR_AFTER")" != "$BASE_SHA" ]; then
                publish_stale_event
                exit 0
              fi
              echo "External review is already cleared by the canonical current-head gate; suppressing label application."
              echo "classification=external-cleared" >> "$GITHUB_OUTPUT"
              echo "needs_review=false" >> "$GITHUB_OUTPUT"
              echo "reasons=" >> "$GITHUB_OUTPUT"
              exit 0
            elif [ "$clearance_rc" -ne 1 ]; then
              publish_clearance_failure "canonical helper exited $clearance_rc"
              exit 0
            fi
          fi

          echo "needs_review=$NEEDS_REVIEW" >> "$GITHUB_OUTPUT"
          echo "reasons=$REASONS" >> "$GITHUB_OUTPUT"

      - name: Apply label and comment
        # A PAT-driven auto-clear removal intentionally triggers this workflow.
        # Re-evaluate and publish External Review Check, but do not undo that
        # same removal by re-adding the label (#969). Every other label event
        # follows the ordinary classification result (#1254).
        if: >-
          steps.check.outputs.needs_review == 'true' &&
          !(github.event.action == 'unlabeled' &&
            github.event.label.name == 'needs-external-review')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REASONS: ${{ steps.check.outputs.reasons }}
          CLASSIFICATION: ${{ steps.check.outputs.classification }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Check if label already applied to avoid duplicate comments
          EXISTING=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json labels --jq '.labels[].name' | grep '^needs-external-review$' || true)
          if [ -n "$EXISTING" ]; then
            echo "Label already applied, skipping."
            exit 0
          fi

          # #1254: label-event runs can outlive the event head or base. Fence
          # the write against both live identities immediately before applying
          # the label. An unreadable or malformed pair fails this job (and
          # therefore Label Gate) closed; a confirmed move/retarget is a
          # successful stale-run no-op.
          if ! LIVE_PAIR=$(gh api \
            "repos/${{ github.repository }}/pulls/$PR_NUMBER" \
            --jq '{head:.head.sha,base:.base.sha}'); then
            echo "::error::Could not read the live PR head/base before applying needs-external-review." >&2
            exit 1
          fi
          if ! jq -e '
              select((.head | type) == "string" and (.head | test("^[0-9a-fA-F]{40}$")))
              | select((.base | type) == "string" and (.base | test("^[0-9a-fA-F]{40}$")))
            ' <<<"$LIVE_PAIR" >/dev/null; then
            echo "::error::Live PR head/base is malformed; refusing to apply needs-external-review." >&2
            exit 1
          fi
          LIVE_HEAD=$(jq -r '.head' <<<"$LIVE_PAIR")
          LIVE_BASE=$(jq -r '.base' <<<"$LIVE_PAIR")
          if [ "$LIVE_HEAD" != "$HEAD_SHA" ] || [ "$LIVE_BASE" != "$BASE_SHA" ]; then
            echo "PR head/base moved from $HEAD_SHA/$BASE_SHA to $LIVE_HEAD/$LIVE_BASE; skipping stale needs-external-review application."
            exit 0
          fi

          gh pr edit "$PR_NUMBER" --add-label "needs-external-review" \
            --repo "${{ github.repository }}"

          FORMATTED_REASONS=$(echo "$REASONS" | sed 's/%0A/\n/g')
          PROVENANCE=""
          if [ "$CLASSIFICATION" = fail-closed ]; then
            PROVENANCE="<!-- mergepath-external-review-label:v1 head=$HEAD_SHA cause=fail-closed -->"
          fi

          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body "$(cat <<EOF
          $PROVENANCE
          **External Review Required**

          This PR has been labeled \`needs-external-review\` based on .github/review-policy.yml:

          $FORMATTED_REASONS

          Per REVIEW_POLICY.md, the authoring agent must post a handoff message and alert the human. The human will coordinate external review by a different agent.

          > Automated check per .github/review-policy.yml
          EOF
          )"

      - name: Reconcile a policy-owned fail-closed label
        if: >-
          steps.check.outputs.classification == 'under-threshold' ||
          steps.check.outputs.classification == 'carried-forward'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LABEL_REMOVAL_TOKEN: ${{ secrets.CI_ACTOR_TOKEN || secrets.REVIEWER_ASSIGNMENT_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # #1321: a successful no-review classification may retract only a
          # label this workflow previously applied because an earlier read
          # failed closed. This includes an ordinary under-threshold result and
          # a same-fingerprint carry-forward. An old comment is not ownership:
          # a human could have removed and re-applied the label since then. Bind
          # the decision to the latest label event and adjacent automation comment.
          fetch_array() { # <endpoint> <output-file>
            local endpoint=$1 output=$2 raw err rc=0
            raw=$(mktemp)
            err=$(mktemp)
            gh api --paginate "$endpoint" >"$raw" 2>"$err" || rc=$?
            if [ "$rc" -ne 0 ] || ! jq -s 'add // []' "$raw" >"$output"; then
              echo "::warning::Could not read complete $endpoint data; preserving needs-external-review." >&2
              cat "$err" >&2 || true
              rm -f "$raw" "$err"
              return 1
            fi
            rm -f "$raw" "$err"
          }

          read_live_pr() { # <output-file>
            local output=$1 raw err rc=0
            raw=$(mktemp)
            err=$(mktemp)
            gh api "repos/$REPO/pulls/$PR_NUMBER" >"$raw" 2>"$err" || rc=$?
            if [ "$rc" -ne 0 ] \
               || ! jq -e '
                    select((.head.sha | type) == "string" and (.head.sha | test("^[0-9a-fA-F]{40}$")))
                    | select((.base.sha | type) == "string" and (.base.sha | test("^[0-9a-fA-F]{40}$")))
                    | select((.labels | type) == "array")
                    | {head_sha:.head.sha, base_sha:.base.sha,
                       labels:[.labels[] | select((.name | type) == "string") | .name]}
                  ' "$raw" >"$output"; then
              echo "::warning::Could not read current PR head, base, and labels; preserving needs-external-review." >&2
              cat "$err" >&2 || true
              rm -f "$raw" "$err"
              return 1
            fi
            rm -f "$raw" "$err"
          }

          LIVE=$(mktemp)
          TIMELINE=$(mktemp)
          COMMENTS=$(mktemp)
          cleanup_reconcile() { rm -f "$LIVE" "$TIMELINE" "$COMMENTS"; }
          trap cleanup_reconcile EXIT

          if ! read_live_pr "$LIVE"; then
            exit 0
          fi
          LIVE_HEAD=$(jq -r '.head_sha' "$LIVE")
          LIVE_BASE=$(jq -r '.base_sha' "$LIVE")
          if [ "$LIVE_HEAD" != "$EXPECTED_HEAD_SHA" ] || [ "$LIVE_BASE" != "$EXPECTED_BASE_SHA" ]; then
            echo "::warning::PR head/base moved from $EXPECTED_HEAD_SHA/$EXPECTED_BASE_SHA to $LIVE_HEAD/$LIVE_BASE during classification; preserving needs-external-review." >&2
            exit 0
          fi
          if ! jq -e '.labels | index("needs-external-review") != null' "$LIVE" >/dev/null; then
            echo "needs-external-review is already absent; nothing to reconcile."
            exit 0
          fi

          if ! fetch_array "repos/$REPO/issues/$PR_NUMBER/timeline" "$TIMELINE" \
             || ! fetch_array "repos/$REPO/issues/$PR_NUMBER/comments" "$COMMENTS"; then
            exit 0
          fi
          LATEST=$(jq -c '
            [ .[]
              | select((.event == "labeled" or .event == "unlabeled")
                       and .label.name == "needs-external-review") ]
            | sort_by(.created_at, .id) | last // null
          ' "$TIMELINE")
          if ! jq -e '.event == "labeled" and .actor.login == "github-actions[bot]"' \
               <<<"$LATEST" >/dev/null; then
            echo "Latest needs-external-review timeline event is not a github-actions label application; preserving it."
            exit 0
          fi
          LABEL_EVENT_ID=$(jq -r '.id' <<<"$LATEST")
          LABEL_EVENT_TIME=$(jq -r '.created_at' <<<"$LATEST")

          # New applications carry an exact-head marker as the first line of
          # the application envelope. Legacy applications are admitted only
          # when the complete body matches one of the historical fail-closed
          # templates. A title or reason substring can be supplied by an
          # ordinary protected-path filename, so neither proves ownership.
          OWNER_COMMENT=$(jq -c --arg applied "$LABEL_EVENT_TIME" --arg head "$EXPECTED_HEAD_SHA" '
            def application_prefix:
              "**External Review Required**\n\n"
              + "This PR has been labeled `needs-external-review` based on .github/review-policy.yml:\n\n";
            def application_suffix:
              "\n\nPer REVIEW_POLICY.md, the authoring agent must post a handoff message and alert the human. "
              + "The human will coordinate external review by a different agent.\n\n"
              + "> Automated check per .github/review-policy.yml";
            def application_body($reason):
              application_prefix + $reason + application_suffix;
            def legacy_body:
              . == application_body("- Could not fetch PR files for external-review fingerprint; requiring review fail-closed")
              or . == application_body("- Could not materialize the PR base tree for the external-review calculation; requiring review fail-closed")
              or . == application_body("- No trusted review-policy.yml on the PR base or the default branch; requiring review fail-closed")
              or . == application_body("- Trusted external-review fingerprint helper is unavailable on the PR base and the default branch; requiring review fail-closed")
              or . == application_body("- External-review fingerprint helper failed; requiring review fail-closed");
            def marked_body($expected_head):
              ("<!-- mergepath-external-review-label:v1 head=" + $expected_head
               + " cause=fail-closed -->\n" + application_prefix) as $prefix
              | . as $body
              | ($body | startswith($prefix))
                and ($body | endswith(application_suffix))
                and (($body | ltrimstr($prefix) | rtrimstr(application_suffix))
                     | test("^- [^\\n]+; requiring review fail-closed$"));
            ($applied | fromdateiso8601) as $at
            | [ .[]
                | select(.user.login == "github-actions[bot]")
                | select((.created_at | fromdateiso8601) >= $at
                         and (.created_at | fromdateiso8601) <= ($at + 300))
                | select(.body | legacy_body or marked_body($head)) ]
            | sort_by(.created_at, .id) | first // null
          ' "$COMMENTS")
          if [ "$OWNER_COMMENT" = null ]; then
            echo "No adjacent github-actions fail-closed application comment proves ownership; preserving needs-external-review."
            exit 0
          fi
          # Close the read/delete race as far as the API permits: repeat both
          # mutable facts immediately before deletion. A human re-application,
          # an unlinking event, a head/base move, or any read failure holds the label.
          if ! fetch_array "repos/$REPO/issues/$PR_NUMBER/timeline" "$TIMELINE"; then
            exit 0
          fi
          LATEST_AGAIN=$(jq -c '
            [ .[]
              | select((.event == "labeled" or .event == "unlabeled")
                       and .label.name == "needs-external-review") ]
            | sort_by(.created_at, .id) | last // null
          ' "$TIMELINE")
          if ! read_live_pr "$LIVE"; then
            exit 0
          fi
          if [ "$(jq -r '.id // ""' <<<"$LATEST_AGAIN")" != "$LABEL_EVENT_ID" ] \
             || [ "$(jq -r '.event // ""' <<<"$LATEST_AGAIN")" != labeled ] \
             || [ "$(jq -r '.actor.login // ""' <<<"$LATEST_AGAIN")" != 'github-actions[bot]' ] \
             || [ "$(jq -r '.head_sha' "$LIVE")" != "$EXPECTED_HEAD_SHA" ] \
             || [ "$(jq -r '.base_sha' "$LIVE")" != "$EXPECTED_BASE_SHA" ] \
             || ! jq -e '.labels | index("needs-external-review") != null' "$LIVE" >/dev/null; then
            echo "::warning::PR head, base, label, or ownership changed during reconciliation; preserving needs-external-review." >&2
            exit 0
          fi
          if [ -z "$LABEL_REMOVAL_TOKEN" ]; then
            echo "::warning::Label-removal token is unavailable; preserving needs-external-review." >&2
            exit 0
          fi
          if ! GH_TOKEN="$LABEL_REMOVAL_TOKEN" gh api -X DELETE \
            "repos/$REPO/issues/$PR_NUMBER/labels/needs-external-review"; then
            echo "::warning::Could not remove needs-external-review; preserving the label for Label Gate." >&2
            exit 0
          fi
          echo "Removed workflow-owned fail-closed needs-external-review after a trusted no-review classification."

      - name: Propagation PR review lane
        if: steps.check.outputs.propagation_lane == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # #620 (Codex r6): the needs-external-review removal below must fire
          # agent-review.yml's `unlabeled` settle re-arm, and GITHUB_TOKEN-driven
          # events create no workflow runs (the #315/#324 auto-clear lesson) —
          # a GITHUB_TOKEN removal here leaves an approved, settled PR
          # CLEAN-but-unmerged. The PAT is scoped to the two commands that must
          # create workflow runs GITHUB_TOKEN cannot: the label removal below,
          # and the #658 merge-clearance-recheck repository_dispatch. The
          # lane-marker comment itself deliberately stays on GITHUB_TOKEN so it
          # remains github-actions-authored for its #429 consumers — but that is
          # exactly why it fires no run, hence the PAT dispatch that nudges
          # merge-clearance-gate. Every other command keeps the restricted
          # default token.
          LABEL_REMOVAL_TOKEN: ${{ secrets.CI_ACTOR_TOKEN || secrets.REVIEWER_ASSIGNMENT_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Embedded in the lane marker so the signal is HEAD/BASE-PINNED — a
          # consumer (merge-clearance-gate.sh's propagation exemption, #429)
          # can confirm THIS pair was verified, not merely that the PR was
          # once a faithful mirror before a push or retarget.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Recognized propagation PR (see REVIEW_POLICY.md § Propagation
          # PR review lane): the check step VERIFIED it is a byte-for-byte
          # faithful mirror of mergepath@<sha> — every changed file
          # byte-matches mergepath's content under a manifest path, as
          # confirmed by mergepath@<sha>'s own verify-propagation-pr.sh.
          # It is exempt from the Phase 4 external-review requirement —
          # but still subject to CI green, CodeRabbit advisory review,
          # and an internal reviewer-identity APPROVED (the standard
          # under-threshold path).
          #
          # Post a HEAD/BASE-PINNED, machine-readable lane marker. The marker
          # embeds the verified pair, so a consumer of this signal
          # (scripts/merge-clearance-gate.sh's propagation exemption, #429)
          # exempts a PR ONLY if the lane verified THAT head/base pair — not
          # merely that the PR was once a faithful mirror before a retarget.
          # Posted only by this workflow (github-actions[bot]); a PR author
          # cannot forge that identity. One marker per distinct verified pair:
          # re-runs on the same pair don't re-comment; a faithful re-push or
          # same-head retarget posts a fresh marker only after that new pair is
          # verified; a DIVERGED push never reaches this step.
          # Marker contract is shared with merge-clearance-gate.sh
          # (lane_verified(), also consumed indirectly by agent-review.yml's
          # rc=5 branch via --derive-external-requiredness, #620) AND with
          # agent-review.yml's triage job (#656: triage skips its
          # needs-external-review add only for a pair this marker pins) —
          # keep the `mergepath-propagation-lane:v2 verified-head=<sha>
          # verified-base=<sha>` form
          # in sync across the three files
          # (scripts/ci/check_agent_review_triage_defers asserts the
          # lockstep).
          #
          # ORDER MATTERS (#620 Codex r9): the marker MUST be posted before
          # the label removal below. The removal fires agent-review.yml's
          # unlabeled re-arm, whose rc=5 branch derives external
          # requiredness via merge-clearance-gate.sh — whose lane_verified()
          # reads this marker to tell exemption apart from clearance.
          # Marker-after-removal would open a window where that derivation
          # treats the exemption as an ordinary above-threshold arm.
          # Marker-then-removal is safe in the failure direction: if the
          # marker posts and the removal then fails, the still-present label
          # keeps merge-clearance-gate blocking (a present label is never
          # subject to the propagation exemption).
          fence_event_pair() { # <operation-description>
            local operation=$1 pair live_head live_base
            if ! pair=$(gh api \
              "repos/${{ github.repository }}/pulls/$PR_NUMBER" \
              --jq '{head:.head.sha,base:.base.sha}'); then
              echo "::error::Could not read the live PR head/base before $operation." >&2
              exit 1
            fi
            if ! jq -e '
                select((.head | type) == "string" and (.head | test("^[0-9a-fA-F]{40}$")))
                | select((.base | type) == "string" and (.base | test("^[0-9a-fA-F]{40}$")))
              ' <<<"$pair" >/dev/null; then
              echo "::error::Live PR head/base is malformed; refusing $operation." >&2
              exit 1
            fi
            live_head=$(jq -r '.head' <<<"$pair")
            live_base=$(jq -r '.base' <<<"$pair")
            if [ "$live_head" != "$HEAD_SHA" ] || [ "$live_base" != "$BASE_SHA" ]; then
              echo "PR head/base moved from $HEAD_SHA/$BASE_SHA to $live_head/$live_base; refusing stale $operation."
              exit 0
            fi
          }

          MARKER="<!-- mergepath-propagation-lane:v2 verified-head=$HEAD_SHA verified-base=$BASE_SHA -->"
          ALREADY=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json comments --jq '.comments[].body' | grep -F "$MARKER" || true)
          if [ -z "$ALREADY" ]; then
            # The marker and dispatch authorize the propagation exemption for
            # this pair. Check the complete event pair immediately before that
            # authority is published.
            fence_event_pair "publishing verified-propagation authority"
            gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body "$(cat <<EOF
          $MARKER
          **Propagation PR review lane** — verified faithful mirror ✅ (head \`$HEAD_SHA\`, base \`$BASE_SHA\`)

          This PR was checked out against \`mergepath\` at the source commit named in its branch and **verified byte-for-byte at this head/base pair**: every changed file is under a \`.mergepath-sync.yml\` path AND matches \`mergepath@<sha>\`'s content (\`scripts/workflow/verify-propagation-pr.sh\`). Its content was already reviewed in the upstream mergepath PR(s). Per REVIEW_POLICY.md § Propagation PR review lane it is **exempt from the Phase 4 external-review requirement**.

          It is still subject to: CI green, CodeRabbit advisory review, and an internal reviewer-identity \`APPROVED\` — the standard under-threshold path. Merge as the author once those clear.

          > Automated check per .github/review-policy.yml
          EOF
          )"
            # #658: the marker just posted is a GITHUB_TOKEN github-actions[bot]
            # issue comment, and GITHUB_TOKEN-authored events create no workflow
            # runs — so merge-clearance-gate.yml cannot re-run via issue_comment
            # for this freshly verified head. Nudge it directly with a
            # repository_dispatch (its `merge-clearance-recheck` trigger) so a
            # verified sync PR clears the Merge clearance gate promptly instead
            # of waiting up to 15 min for the scheduled sweep. PAT-driven: the
            # workflow token is contents:read (cannot POST /dispatches), and
            # keeping the dispatch on the PAT avoids widening the GITHUB_TOKEN
            # scope. Best-effort — the gate re-derives clearance from THIS marker
            # (lane_verified, head/base-pinned) and never trusts the dispatch payload,
            # so on any failure the */15 sweep still recovers the gate; a failed
            # dispatch must never fail the lane. Keep the event type in sync with
            # merge-clearance-gate.yml's repository_dispatch trigger.
            GH_TOKEN="$LABEL_REMOVAL_TOKEN" gh api -X POST \
              "repos/${{ github.repository }}/dispatches" \
              -f event_type=merge-clearance-recheck \
              -F "client_payload[pr]=$PR_NUMBER" \
              || echo "note: merge-clearance-recheck dispatch failed (#658); the */15 scheduled sweep will recover the Merge clearance gate."
          fi

          # If a prior run (or a stale label-prefixed edit) applied
          # needs-external-review before this PR qualified, remove it so
          # the Label Gate stops blocking. The workflow REMOVING a label
          # it is responsible for applying is not an agent override — the
          # human-action-label prohibition (REVIEW_POLICY.md § Agent
          # prohibitions) is about agents clearing labels, not about the
          # policy automation reconciling its own decision. This lane is
          # a sanctioned automation alongside auto-clear-blocking-labels.yml.
          # Runs AFTER the marker post above — see ORDER MATTERS.
          EXISTING=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json labels --jq '.labels[].name' | grep '^needs-external-review$' || true)
          if [ -n "$EXISTING" ]; then
            # Repeat the event-pair fence immediately before deletion: marker
            # publication and dispatch above can take long enough for the PR to
            # move again. This bounds both authority writes without claiming an
            # atomic read-to-write guarantee.
            fence_event_pair "removing needs-external-review for verified propagation"

            # PAT-driven so the removal fires the #620 unlabeled settle
            # re-arm (see LABEL_REMOVAL_TOKEN above).
            GH_TOKEN="$LABEL_REMOVAL_TOKEN" gh pr edit "$PR_NUMBER" --remove-label "needs-external-review" \
              --repo "${{ github.repository }}"
            echo "Removed needs-external-review — PR qualifies for the propagation review lane."
          fi
