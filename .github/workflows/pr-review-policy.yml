name: PR Review Policy

on:
  pull_request:
    types: [opened, edited, synchronize, labeled, unlabeled]

permissions:
  pull-requests: write
  contents: read
  issues: read

jobs:
  self-review-check:
    name: Self-Review Required
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # The parser is loaded from the DEFAULT BRANCH, never from the PR head.
      # This job triggers on `pull_request`, so a default checkout would fetch
      # the proposed code and run the validator out of it — letting a PR
      # rewrite the gate that judges it, which is strictly worse than the line
      # grep this replaces. Same posture as agent-review.yml's trusted-helper
      # checkouts; persist-credentials off because nothing here needs an
      # authenticated git (#548).
      - name: Checkout trusted PR body validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # Pins the VALIDATOR's runtime, chosen on its own merits — an active LTS.
      # The parser imports exactly one thing (`node:fs`), so this buys
      # determinism against runner-image drift, not capability. Deliberately a
      # literal, not node-version-file: this workflow is canonical and lands
      # byte-identical on every consumer, most of which have no .nvmrc.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # Routes through the single tested entrypoint rather than invoking the
      # parser directly, so the contract has one implementation instead of a
      # shell copy and a YAML copy that drift apart.
      #
      # `--self-review-only` checks the heading and nothing else: no policy is
      # read and no claim is made about `Authoring-Agent:`. Widening this
      # required check to the identity contract is a separate policy change,
      # tracked in #1137.
      #
      # ORDERING, load-bearing: this flag landed on the default branch in its
      # own change (#1138) BEFORE this workflow started passing it. The
      # validator is loaded from the default branch, so a flag introduced
      # alongside its caller does not exist when the gate runs and the required
      # check dies on `usage:` — hit twice during #1132, once as a missing
      # script and once as a missing interface. Any future flag this gate
      # passes must land the same way.
      #
      # The body goes in on STDIN via env, so it is never interpolated into the
      # shell and never appears in argv.
      - name: Validate the PR body against the contract
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$PR_BODY" | scripts/validate-pr-body.sh --self-review-only

  label-gate:
    name: Label Gate
    needs: external-review-labeling
    if: always()
    runs-on: ubuntu-latest
    env:
      CLASSIFIER_RESULT: ${{ needs.external-review-labeling.result }}
    steps:
      - name: Block merge if blocking labels present
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // The classifier may add needs-external-review during this run.
            // Wait for it before reading live labels (#1251), and fail closed
            // if it did not complete: an unread classifier result cannot make
            // the event's pre-classification label set authoritative.
            if (process.env.CLASSIFIER_RESULT !== 'success') {
              core.setFailed(
                `External Review Check finished with ${process.env.CLASSIFIER_RESULT || 'an unknown result'}; ` +
                `failing closed before evaluating labels.`
              );
              return;
            }
            // check_pr_review_policy_nudge asserts parity with the shared
            // scripts/lib/blocking-labels.sh predicate (#1241).
            const blockingLabels = [
              'needs-external-review',
              'needs-human-review',
              'policy-violation',
              'human-hold',
            ];
            // Read the PR's LIVE labels, never context.payload's snapshot
            // (#1339). A re-run replays the ORIGINAL event payload, so a run
            // that failed on a since-removed label failed identically on
            // every re-run and could never be retired by one (#1318). A
            // failed read fails closed: "could not read the labels" must not
            // pass as "no blocking labels".
            const issue_number = context.payload.pull_request.number;
            let prLabels;
            try {
              const labels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                per_page: 100,
              });
              prLabels = labels.map(l => l.name);
            } catch (err) {
              core.setFailed(
                `Could not read the current labels of #${issue_number} (${err.message}); ` +
                `failing closed rather than treating an unread label set as clear.`
              );
              return;
            }
            const blockers = prLabels.filter(l => blockingLabels.includes(l));

            if (blockers.length > 0) {
              core.setFailed(
                `Merge blocked by label(s): ${blockers.join(', ')}. ` +
                `Per REVIEW_POLICY.md, the human is the tiebreaker and resolves blocking labels.`
              );
            }

  external-review-labeling:
    name: External Review Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The external-review check only reads local history (git diff / show
          # / worktree) and clones PUBLIC mergepath unauthenticated; it never
          # pushes or uses the workspace remote, so don't leave the checkout
          # token in .git/config (#548 defense-in-depth).
          persist-credentials: false

      - name: Check for external review triggers from review-policy.yml
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        # The classifier is scripts/workflow/external_review_classify.sh
        # (#2727 slice 3b), the same file the trusted C6/C7 consumer runs. This
        # job holds the CI-actor PAT and runs no code from the candidate
        # checkout (#2775), so the classifier is read from the DEFAULT BRANCH's
        # blob, never from the merge ref. A default branch that does not carry
        # it yet (the PR that introduces it, or a consumer's first sync) gets a
        # fail-closed classification rather than the candidate's copy.
        run: |
          CLASSIFIER=$(mktemp)
          if git rev-parse --verify --quiet "origin/$DEFAULT_BRANCH^{commit}" >/dev/null \
             && git show "origin/$DEFAULT_BRANCH:scripts/workflow/external_review_classify.sh" >"$CLASSIFIER" 2>/dev/null \
             && [ -s "$CLASSIFIER" ]; then
            echo "External-review: classifier from origin/$DEFAULT_BRANCH ($(git rev-parse "origin/$DEFAULT_BRANCH"))."
            bash "$CLASSIFIER"
          else
            echo "External-review fail-closed: origin/$DEFAULT_BRANCH carries no scripts/workflow/external_review_classify.sh; requiring review."
            echo "needs_review=true" >> "$GITHUB_OUTPUT"
            echo "reasons=- The trusted external-review classifier is unavailable on the default branch; requiring review fail-closed" >> "$GITHUB_OUTPUT"
            echo "classification=fail-closed" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply label and comment
        # A PAT-driven auto-clear removal intentionally triggers this workflow.
        # Re-evaluate and publish External Review Check, but do not undo that
        # same removal by re-adding the label (#969). Every other label event
        # follows the ordinary classification result (#1254).
        if: >-
          steps.check.outputs.needs_review == 'true' &&
          !(github.event.action == 'unlabeled' &&
            github.event.label.name == 'needs-external-review')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REASONS: ${{ steps.check.outputs.reasons }}
          CLASSIFICATION: ${{ steps.check.outputs.classification }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Check if label already applied to avoid duplicate comments
          EXISTING=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json labels --jq '.labels[].name' | grep '^needs-external-review$' || true)
          if [ -n "$EXISTING" ]; then
            echo "Label already applied, skipping."
            exit 0
          fi

          # #1254: label-event runs can outlive the event head or base. Fence
          # the write against both live identities immediately before applying
          # the label. An unreadable or malformed pair fails this job (and
          # therefore Label Gate) closed; a confirmed move/retarget is a
          # successful stale-run no-op.
          if ! LIVE_PAIR=$(gh api \
            "repos/${{ github.repository }}/pulls/$PR_NUMBER" \
            --jq '{head:.head.sha,base:.base.sha}'); then
            echo "::error::Could not read the live PR head/base before applying needs-external-review." >&2
            exit 1
          fi
          if ! jq -e '
              select((.head | type) == "string" and (.head | test("^[0-9a-fA-F]{40}$")))
              | select((.base | type) == "string" and (.base | test("^[0-9a-fA-F]{40}$")))
            ' <<<"$LIVE_PAIR" >/dev/null; then
            echo "::error::Live PR head/base is malformed; refusing to apply needs-external-review." >&2
            exit 1
          fi
          LIVE_HEAD=$(jq -r '.head' <<<"$LIVE_PAIR")
          LIVE_BASE=$(jq -r '.base' <<<"$LIVE_PAIR")
          if [ "$LIVE_HEAD" != "$HEAD_SHA" ] || [ "$LIVE_BASE" != "$BASE_SHA" ]; then
            echo "PR head/base moved from $HEAD_SHA/$BASE_SHA to $LIVE_HEAD/$LIVE_BASE; skipping stale needs-external-review application."
            exit 0
          fi

          gh pr edit "$PR_NUMBER" --add-label "needs-external-review" \
            --repo "${{ github.repository }}"

          FORMATTED_REASONS=$(echo "$REASONS" | sed 's/%0A/\n/g')
          PROVENANCE=""
          if [ "$CLASSIFICATION" = fail-closed ]; then
            PROVENANCE="<!-- mergepath-external-review-label:v1 head=$HEAD_SHA cause=fail-closed -->"
          fi

          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body "$(cat <<EOF
          $PROVENANCE
          **External Review Required**

          This PR has been labeled \`needs-external-review\` based on .github/review-policy.yml:

          $FORMATTED_REASONS

          Per REVIEW_POLICY.md, the authoring agent must post a handoff message and alert the human. The human will coordinate external review by a different agent.

          > Automated check per .github/review-policy.yml
          EOF
          )"

      - name: Reconcile a policy-owned fail-closed label
        if: >-
          steps.check.outputs.classification == 'under-threshold' ||
          steps.check.outputs.classification == 'carried-forward'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LABEL_REMOVAL_TOKEN: ${{ secrets.CI_ACTOR_TOKEN || secrets.REVIEWER_ASSIGNMENT_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # #1321: a successful no-review classification may retract only a
          # label this workflow previously applied because an earlier read
          # failed closed. This includes an ordinary under-threshold result and
          # a same-fingerprint carry-forward. An old comment is not ownership:
          # a human could have removed and re-applied the label since then. Bind
          # the decision to the latest label event and adjacent automation comment.
          fetch_array() { # <endpoint> <output-file>
            local endpoint=$1 output=$2 raw err rc=0
            raw=$(mktemp)
            err=$(mktemp)
            gh api --paginate "$endpoint" >"$raw" 2>"$err" || rc=$?
            if [ "$rc" -ne 0 ] || ! jq -s 'add // []' "$raw" >"$output"; then
              echo "::warning::Could not read complete $endpoint data; preserving needs-external-review." >&2
              cat "$err" >&2 || true
              rm -f "$raw" "$err"
              return 1
            fi
            rm -f "$raw" "$err"
          }

          read_live_pr() { # <output-file>
            local output=$1 raw err rc=0
            raw=$(mktemp)
            err=$(mktemp)
            gh api "repos/$REPO/pulls/$PR_NUMBER" >"$raw" 2>"$err" || rc=$?
            if [ "$rc" -ne 0 ] \
               || ! jq -e '
                    select((.head.sha | type) == "string" and (.head.sha | test("^[0-9a-fA-F]{40}$")))
                    | select((.base.sha | type) == "string" and (.base.sha | test("^[0-9a-fA-F]{40}$")))
                    | select((.labels | type) == "array")
                    | {head_sha:.head.sha, base_sha:.base.sha,
                       labels:[.labels[] | select((.name | type) == "string") | .name]}
                  ' "$raw" >"$output"; then
              echo "::warning::Could not read current PR head, base, and labels; preserving needs-external-review." >&2
              cat "$err" >&2 || true
              rm -f "$raw" "$err"
              return 1
            fi
            rm -f "$raw" "$err"
          }

          LIVE=$(mktemp)
          TIMELINE=$(mktemp)
          COMMENTS=$(mktemp)
          cleanup_reconcile() { rm -f "$LIVE" "$TIMELINE" "$COMMENTS"; }
          trap cleanup_reconcile EXIT

          if ! read_live_pr "$LIVE"; then
            exit 0
          fi
          LIVE_HEAD=$(jq -r '.head_sha' "$LIVE")
          LIVE_BASE=$(jq -r '.base_sha' "$LIVE")
          if [ "$LIVE_HEAD" != "$EXPECTED_HEAD_SHA" ] || [ "$LIVE_BASE" != "$EXPECTED_BASE_SHA" ]; then
            echo "::warning::PR head/base moved from $EXPECTED_HEAD_SHA/$EXPECTED_BASE_SHA to $LIVE_HEAD/$LIVE_BASE during classification; preserving needs-external-review." >&2
            exit 0
          fi
          if ! jq -e '.labels | index("needs-external-review") != null' "$LIVE" >/dev/null; then
            echo "needs-external-review is already absent; nothing to reconcile."
            exit 0
          fi

          if ! fetch_array "repos/$REPO/issues/$PR_NUMBER/timeline" "$TIMELINE" \
             || ! fetch_array "repos/$REPO/issues/$PR_NUMBER/comments" "$COMMENTS"; then
            exit 0
          fi
          LATEST=$(jq -c '
            [ .[]
              | select((.event == "labeled" or .event == "unlabeled")
                       and .label.name == "needs-external-review") ]
            | sort_by(.created_at, .id) | last // null
          ' "$TIMELINE")
          if ! jq -e '.event == "labeled" and .actor.login == "github-actions[bot]"' \
               <<<"$LATEST" >/dev/null; then
            echo "Latest needs-external-review timeline event is not a github-actions label application; preserving it."
            exit 0
          fi
          LABEL_EVENT_ID=$(jq -r '.id' <<<"$LATEST")
          LABEL_EVENT_TIME=$(jq -r '.created_at' <<<"$LATEST")

          # New applications carry an exact-head marker as the first line of
          # the application envelope. Legacy applications are admitted only
          # when the complete body matches one of the historical fail-closed
          # templates. A title or reason substring can be supplied by an
          # ordinary protected-path filename, so neither proves ownership.
          OWNER_COMMENT=$(jq -c --arg applied "$LABEL_EVENT_TIME" --arg head "$EXPECTED_HEAD_SHA" '
            def application_prefix:
              "**External Review Required**\n\n"
              + "This PR has been labeled `needs-external-review` based on .github/review-policy.yml:\n\n";
            def application_suffix:
              "\n\nPer REVIEW_POLICY.md, the authoring agent must post a handoff message and alert the human. "
              + "The human will coordinate external review by a different agent.\n\n"
              + "> Automated check per .github/review-policy.yml";
            def application_body($reason):
              application_prefix + $reason + application_suffix;
            def legacy_body:
              . == application_body("- Could not fetch PR files for external-review fingerprint; requiring review fail-closed")
              or . == application_body("- Could not materialize the PR base tree for the external-review calculation; requiring review fail-closed")
              or . == application_body("- No trusted review-policy.yml on the PR base or the default branch; requiring review fail-closed")
              or . == application_body("- Trusted external-review fingerprint helper is unavailable on the PR base and the default branch; requiring review fail-closed")
              or . == application_body("- External-review fingerprint helper failed; requiring review fail-closed");
            def marked_body($expected_head):
              ("<!-- mergepath-external-review-label:v1 head=" + $expected_head
               + " cause=fail-closed -->\n" + application_prefix) as $prefix
              | . as $body
              | ($body | startswith($prefix))
                and ($body | endswith(application_suffix))
                and (($body | ltrimstr($prefix) | rtrimstr(application_suffix))
                     | test("^- [^\\n]+; requiring review fail-closed$"));
            ($applied | fromdateiso8601) as $at
            | [ .[]
                | select(.user.login == "github-actions[bot]")
                | select((.created_at | fromdateiso8601) >= $at
                         and (.created_at | fromdateiso8601) <= ($at + 300))
                | select(.body | legacy_body or marked_body($head)) ]
            | sort_by(.created_at, .id) | first // null
          ' "$COMMENTS")
          if [ "$OWNER_COMMENT" = null ]; then
            echo "No adjacent github-actions fail-closed application comment proves ownership; preserving needs-external-review."
            exit 0
          fi
          # Close the read/delete race as far as the API permits: repeat both
          # mutable facts immediately before deletion. A human re-application,
          # an unlinking event, a head/base move, or any read failure holds the label.
          if ! fetch_array "repos/$REPO/issues/$PR_NUMBER/timeline" "$TIMELINE"; then
            exit 0
          fi
          LATEST_AGAIN=$(jq -c '
            [ .[]
              | select((.event == "labeled" or .event == "unlabeled")
                       and .label.name == "needs-external-review") ]
            | sort_by(.created_at, .id) | last // null
          ' "$TIMELINE")
          if ! read_live_pr "$LIVE"; then
            exit 0
          fi
          if [ "$(jq -r '.id // ""' <<<"$LATEST_AGAIN")" != "$LABEL_EVENT_ID" ] \
             || [ "$(jq -r '.event // ""' <<<"$LATEST_AGAIN")" != labeled ] \
             || [ "$(jq -r '.actor.login // ""' <<<"$LATEST_AGAIN")" != 'github-actions[bot]' ] \
             || [ "$(jq -r '.head_sha' "$LIVE")" != "$EXPECTED_HEAD_SHA" ] \
             || [ "$(jq -r '.base_sha' "$LIVE")" != "$EXPECTED_BASE_SHA" ] \
             || ! jq -e '.labels | index("needs-external-review") != null' "$LIVE" >/dev/null; then
            echo "::warning::PR head, base, label, or ownership changed during reconciliation; preserving needs-external-review." >&2
            exit 0
          fi
          if [ -z "$LABEL_REMOVAL_TOKEN" ]; then
            echo "::warning::Label-removal token is unavailable; preserving needs-external-review." >&2
            exit 0
          fi
          if ! GH_TOKEN="$LABEL_REMOVAL_TOKEN" gh api -X DELETE \
            "repos/$REPO/issues/$PR_NUMBER/labels/needs-external-review"; then
            echo "::warning::Could not remove needs-external-review; preserving the label for Label Gate." >&2
            exit 0
          fi
          echo "Removed workflow-owned fail-closed needs-external-review after a trusted no-review classification."

      - name: Propagation PR review lane
        if: steps.check.outputs.propagation_lane == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # #620 (Codex r6): the needs-external-review removal below must fire
          # agent-review.yml's `unlabeled` settle re-arm, and GITHUB_TOKEN-driven
          # events create no workflow runs (the #315/#324 auto-clear lesson) —
          # a GITHUB_TOKEN removal here leaves an approved, settled PR
          # CLEAN-but-unmerged. The PAT is scoped to the two commands that must
          # create workflow runs GITHUB_TOKEN cannot: the label removal below,
          # and the #658 merge-clearance-recheck repository_dispatch. The
          # lane-marker diagnostic stays on GITHUB_TOKEN; its authorship grants
          # no clearance and its publication fires no run. The PAT dispatch nudges
          # merge-clearance-gate. Every other command keeps the restricted
          # default token.
          LABEL_REMOVAL_TOKEN: ${{ secrets.CI_ACTOR_TOKEN || secrets.REVIEWER_ASSIGNMENT_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Embedded in the diagnostic marker to report the checked pair.
          # Consumers independently verify their live head/base pair; this
          # snapshot cannot authorize an exemption after a push or retarget.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Recognized propagation PR (see REVIEW_POLICY.md § Propagation
          # PR review lane): the check step VERIFIED it is a byte-for-byte
          # faithful mirror of mergepath@<sha> — every changed file
          # byte-matches mergepath's content under a manifest path, as
          # independently confirmed by the trusted live verifier at use time.
          # It is exempt from the Phase 4 external-review requirement —
          # but still subject to CI green, CodeRabbit advisory review,
          # and an internal reviewer-identity APPROVED (the standard
          # under-threshold path).
          #
          # Post a head/base-pinned diagnostic marker once per verified pair.
          # Actions-bot authorship alone is not proof of this workflow's origin.
          # Clearance and triage consumers independently verify the live pair
          # with their trusted base-checkout verifier and governing policy;
          # copied markers, old pairs and label events grant no exemption.
          # Keep the v2 diagnostic shape in sync with its reporting consumers.
          # A dispatch after publication schedules another live verification;
          # neither the marker nor that dispatch supplies clearance authority.
          fence_event_pair() { # <operation-description>
            local operation=$1 pair live_head live_base
            if ! pair=$(gh api \
              "repos/${{ github.repository }}/pulls/$PR_NUMBER" \
              --jq '{head:.head.sha,base:.base.sha}'); then
              echo "::error::Could not read the live PR head/base before $operation." >&2
              exit 1
            fi
            if ! jq -e '
                select((.head | type) == "string" and (.head | test("^[0-9a-fA-F]{40}$")))
                | select((.base | type) == "string" and (.base | test("^[0-9a-fA-F]{40}$")))
              ' <<<"$pair" >/dev/null; then
              echo "::error::Live PR head/base is malformed; refusing $operation." >&2
              exit 1
            fi
            live_head=$(jq -r '.head' <<<"$pair")
            live_base=$(jq -r '.base' <<<"$pair")
            if [ "$live_head" != "$HEAD_SHA" ] || [ "$live_base" != "$BASE_SHA" ]; then
              echo "PR head/base moved from $HEAD_SHA/$BASE_SHA to $live_head/$live_base; refusing stale $operation."
              exit 0
            fi
          }

          MARKER="<!-- mergepath-propagation-lane:v2 verified-head=$HEAD_SHA verified-base=$BASE_SHA -->"
          # Read every page before matching: a partial response is not proof
          # of absence, and piping directly to grep can hide a later failure.
          if ! MARKER_COMMENTS=$(gh api --paginate \
            "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" --jq '.[].body'); then
            echo "::error::Could not read complete propagation-lane marker history; refusing writes." >&2
            exit 1
          fi
          ALREADY=$(grep -F "$MARKER" <<<"$MARKER_COMMENTS" || true)
          if [ -z "$ALREADY" ]; then
            # Fence the complete event pair before publishing its diagnostic
            # marker. Receivers independently verify the live pair.
            fence_event_pair "publishing verified-propagation diagnostics"
            gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body "$(cat <<EOF
          $MARKER
          **Propagation PR review lane** — verified faithful mirror ✅ (head \`$HEAD_SHA\`, base \`$BASE_SHA\`)

          This PR was checked out against \`mergepath\` at the source commit named in its branch and **verified byte-for-byte at this head/base pair**: every changed file is under a \`.mergepath-sync.yml\` path AND matches \`mergepath@<sha>\`'s content (\`scripts/workflow/verify-propagation-pr.sh\`). Its content was already reviewed in the upstream mergepath PR(s). Per REVIEW_POLICY.md § Propagation PR review lane it is **exempt from the Phase 4 external-review requirement**.

          This marker is diagnostic; clearance consumers independently verify their live head/base pair.

          It is still subject to: CI green, CodeRabbit advisory review, and an internal reviewer-identity \`APPROVED\` — the standard under-threshold path. Merge as the author once those clear.

          > Automated check per .github/review-policy.yml
          EOF
          )"
            # #658: the marker just posted is a GITHUB_TOKEN github-actions[bot]
            # issue comment, and GITHUB_TOKEN-authored events create no workflow
            # runs — so merge-clearance-gate.yml cannot re-run via issue_comment
            # for this freshly verified head. Nudge it directly with a
            # repository_dispatch (its `merge-clearance-recheck` trigger) so a
            # verified sync PR clears the Merge clearance gate promptly instead
            # of waiting for the scheduled sweep (up to 30 min since #2167). PAT-driven: the
            # workflow token is contents:read (cannot POST /dispatches), and
            # keeping the dispatch on the PAT avoids widening the GITHUB_TOKEN
            # scope. Best-effort — the gate independently byte-verifies its live
            # head/base pair and never trusts the marker or dispatch payload,
            # so on any failure the scheduled sweep still recovers the gate; a failed
            # dispatch must never fail the lane. Keep the event type in sync with
            # merge-clearance-gate.yml's repository_dispatch trigger.
            GH_TOKEN="$LABEL_REMOVAL_TOKEN" gh api -X POST \
              "repos/${{ github.repository }}/dispatches" \
              -f event_type=merge-clearance-recheck \
              -F "client_payload[pr]=$PR_NUMBER" \
              || echo "note: merge-clearance-recheck dispatch failed (#658); the scheduled sweep will recover the Merge clearance gate."
          fi

          # If a prior run (or a stale label-prefixed edit) applied
          # needs-external-review before this PR qualified, remove it so
          # the Label Gate stops blocking. The workflow REMOVING a label
          # it is responsible for applying is not an agent override — the
          # human-action-label prohibition (REVIEW_POLICY.md § Agent
          # prohibitions) is about agents clearing labels, not about the
          # policy automation reconciling its own decision. This lane is
          # a sanctioned automation alongside auto-clear-blocking-labels.yml.
          # Runs AFTER the marker post above — see ORDER MATTERS.
          EXISTING=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json labels --jq '.labels[].name' | grep '^needs-external-review$' || true)
          if [ -n "$EXISTING" ]; then
            # Repeat the event-pair fence immediately before deletion: marker
            # publication and dispatch above can take long enough for the PR to
            # move again. This bounds both authority writes without claiming an
            # atomic read-to-write guarantee.
            fence_event_pair "removing needs-external-review for verified propagation"

            # PAT-driven so the removal fires the #620 unlabeled settle
            # re-arm (see LABEL_REMOVAL_TOKEN above).
            GH_TOKEN="$LABEL_REMOVAL_TOKEN" gh pr edit "$PR_NUMBER" --remove-label "needs-external-review" \
              --repo "${{ github.repository }}"
            echo "Removed needs-external-review — PR qualifies for the propagation review lane."
          fi

      - name: Dependabot action-pin bump lane
        if: steps.check.outputs.dependabot_pin_bump == 'true'
        env:
          # Diagnostic only: this step writes one github-actions[bot] marker
          # comment per verified head/base pair and nothing else. It removes
          # no label (auto-clear-blocking-labels.yml owns that, on a trusted
          # trigger, against the live pair) and it grants no clearance — the
          # Merge clearance gate judges a Dependabot PR by its own provenance
          # arm. A copied marker, an old pair, or a bot byline exempts nothing.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVIDENCE: ${{ steps.check.outputs.dependabot_pin_bump_evidence }}
        run: |
          set -euo pipefail
          MARKER="<!-- mergepath-dependabot-pin-bump:v1 verified-head=$HEAD_SHA verified-base=$BASE_SHA -->"
          # Paginated read: a long-lived PR's comments routinely exceed one page.
          ALREADY=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" --jq '.[].body' | grep -F "$MARKER" || true)
          if [ -n "$ALREADY" ]; then
            echo "Diagnostic marker already posted for head $HEAD_SHA / base $BASE_SHA; nothing to do."
            exit 0
          fi
          # Fence the event pair against the live PR before publishing. An
          # unreadable or malformed pair fails this step closed; a confirmed
          # move is a successful stale-run no-op.
          if ! LIVE_PAIR=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '{head:.head.sha,base:.base.sha}'); then
            echo "::error::Could not read the live PR head/base before publishing the pin-bump marker." >&2
            exit 1
          fi
          if ! jq -e '
              select((.head | type) == "string" and (.head | test("^[0-9a-fA-F]{40}$")))
              | select((.base | type) == "string" and (.base | test("^[0-9a-fA-F]{40}$")))
            ' <<<"$LIVE_PAIR" >/dev/null; then
            echo "::error::Live PR head/base is malformed; refusing to publish the pin-bump marker." >&2
            exit 1
          fi
          if [ "$(jq -r '.head' <<<"$LIVE_PAIR")" != "$HEAD_SHA" ] || [ "$(jq -r '.base' <<<"$LIVE_PAIR")" != "$BASE_SHA" ]; then
            echo "PR head/base moved from $HEAD_SHA/$BASE_SHA; skipping the stale pin-bump marker."
            exit 0
          fi
          if ! jq -e '.exempt == true and (.provenance | type) == "string" and (.files | type) == "array"' <<<"$EVIDENCE" >/dev/null; then
            echo "::error::Pin-bump evidence from the check step is malformed; refusing to publish a marker." >&2
            exit 1
          fi
          BODY=$(mktemp)
          {
            printf '%s\n' "$MARKER"
            printf '**Dependabot action-pin bump lane** — verified pin-only bump ✅ (head `%s`, base `%s`)\n\n' "$HEAD_SHA" "$BASE_SHA"
            printf 'This Dependabot PR touches `.github/workflows/` only through action pins, so it is **exempt from the `.github/**` protected-path external-review rule** (REVIEW_POLICY.md § Dependabot action-pin bump lane) and is not labeled `needs-external-review`. Proven at this head/base pair by the trusted `scripts/workflow/dependabot_pin_bump_exemption.sh`:\n\n'
            printf -- '- Commit provenance: %s\n' "$(jq -r '.provenance' <<<"$EVIDENCE")"
            printf -- '- Diff shape: %s action pin line(s) across %s workflow file(s); every changed line is a `uses:` ref or its pin comment, and nothing else changed\n' "$(jq -r '.pins' <<<"$EVIDENCE")" "$(jq -r '.files | length' <<<"$EVIDENCE")"
            jq -r '.files[] | "  - `\(.filename)`: \(.pins) pin line(s)"' <<<"$EVIDENCE"
            printf '\nThis marker is diagnostic. Any other change under `.github/**`, a commit not produced by Dependabot, or a new head re-enters the ordinary protected-path review. The PR still needs CI green and the Dependabot reviewer-identity `APPROVED` on this head (Merge clearance gate).\n\n> Automated check per .github/review-policy.yml\n'
          } >"$BODY"
          if ! gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$BODY"; then
            echo "::warning::Could not publish optional pin-bump diagnostic marker."
          fi
          rm -f "$BODY"
